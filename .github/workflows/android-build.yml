name: Build Apk

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 🔄 Checkout repository
      - uses: actions/checkout@v3

      # ☕ Set up JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      # 🛠 Setup Android NDK
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1.5.0
        with:
          ndk-version: r28c

      # 🔧 Ensure gradlew is executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ⚡ Build APK
      - name: Build APK with Gradle
        run: ./gradlew clean assembleRelease

      # 📦 Upload APK as artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: engine.apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      # 🩹 xdelta patch from the APK of the latest release (verified), as its own artifact
      - name: Make xdelta patch from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -m1 versionName app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          bash tools/ci_make_patch.sh app/build/outputs/apk/release/app-release.apk patch-out "$V"

      - name: Upload patch
        if: ${{ hashFiles('patch-out/*.xdelta') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: engine.xdelta
          path: patch-out/
          retention-days: 90
