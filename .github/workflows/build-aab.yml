name: Aab & Apk Build

on:
  workflow_dispatch:
    inputs:
      upload_to_playstore:
        description: 'Upload to Google Play?'
        type: boolean
        required: true
        default: false
      play_track:
        description: 'Google Play track (draft = production track as a draft)'
        type: choice
        required: true
        default: production
        options:
          - production
          - internal
          - beta
          - alpha
          - draft
      upload_to_releases:
        description: 'Upload APK to GitHub Releases?'
        type: boolean
        required: true
        default: false
      patch_base_artifact:
        description: 'Patch from an older build: link of its APK artifact (https://github.com/<owner>/<repo>/actions/runs/<run>/artifacts/<id>). Empty = from the previous release, only when releasing'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 🔄 Checkout repository
      - uses: actions/checkout@v3  

      # ☕ Set up JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 🔐 Create keystore from secrets
      - name: Create keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/Star4droid.jks
          if [ -f app/Star4droid.jks ]; then
            echo "Keystore file created successfully."
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/app/Star4droid.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Error: Keystore file was not created."
            exit 1
          fi
          
      # 🔥 Create google-services.json from secret
      - name: Create google-services.json from secret
        run: |
          echo "${{ secrets.FIREBASE_SERVICES_JSON }}" | base64 --decode > app/google-services.json
          if [ -f app/google-services.json ]; then
            echo "google-services.json file created successfully."
          else
            echo "Error: google-services.json file was not created."
            exit 1
          fi

      # 🛠 Setup Android NDK
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1.5.0
        with:
          ndk-version: r28c

      # 🔧 Ensure gradlew is executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ⚡ Build APK
      - name: Build APK with Gradle
        env: &admob
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
        run: ./gradlew clean assembleRelease

      # ⚡ Build AAB
      - name: Build AAB with Gradle
        env: *admob
        run: ./gradlew bundleRelease

      # 📦 Upload APK as artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: engine.apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      # 📦 Upload AAB as artifact
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: engine.aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      # 🚀 Upload AAB to Play Store if requested
      - name: Upload to Play Store
        if: ${{ github.event.inputs.upload_to_playstore == 'true' }}
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.star4droid.star2d.evo
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: ${{ github.event.inputs.play_track == 'draft' && 'production' || github.event.inputs.play_track }}
          status: ${{ github.event.inputs.play_track == 'draft' && 'draft' || 'completed' }}
          whatsNewDirectory: whatsNewDirectory

      # 🔏 Report how the APK is signed (a warning only, never fails the build)
      - name: Verify APK signature
        run: |
          AP=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          "$AP" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee sig.txt
          if grep -qi 'Android Debug' sig.txt; then echo "::warning::APK is signed with the DEBUG key (keystore secrets missing or wrong)"; fi

      # 🏷 Read version name
      - name: Read version name
        run: |
          V=$(grep -m1 versionName app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          echo "VERSION_NAME=$V" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk "Star2D-$V.apk"
          # only the newest section of RELEASE_NOTES.md (English, then Arabic)
          awk '/^## /{n++} n==1' RELEASE_NOTES.md > release-body.md

      # 📤 Upload APK to GitHub Releases if requested
      - name: Upload APK to GitHub Releases
        if: ${{ github.event.inputs.upload_to_releases == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Star2D ${{ env.VERSION_NAME }}
          body_path: release-body.md
          generate_release_notes: false
          files: Star2D-${{ env.VERSION_NAME }}.apk

      # 📥 Optional patch base: the APK inside an artifact of an older run (the link typed in "patch_base_artifact")
      - name: Download the patch base APK from an artifact
        if: ${{ github.event.inputs.patch_base_artifact != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ART_URL: ${{ github.event.inputs.patch_base_artifact }}
        run: |
          ID=$(echo "$ART_URL" | sed -nE 's#.*/artifacts/([0-9]+).*#\1#p')
          REPO=$(echo "$ART_URL" | sed -nE 's#^https?://github\.com/([^/]+/[^/]+)/.*#\1#p')
          [ -z "$REPO" ] && REPO="$GITHUB_REPOSITORY"
          if [ -z "$ID" ]; then echo "::error::patch_base_artifact must look like https://github.com/<owner>/<repo>/actions/runs/<run>/artifacts/<id>"; exit 1; fi
          mkdir -p base-apk
          if ! gh api "repos/$REPO/actions/artifacts/$ID/zip" > base-apk/base.zip; then echo "::error::Could not download artifact $ID of $REPO (expired, or not readable by this workflow)"; exit 1; fi
          unzip -o -q base-apk/base.zip -d base-apk
          APK=$(find base-apk -type f -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "::error::No .apk inside artifact $ID"; ls -R base-apk; exit 1; fi
          echo "Patch base: $APK"
          echo "PATCH_BASE_APK=$GITHUB_WORKSPACE/$APK" >> $GITHUB_ENV

      # 🩹 xdelta patch to the APK just built: from the artifact above when a link was given, otherwise (only when
      #    releasing) from the PREVIOUS release's APK
      - name: Make xdelta patch
        if: ${{ github.event.inputs.upload_to_releases == 'true' || github.event.inputs.patch_base_artifact != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci_make_patch.sh app/build/outputs/apk/release/app-release.apk patch-out "$VERSION_NAME" "v$VERSION_NAME"

      - name: Attach the patch to the release
        if: ${{ github.event.inputs.upload_to_releases == 'true' && hashFiles('patch-out/*.xdelta') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ env.VERSION_NAME }}"
          for a in $(gh release view "$TAG" --json assets --jq '.assets[].name' | grep -E '\.xdelta(\.txt)?$' || true); do
            gh release delete-asset "$TAG" "$a" --yes || true
          done
          gh release upload "$TAG" patch-out/*.xdelta patch-out/*.xdelta.txt --clobber

      # the patch is always an artifact of this run too (with or without a release)
      - name: Upload patch as artifact
        if: ${{ hashFiles('patch-out/*.xdelta') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: engine.xdelta
          path: patch-out/
          retention-days: 90
