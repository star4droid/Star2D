name: Build game template

# Rebuilds the template that "Export APK" uses (app/src/main/assets/files/template.zip, java/manifest.xml,
# java/game.zip, java/template.version) and commits it straight to master.
#   * automatically when the game runtime changes on master (files listed below = template/runtime-sources.txt)
#   * manually: Actions -> "Build game template" -> Run workflow
# How it works: docs/TEMPLATE.md

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and commit even if the sources did not change"
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - "app/src/main/java/com/star4droid/template/**"
      - "app/src/main/java/com/star4droid/star2d/ElementDefs/**"
      - "app/src/main/java/com/star4droid/star2d/Helpers/rtl/**"
      - "app/src/main/java/com/star4droid/star2d/Helpers/Pair.java"
      - "app/src/main/java/com/badlogic/**"
      - "template/**"
      - "tools/make_template.py"
      - "tools/verify_template.py"
      - "gradle.properties"
      - ".github/workflows/build-template.yml"

permissions:
  contents: write

concurrency:
  group: build-template
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Is the template already up to date?
        id: fresh
        run: |
          if python3 tools/make_template.py check; then echo "fresh=true" >> "$GITHUB_OUTPUT"; else echo "fresh=false" >> "$GITHUB_OUTPUT"; fi

      - name: Set up JDK 21
        if: steps.fresh.outputs.fresh != 'true' || inputs.force
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        if: steps.fresh.outputs.fresh != 'true' || inputs.force
        uses: android-actions/setup-android@v3
        with:
          # the default list contains 'tools', which no longer exists in the SDK repository (sdkmanager fails)
          packages: 'platform-tools platforms;android-36 build-tools;37.0.0'

      - name: Build the template APK
        if: steps.fresh.outputs.fresh != 'true' || inputs.force
        run: |
          chmod +x gradlew
          ./gradlew :template:assembleRelease --no-daemon --console=plain

      - name: Generate template.zip / manifest.xml / game.zip
        if: steps.fresh.outputs.fresh != 'true' || inputs.force
        run: python3 tools/make_template.py build

      - name: Safety checks
        if: steps.fresh.outputs.fresh != 'true' || inputs.force
        run: python3 tools/verify_template.py

      - name: Keep the result as a build artifact
        if: steps.fresh.outputs.fresh != 'true' || inputs.force
        uses: actions/upload-artifact@v4
        with:
          name: game-template
          path: |
            app/src/main/assets/files/template.zip
            app/src/main/assets/java/manifest.xml
            app/src/main/assets/java/game.zip
            app/src/main/assets/java/template.version
          retention-days: 30

      - name: Commit to master
        if: steps.fresh.outputs.fresh != 'true' || inputs.force
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/files/template.zip app/src/main/assets/java/manifest.xml app/src/main/assets/java/game.zip app/src/main/assets/java/template.version
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Rebuild game template [skip ci]" -m "Generated by .github/workflows/build-template.yml from $(git rev-parse --short HEAD) (template.version $(cat app/src/main/assets/java/template.version))."
          git pull --rebase --autostash origin master
          git push origin HEAD:master
