name: AgentRouter Automation + APK Build

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Model name (e.g. gpt-5.6-sol, gpt-6-astra, claude-opus-5, deepseek-v4-flash)'
        required: false
        default: 'gpt-6-astra'
        type: string
      
      custom_prompt:
        description: 'Task for Agent'
        required: true
        type: string

      branch_name:
        description: 'Branch name'
        required: true
        default: 'feature/agent-patch'
        type: string

jobs:
  agent-build:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write
      pull-requests: write

    steps:
      # 🔄 Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # 🌿 Create branch
      - name: Create and Switch to Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin

          if git ls-remote --heads origin "${{ inputs.branch_name }}" | grep -q "${{ inputs.branch_name }}"; then
            git checkout "${{ inputs.branch_name }}"
            git pull origin "${{ inputs.branch_name }}"
          else
            git checkout -b "${{ inputs.branch_name }}"
          fi
          git branch --show-current

      # ⚙️ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 🤖 Execute Agent Task via AgentRouter
      - name: Execute AI Workflow
        env:
          OPENAI_BASE_URL: "https://agentrouter.org/v1"
          OPENAI_API_KEY: ${{ secrets.AGENTROUTER_API_KEY }}
          AGENT_PROMPT: ${{ inputs.custom_prompt }}
          AGENT_MODEL: ${{ inputs.model }}
        run: |
          npm install --no-save openai
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');
          const OpenAI = require('openai');

          const client = new OpenAI({
            baseURL: process.env.OPENAI_BASE_URL,
            apiKey: process.env.OPENAI_API_KEY
          });

          async function run() {
            const prompt = process.env.AGENT_PROMPT;
            const model = process.env.AGENT_MODEL;

            console.log(`Sending request to AgentRouter using model: ${model}...`);

            const response = await client.chat.completions.create({
              model: model,
              messages: [
                {
                  role: "system",
                  content: "You are an automated code assistant. If asked to modify or create files, output JSON format with schema: {\"files\": [{\"path\": \"relative/path\", \"content\": \"full file content\"}]}. If simply answering, return normal text."
                },
                {
                  role: "user",
                  content: prompt
                }
              ]
            });

            const output = response.choices[0].message.content;
            console.log("Agent Response received.");

            // محاولة تطبيق تعديلات الملفات إذا كانت مخرجات منظمة
            try {
              const parsed = JSON.parse(output);
              if (parsed.files && Array.isArray(parsed.files)) {
                for (const file of parsed.files) {
                  const fullPath = path.resolve(process.cwd(), file.path);
                  fs.mkdirSync(path.dirname(fullPath), { recursive: true });
                  fs.writeFileSync(fullPath, file.content, 'utf8');
                  console.log(`Updated file: ${file.path}`);
                }
              }
            } catch (e) {
              console.log("Response is plain text (no automated file JSON parsed):");
              console.log(output);
            }
          }

          run().catch(err => {
            console.error("Agent execution failed:", err);
            process.exit(1);
          });
          EOF

      # 💾 Commit changes
      - name: Commit and Push Changes
        run: |
          git add .

          if ! git diff-index --quiet HEAD; then
            git commit -m "automation(agent): ${{ inputs.custom_prompt }}"
            git push origin "${{ inputs.branch_name }}" --force
          else
            echo "No changes made by Agent."
          fi

      # ☕ Setup Java
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 🔐 Restore Keystore
      - name: Create keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/Star4droid.jks

          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/app/Star4droid.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      # 🔥 Restore Firebase Config
      - name: Create google-services.json from secret
        run: |
          echo "${{ secrets.FIREBASE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      # 🛠 Setup Android NDK
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1.5.0
        with:
          ndk-version: r28c

      # 🔧 Make gradlew executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ⚡ Build APK
      - name: Build APK
        run: ./gradlew clean assembleRelease

      # 📦 Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90
