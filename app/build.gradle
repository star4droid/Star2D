
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
}

android {
    namespace 'com.star4droid.star2d.evo'
    compileSdk 36
    buildToolsVersion '36.0.0'
    lint {
    disable 'MissingTranslation', 'TypographyFractions'
    checkOnly 'NewApi', 'HandlerLeak'
    abortOnError false
    checkReleaseBuilds false
    }
    testOptions {
        unitTests.all {
            enabled = false
        }
    }
    signingConfigs {
        release {
            def candidateFiles = [
                System.getenv("KEYSTORE_FILE") ? file(System.getenv("KEYSTORE_FILE")) : null,
                file("Star4droid.jks"),
                file("Star4Droid.jks"),
                rootProject.file("Star4droid.jks"),
                rootProject.file("Star4Droid.jks")
            ].findAll { it != null && it.exists() }

            if (!candidateFiles.isEmpty()) {
                def keystoreFile = candidateFiles.first()
                storeFile keystoreFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: "star4droid"
                keyAlias System.getenv("KEY_ALIAS") ?: "star"
                keyPassword System.getenv("KEY_PASSWORD") ?: (System.getenv("KEYSTORE_PASSWORD") ?: "star4droid")
            } else {
                def rootDebugKeystore = rootProject.file("debug.keystore")
                if (!rootDebugKeystore.exists() && rootProject.file("debug.keystore.base64").exists()) {
                    try {
                        byte[] decoded = java.util.Base64.decoder.decode(rootProject.file("debug.keystore.base64").text.trim())
                        rootDebugKeystore.withOutputStream { it.write(decoded) }
                    } catch (Exception ignored) {}
                }
                if (rootDebugKeystore.exists()) {
                    storeFile rootDebugKeystore
                    storePassword "android"
                    keyAlias "androiddebugkey"
                    keyPassword "android"
                } else {
                    def fallbackKeystore = file("${buildDir}/generated_debug.keystore")
                    if (!fallbackKeystore.exists()) {
                        fallbackKeystore.parentFile?.mkdirs()
                        try {
                            def cmd = "keytool -genkeypair -alias androiddebugkey -keypass android -keystore ${fallbackKeystore.absolutePath} -storepass android -dname CN=AndroidDebug -validity 10000 -keyalg RSA"
                            cmd.execute().waitFor()
                        } catch (Exception ignored) {}
                    }
                    if (fallbackKeystore.exists()) {
                        storeFile fallbackKeystore
                        storePassword "android"
                        keyAlias "androiddebugkey"
                        keyPassword "android"
                    } else {
                        println "Release keystore not found. Using debug keystore."
                        initWith signingConfigs.debug
                    }
                }
            }
        }
    }
    defaultConfig {
        applicationId "com.star4droid.star2d.evo"
        minSdk 23
        targetSdk 36
        versionCode 47
        versionName "0.4.7Beta"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
        vectorDrawables { 
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    if (file("google-services.json").exists()) {
        apply plugin: 'com.google.gms.google-services'
        apply plugin: 'com.google.firebase.crashlytics'
    }

    buildFeatures {
        buildConfig true
        compose true
    }
    
}

secrets {
    propertiesFileName = ".env"
    defaultPropertiesFileName = ".env.example"
}

ext {
    gdxVersion = '1.13.1'
}

configurations { natives }

