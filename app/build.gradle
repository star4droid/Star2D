
plugins {
    id 'com.android.application'  
}

android {
    namespace 'com.star4droid.star2d.evo'
    compileSdk 36
    buildToolsVersion '37.0.0'
    lint {
    disable 'MissingTranslation', 'TypographyFractions'
    checkOnly 'NewApi', 'HandlerLeak'
    abortOnError false
    checkReleaseBuilds false
    }
    testOptions {
        unitTests.all {
            enabled = false
        }
    }
    signingConfigs {
        release {
            def keystorePath = System.getenv("KEYSTORE_FILE") ?: "Star4droid.jks"
            def keystoreFile = file(keystorePath)
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD")
            } else {
                println "Release keystore '${keystoreFile.absolutePath}' not found. Using debug keystore."
                initWith signingConfigs.debug
            }
            // AGP drops the classic JAR signature (v1) when minSdk >= 24, so many installers / file managers / scanners
            // report the APK as "not signed" although v2 is valid. Write all schemes.
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
    }
    defaultConfig {
        applicationId "com.star4droid.star2d.evo"
        minSdk 24
        targetSdk 36
        versionCode 56
        versionName "0.5.6Beta"
        // AdMob ids come from -P properties / env (GitHub secrets). With no ids the build has NO ads (a small dismissible
        // notice is shown instead). -PADMOB_TEST=true (or env) uses Google's test ids to try ads locally.
        def prop = { String key -> (project.findProperty(key) ?: System.getenv(key) ?: '').toString().trim() }
        def testAds = prop('ADMOB_TEST') == 'true'
        // order: -P/env value, then Google test ids (ADMOB_TEST=true), then the project's own AdMob ids
        def real = [ADMOB_APP_ID: 'ca-app-pub-6867422220990629~5865152801', ADMOB_BANNER_ID: 'ca-app-pub-6867422220990629/1366845451',
                    ADMOB_INTERSTITIAL_ID: 'ca-app-pub-6867422220990629/8706938560', ADMOB_REWARDED_ID: 'ca-app-pub-6867422220990629/5216471455']
        def adId = { String key, String test -> prop(key) ?: (testAds ? test : real[key] ?: '') }
        def appId = adId('ADMOB_APP_ID', 'ca-app-pub-3940256099942544~3347511713')
        // the SDK needs some app id in the manifest to start; it is only initialised when ads are enabled
        manifestPlaceholders = [admobAppId: appId ?: 'ca-app-pub-3940256099942544~3347511713']
        buildConfigField 'boolean', 'ADS_ENABLED', (appId && adId('ADMOB_BANNER_ID', 'x') && adId('ADMOB_INTERSTITIAL_ID', 'x') ? 'true' : 'false')
        buildConfigField 'String', 'ADMOB_BANNER_ID', '"' + adId('ADMOB_BANNER_ID', 'ca-app-pub-3940256099942544/9214589741') + '"'
        buildConfigField 'String', 'ADMOB_INTERSTITIAL_ID', '"' + adId('ADMOB_INTERSTITIAL_ID', 'ca-app-pub-3940256099942544/1033173712') + '"'
        buildConfigField 'String', 'ADMOB_REWARDED_ID', '"' + adId('ADMOB_REWARDED_ID', 'ca-app-pub-3940256099942544/5224354917') + '"'
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
        vectorDrawables { 
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            // native debug symbols go inside the AAB; Play Console reads them automatically
            ndk { debugSymbolLevel 'FULL' }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    if (file("google-services.json").exists()) {
        apply plugin: 'com.google.gms.google-services'
        apply plugin: 'com.google.firebase.crashlytics'
    }

    buildFeatures {
        buildConfig true
    }
    
}

ext {
    gdxVersion = '1.14.2'
}

configurations { natives }

