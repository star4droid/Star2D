bhv_p_CountUp_autoPlay = تشغيل تلقائي
bhv_pd_CountUp_autoPlay = ابدأ العدّ بمجرد بدء المشهد. وإلا استخدم بلوك العدّ.
bhv_n_Typewriter = الآلة الكاتبة
bhv_d_Typewriter = عنصر نص يكتب نصه حرفاً حرفاً، مثل مربع حوار. انقر لإظهاره كله دفعة واحدة.
bhv_p_Typewriter_speed = السرعة
bhv_pd_Typewriter_speed = حروف في الثانية.
bhv_p_Typewriter_startDelay = تأخير البدء
bhv_pd_Typewriter_startDelay = انتظر هذه المدة قبل بدء الكتابة.
bhv_p_Typewriter_punctuationPause = وقفة علامات الترقيم
bhv_pd_Typewriter_punctuationPause = وقفة إضافية بعد . , ! ? لتتنفس الجمل (0 = بلا).
bhv_p_Typewriter_customText = نص مخصص
bhv_pd_Typewriter_customText = اكتب نصاً آخر بدلاً من المكتوب في العنصر (فارغ = استخدم نص العنصر).
bhv_p_Typewriter_tapToSkip = انقر للتخطي
bhv_pd_Typewriter_tapToSkip = لمس النص يُظهره كله دفعة واحدة.
bhv_p_Typewriter_autoPlay = تشغيل تلقائي
bhv_pd_Typewriter_autoPlay = ابدأ بمجرد بدء المشهد. وإلا استخدم بلوك كتابة النص.
bhv_p_Typewriter_tickSound = صوت التكّة
bhv_pd_Typewriter_tickSound = صوت صغير للحروف (اختياري).
