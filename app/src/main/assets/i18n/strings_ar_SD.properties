bhv_pd_Respawn_respawnWhenFalling = إعادة الظهور عندما يسقط العنصر تحت الخط أدناه (حفر المنصات).
bhv_p_Respawn_fallBelowY = السقوط تحت ص
bhv_pd_Respawn_fallBelowY = ارتفاع الخط (بكسل المحرر، ص للأعلى). تحت هذا يعاد ظهور العنصر.
bhv_p_Respawn_delay = التأخير
bhv_pd_Respawn_delay = انتظر هذه المدة (غير مرئي) قبل العودة.
bhv_g_How = كيف
bhv_p_Respawn_invulnerableTime = مدة الحصانة
bhv_pd_Respawn_invulnerableTime = لا شيء يؤذيه خلال هذه المدة بعد العودة (تتطلب الصحة).
bhv_p_Respawn_restoreHealth = استعادة الصحة
bhv_pd_Respawn_restoreHealth = تعود نقاط الصحة كاملة (تتطلب الصحة).
bhv_p_Respawn_respawnSound = صوت إعادة الظهور
bhv_pd_Respawn_respawnSound = يُشغَّل عند العودة.
bhv_p_Respawn_lives = الأرواح
bhv_pd_Respawn_lives = عدد الأرواح. 0 = بلا حد. عند فقدان الأخيرة يُفتح المشهد أدناه.
bhv_g_Lives = الأرواح
bhv_p_Respawn_livesVariable = متغير الأرواح
bhv_pd_Respawn_livesVariable = متغير مشهد (int) يعرض دائماً الأرواح المتبقية، مثل lives. فارغ = بلا.
bhv_p_Respawn_gameOverScene = مشهد نهاية اللعبة
bhv_pd_Respawn_gameOverScene = المشهد المراد فتحه عند انتهاء الأرواح (نهاية اللعبة). فارغ = لا شيء، يُطلق الحدث فقط.
bhv_n_ButtonSound = صوت الزر
bhv_d_ButtonSound = يشغّل صوتاً عند لمس العنصر أو تحريره أو النقر عليه. أضفه إلى كل أزرار قائمتك.
bhv_g_Input = الإدخال
bhv_p_ButtonSound_sound = الصوت
bhv_pd_ButtonSound_sound = الصوت الذي يُشغَّل عند بدء اللمس / حدوث النقر (ملف من أصوات المشروع).
bhv_p_ButtonSound_releaseSound = صوت التحرير
bhv_pd_ButtonSound_releaseSound = الصوت الذي يُشغَّل عند رفع الإصبع (اختياري).
bhv_p_ButtonSound_when = متى
bhv_pd_ButtonSound_when = TOUCH_START = بمجرد الضغط، CLICK = فقط عند الضغط والتحرير عليه.
bhv_p_ButtonSound_cooldown = فترة الانتظار
bhv_pd_ButtonSound_cooldown = تجاهل اللمسات التي تأتي قبل هذه المدة من آخر صوت.
bhv_n_Draggable = قابل للسحب
bhv_d_Draggable = يمكن للاعب سحب العنصر بإصبعه. أبقِه داخل منطقة، أو الصقه بشبكة، أو أعده إلى مكانه، أو أفلته على أهداف (ألغاز، مخزون، منزلقات).
bhv_p_Draggable_lockX = قفل س
bhv_pd_Draggable_lockX = لا يتحرك جانبياً.
bhv_p_Draggable_lockY = قفل ص
bhv_pd_Draggable_lockY = لا يتحرك للأعلى والأسفل.
bhv_p_Draggable_area = المنطقة
bhv_pd_Draggable_area = إبقاء العنصر داخل صندوق هذا العنصر الآخر (اختياري).
bhv_p_Draggable_gridSize = حجم الشبكة
bhv_pd_Draggable_gridSize = عند التحرير، يلتصق بشبكة بهذا الحجم (0 = بلا شبكة).
bhv_p_Draggable_snapBack = العودة للمكان
bhv_pd_Draggable_snapBack = العودة إلى المكان الأصلي عند التحرير.
bhv_p_Draggable_snapBackTime = مدة العودة
bhv_pd_Draggable_snapBackTime = مدة الرحلة للعودة (0 = فوراً).
bhv_p_Draggable_dropTargets = أهداف الإسقاط
bhv_pd_Draggable_dropTargets = عناصر يمكن إفلاته عليها (اختياري). يعمل onDropOn عند تحريره فوق أحدها.
bhv_p_Draggable_snapToTarget = الالتصاق بالهدف
bhv_pd_Draggable_snapToTarget = الانتقال إلى مركز الهدف الذي أُفلت عليه.
bhv_p_Draggable_dragScale = مقياس السحب
bhv_pd_Draggable_dragScale = الحجم أثناء السحب (1 = عادي)، ليبدو مرفوعاً.
bhv_p_Draggable_bringToFront = إحضار للأمام
bhv_pd_Draggable_bringToFront = يُحضر العنصر أمام الآخرين أثناء السحب.
bhv_p_Draggable_freezePhysics = تجميد الفيزياء
bhv_pd_Draggable_freezePhysics = يتوقف العنصر الفيزيائي عن الحركة من تلقاء نفسه أثناء الإمساك به.
bhv_n_LongPress = ضغط مطوّل
bhv_d_LongPress = يميز بين نقرة سريعة وإمساك العنصر. أزرار تأكيد بالإمساك، قوائم مخفية، شحن.
