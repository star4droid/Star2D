bhv_p_Goal_targets = الأهداف
bhv_pd_Goal_targets = العناصر التي تفوز بلمسه.
bhv_g_Who_wins = من يفوز
bhv_p_Goal_targetPrefix = بادئة الهدف
bhv_pd_Goal_targetPrefix = وكذلك العناصر التي يبدأ اسمها بإحدى هذه الكلمات (افصل بينها بفواصل).
