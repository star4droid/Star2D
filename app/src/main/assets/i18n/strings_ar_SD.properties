bhv_pd_Goal_needTouch = إيقاف: لا حاجة للمس، تُكسب المرحلة بمجرد تحقق الشروط أدناه (مثل جمع كل النجوم).
bhv_p_Goal_collectGroup = مجموعة الجمع
bhv_pd_Goal_collectGroup = اسم مجموعة القابلات للجمع التي يجب جمعها كلها. فارغ = بلا شرط.
