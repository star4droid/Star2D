bhv_p_CameraFollow_followSpeed = سرعة التتبع
bhv_pd_CameraFollow_followSpeed = سرعة لحاق الكاميرا. الأعلى = أكثر التصاقاً. 0 = ملتصقة بالهدف.
bhv_g_Feel = الإحساس
bhv_p_CameraFollow_deadZoneWidth = عرض المنطقة الميتة
bhv_pd_CameraFollow_deadZoneWidth = يمكن للهدف التحرك جانبياً بهذا المقدار قبل أن تتحرك الكاميرا إطلاقاً.
bhv_p_CameraFollow_deadZoneHeight = ارتفاع المنطقة الميتة
bhv_pd_CameraFollow_deadZoneHeight = الأمر نفسه للحركة الرأسية.
bhv_p_CameraFollow_lookAhead = النظرة الاستباقية
