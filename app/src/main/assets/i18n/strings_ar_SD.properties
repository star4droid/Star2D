bhv_p_SpaceShip_boostTime = مدة التعزيز
bhv_pd_SpaceShip_boostTime = مدة بقاء التعزيز.
bhv_p_SpaceShip_boostCooldown = انتظار التعزيز
bhv_pd_SpaceShip_boostCooldown = الوقت قبل أن يبدأ التعزيز التالي.
