bhv_pd_ScaleTouchEffect_pressedAlpha = يتلاشى قليلاً أيضاً أثناء اللمس (1 = بلا تلاشٍ).
bhv_n_Shake = الاهتزاز
bhv_d_Shake = يرتجف العنصر للحظة: عند بدء المشهد، أو عند لمسه، أو من بلوك. مناسب للإجابات الخاطئة والضربات والأزرار.
bhv_p_Shake_trigger = المشغّل
bhv_pd_Shake_trigger = متى يهتز. MANUAL = فقط عند تشغيل بلوك الاهتزاز.
bhv_p_Shake_axis = المحور
bhv_pd_Shake_axis = اتجاه حركته.
bhv_p_Shake_intensity = الشدة
bhv_pd_Shake_intensity = المسافة التي يتحركها بعيداً عن مكانه.
bhv_p_Shake_duration = المدة
bhv_pd_Shake_duration = مدة اهتزازة واحدة.
bhv_p_Shake_frequency = التردد
bhv_pd_Shake_frequency = تغيرات الاتجاه في الثانية: أكبر = متوتر، أصغر = متمايل.
bhv_p_Shake_rotation = الدوران
bhv_pd_Shake_rotation = يدور أيضاً قليلاً ذهاباً وإياباً (0 = بلا دوران).
bhv_p_Shake_decay = التلاشي
bhv_pd_Shake_decay = يضعف الاهتزاز حتى يتوقف.
bhv_p_Shake_loop = تكرار
bhv_pd_Shake_loop = استمر بالاهتزاز حتى يعمل بلوك الإيقاف (تُتجاهل المدة).
bhv_n_SlideIn = انزلاق للداخل
bhv_d_SlideIn = ينزلق العنصر إلى مكانه من أحد الجوانب، مع ارتداد أو تسهيل إن شئت. بلوك يعيده منزلقاً للخارج. مناسب للقوائم واللوحات.
bhv_p_SlideIn_from = من
bhv_pd_SlideIn_from = الجهة التي يأتي منها.
bhv_p_SlideIn_distance = المسافة
bhv_pd_SlideIn_distance = مدى بُعد نقطة البداية.
bhv_p_SlideIn_duration = المدة
bhv_pd_SlideIn_duration = مدة الانزلاق.
bhv_p_SlideIn_delay = التأخير
bhv_pd_SlideIn_delay = انتظر هذه المدة قبل البدء (استخدم قيماً مختلفة لانزلاق قائمة عنصراً بعد عنصر).
bhv_p_SlideIn_ease = التسهيل
bhv_pd_SlideIn_ease = كيف تتغير السرعة أثناء الانزلاق.
bhv_p_SlideIn_fade = التلاشي
bhv_pd_SlideIn_fade = يظهر تدريجياً أيضاً أثناء الانزلاق.
bhv_p_SlideIn_autoPlay = تشغيل تلقائي
bhv_pd_SlideIn_autoPlay = ابدأ بمجرد بدء المشهد. وإلا يبقى العنصر في مكانه حتى يعمل بلوك التشغيل.
bhv_n_TintCycle = دورة التلوين
bhv_d_TintCycle = يتغير لون العنصر ببطء: ذهاباً وإياباً بين لونين، أو عبر قوس قزح كاملاً. مناسب للعناوين والتعزيزات وإشارات الخطر.
bhv_p_TintCycle_mode = الوضع
bhv_pd_TintCycle_mode = BETWEEN = يتلاشى بين اللونين، RAINBOW = يمر بكل الألوان.
bhv_p_TintCycle_colorA = اللون أ
bhv_pd_TintCycle_colorA = اللون الأول (BETWEEN).
bhv_p_TintCycle_colorB = اللون ب
bhv_pd_TintCycle_colorB = اللون الثاني (BETWEEN).
bhv_p_TintCycle_speed = السرعة
bhv_pd_TintCycle_speed = دورات كاملة في الثانية.
bhv_p_TintCycle_saturation = التشبع
bhv_pd_TintCycle_saturation = قوة الألوان (RAINBOW).
bhv_p_TintCycle_brightness = السطوع
bhv_pd_TintCycle_brightness = مدى فتح الألوان (RAINBOW).
bhv_p_TintCycle_autoPlay = تشغيل تلقائي
bhv_pd_TintCycle_autoPlay = ابدأ بمجرد بدء المشهد.
bhv_n_Wobble = التمايل
bhv_d_Wobble = يتأرجح العنصر يميناً ويساراً مثل لعبة (ويمكنه الانضغاط قليلاً). للأبد، أو عند اللمس، أو من بلوك. مناسب للأيقونات الساكنة وجذب الانتباه.
bhv_p_Wobble_trigger = المشغّل
bhv_pd_Wobble_trigger = متى يتمايل. MANUAL = فقط عند تشغيل بلوك التمايل.
bhv_p_Wobble_angle = الزاوية
bhv_pd_Wobble_angle = مقدار دورانه في كل اتجاه.
bhv_p_Wobble_speed = السرعة
bhv_pd_Wobble_speed = أرجحات كاملة في الثانية.
bhv_p_Wobble_duration = المدة
bhv_pd_Wobble_duration = يتمايل لهذه المدة ثم يتوقف. 0 = حتى يُوقف.
bhv_p_Wobble_decay = التلاشي
bhv_pd_Wobble_decay = كل أرجحة أصغر من السابقة (تتطلب مدة).
bhv_p_Wobble_squash = الانضغاط
bhv_pd_Wobble_squash = يتمدد وينضغط قليلاً أثناء الأرجحة (0 = بلا).
bhv_n_Car = السيارة
bhv_d_Car = سيارة قابلة للقيادة بدواسة وقود وفرامل وتوجيه وفرملة يد. TOP_DOWN: سيارة بنموذج الدراجة تُرى من الأعلى (زاوية التوجيه، قاعدة العجلات، التماسك، انزلاق فرملة اليد). SIDE_SCROLLER: يقود عناصر العجلات في سيارة بنيتها بالروابط.
bhv_g_Vehicles = المركبات
bhv_note_Car = يتطلب عنصراً فيزيائياً DYNAMIC (جسم السيارة). من الأعلى: جاذبية 0 في المشهد. جانبي: عجلات موصولة بالجسم بالروابط.
bhv_p_Car_mode = الوضع
bhv_pd_Car_mode = TOP_DOWN: سيارة تُرى من الأعلى. SIDE_SCROLLER: قائمة العجلات تُدار بالمحركات (ابنِ السيارة بالروابط في المحرر).
bhv_g_Mode = الوضع
bhv_p_Car_joystick = عصا التحكم
bhv_pd_Car_joystick = عصا التحكم: يسار/يمين توجه (من الأعلى) أو تقود (جانبي)، أعلى/أسفل وقود وفرامل.
bhv_p_Car_gasButton = زر الوقود
bhv_pd_Car_gasButton = زر الوقود (أي عنصر). ضغطه = تسارع.
bhv_p_Car_brakeButton = زر الفرامل
bhv_pd_Car_brakeButton = زر الفرامل. من الأعلى: يفرمل ثم يرجع للخلف. جانبي: يقفل العجلات.
bhv_p_Car_leftButton = زر اليسار
bhv_pd_Car_leftButton = من الأعلى: توجيه لليسار. جانبي: قيادة لليسار / ميل لليسار في الهواء.
bhv_p_Car_rightButton = زر اليمين
bhv_pd_Car_rightButton = من الأعلى: توجيه لليمين. جانبي: قيادة لليمين / ميل لليمين في الهواء.
bhv_p_Car_handbrakeButton = زر فرملة اليد
bhv_pd_Car_handbrakeButton = يقفل الخلف: تنزلق السيارة وتنحرف (من الأعلى) أو تتوقف العجلات (جانبي).
bhv_p_Car_useKeyboard = استخدام لوحة المفاتيح
bhv_pd_Car_useKeyboard = مفاتيح الأسهم / WASD والمسافة (فرملة اليد) تقود أيضاً (الحاسوب، الاختبارات).
bhv_p_Car_useTilt = استخدام الإمالة
bhv_pd_Car_useTilt = أمل الهاتف للتوجيه (من الأعلى).
bhv_p_Car_deadZone = المنطقة الميتة
bhv_pd_Car_deadZone = دفعات عصا التحكم الأصغر من هذا تُتجاهل.
bhv_p_Car_maxSpeed = أقصى سرعة
bhv_pd_Car_maxSpeed = السرعة القصوى للأمام.
bhv_g_Engine_and_brakes = المحرك والفرامل
bhv_p_Car_reverseSpeed = سرعة الرجوع
bhv_pd_Car_reverseSpeed = السرعة القصوى للخلف.
bhv_p_Car_acceleration = التسارع
bhv_pd_Car_acceleration = سرعة تسريع المحرك للسيارة.
bhv_p_Car_brakeForce = قوة الفرامل
bhv_pd_Car_brakeForce = مدى قوة إبطاء الفرامل للسيارة.
bhv_p_Car_rollingResistance = مقاومة التدحرج
bhv_pd_Car_rollingResistance = التباطؤ عندما لا يُضغط شيء.
bhv_p_Car_maxSteerAngle = أقصى زاوية توجيه
bhv_pd_Car_maxSteerAngle = أكبر زاوية للعجلات الأمامية.
bhv_g_Steering__top_down_ = التوجيه (من الأعلى)
bhv_p_Car_steerSpeed = سرعة التوجيه
bhv_pd_Car_steerSpeed = سرعة دوران العجلات إلى الزاوية المطلوبة.
bhv_p_Car_steerReduction = تقليل التوجيه
bhv_pd_Car_steerReduction = يوجّه أقل عند السرعة العالية (0 = بلا تغيير، 1 = شبه مستقيم عند السرعة القصوى).
bhv_p_Car_frontAxle = المحور الأمامي
bhv_pd_Car_frontAxle = المسافة من مركز السيارة إلى المحور الأمامي. 0 (مع المحور الخلفي 0) = 35% من الضلع الأطول.
bhv_p_Car_rearAxle = المحور الخلفي
bhv_pd_Car_rearAxle = المسافة من مركز السيارة إلى المحور الخلفي. قاعدة العجلات = المحور الأمامي + الخلفي.
bhv_p_Car_noseAngle = زاوية المقدمة
bhv_pd_Car_noseAngle = الزاوية التي تشير إليها مقدمة الصورة عندما لا يكون العنصر مدوراً (90 = أعلى، 0 = يمين).
bhv_p_Car_grip = التماسك
bhv_pd_Car_grip = سرعة إيقاف الانزلاق الجانبي. عالٍ = على قضبان، منخفض = زلق.
bhv_g_Grip__top_down_ = التماسك (من الأعلى)
bhv_p_Car_handbrakeGrip = تماسك فرملة اليد
bhv_pd_Car_handbrakeGrip = التماسك أثناء تفعيل فرملة اليد (صغير = انحراف).
bhv_p_Car_driftSpeed = سرعة الانحراف
bhv_pd_Car_driftSpeed = السرعة الجانبية التي تُعد انحرافاً (onDriftStart).
bhv_p_Car_wheels = العجلات
bhv_pd_Car_wheels = عناصر العجلات (دوائر فيزيائية موصولة بجسم السيارة بالروابط). السلوك يدوّرها.
bhv_g_Wheels__side_scroller_ = العجلات (جانبي)
bhv_p_Car_wheelAcceleration = تسارع العجلات
bhv_pd_Car_wheelAcceleration = سرعة تسارع محركات العجلات.
bhv_p_Car_airSpin = الدوران في الهواء
bhv_pd_Car_airSpin = سرعة دوران جسم السيارة في الهواء بينما يُضغط يسار/يمين.
bhv_n_SpaceShip = السفينة الفضائية
bhv_d_SpaceShip = سفينة بأسلوب Asteroids: الدوران يسار/يمين، دفع للأمام في اتجاه المواجهة، مقاومة، حد للسرعة وتعزيز اختياري. وجّهها بعصا تحكم أو أزرار أو لوحة المفاتيح أو بإمالة الهاتف. تتطلب جاذبية 0.
bhv_p_SpaceShip_joystick = عصا التحكم
bhv_pd_SpaceShip_joystick = عنصر عصا التحكم الذي يقود السفينة (اختياري).
bhv_p_SpaceShip_steering = التوجيه
bhv_pd_SpaceShip_steering = ROTATE: يسار/يمين تدور، أعلى تدفع. POINT: تدور السفينة نحو اتجاه عصا التحكم.
bhv_p_SpaceShip_leftButton = زر اليسار
bhv_pd_SpaceShip_leftButton = زر (أي عنصر) يدير السفينة لليسار ما دام مضغوطاً.
bhv_p_SpaceShip_rightButton = زر اليمين
bhv_pd_SpaceShip_rightButton = زر (أي عنصر) يدير السفينة لليمين ما دام مضغوطاً.
bhv_p_SpaceShip_thrustButton = زر الدفع
bhv_pd_SpaceShip_thrustButton = زر يدفع للأمام ما دام مضغوطاً.
bhv_p_SpaceShip_brakeButton = زر الفرامل
bhv_pd_SpaceShip_brakeButton = زر يبطئ السفينة ما دام مضغوطاً.
bhv_p_SpaceShip_boostButton = زر التعزيز
bhv_pd_SpaceShip_boostButton = زر يبدأ التعزيز.
bhv_p_SpaceShip_useKeyboard = استخدام لوحة المفاتيح
bhv_pd_SpaceShip_useKeyboard = مفاتيح الأسهم / A D W S / shift تحلق بالسفينة أيضاً (الحاسوب، الاختبارات).
bhv_p_SpaceShip_useTilt = استخدام الإمالة
bhv_pd_SpaceShip_useTilt = أمل الهاتف يسار/يمين للدوران.
bhv_p_SpaceShip_deadZone = المنطقة الميتة
bhv_pd_SpaceShip_deadZone = دفعات عصا التحكم الأصغر من هذا تُتجاهل.
bhv_p_SpaceShip_thrust = الدفع
bhv_pd_SpaceShip_thrust = التسارع للأمام.
bhv_p_SpaceShip_maxSpeed = أقصى سرعة
bhv_pd_SpaceShip_maxSpeed = حد السرعة.
bhv_p_SpaceShip_rotateSpeed = سرعة الدوران
bhv_pd_SpaceShip_rotateSpeed = سرعة الدوران.
bhv_p_SpaceShip_drag = المقاومة
bhv_pd_SpaceShip_drag = يبطئ السفينة تلقائياً. 0 = تستمر بالانجراف للأبد (فضاء)، 1 = تتوقف في نحو ثانية.
bhv_p_SpaceShip_brakePower = قوة الفرملة
bhv_pd_SpaceShip_brakePower = مدى قوة إبطاء الفرامل للسفينة.
bhv_p_SpaceShip_noseAngle = زاوية المقدمة
bhv_pd_SpaceShip_noseAngle = الزاوية التي تشير إليها مقدمة الصورة عندما لا يكون العنصر مدوراً (90 = أعلى، 0 = يمين).
bhv_p_SpaceShip_boostMultiplier = مضاعف التعزيز
bhv_pd_SpaceShip_boostMultiplier = يُضرب الدفع وحد السرعة بهذه القيمة أثناء التعزيز. 1 = بلا تعزيز.
