bhv_pd_TiltMove_invertX = تبديل اليسار واليمين.
bhv_p_TiltMove_invertY = عكس ص
bhv_pd_TiltMove_invertY = تبديل الأعلى والأسفل.
bhv_p_TiltMove_speed = السرعة
bhv_pd_TiltMove_speed = السرعة القصوى.
bhv_p_TiltMove_acceleration = التسارع
bhv_pd_TiltMove_acceleration = ROLL فقط: التسارع عند الإمالة الكاملة.
bhv_p_TiltMove_damping = التخميد
bhv_pd_TiltMove_damping = ROLL فقط: يبطئ الكرة (0 = أبداً).
bhv_n_TopDownPlayer = لاعب من الأعلى
bhv_d_TopDownPlayer = يحرك العنصر في كل الاتجاهات (تقمص أدوار، إطلاق نار، متاهة): عصا تحكم أو 4 أزرار أو لوحة المفاتيح، مع تسارع واحتكاك والتزام بـ 4/8 اتجاهات ودوران اختياري نحو الحركة. استخدم جاذبية 0 في المشهد.
bhv_p_TopDownPlayer_joystick = عصا التحكم
bhv_pd_TopDownPlayer_joystick = عنصر عصا التحكم الذي يقود هذا العنصر (اختياري).
bhv_p_TopDownPlayer_upButton = زر الأعلى
bhv_pd_TopDownPlayer_upButton = زر (أي عنصر) يتحرك للأعلى ما دام مضغوطاً.
bhv_p_TopDownPlayer_downButton = زر الأسفل
bhv_pd_TopDownPlayer_downButton = زر (أي عنصر) يتحرك للأسفل ما دام مضغوطاً.
bhv_p_TopDownPlayer_leftButton = زر اليسار
bhv_pd_TopDownPlayer_leftButton = زر (أي عنصر) يتحرك لليسار ما دام مضغوطاً.
bhv_p_TopDownPlayer_rightButton = زر اليمين
bhv_pd_TopDownPlayer_rightButton = زر (أي عنصر) يتحرك لليمين ما دام مضغوطاً.
bhv_p_TopDownPlayer_useKeyboard = استخدام لوحة المفاتيح
bhv_pd_TopDownPlayer_useKeyboard = مفاتيح الأسهم / WASD تحرك العنصر أيضاً (الحاسوب، الاختبارات).
bhv_p_TopDownPlayer_deadZone = المنطقة الميتة
bhv_pd_TopDownPlayer_deadZone = دفعات عصا التحكم الأصغر من هذا تُتجاهل.
bhv_p_TopDownPlayer_directions = الاتجاهات
bhv_pd_TopDownPlayer_directions = ANY = اتجاهات سلسة لعصا التحكم، EIGHT = التزام بـ 8 اتجاهات، FOUR = أعلى/أسفل/يسار/يمين فقط.
bhv_p_TopDownPlayer_speed = السرعة
bhv_pd_TopDownPlayer_speed = السرعة القصوى.
bhv_p_TopDownPlayer_acceleration = التسارع
bhv_pd_TopDownPlayer_acceleration = سرعة الوصول إلى السرعة الكاملة. 0 = فوراً.
bhv_p_TopDownPlayer_friction = الاحتكاك
bhv_pd_TopDownPlayer_friction = سرعة التوقف عندما لا يُضغط شيء. 0 = فوراً.
bhv_p_TopDownPlayer_rotateToDirection = الدوران نحو الاتجاه
bhv_pd_TopDownPlayer_rotateToDirection = يدير العنصر نحو الجهة التي يتحرك إليها.
bhv_g_Facing = المواجهة
bhv_p_TopDownPlayer_faceOffset = إزاحة الوجه
bhv_pd_TopDownPlayer_faceOffset = زاوية الصورة عندما تواجه اليمين (0 = يمين، 90 = أعلى...).
bhv_p_TopDownPlayer_turnSpeed = سرعة الدوران
bhv_pd_TopDownPlayer_turnSpeed = سرعة الدوران. 0 = فوراً.
bhv_p_TopDownPlayer_flipToDirection = العكس حسب الاتجاه
bhv_pd_TopDownPlayer_flipToDirection = عكس الصورة عند التحرك لليسار (للمناظر الجانبية).
