bhv_p_CameraFollow_boundsRight = حد اليمين
bhv_p_CameraFollow_boundsTop = حد الأعلى
bhv_n_CameraShake = اهتزاز الكاميرا
bhv_d_CameraShake = اهتزاز الشاشة للضربات والانفجارات والهبوط. استدعِ shake بقوة من 0 إلى 1؛ الضربات القوية تهز أكثر بكثير من الضعيفة وتتلاشى من تلقاء نفسها. يمكن للصحة تشغيله أيضاً (اهتزاز عند الضربة). يعمل مع تتبع الكاميرا أو بدونه.
bhv_p_CameraShake_maxOffset = أقصى إزاحة
bhv_pd_CameraShake_maxOffset = أكبر إزاحة للكاميرا عند القوة الكاملة.
bhv_g_Shake = الاهتزاز
bhv_p_CameraShake_frequency = التردد
bhv_pd_CameraShake_frequency = سرعة الارتجاف.
bhv_p_CameraShake_decay = التلاشي
