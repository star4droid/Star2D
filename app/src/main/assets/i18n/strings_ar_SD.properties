bhv_p_WrapScreen_wrapY = التفاف ص
bhv_pd_WrapScreen_wrapY = الالتفاف عند الحافتين العلوية/السفلية.
bhv_p_WrapScreen_margin = الهامش
bhv_pd_WrapScreen_margin = مساحة إضافية خارج المنطقة قبل الالتفاف.
