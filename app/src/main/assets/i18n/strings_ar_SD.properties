bhv_pd_Goal_needAtLeast = الكمية المطلوبة من المتغير.
bhv_p_Goal_mustBeGone = يجب أن تختفي
bhv_pd_Goal_mustBeGone = عناصر يجب تدميرها كلها أولاً (زعماء، أعداء).
bhv_p_Goal_winPanel = لوحة الفوز
bhv_pd_Goal_winPanel = عنصر يُعرض (لوحة 'لقد فزت'). يُخفى عند بدء اللعبة.
bhv_g_When_won = عند الفوز
bhv_p_Goal_nextScene = المشهد التالي
bhv_pd_Goal_nextScene = المشهد المراد فتحه بعد التأخير (المرحلة التالية). فارغ = البقاء.
