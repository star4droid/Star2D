bhv_pd_CameraFollow_lookAheadSpeed = سرعة الهدف التي تكتمل عندها النظرة الاستباقية.
bhv_p_CameraFollow_zoom = التقريب
bhv_pd_CameraFollow_zoom = 1 = العرض العادي للمشهد، 2 = أقرب بمرتين، 0.5 = أبعد بمرتين.
bhv_g_Zoom = التقريب
bhv_p_CameraFollow_zoomSpeed = سرعة التقريب
bhv_pd_CameraFollow_zoomSpeed = سرعة تغير التقريب. 0 = فوراً.
bhv_p_CameraFollow_useBounds = استخدام الحدود
bhv_pd_CameraFollow_useBounds = إبقاء العرض داخل المستطيل أدناه (حجم مرحلتك) فلا يظهر الفراغ الخارجي أبداً.
bhv_g_Limits = القيود
