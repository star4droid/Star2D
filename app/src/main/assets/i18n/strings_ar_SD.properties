bhv_pd_TapToMove_faceOffset = زاوية الصورة عندما تواجه اليمين (0 = يمين، 90 = أعلى...).
bhv_n_TiltMove = الحركة بالإمالة
bhv_d_TiltMove = يحرك العنصر بإمالة الهاتف (مقياس التسارع): كرة تتدحرج، متاهة كرات، ملتقط أشياء ساقطة. مفاتيح الأسهم تحاكي الإمالة على الحاسوب.
bhv_p_TiltMove_mode = الوضع
bhv_pd_TiltMove_mode = VELOCITY: الإمالة تحدد السرعة. ROLL: الإمالة تدفع كالجاذبية على كرة (تستمر بالتدحرج).
bhv_g_Tilt = الإمالة
bhv_p_TiltMove_fullTilt = الإمالة الكاملة
bhv_pd_TiltMove_fullTilt = الإمالة التي تعطي السرعة الكاملة. 9.8 = الهاتف عمودي، حوالي 4 = إمالة مريحة.
bhv_p_TiltMove_deadZone = المنطقة الميتة
bhv_pd_TiltMove_deadZone = الإمالات الأصغر من هذا تُتجاهل.
bhv_p_TiltMove_smoothing = التنعيم
bhv_pd_TiltMove_smoothing = ينعّم الحساس المهتز. الأعلى = أنعم لكن أبطأ استجابة.
