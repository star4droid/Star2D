bhv_p_Projectile_targetPrefix = بادئة الهدف
bhv_pd_Projectile_targetPrefix = وكذلك العناصر التي يبدأ اسمها بإحدى هذه الكلمات (افصل بينها بفواصل)، مثال: enemy.
bhv_p_Projectile_damage = الضرر
bhv_pd_Projectile_damage = نقاط الصحة المخصومة بضربة واحدة.
bhv_p_Projectile_autoHealth = صحة تلقائية
bhv_pd_Projectile_autoHealth = امنح هدفاً بلا صحة هذا العدد من نقاط الصحة (0 = اتركه).
