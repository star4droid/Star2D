bhv_pd_Goal_delay = انتظر هذه المدة قبل فتح المشهد.
bhv_p_Goal_clearCheckpoints = مسح نقاط الحفظ
bhv_pd_Goal_clearCheckpoints = نسيان نقاط الحفظ عند كسب المرحلة (لتبدأ اللعبة التالية من البداية).
bhv_p_Goal_winSound = صوت الفوز
bhv_pd_Goal_winSound = يُشغَّل عند كسب المرحلة.
bhv_n_PowerUp = التعزيز
bhv_d_PowerUp = عنصر يُلتقط فيغيّر إعدادات سلوك لدى من يأخذه لفترة (أسرع، قفزات أعلى، إطلاق أسرع...) ثم يعيدها. يمكنه أيضاً العلاج والحصانة.
bhv_note_PowerUp = يتطلب عنصراً فيزيائياً؛ الأفضل أن يكون حساساً (Sensor) ليمر اللاعب من خلاله.
bhv_p_PowerUp_collectors = الجامعون
bhv_pd_PowerUp_collectors = العناصر التي يمكنها أخذه.
bhv_p_PowerUp_collectorPrefix = بادئة الجامع
bhv_pd_PowerUp_collectorPrefix = وكذلك العناصر التي يبدأ اسمها بإحدى هذه الكلمات (افصل بينها بفواصل). اترك القائمة وهذا النص فارغين ليتمكن أي عنصر له سلوك الصحة من أخذه.
bhv_p_PowerUp_behavior1 = السلوك
bhv_pd_PowerUp_behavior1 = اسم كلاس السلوك لدى الجامع، مثل PlatformerPlayer أو Shooter أو TopDownPlayer. فارغ = بلا تأثير.
bhv_g_Effect_1 = التأثير 1
bhv_p_PowerUp_parameter1 = الإعداد
bhv_pd_PowerUp_parameter1 = الإعداد (حقل public) المراد تغييره، تماماً كما هو مكتوب في السلوك، مثل jumpSpeed أو speed أو fireRate.
bhv_p_PowerUp_mode1 = كيف
bhv_pd_PowerUp_mode1 = SET يضع القيمة، ADD يضيفها، MULTIPLY يضرب القيمة الحالية.
bhv_p_PowerUp_amount1 = الكمية
bhv_p_PowerUp_behavior2 = السلوك
bhv_pd_PowerUp_behavior2 = إعداد ثانٍ يُغيَّر في الوقت نفسه (اختياري).
bhv_g_Effect_2 = التأثير 2
bhv_p_PowerUp_parameter2 = الإعداد
bhv_pd_PowerUp_parameter2 = الإعداد الثاني المراد تغييره، تماماً كما هو مكتوب في السلوك.
bhv_p_PowerUp_mode2 = كيف
bhv_pd_PowerUp_mode2 = SET يضع القيمة، ADD يضيفها، MULTIPLY يضرب القيمة الحالية.
bhv_p_PowerUp_amount2 = الكمية
bhv_p_PowerUp_duration = المدة
bhv_pd_PowerUp_duration = مدة بقاء التأثيرات. 0 = للأبد.
bhv_g_Duration_and_extras = المدة والإضافات
