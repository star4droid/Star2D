bhv_pd_SwipeDetector_fireWhileMoving = الاستجابة بمجرد بلوغ المسافة، دون انتظار رفع الإصبع.
bhv_n_ToggleOnClick = تبديل عند النقر
bhv_d_ToggleOnClick = لمس العنصر يُظهر أو يُخفي عناصر أخرى: لوحة إعدادات، قائمة، تلميح.
bhv_p_ToggleOnClick_targets = الأهداف
bhv_pd_ToggleOnClick_targets = العناصر التي تُظهَر / تُخفى.
bhv_p_ToggleOnClick_action = الإجراء
bhv_pd_ToggleOnClick_action = TOGGLE = يعكس في كل مرة، SHOW = يظهر دائماً، HIDE = يخفي دائماً.
bhv_p_ToggleOnClick_trigger = المشغّل
bhv_pd_ToggleOnClick_trigger = CLICK = عند الضغط والتحرير على العنصر، TOUCH_START = بمجرد الضغط.
bhv_p_ToggleOnClick_startHidden = البدء مخفياً
bhv_pd_ToggleOnClick_startHidden = إخفاء الأهداف عند بدء المشهد.
bhv_p_ToggleOnClick_affectPhysics = التأثير على الفيزياء
bhv_pd_ToggleOnClick_affectPhysics = العناصر الفيزيائية المخفية تتوقف أيضاً عن التصادم والحركة.
bhv_n_Lifetime = العمر
bhv_d_Lifetime = يزيل العنصر نفسه بعد فترة، مع تلاشٍ (واختيارياً انكماش) أولاً. رصاصات، جسيمات، منصات مؤقتة، تلميحات.
bhv_g_Logic = المنطق
bhv_p_Lifetime_seconds = الثواني
bhv_pd_Lifetime_seconds = مدة بقائه، تُحسب من بدء المشهد (أو من reset).
bhv_p_Lifetime_randomExtra = إضافة عشوائية
bhv_pd_Lifetime_randomExtra = عمر إضافي عشوائي بين -x و+x ثانية، حتى لا يختفي حشد كامل دفعة واحدة.
bhv_p_Lifetime_fadeTime = مدة التلاشي
bhv_pd_Lifetime_fadeTime = يتلاشى خلال الثواني الأخيرة.
bhv_p_Lifetime_shrink = انكماش
bhv_pd_Lifetime_shrink = ينكمش أيضاً حتى يزول أثناء التلاشي.
bhv_p_Lifetime_endAction = إجراء النهاية
bhv_pd_Lifetime_endAction = DESTROY يزيل العنصر، HIDE يبقيه غير مرئي وغير نشط.
bhv_n_ProgressBind = ربط التقدم
bhv_d_ProgressBind = يُبقي شريط تقدم متوافقاً مع رقم: قيمة محفوظة بـ setValue، أو شريط آخر، أو الرقم المكتوب في نص. الصحة، التحميل، الخبرة، المؤقتات.
bhv_p_ProgressBind_source = المصدر
bhv_pd_ProgressBind_source = مصدر الرقم. SAVED_VALUE = قيمة محفوظة بالاسم (setValue / getValue)، OTHER_PROGRESS = قيمة عنصر تقدم آخر، OTHER_TEXT = أول رقم مكتوب في عنصر نص، MANUAL = بلوك ضبط القيمة فقط.
bhv_p_ProgressBind_valueName = اسم القيمة
bhv_pd_ProgressBind_valueName = اسم القيمة المحفوظة (SAVED_VALUE).
bhv_p_ProgressBind_other = الآخر
bhv_pd_ProgressBind_other = العنصر الآخر (OTHER_PROGRESS / OTHER_TEXT).
bhv_p_ProgressBind_minValue = أدنى قيمة
bhv_pd_ProgressBind_minValue = الرقم الذي يعرض شريطاً فارغاً.
bhv_p_ProgressBind_maxValue = أقصى قيمة
bhv_pd_ProgressBind_maxValue = الرقم الذي يعرض شريطاً ممتلئاً.
bhv_p_ProgressBind_smoothing = التنعيم
bhv_pd_ProgressBind_smoothing = سرعة لحاق الشريط (0 = فوراً).
bhv_p_ProgressBind_pollInterval = فترة القراءة
bhv_pd_ProgressBind_pollInterval = عدد مرات قراءة المصدر؛ القيمة المحفوظة بالاسم تُقرأ من التخزين.
bhv_n_ScoreCounter = عداد النقاط
bhv_d_ScoreCounter = يعرض متغير مشهد (نقاط، عملات، أرواح...) في عنصر نص مع بادئة وحشو وحركة عدّ، ويحتفظ بأعلى نتيجة على الجهاز.
bhv_p_ScoreCounter_variable = المتغير
bhv_pd_ScoreCounter_variable = متغير المشهد المراد عرضه (int أو float منشأ في المتغيرات). Collectible وTimer يكتبان في المتغيرات بالاسم. فارغ = يحتفظ العداد برقمه الخاص.
bhv_g_Value = القيمة
bhv_p_ScoreCounter_display = العرض
bhv_pd_ScoreCounter_display = عنصر النص الذي يعرضه. فارغ = هذا العنصر (إذا كان نصاً).
bhv_p_ScoreCounter_prefix = البادئة
bhv_pd_ScoreCounter_prefix = تُكتب قبل الرقم، مثل SCORE
bhv_p_ScoreCounter_suffix = اللاحقة
bhv_pd_ScoreCounter_suffix = تُكتب بعد الرقم، مثل  pts
bhv_p_ScoreCounter_decimals = الخانات العشرية
