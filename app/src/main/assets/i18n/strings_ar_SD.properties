bhv_pd_Pulse_minScale = أصغر حجم، 1 = الحجم العادي.
bhv_p_Pulse_maxScale = أقصى مقياس
bhv_pd_Pulse_maxScale = أكبر حجم، 1 = الحجم العادي.
bhv_p_Pulse_speed = السرعة
bhv_pd_Pulse_speed = نبضات في الثانية.
bhv_p_Pulse_lowOpacity = العتامة الدنيا
bhv_pd_Pulse_lowOpacity = العتامة عند أصغر حجم (1 = بلا تلاشٍ).
bhv_p_Pulse_autoPlay = تشغيل تلقائي
bhv_pd_Pulse_autoPlay = ابدأ النبض بمجرد بدء المشهد. وإلا استخدم بلوكات البدء / نبضة واحدة.
bhv_p_Pulse_pulseWhileTouched = النبض أثناء اللمس
bhv_pd_Pulse_pulseWhileTouched = استمر بالنبض ما دام العنصر ملموساً.
bhv_n_ScaleTouchEffect = تأثير تحجيم اللمس
bhv_d_ScaleTouchEffect = ينكمش العنصر (أو يكبر) عند لمسه ويرتد عند التحرير.
bhv_p_ScaleTouchEffect_pressedScale = مقياس الضغط
bhv_pd_ScaleTouchEffect_pressedScale = المقياس أثناء اللمس، 1 = الحجم العادي.
