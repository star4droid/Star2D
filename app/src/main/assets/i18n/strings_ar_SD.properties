bhv_pd_Projectile_knockback = يدفع الهدف المصاب في اتجاه الطيران، بوحدة px/s.
bhv_p_Projectile_hitSound = صوت الضربة
bhv_pd_Projectile_hitSound = يُشغَّل عند إصابة هدف.
