bhv_n_TapToMove = انقر للتحرك
bhv_d_TapToMove = يتحرك إلى حيث تلمس: TAP يمشي إلى النقطة المنقورة (استراتيجية، أشر وانقر)، HOLD يتبع الإصبع ما دام مضغوطاً، DRAG_ITEM يتيح لك الإمساك بالعنصر نفسه وسحبه (قطع الألغاز، البطاقات). اللمسات على أزرار/عصا تحكم قائمة التجاهل لا تُستخدم.
bhv_p_TapToMove_mode = الوضع
bhv_pd_TapToMove_mode = TAP: اذهب إلى النقطة المنقورة. HOLD: اتبع الإصبع ما دام مضغوطاً. DRAG_ITEM: المس العنصر واسحبه.
bhv_g_Touch = اللمس
bhv_p_TapToMove_ignoreTouchesOn = تجاهل اللمسات على
bhv_pd_TapToMove_ignoreTouchesOn = اللمسات التي تبدأ على هذه العناصر (أزرار، عصا تحكم، لوحات) تُتجاهل.
bhv_p_TapToMove_marker = العلامة
bhv_pd_TapToMove_marker = عنصر اختياري يظهر عند النقطة المنقورة (وضع TAP)؛ ويختفي عند وصول العنصر.
bhv_p_TapToMove_speed = السرعة
bhv_pd_TapToMove_speed = سرعة المشي.
bhv_p_TapToMove_stopDistance = مسافة التوقف
bhv_pd_TapToMove_stopDistance = يُعد وصل عندما يقترب بهذا المقدار.
bhv_p_TapToMove_horizontalOnly = أفقي فقط
bhv_pd_TapToMove_horizontalOnly = يسار/يمين فقط (شخصيات المنصات تحتفظ بالجاذبية). إيقاف: يتحرك في كل الاتجاهات ويتجاهل الجاذبية.
bhv_p_TapToMove_dragStiffness = صلابة السحب
bhv_pd_TapToMove_dragStiffness = DRAG_ITEM: مدى إحكام تتبع العنصر للإصبع (للعناصر الفيزيائية؛ الأعلى = أكثر إحكاماً).
bhv_p_TapToMove_rotateToDirection = الدوران نحو الاتجاه
bhv_pd_TapToMove_rotateToDirection = يدير العنصر نحو الجهة التي يذهب إليها.
bhv_p_TapToMove_flipToDirection = العكس حسب الاتجاه
bhv_pd_TapToMove_flipToDirection = عكس الصورة عند الذهاب لليسار.
