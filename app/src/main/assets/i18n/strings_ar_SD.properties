bhv_pd_WrapScreen_customLeft = منطقة CUSTOM: الحافة اليسرى.
bhv_p_WrapScreen_customBottom = أسفل مخصص
bhv_pd_WrapScreen_customBottom = منطقة CUSTOM: الحافة السفلية.
bhv_p_WrapScreen_customRight = يمين مخصص
bhv_pd_WrapScreen_customRight = منطقة CUSTOM: الحافة اليمنى.
bhv_p_WrapScreen_customTop = أعلى مخصص
bhv_pd_WrapScreen_customTop = منطقة CUSTOM: الحافة العلوية.
