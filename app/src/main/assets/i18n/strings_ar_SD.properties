bhv_pd_FadeIn_fromScale = الحجم عند البداية، 1 = الحجم العادي. استخدم 0.5 ليظهر بتأثير "pop".
bhv_p_FadeIn_ease = التسهيل
bhv_pd_FadeIn_ease = كيف تتغير السرعة أثناء التلاشي.
bhv_p_FadeIn_autoPlay = تشغيل تلقائي
bhv_pd_FadeIn_autoPlay = ابدأ بمجرد بدء المشهد. وإلا يظهر العنصر عادياً حتى يعمل بلوك التشغيل.
