bhv_pd_Blink_onTime = مدة بقائه مرئياً في كل مرة.
bhv_p_Blink_offTime = مدة الاختفاء
bhv_pd_Blink_offTime = مدة بقائه مخفياً في كل مرة.
bhv_p_Blink_offOpacity = عتامة الاختفاء
bhv_pd_Blink_offOpacity = العتامة أثناء "الاختفاء" (0 = غير مرئي).
bhv_p_Blink_smooth = سلس
bhv_pd_Blink_smooth = يتلاشى بسلاسة بدلاً من التبديل فوراً.
bhv_p_Blink_count = العدد
bhv_pd_Blink_count = عدد الومضات، ثم يتوقف مرئياً. 0 = للأبد.
bhv_p_Blink_autoPlay = تشغيل تلقائي
bhv_pd_Blink_autoPlay = ابدأ الوميض بمجرد بدء المشهد.
bhv_n_FadeIn = ظهور تدريجي
bhv_d_FadeIn = يظهر العنصر بسلاسة: من غير مرئي (واختيارياً أصغر) إلى مظهره العادي. مناسب للقوائم والعناوين.
bhv_p_FadeIn_duration = المدة
bhv_pd_FadeIn_duration = مدة التلاشي.
bhv_p_FadeIn_delay = التأخير
bhv_pd_FadeIn_delay = انتظر هذه المدة قبل البدء.
bhv_p_FadeIn_fromOpacity = العتامة الابتدائية
bhv_pd_FadeIn_fromOpacity = العتامة عند البداية (0 = غير مرئي).
