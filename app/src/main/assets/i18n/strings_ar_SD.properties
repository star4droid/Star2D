bc_dims = يظهر في المشاهد
bc_dims_2d = مشاهد ثنائية الأبعاد
bc_dims_3d = مشاهد ثلاثية الأبعاد
bc_dims_both = كلاهما
bhv_n_Billboard3D = لوحة مواجهة ثلاثية الأبعاد
bhv_d_Billboard3D = يدير وجهه دائماً نحو الكاميرا: أشجار مسطحة، بطاقات أسماء، أشرطة صحة، صور، لافتات. الوضع القائم يدور حول Y فقط فلا يميل للخلف أبداً.
bhv_p_Billboard3D_upright = قائم
bhv_pd_Billboard3D_upright = يدور حول Y فقط (يبقى قائماً).
bhv_p_Billboard3D_faceIsPlusZ = الوجه هو الجانب +Z
bhv_pd_Billboard3D_faceIsPlusZ = وجه العنصر هو جانبه +Z (مربعات ومستويات مصنوعة لتواجه +Z) بدل -Z.
bhv_p_Billboard3D_smoothing = النعومة
bhv_pd_Billboard3D_smoothing = دوران ناعم (0 = فوراً).
bhv_p_Billboard3D_maxDistance = أقصى مسافة
bhv_pd_Billboard3D_maxDistance = يتوقف عن الدوران إذا ابتعد عن الكاميرا أكثر من هذا (0 = دائماً).
bhv_n_Buoyancy3D = الطفو ثلاثي الأبعاد
bhv_d_Buoyancy3D = يطفو على عنصر ماء ويتمايل مع أمواجه: قوارب، أطواف، براميل، مقعد يغسله البحر، بط. بدون جسم يركب السطح بدقة؛ ومع جسم DYNAMIC تدفع الأمواج زواياه فيميل ويتمايل حقيقياً.
bhv_e_Buoyancy3D_onEnterWater = عند دخول الماء
bhv_e_Buoyancy3D_onLeaveWater = عند مغادرة الماء
bhv_p_Buoyancy3D_water = الماء
bhv_pd_Buoyancy3D_water = عنصر الماء (فارغ = الماء الذي تحته).
bhv_p_Buoyancy3D_sinkDepth = عمق الغطس
bhv_pd_Buoyancy3D_sinkDepth = كم يغطس في الماء (سالب = يطفو فوقه).
bhv_p_Buoyancy3D_tilt = الميلان
bhv_pd_Buoyancy3D_tilt = مقدار ميلانه مع الأمواج (0 = يبقى مستوياً).
bhv_p_Buoyancy3D_smoothing = النعومة
bhv_pd_Buoyancy3D_smoothing = يتبع السطح بنعومة (أعلى = أسرع).
bhv_p_Buoyancy3D_lift = الرفع
bhv_pd_Buoyancy3D_lift = DYNAMIC: قوة رفع الماء له (1 = يطفو عند عمق الغطس).
bhv_p_Buoyancy3D_drag = المقاومة
bhv_pd_Buoyancy3D_drag = DYNAMIC: الماء يبطئه (مقاومة).
bhv_p_Buoyancy3D_drift = الانجراف
bhv_pd_Buoyancy3D_drift = انجراف بطيء مع الأمواج (بدون جسم).
bhv_n_CameraOrbitTouch3D = كاميرا مدارية باللمس ثلاثية الأبعاد
bhv_d_CameraOrbitTouch3D = اسحب لتدوير الكاميرا حول هدف وقرّب بإصبعين، مع حدود كي لا تنزل تحت الأرض أبداً: عارض نماذج، مرائب واختيار سيارات، خرائط استراتيجية، قوائم. تدور ببطء وحدها عندما لا يلمس أحد الشاشة.
bhv_e_CameraOrbitTouch3D_onIdle = عند الخمول
bhv_p_CameraOrbitTouch3D_target = الهدف
bhv_pd_CameraOrbitTouch3D_target = العنصر الذي تدور حوله (فارغ = النقطة التي تنظر إليها الكاميرا عند بدء اللعبة).
bhv_p_CameraOrbitTouch3D_lookHeight = ارتفاع النظر
bhv_pd_CameraOrbitTouch3D_lookHeight = ينظر إلى هذا الارتفاع فوق الهدف.
bhv_p_CameraOrbitTouch3D_distance = المسافة
bhv_pd_CameraOrbitTouch3D_distance = المسافة عند البدء (0 = المسافة الحالية عند البدء).
bhv_p_CameraOrbitTouch3D_minDistance = أدنى مسافة
bhv_pd_CameraOrbitTouch3D_minDistance = أقرب تكبير.
bhv_p_CameraOrbitTouch3D_maxDistance = أقصى مسافة
bhv_pd_CameraOrbitTouch3D_maxDistance = أبعد تصغير.
bhv_p_CameraOrbitTouch3D_minPitch = أدنى ميل
bhv_pd_CameraOrbitTouch3D_minPitch = أدنى زاوية نظر (سالب = من الأعلى).
bhv_p_CameraOrbitTouch3D_maxPitch = أقصى ميل
bhv_pd_CameraOrbitTouch3D_maxPitch = أعلى زاوية نظر (0 = بمستوى الهدف).
bhv_p_CameraOrbitTouch3D_sensitivity = الحساسية
bhv_pd_CameraOrbitTouch3D_sensitivity = درجات لكل بكسل مسحوب.
bhv_p_CameraOrbitTouch3D_autoRotate = دوران تلقائي
bhv_pd_CameraOrbitTouch3D_autoRotate = تدور وحدها حين لا يلمس أحد (0 = أبداً).
bhv_p_CameraOrbitTouch3D_idleDelay = مهلة الخمول
bhv_pd_CameraOrbitTouch3D_idleDelay = ثوانٍ بدون لمس قبل أن تدور وحدها.
bhv_n_Car3D = سيارة ثلاثية الأبعاد
bhv_d_Car3D = سيارة ثلاثية الأبعاد قابلة للقيادة بتعليق حقيقي (مركبة Bullet بالأشعة): وقود، فرامل / رجوع، توجيه، انجراف بفرامل اليد، سرعة قصوى بالكم/س. العجلات يمكن أن تكون عُقداً في نموذج السيارة ("wheel-front-left"...) أو عناصر منفصلة أو غير مرئية. تحتاج جسماً DYNAMIC.
bhv_e_Car3D_onFlip = عند الانقلاب
bhv_e_Car3D_onDriftStart = عند بدء الانجراف
bhv_e_Car3D_onDriftEnd = عند انتهاء الانجراف
bhv_p_Car3D_joystick = عصا التحكم
bhv_pd_Car3D_joystick = عصا التحكم: يسار/يمين للتوجيه، أعلى للوقود، أسفل للفرامل / الرجوع.
bhv_p_Car3D_gasButton = زر الوقود
bhv_pd_Car3D_gasButton = زر الوقود (مع الضغط المستمر).
bhv_p_Car3D_brakeButton = زر الفرامل
bhv_pd_Car3D_brakeButton = زر الفرامل (مع الضغط المستمر): يفرمل ثم يرجع للخلف عند التوقف.
bhv_p_Car3D_leftButton = زر اليسار
bhv_pd_Car3D_leftButton = زر التوجيه لليسار (مع الضغط المستمر).
bhv_p_Car3D_rightButton = زر اليمين
bhv_pd_Car3D_rightButton = زر التوجيه لليمين (مع الضغط المستمر).
bhv_p_Car3D_handbrakeButton = زر فرامل اليد
bhv_pd_Car3D_handbrakeButton = زر فرامل اليد (مع الضغط المستمر): يقفل العجلات الخلفية للانجراف.
bhv_p_Car3D_useKeyboard = استخدم لوحة المفاتيح
bhv_pd_Car3D_useKeyboard = الأسهم / WASD للقيادة، والمسافة لفرامل اليد (الحاسوب، الاختبارات).
bhv_p_Car3D_useTilt = استخدم الإمالة
bhv_pd_Car3D_useTilt = أمِل الهاتف للتوجيه.
bhv_p_Car3D_autoGas = وقود تلقائي
bhv_pd_Car3D_autoGas = يضغط الوقود دائماً (ألعاب الجري اللانهائي: توجيه فقط).
bhv_p_Car3D_deadZone = المنطقة الميتة
bhv_pd_Car3D_deadZone = دفعات عصا التحكم الأصغر من هذا تُتجاهل.
bhv_p_Car3D_maxSpeed = أقصى سرعة
bhv_pd_Car3D_maxSpeed = السرعة القصوى للأمام.
bhv_p_Car3D_reverseSpeed = سرعة الرجوع
bhv_pd_Car3D_reverseSpeed = السرعة القصوى للخلف.
bhv_p_Car3D_acceleration = التسارع
bhv_pd_Car3D_acceleration = مدى سرعة المحرك في تسريع السيارة.
bhv_p_Car3D_brakeStrength = قوة الفرامل
bhv_pd_Car3D_brakeStrength = مدى قوة الفرامل في إبطائها.
bhv_p_Car3D_drive = الدفع
bhv_pd_Car3D_drive = العجلات التي يديرها المحرك.
bhv_p_Car3D_engineSound = صوت المحرك
bhv_pd_Car3D_engineSound = صوت محرك متكرر؛ طبقته تتبع السرعة (فارغ = صامت).
bhv_p_Car3D_engineVolume = صوت المحرك
bhv_pd_Car3D_engineVolume = مستوى صوت المحرك.
bhv_p_Car3D_maxSteerAngle = أقصى زاوية توجيه
bhv_pd_Car3D_maxSteerAngle = أكبر زاوية للعجلات الأمامية.
bhv_p_Car3D_steerSpeed = سرعة التوجيه
bhv_pd_Car3D_steerSpeed = مدى سرعة دوران العجلات للتوجيه.
bhv_p_Car3D_steerReduction = تقليل التوجيه
bhv_pd_Car3D_steerReduction = يوجّه أقل عند السرعة القصوى (0 = أبداً، 1 = شبه مستقيم).
bhv_p_Car3D_grip = التماسك
bhv_pd_Car3D_grip = تماسك الإطارات (أعلى = يلتصق بالطريق، أقل = ينزلق).
bhv_p_Car3D_driftGrip = تماسك الانجراف
bhv_pd_Car3D_driftGrip = التماسك الخلفي أثناء فرامل اليد (صغير = انجراف).
bhv_p_Car3D_driftSpeed = سرعة الانجراف
bhv_pd_Car3D_driftSpeed = السرعة الجانبية التي تُعد انجرافاً (أحداث).
bhv_p_Car3D_suspensionLength = طول التعليق
bhv_pd_Car3D_suspensionLength = الطول الحر للنوابض.
bhv_p_Car3D_stiffness = الصلابة
bhv_pd_Car3D_stiffness = صلابة النوابض (أعلى = قيادة أقسى).
bhv_p_Car3D_damping = التخميد
bhv_pd_Car3D_damping = تخميد النوابض (أعلى = ارتداد أقل).
bhv_p_Car3D_bodyRoll = ميلان الهيكل
bhv_pd_Car3D_bodyRoll = مقدار ميلان الهيكل في المنعطفات (0 = مستوٍ، 1 = حقيقي، قد ينقلب).
bhv_p_Car3D_wheelMode = وضع العجلات
bhv_pd_Car3D_wheelMode = AUTO: عُقد النموذج إن وُجدت، وإلا عناصر العجلات، وإلا عجلات غير مرئية في الزوايا.
bhv_p_Car3D_frontLeftNode = العقدة الأمامية اليسرى
bhv_pd_Car3D_frontLeftNode = عقدة العجلة الأمامية اليسرى في نموذج السيارة.
bhv_p_Car3D_frontRightNode = العقدة الأمامية اليمنى
bhv_pd_Car3D_frontRightNode = عقدة العجلة الأمامية اليمنى في نموذج السيارة.
bhv_p_Car3D_rearLeftNode = العقدة الخلفية اليسرى
bhv_pd_Car3D_rearLeftNode = عقدة العجلة الخلفية اليسرى في نموذج السيارة.
bhv_p_Car3D_rearRightNode = العقدة الخلفية اليمنى
bhv_pd_Car3D_rearRightNode = عقدة العجلة الخلفية اليمنى في نموذج السيارة.
bhv_p_Car3D_frontLeftWheel = العجلة الأمامية اليسرى
bhv_pd_Car3D_frontLeftWheel = عنصر العجلة الأمامية اليسرى (وضع ELEMENTS).
bhv_p_Car3D_frontRightWheel = العجلة الأمامية اليمنى
bhv_pd_Car3D_frontRightWheel = عنصر العجلة الأمامية اليمنى (وضع ELEMENTS).
bhv_p_Car3D_rearLeftWheel = العجلة الخلفية اليسرى
bhv_pd_Car3D_rearLeftWheel = عنصر العجلة الخلفية اليسرى (وضع ELEMENTS).
bhv_p_Car3D_rearRightWheel = العجلة الخلفية اليمنى
bhv_pd_Car3D_rearRightWheel = عنصر العجلة الخلفية اليمنى (وضع ELEMENTS).
bhv_p_Car3D_wheelRadius = نصف قطر العجلة
bhv_pd_Car3D_wheelRadius = نصف قطر العجلة (0 = يُقاس من العجلات).
bhv_p_Car3D_fitCollider = ملاءمة المصادم
bhv_pd_Car3D_fitCollider = يقلّص مصادم الهيكل فوق العجلات كي تحمل النوابض السيارة (مستحسن).
bhv_p_Car3D_followCamera = كاميرا متابعة
bhv_pd_Car3D_followCamera = الكاميرا تتبع خلف السيارة (كاميرا فارغة = الرئيسية).
bhv_p_Car3D_camera = الكاميرا
bhv_pd_Car3D_camera = الكاميرا التي تتبع (فارغ = الكاميرا الرئيسية).
bhv_p_Car3D_cameraDistance = بُعد الكاميرا
bhv_pd_Car3D_cameraDistance = بُعد الكاميرا خلف السيارة.
bhv_p_Car3D_cameraHeight = ارتفاع الكاميرا
bhv_pd_Car3D_cameraHeight = ارتفاع الكاميرا فوق السيارة.
bhv_p_Car3D_flipResetTime = مهلة إعادة الانقلاب
bhv_pd_Car3D_flipResetTime = يعيد السيارة على عجلاتها بعد بقائها مقلوبة هذه المدة (0 = أبداً).
bhv_n_CharacterAnimator3D = محرّك الشخصية ثلاثي الأبعاد
bhv_d_CharacterAnimator3D = يشغّل مقاطع الوقوف والمشي والجري والقفز والسقوط للنموذج حسب سرعة حركته الحقيقية، مع مزج ناعم. يعمل مع أي حركة (بلوكاتك، الذكاء الاصطناعي، الفيزياء). يكفي جزء من اسم المقطع ("walk").
bhv_e_CharacterAnimator3D_onClipChanged = عند تغيّر المقطع
bhv_p_CharacterAnimator3D_idleClip = مقطع الوقوف
bhv_pd_CharacterAnimator3D_idleClip = المقطع أثناء الوقوف بلا حركة (يكفي جزء من الاسم).
bhv_p_CharacterAnimator3D_walkClip = مقطع المشي
bhv_pd_CharacterAnimator3D_walkClip = المقطع أثناء المشي.
bhv_p_CharacterAnimator3D_runClip = مقطع الجري
bhv_pd_CharacterAnimator3D_runClip = المقطع أثناء الجري (فارغ = مقطع المشي).
bhv_p_CharacterAnimator3D_jumpClip = مقطع القفز
bhv_pd_CharacterAnimator3D_jumpClip = المقطع أثناء الصعود في الهواء (فارغ = يبقى مقطع الأرض).
bhv_p_CharacterAnimator3D_fallClip = مقطع السقوط
bhv_pd_CharacterAnimator3D_fallClip = المقطع أثناء السقوط (فارغ = مقطع القفز).
bhv_p_CharacterAnimator3D_walkSpeed = سرعة المشي
bhv_pd_CharacterAnimator3D_walkSpeed = سرعة مقطع المشي كما صُنع (المشي الأبطأ يشغّله أبطأ).
bhv_p_CharacterAnimator3D_runSpeed = سرعة الجري
bhv_pd_CharacterAnimator3D_runSpeed = السرعة التي يبدأ منها مقطع الجري.
bhv_p_CharacterAnimator3D_matchSpeed = مطابقة السرعة
bhv_pd_CharacterAnimator3D_matchSpeed = سرعة المقطع تتبع سرعة الحركة (بدون انزلاق الأقدام).
bhv_p_CharacterAnimator3D_blendTime = زمن المزج
bhv_pd_CharacterAnimator3D_blendTime = زمن المزج بين مقطعين.
bhv_p_CharacterAnimator3D_groundCheck = فحص الأرض
bhv_pd_CharacterAnimator3D_groundCheck = يُعد في الهواء إذا لم يكن شيء بهذا القرب تحت القدمين.
bhv_n_Chase3D = المطاردة ثلاثية الأبعاد
bhv_d_Chase3D = عدو يرى اللاعب (مدى، مجال رؤية، الجدران تحجب الرؤية) أو يسمعه، فيجري خلفه، ويهاجم عند الاقتراب، ويبحث في آخر مكان رآه فيه لفترة، ثم يعود لمكانه. يعمل مع الدورية ثلاثية الأبعاد على نفس العنصر.
bhv_e_Chase3D_onSpotted = عند رصده
bhv_e_Chase3D_onLost = عند فقدانه
bhv_e_Chase3D_onAttack = عند الهجوم
bhv_p_Chase3D_target = الهدف
bhv_pd_Chase3D_target = من يطارد (فارغ = الكاميرا الرئيسية: لاعب منظور الشخص الأول).
bhv_p_Chase3D_sightRange = مدى الرؤية
bhv_pd_Chase3D_sightRange = يرى الهدف حتى هذه المسافة.
bhv_p_Chase3D_fieldOfView = مجال الرؤية
bhv_pd_Chase3D_fieldOfView = عرض الرؤية أمامه (360 = في كل الاتجاهات).
