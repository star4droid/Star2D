bhv_g_Combat = القتال
bhv_note_DamageOnTouch = يتطلب عنصراً فيزيائياً. تُكتشف الأهداف بالتماس، لذا يجب أن يشارك جسم Dynamic؛ وتُكتشف أهداف القائمة أيضاً بالتداخل.
bhv_p_DamageOnTouch_targets = الأهداف
bhv_pd_DamageOnTouch_targets = العناصر التي تتأذى. اترك الحقلين فارغين لإيذاء أي شيء له سلوك الصحة.
