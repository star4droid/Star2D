bhv_d_Destructible = صناديق، طوب، جدران: ينكسر بعد عدد من الضربات (رصاص، DamageOnTouch، أو كرة تلمسه)، ويعرض صور التلف تدريجياً ويمكنه إسقاط عنصر.
