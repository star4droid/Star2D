bhv_p_PowerUp_shield = الدرع
bhv_pd_PowerUp_shield = لا يمكن إيذاء الجامع خلال هذه المدة (تتطلب الصحة).
bhv_p_PowerUp_collectSound = صوت الجمع
bhv_pd_PowerUp_collectSound = يُشغَّل عند أخذه.
bhv_p_PowerUp_afterCollect = بعد الجمع
bhv_pd_PowerUp_afterCollect = DESTROY يزيله بعد انتهاء التأثيرات، HIDE يخفيه فقط.
bhv_p_PowerUp_respawnAfter = إعادة الظهور بعد
bhv_pd_PowerUp_respawnAfter = يعود بعد هذه المدة (ليمكن أخذ التعزيز نفسه مجدداً). 0 = أبداً.
bhv_n_Respawn = إعادة الظهور
bhv_d_Respawn = يعيد اللاعب إلى آخر نقطة حفظ (أو إلى مكان البداية) بعد الموت أو السقوط خارج العالم، مع حصانة قصيرة، وعداد أرواح اختياري، ومشهد نهاية اللعبة.
bhv_note_Respawn = يتطلب عنصراً فيزيائياً. اضبط إجراء الموت في الصحة على RESPAWN لاستخدامه عند الموت.
bhv_p_Respawn_channel = القناة
bhv_pd_Respawn_channel = يجب أن تطابق قناة نقاط الحفظ التي سيستخدمها.
bhv_p_Respawn_startAtCheckpoint = البدء من نقطة الحفظ
bhv_pd_Respawn_startAtCheckpoint = عند بدء المشهد، انتقل إلى نقطة الحفظ المحفوظة إن وُجدت (بعد إعادة التشغيل).
bhv_p_Respawn_saveToDisk = الحفظ على القرص
bhv_pd_Respawn_saveToDisk = ابحث أيضاً عن نقطة حفظ مخزنة على القرص.
