bhv_p_Destructible_hitters = الضاربون
bhv_pd_Destructible_hitters = العناصر التي تؤذيه باللمس (كرة للطوب).
bhv_g_Hit_by_touching = يُضرب باللمس
bhv_p_Destructible_hitterPrefix = بادئة الضارب
bhv_pd_Destructible_hitterPrefix = وكذلك العناصر التي يبدأ اسمها بإحدى هذه الكلمات، مثال: ball (افصل بينها بفواصل).
