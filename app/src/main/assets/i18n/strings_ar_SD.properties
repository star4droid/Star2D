bhv_p_FadeOut_trigger = المشغّل
bhv_pd_FadeOut_trigger = متى يبدأ التلاشي. MANUAL = فقط عند تشغيل بلوك التشغيل.
bhv_p_FadeOut_duration = المدة
bhv_pd_FadeOut_duration = مدة التلاشي.
bhv_p_FadeOut_delay = التأخير
bhv_pd_FadeOut_delay = انتظر هذه المدة قبل البدء (رسالة تختفي من تلقاء نفسها).
bhv_p_FadeOut_toOpacity = العتامة النهائية
bhv_pd_FadeOut_toOpacity = العتامة عند النهاية (0 = غير مرئي).
bhv_p_FadeOut_toScale = المقياس النهائي
bhv_pd_FadeOut_toScale = الحجم عند النهاية، 1 = الحجم العادي. استخدم 0 للانكماش حتى الزوال.
bhv_p_FadeOut_ease = التسهيل
bhv_pd_FadeOut_ease = كيف تتغير السرعة أثناء التلاشي.
