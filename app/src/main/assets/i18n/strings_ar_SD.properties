bhv_pd_CountUp_duration = مدة العدّ.
bhv_p_CountUp_delay = التأخير
bhv_pd_CountUp_delay = انتظر هذه المدة قبل العدّ.
bhv_p_CountUp_decimals = الخانات العشرية
bhv_pd_CountUp_decimals = الأرقام بعد النقطة.
