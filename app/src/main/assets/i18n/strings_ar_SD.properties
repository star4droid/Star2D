bhv_g_Camera = الكاميرا
bhv_p_CameraFollow_target = الهدف
bhv_pd_CameraFollow_target = العنصر المراد تتبعه. فارغ = العنصر الذي عليه هذا السلوك.
bhv_g_Target = الهدف
bhv_p_CameraFollow_followX = تتبع س
bhv_pd_CameraFollow_followX = تتبع أفقياً.
bhv_p_CameraFollow_followY = تتبع ص
bhv_pd_CameraFollow_followY = تتبع رأسياً.
bhv_p_CameraFollow_offsetX = إزاحة س
bhv_pd_CameraFollow_offsetX = انظر بهذا المقدار إلى يمين الهدف (سالب = يسار).
bhv_p_CameraFollow_offsetY = إزاحة ص
bhv_pd_CameraFollow_offsetY = انظر بهذا المقدار فوق الهدف (سالب = تحت).
