bhv_p_LongPress_holdBar = شريط الإمساك
bhv_pd_LongPress_holdBar = عنصر تقدم Progress يمتلئ أثناء الإمساك (اختياري): أمسك للتأكيد.
bhv_n_OpenSceneOnClick = فتح مشهد عند النقر
bhv_d_OpenSceneOnClick = لمس العنصر يفتح مشهداً آخر، بعد انتظار وتلاشٍ اختياريين. لأزرار اللعب والقوائم.
bhv_p_OpenSceneOnClick_scene = المشهد
bhv_pd_OpenSceneOnClick_scene = اسم المشهد المراد فتحه (كما هو مكتوب في قائمة المشاهد).
bhv_p_OpenSceneOnClick_trigger = المشغّل
bhv_pd_OpenSceneOnClick_trigger = CLICK = عند الضغط والتحرير على العنصر، TOUCH_START = بمجرد الضغط.
bhv_p_OpenSceneOnClick_delay = التأخير
bhv_pd_OpenSceneOnClick_delay = انتظر هذه المدة قبل تغيير المشهد (وقت لصوت أو تأثير).
bhv_p_OpenSceneOnClick_fadeOverlay = طبقة التلاشي
bhv_pd_OpenSceneOnClick_fadeOverlay = صندوق أسود كبير فوق الشاشة كلها (اختياري): يظهر تدريجياً قبل تغيير المشهد. اجعله غير مرئي أو بعتامة 0% في المحرر.
bhv_p_OpenSceneOnClick_fadeTime = مدة التلاشي
bhv_pd_OpenSceneOnClick_fadeTime = المدة التي تستغرقها الطبقة لتظهر تدريجياً.
bhv_p_OpenSceneOnClick_clickSound = صوت النقر
bhv_pd_OpenSceneOnClick_clickSound = الصوت الذي يُشغَّل عند قبول اللمس (اختياري).
bhv_n_SwipeDetector = كاشف السحب
bhv_d_SwipeDetector = يكشف سحبة إصبع لليسار أو اليمين أو الأعلى أو الأسفل، على العنصر أو في أي مكان على الشاشة. لقلب الصفحات والقوائم والألعاب التي يُتحكم فيها بالسحب.
bhv_p_SwipeDetector_onlyOnElement = على العنصر فقط
bhv_pd_SwipeDetector_onlyOnElement = تُحتسب السحبات التي تبدأ على هذا العنصر فقط. إيقاف = سحبة في أي مكان على الشاشة.
bhv_p_SwipeDetector_minDistance = أدنى مسافة
bhv_pd_SwipeDetector_minDistance = المسافة التي يجب أن يقطعها الإصبع (بكسل الشاشة).
bhv_p_SwipeDetector_maxTime = أقصى زمن
bhv_pd_SwipeDetector_maxTime = يجب إنجاز السحبة خلال هذا الزمن؛ تُتجاهل السحبات الأبطأ (0 = بلا حد).
