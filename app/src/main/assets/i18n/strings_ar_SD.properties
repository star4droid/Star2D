bhv_pd_Parallax_factorY = الأمر نفسه للأعلى والأسفل. يُستخدم فقط عند تفعيل "التأثير على الرأسي".
bhv_p_Parallax_affectVertical = التأثير على الرأسي
bhv_pd_Parallax_affectVertical = يستجيب أيضاً عند تحرك الكاميرا للأعلى والأسفل.
