bhv_pd_Typewriter_tickEvery = شغّل صوت التكّة كل هذا العدد من الحروف.
bhv_n_Blink = الوميض
bhv_d_Blink = يومض العنصر ظاهراً ومختفياً (أو يتلاشى ويظهر). مناسب لنصوص "انقر للبدء" والتحذيرات وفترة الحصانة.
bhv_g_UI_effects = تأثيرات الواجهة
