visibleDetails = determina se o elemento é visível ou não
bulletDetails = Se o item é um projétil, ele responderá à física mais rápido e periodicamente (esta característica não deve ser ativada sempre)
fixedRotationDetails = torna a rotação do item fixa no jogo.
isSensorDetails = O elemento sensor apenas detecta outros objetos, mas não é afetado fisicamente por eles.
shapeDetails = determina o tipo de forma (retangular/circular/personalizada)
lightTypeDetails = determina o tipo de luz
