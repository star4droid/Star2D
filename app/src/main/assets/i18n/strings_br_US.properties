tut_add_finish=Adicione "%1$s" embaixo: ele fecha o cenário antigo, e só o novo continua rodando.
tut_finish_inside=Arraste "%1$s" também para a abertura "senão", embaixo de "%2$s": ele fecha o cenário antigo para só o novo rodar.
