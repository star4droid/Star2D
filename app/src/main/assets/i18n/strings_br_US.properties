bhv_p_Spawner_template = Modelo
bhv_pd_Spawner_template = O elemento a copiar. Ele fica oculto quando o jogo começa; cada cópia mantém seus comportamentos, eventos e propriedades.
bhv_g_What = O quê
bhv_p_Spawner_moreTemplates = Mais modelos
bhv_pd_Spawner_moreTemplates = Mais elementos para copiar: cada criação escolhe um de todos os modelos ao acaso.
bhv_p_Spawner_spawnedLifetime = Tempo de vida da cópia
bhv_pd_Spawner_spawnedLifetime = Cada cópia se remove após este tempo (0 = nunca).
bhv_p_Spawner_autoStart = Início automático
bhv_pd_Spawner_autoStart = Começa a criar quando o cenário começa. Desativado: chame start spawning.
bhv_g_When = Quando
bhv_p_Spawner_firstDelay = Primeiro atraso
bhv_pd_Spawner_firstDelay = Espera este tempo antes da primeira criação.
bhv_p_Spawner_interval = Intervalo
bhv_pd_Spawner_interval = Segundos entre duas criações (em ondas: entre dois membros de uma onda).
bhv_p_Spawner_maxAlive = Máx. vivos
bhv_pd_Spawner_maxAlive = Nenhuma cópia nova enquanto houver tantas vivas. 0 = sem limite (o motor para em 300).
bhv_p_Spawner_totalLimit = Limite total
bhv_pd_Spawner_totalLimit = Para de vez após tantas criações. 0 = nunca.
bhv_p_Spawner_speedUp = Acelerar
bhv_pd_Spawner_speedUp = Cada criação (cada onda no modo de ondas) deixa o intervalo tanto mais curto.
bhv_p_Spawner_minInterval = Intervalo mín.
bhv_pd_Spawner_minInterval = O intervalo nunca fica mais curto que isto.
bhv_p_Spawner_area = Área
bhv_pd_Spawner_area = AT_SPAWNER: no spawner. INSIDE_SELF: em qualquer lugar da caixa dele. RING: ao redor dele. POINTS: nos elementos marcadores abaixo.
bhv_g_Where = Onde
bhv_p_Spawner_radiusMin = Raio mín.
bhv_pd_Spawner_radiusMin = RING: menor distância do spawner.
bhv_p_Spawner_radiusMax = Raio máx.
bhv_pd_Spawner_radiusMax = RING: maior distância do spawner.
bhv_p_Spawner_points = Pontos
bhv_pd_Spawner_points = POINTS: elementos que marcam onde as cópias aparecem.
bhv_p_Spawner_randomPoint = Ponto aleatório
bhv_pd_Spawner_randomPoint = POINTS: escolhe um ponto aleatório. Desativado: percorre-os em ordem.
bhv_p_Spawner_useWaves = Usar ondas
bhv_pd_Spawner_useWaves = Cria em ondas: um grupo, uma pausa, um grupo maior...
bhv_g_Waves = Ondas
bhv_p_Spawner_waveSize = Tamanho da onda
bhv_pd_Spawner_waveSize = Membros da primeira onda.
bhv_p_Spawner_waveGrowth = Crescimento da onda
bhv_pd_Spawner_waveGrowth = Cada onda tem tantos membros a mais que a anterior.
bhv_p_Spawner_waveCount = Número de ondas
bhv_pd_Spawner_waveCount = Quantidade de ondas. 0 = sem fim.
bhv_p_Spawner_waveDelay = Atraso da onda
bhv_pd_Spawner_waveDelay = Pausa entre duas ondas.
bhv_p_Spawner_waitUntilCleared = Esperar até limpar
bhv_pd_Spawner_waitUntilCleared = Uma onda só termina (e a próxima pode começar) quando todos os membros dela sumiram.
bhv_p_Spawner_loopWaves = Repetir ondas
bhv_pd_Spawner_loopWaves = Recomeça pela primeira onda depois da última.
bhv_p_Spawner_spawnSound = Som de criação
bhv_pd_Spawner_spawnSound = Tocado a cada criação.
bhv_n_Turret = Turret
bhv_d_Turret = Uma arma automática: encontra o alvo mais próximo no alcance, gira em direção a ele e atira balas que o ferem (os alvos precisam de um comportamento Health, ou dê a eles pontos de vida com Vida automática). As balas são reutilizadas, então é leve.
bhv_note_Turret = Requer um elemento físico; ele gira e atira a partir do centro.
bhv_p_Turret_targets = Alvos
bhv_pd_Turret_targets = Elementos em que ele atira.
bhv_g_Targets = Alvos
bhv_p_Turret_targetPrefix = Prefixo dos alvos
bhv_pd_Turret_targetPrefix = Também elementos cujo nome começa com uma destas palavras (separe com vírgulas), ex.: player, enemy.
bhv_p_Turret_range = Alcance
bhv_pd_Turret_range = Só enxerga alvos tão próximos.
bhv_p_Turret_turnSpeed = Velocidade de giro
bhv_pd_Turret_turnSpeed = Gira em direção ao alvo nesta velocidade. 0 = instantaneamente.
bhv_g_Aim = Mira
bhv_p_Turret_imageAngle = Ângulo da imagem
bhv_pd_Turret_imageAngle = Direção para onde a imagem olha na rotação 0: 0 = direita, 90 = cima, 180 = esquerda, -90 = baixo.
bhv_p_Turret_rotateToTarget = Girar para o alvo
bhv_pd_Turret_rotateToTarget = Gira o elemento em direção ao alvo. Desativado: só atira, na direção em que já aponta.
bhv_p_Turret_aimTolerance = Tolerância de mira
bhv_pd_Turret_aimTolerance = Só atira quando aponta tão perto do alvo.
bhv_p_Turret_leadTarget = Antecipar alvo
bhv_pd_Turret_leadTarget = Mira onde um alvo em movimento estará, em vez de onde ele está.
bhv_p_Turret_active = Ativo
bhv_pd_Turret_active = Atira automaticamente. Desativado: chame fire now você mesmo.
bhv_g_Fire = Tiro
bhv_p_Turret_fireRate = Cadência de tiro
bhv_pd_Turret_fireRate = Rajadas por segundo.
bhv_p_Turret_burst = Rajada
bhv_pd_Turret_burst = Balas em uma rajada.
bhv_p_Turret_burstGap = Intervalo da rajada
bhv_pd_Turret_burstGap = Pausa entre as balas de uma rajada.
bhv_p_Turret_spread = Dispersão
bhv_pd_Turret_spread = Erro lateral aleatório de cada bala.
bhv_p_Turret_muzzle = Boca do cano
bhv_pd_Turret_muzzle = As balas começam tão longe do centro, na direção do tiro (a ponta do cano).
bhv_p_Turret_bulletImage = Imagem da bala
bhv_pd_Turret_bulletImage = Imagem de uma bala. Vazio = um quadrado colorido.
bhv_g_Bullet = Bala
bhv_p_Turret_bulletColor = Cor da bala
bhv_pd_Turret_bulletColor = Cor do quadrado (ou tom da imagem).
bhv_p_Turret_bulletSize = Tamanho da bala
bhv_p_Turret_bulletSpeed = Velocidade da bala
bhv_p_Turret_bulletLifetime = Tempo de vida da bala
bhv_pd_Turret_bulletLifetime = Uma bala que não atinge nada desaparece após este tempo.
bhv_p_Turret_damage = Dano
bhv_pd_Turret_damage = Pontos de vida retirados por uma bala.
bhv_p_Turret_autoHealth = Vida automática
bhv_pd_Turret_autoHealth = Dá a um alvo sem Health esta quantidade de pontos de vida (0 = deixa como está).
bhv_p_Turret_knockback = Repulsão
bhv_pd_Turret_knockback = Empurra o alvo na direção da bala.
bhv_p_Turret_shootSound = Som de tiro
bhv_pd_Turret_shootSound = Tocado a cada tiro.
bhv_p_Turret_hitSound = Som de golpe
bhv_pd_Turret_hitSound = Tocado quando uma bala atinge.
bhv_p_Turret_obstacles = Obstáculos
bhv_pd_Turret_obstacles = Paredes que param as balas.
bhv_p_Turret_obstaclePrefix = Prefixo dos obstáculos
bhv_pd_Turret_obstaclePrefix = Também elementos cujo nome começa com uma destas palavras, ex.: wall, ground.
bhv_n_Checkpoint = Checkpoint
bhv_d_Checkpoint = Uma bandeira que lembra para onde voltar: quando o jogador a toca, o comportamento Respawn retorna para lá após a morte ou uma queda. Funciona entre reinícios de cenário (e, se quiser, entre aberturas do app).
bhv_g_Gameplay = Jogabilidade
bhv_note_Checkpoint = Requer um elemento físico; torne-o um Sensor para o jogador passar por ele.
bhv_p_Checkpoint_targets = Alvos
bhv_pd_Checkpoint_targets = Elementos que o ativam.
bhv_g_Who_activates_it = Quem o ativa
bhv_p_Checkpoint_targetPrefix = Prefixo dos alvos
bhv_pd_Checkpoint_targetPrefix = Também elementos cujo nome começa com uma destas palavras (separe com vírgulas).
bhv_p_Checkpoint_channel = Canal
bhv_pd_Checkpoint_channel = Checkpoints e comportamentos Respawn com o mesmo canal trabalham juntos. Use canais diferentes para jogadores diferentes.
bhv_g_Respawn_point = Ponto de renascimento
bhv_p_Checkpoint_offsetX = Deslocamento x
bhv_pd_Checkpoint_offsetX = O jogador volta tanto à direita do centro da bandeira (negativo = esquerda).
bhv_p_Checkpoint_offsetY = Deslocamento y
bhv_pd_Checkpoint_offsetY = O jogador volta tanto acima do centro da bandeira.
bhv_p_Checkpoint_saveToDisk = Salvar no disco
bhv_pd_Checkpoint_saveToDisk = Mantém o checkpoint depois que o app é fechado (Preferences). Desativado: dura até o jogo ser fechado ou forgetCheckpoints ser chamado.
bhv_p_Checkpoint_activeImage = Imagem ativa
bhv_pd_Checkpoint_activeImage = Imagem depois de ativado (opcional), ex.: uma bandeira erguida.
bhv_p_Checkpoint_activateSound = Som de ativação
bhv_pd_Checkpoint_activateSound = Tocado quando é ativado.
bhv_n_Collectible = Collectible
bhv_d_Collectible = Moedas, gemas, chaves, corações: quando o jogador o toca, ele soma um valor a uma variável do cenário (pontuação, moedas, chaves), pode curar, toca um som e desaparece ou volta depois.
bhv_note_Collectible = Requer um elemento físico; melhor como Sensor para o jogador passar por ele.
bhv_p_Collectible_collectors = Coletores
bhv_pd_Collectible_collectors = Elementos que podem coletá-lo.
bhv_g_Who_can_pick_it_up = Quem pode pegar
bhv_p_Collectible_collectorPrefix = Prefixo dos coletores
bhv_pd_Collectible_collectorPrefix = Também elementos cujo nome começa com uma destas palavras (separe com vírgulas). Deixe a lista e este texto vazios para que qualquer elemento com um comportamento Health possa coletá-lo.
bhv_p_Collectible_variable = Variável
bhv_pd_Collectible_variable = Nome da variável do cenário (crie-a em Variáveis: um int ou float), ex.: score ou coins. Vazio = sem variável.
bhv_g_Reward = Recompensa
bhv_p_Collectible_value = Valor
bhv_pd_Collectible_value = Somada à variável quando coletado.
bhv_p_Collectible_heal = Curar
bhv_pd_Collectible_heal = Cura o coletor (precisa de um comportamento Health nele).
bhv_p_Collectible_group = Grupo
bhv_pd_Collectible_group = Conta para um Goal que quer todos os collectibles deste grupo (moedas, estrelas...). Vazio = sem grupo.
bhv_p_Collectible_collectSound = Som de coleta
bhv_pd_Collectible_collectSound = Tocado quando é coletado.
bhv_p_Collectible_afterCollect = Após coletar
bhv_pd_Collectible_afterCollect = DESTROY o remove, HIDE o mantém invisível (volta com respawn depois), NOTHING o deixa.
bhv_g_After = Depois
bhv_p_Collectible_popTime = Tempo do estouro
bhv_pd_Collectible_popTime = Um breve estouro (cresce e esmaece) antes de desaparecer.
bhv_p_Collectible_respawnAfter = Renascer após
bhv_pd_Collectible_respawnAfter = Somente HIDE: volta após este tempo. 0 = nunca.
bhv_n_Door = Door
bhv_d_Door = Uma porta, portal ou saída: quando o jogador a toca (ou aperta um botão ao lado dela) ela abre outro cenário ou teletransporta o jogador para outro elemento. Pode exigir uma chave (uma variável do cenário) antes.
bhv_note_Door = Requer um elemento físico; torne-o um Sensor para o jogador poder ficar nele.
bhv_p_Door_targets = Alvos
bhv_pd_Door_targets = Elementos que podem usá-la.
bhv_g_Who = Quem
bhv_p_Door_targetPrefix = Prefixo dos alvos
bhv_pd_Door_targetPrefix = Também elementos cujo nome começa com uma destas palavras (separe com vírgulas).
bhv_p_Door_mode = Modo
bhv_pd_Door_mode = OPEN_SCENE abre outro cenário, TELEPORT move o jogador para o elemento de destino.
bhv_g_What_it_does = O que faz
bhv_p_Door_scene = Cenário
bhv_pd_Door_scene = OPEN_SCENE: o cenário a abrir (nome exato).
bhv_p_Door_destination = Destino
bhv_pd_Door_destination = TELEPORT: o jogador aparece no centro deste elemento (outra Door cria um portal de mão dupla).
bhv_p_Door_delay = Atraso
bhv_pd_Door_delay = Espera este tempo depois que a porta abre (tempo para um som ou uma animação).
bhv_p_Door_trigger = Gatilho
bhv_pd_Door_trigger = ON_TOUCH: na hora. WHEN_PRESSED: o jogador também precisa segurar o botão abaixo (ou apertar Cima / W em um teclado).
bhv_g_How_it_opens = Como abre
bhv_p_Door_useButton = Botão de uso
bhv_pd_Door_useButton = O elemento de botão a segurar com WHEN_PRESSED (opcional).
bhv_p_Door_needVariable = Variável necessária
bhv_pd_Door_needVariable = Uma variável do cenário que deve atingir o número abaixo, ex.: keys. Vazio = sempre aberta.
bhv_p_Door_needAtLeast = Precisa de pelo menos
bhv_pd_Door_needAtLeast = A quantidade necessária da variável.
bhv_p_Door_consume = Consumir
bhv_pd_Door_consume = Usar a porta tira essa quantidade da variável (a chave é gasta).
bhv_p_Door_openSound = Som de abertura
bhv_pd_Door_openSound = Tocado quando a porta abre.
bhv_p_Door_lockedSound = Som de trancada
bhv_pd_Door_lockedSound = Tocado quando o jogador toca a porta mas falta a chave.
bhv_n_Goal = Goal
bhv_d_Goal = A linha de chegada / condição de vitória: a fase é vencida quando o jogador a alcança E as condições são cumpridas (todas as moedas de um grupo coletadas, uma pontuação atingida, todos os inimigos eliminados). Mostra um painel de vitória e pode abrir o próximo cenário.
bhv_p_Goal_targets = Alvos
bhv_pd_Goal_targets = Elementos que vencem ao tocá-lo.
bhv_g_Who_wins = Quem vence
bhv_p_Goal_targetPrefix = Prefixo dos alvos
bhv_pd_Goal_targetPrefix = Também elementos cujo nome começa com uma destas palavras (separe com vírgulas).
bhv_p_Goal_needTouch = Exigir toque
bhv_pd_Goal_needTouch = Desativado: não é preciso toque, a fase é vencida assim que as condições abaixo são cumpridas (ex.: coletar todas as estrelas).
bhv_p_Goal_collectGroup = Coletar grupo
bhv_pd_Goal_collectGroup = Nome do grupo de Collectibles que devem ser TODOS coletados. Vazio = sem condição.
bhv_g_Conditions = Condições
bhv_p_Goal_needVariable = Variável necessária
bhv_pd_Goal_needVariable = Uma variável do cenário que deve atingir o número abaixo, ex.: score ou keys. Vazio = sem condição.
bhv_p_Goal_needAtLeast = Precisa de pelo menos
bhv_pd_Goal_needAtLeast = A quantidade necessária da variável.
bhv_p_Goal_mustBeGone = Devem sumir
bhv_pd_Goal_mustBeGone = Elementos que devem ser todos destruídos antes (chefes, inimigos).
bhv_p_Goal_winPanel = Painel de vitória
bhv_pd_Goal_winPanel = Um elemento a mostrar (um painel “Você venceu”). Ele fica oculto quando o jogo começa.
bhv_g_When_won = Ao vencer
bhv_p_Goal_nextScene = Próximo cenário
bhv_pd_Goal_nextScene = Cenário a abrir após o atraso (a próxima fase). Vazio = permanecer.
bhv_p_Goal_delay = Atraso
bhv_pd_Goal_delay = Espera este tempo antes de abrir o cenário.
bhv_p_Goal_clearCheckpoints = Limpar checkpoints
bhv_pd_Goal_clearCheckpoints = Esquece os checkpoints quando a fase é vencida (para a próxima partida começar do início).
bhv_p_Goal_winSound = Som de vitória
bhv_pd_Goal_winSound = Tocado quando a fase é vencida.
bhv_n_PowerUp = Power Up
bhv_d_PowerUp = Um item que muda por um tempo as configurações de um comportamento em quem o pega (mais rápido, pulos mais altos, tiro mais rápido...) e depois as restaura. Também pode curar e tornar invulnerável.
bhv_note_PowerUp = Requer um elemento físico; melhor como Sensor para o jogador passar por ele.
bhv_p_PowerUp_collectors = Coletores
bhv_pd_PowerUp_collectors = Elementos que podem pegá-lo.
bhv_p_PowerUp_collectorPrefix = Prefixo dos coletores
bhv_pd_PowerUp_collectorPrefix = Também elementos cujo nome começa com uma destas palavras (separe com vírgulas). Deixe a lista e este texto vazios para que qualquer elemento com um comportamento Health possa pegá-lo.
bhv_p_PowerUp_behavior1 = Comportamento
bhv_pd_PowerUp_behavior1 = Nome da classe do comportamento no coletor, ex.: PlatformerPlayer, Shooter, TopDownPlayer. Vazio = sem efeito.
bhv_g_Effect_1 = Efeito 1
bhv_p_PowerUp_parameter1 = Configuração
bhv_pd_PowerUp_parameter1 = A configuração (campo público) a mudar, exatamente como escrita no comportamento, ex.: jumpSpeed, speed, fireRate.
bhv_p_PowerUp_mode1 = Como
bhv_pd_PowerUp_mode1 = SET coloca o valor, ADD soma, MULTIPLY multiplica o valor atual.
bhv_p_PowerUp_amount1 = Quantidade
bhv_p_PowerUp_behavior2 = Comportamento
bhv_pd_PowerUp_behavior2 = Uma segunda configuração a mudar ao mesmo tempo (opcional).
bhv_g_Effect_2 = Efeito 2
bhv_p_PowerUp_parameter2 = Configuração
bhv_pd_PowerUp_parameter2 = A segunda configuração a mudar, exatamente como escrita no comportamento.
bhv_p_PowerUp_mode2 = Como
bhv_pd_PowerUp_mode2 = SET coloca o valor, ADD soma, MULTIPLY multiplica o valor atual.
bhv_p_PowerUp_amount2 = Quantidade
bhv_p_PowerUp_duration = Duração
bhv_pd_PowerUp_duration = Quanto tempo os efeitos duram. 0 = para sempre.
bhv_g_Duration_and_extras = Duração e extras
bhv_p_PowerUp_heal = Curar
bhv_pd_PowerUp_heal = Pontos de vida restaurados ao coletor (precisa de Health).
bhv_p_PowerUp_shield = Escudo
bhv_pd_PowerUp_shield = O coletor não pode ser ferido por este tempo (precisa de Health).
bhv_p_PowerUp_collectSound = Som de coleta
bhv_pd_PowerUp_collectSound = Tocado quando é pego.
bhv_p_PowerUp_afterCollect = Após coletar
bhv_pd_PowerUp_afterCollect = DESTROY o remove quando os efeitos terminam, HIDE apenas o oculta.
bhv_p_PowerUp_respawnAfter = Renascer após
bhv_pd_PowerUp_respawnAfter = Volta após este tempo (para o mesmo power-up poder ser pego de novo). 0 = nunca.
bhv_n_Respawn = Respawn
bhv_d_Respawn = Traz o jogador de volta ao último Checkpoint (ou ao ponto onde começou) depois de morrer ou cair para fora do mundo, com uma breve invulnerabilidade, um contador de vidas opcional e cenário de fim de jogo.
bhv_note_Respawn = Requer um elemento físico. Defina a ação ao morrer de Health como RESPAWN para usá-lo na morte.
bhv_p_Respawn_channel = Canal
bhv_pd_Respawn_channel = Deve corresponder ao canal dos Checkpoints que ele deve usar.
bhv_p_Respawn_startAtCheckpoint = Começar no checkpoint
bhv_pd_Respawn_startAtCheckpoint = No início do cenário, vai para o checkpoint salvo, se houver (após um reinício).
bhv_p_Respawn_saveToDisk = Salvar no disco
bhv_pd_Respawn_saveToDisk = Procura também um checkpoint salvo no disco.
bhv_p_Respawn_respawnWhenFalling = Renascer ao cair
bhv_pd_Respawn_respawnWhenFalling = Renasce quando o elemento cai abaixo da linha abaixo (buracos de plataforma).
bhv_p_Respawn_fallBelowY = Cair abaixo de y
bhv_pd_Respawn_fallBelowY = Altura da linha (pixels do editor, y para cima). Abaixo disto o elemento renasce.
bhv_p_Respawn_delay = Atraso
bhv_pd_Respawn_delay = Espera este tempo (invisível) antes de voltar.
bhv_g_How = Como
bhv_p_Respawn_invulnerableTime = Tempo invulnerável
bhv_pd_Respawn_invulnerableTime = Nada pode feri-lo por este tempo depois de voltar (precisa de Health).
bhv_p_Respawn_restoreHealth = Restaurar vida
bhv_pd_Respawn_restoreHealth = Os pontos de vida ficam cheios de novo (precisa de Health).
bhv_p_Respawn_respawnSound = Som de renascimento
bhv_pd_Respawn_respawnSound = Tocado quando ele volta.
bhv_p_Respawn_lives = Vidas
bhv_pd_Respawn_lives = Número de vidas. 0 = ilimitado. Quando a última é perdida, o cenário abaixo abre.
bhv_g_Lives = Vidas
bhv_p_Respawn_livesVariable = Variável de vidas
bhv_pd_Respawn_livesVariable = Variável do cenário (int) que sempre mostra as vidas restantes, ex.: lives. Vazio = nenhuma.
bhv_p_Respawn_gameOverScene = Cenário de fim de jogo
bhv_pd_Respawn_gameOverScene = Cenário a abrir quando não há mais vidas (fim de jogo). Vazio = não faz nada, só o evento dispara.
bhv_n_ButtonSound = Som do botão
bhv_d_ButtonSound = Toca um som quando o elemento é tocado, solto ou clicado. Adicione a todos os botões do seu menu.
bhv_g_Input = Entrada
bhv_p_ButtonSound_sound = Som
bhv_pd_ButtonSound_sound = Som tocado quando o toque começa / o clique acontece (um arquivo dos sons do projeto).
bhv_p_ButtonSound_releaseSound = Som ao soltar
bhv_pd_ButtonSound_releaseSound = Som tocado quando o dedo é levantado (opcional).
bhv_p_ButtonSound_when = Quando
bhv_pd_ButtonSound_when = TOUCH_START = assim que é pressionado, CLICK = só quando é pressionado e solto nele.
bhv_p_ButtonSound_cooldown = Intervalo mínimo
bhv_pd_ButtonSound_cooldown = Ignora toques que vêm antes deste tempo após o último som.
bhv_n_Draggable = Draggable
bhv_d_Draggable = O jogador pode arrastar o elemento com o dedo. Mantenha-o dentro de uma área, ajuste-o a uma grade, mande-o de volta para casa ou solte-o em alvos (quebra-cabeças, inventários, controles deslizantes).
bhv_p_Draggable_lockX = Travar x
bhv_pd_Draggable_lockX = Não mover para os lados.
bhv_p_Draggable_lockY = Travar y
bhv_pd_Draggable_lockY = Não mover para cima e para baixo.
bhv_p_Draggable_area = Área
bhv_pd_Draggable_area = Mantém o elemento dentro da caixa deste outro elemento (opcional).
bhv_p_Draggable_gridSize = Tamanho da grade
bhv_pd_Draggable_gridSize = Ao soltar, ajusta a uma grade deste tamanho (0 = sem grade).
bhv_p_Draggable_snapBack = Voltar ao lugar
bhv_pd_Draggable_snapBack = Volta ao ponto inicial quando solto.
bhv_p_Draggable_snapBackTime = Tempo de volta
bhv_pd_Draggable_snapBackTime = Quanto tempo leva a viagem de volta (0 = de uma vez).
bhv_p_Draggable_dropTargets = Alvos de soltura
bhv_pd_Draggable_dropTargets = Elementos em que ele pode ser solto (opcional). onDropOn roda quando é solto sobre um.
bhv_p_Draggable_snapToTarget = Encaixar no alvo
bhv_pd_Draggable_snapToTarget = Move para o centro do alvo onde foi solto.
bhv_p_Draggable_dragScale = Escala ao arrastar
bhv_pd_Draggable_dragScale = Tamanho durante o arrasto (1 = normal), para parecer levantado.
bhv_p_Draggable_bringToFront = Trazer para frente
bhv_pd_Draggable_bringToFront = Traz o elemento para a frente dos outros durante o arrasto.
bhv_p_Draggable_freezePhysics = Congelar física
bhv_pd_Draggable_freezePhysics = Um elemento físico para de se mover sozinho enquanto é segurado.
bhv_n_LongPress = Toque longo
bhv_d_LongPress = Diferencia um toque rápido de segurar o elemento. Botões de confirmar segurando, menus ocultos, carregamento.
bhv_p_LongPress_holdTime = Tempo de segurar
bhv_pd_LongPress_holdTime = Quanto tempo o dedo deve ficar pressionado.
bhv_p_LongPress_moveTolerance = Tolerância de movimento
bhv_pd_LongPress_moveTolerance = Se o dedo se mover mais que isto (pixels da tela), deixa de ser um toque longo.
bhv_p_LongPress_repeat = Repetir
bhv_pd_LongPress_repeat = Continua disparando onLongPress a cada tempo de segurar enquanto o dedo permanece pressionado.
bhv_p_LongPress_holdBar = Barra de segurar
bhv_pd_LongPress_holdBar = Um elemento Progress que enche enquanto segura (opcional): segure para confirmar.
bhv_n_OpenSceneOnClick = Abrir cenário ao clicar
bhv_d_OpenSceneOnClick = Tocar no elemento abre outro cenário, após uma espera e um fade opcionais. Para botões Jogar e menus.
bhv_p_OpenSceneOnClick_scene = Cenário
bhv_pd_OpenSceneOnClick_scene = Nome do cenário a abrir (como escrito na lista de cenários).
bhv_p_OpenSceneOnClick_trigger = Gatilho
bhv_pd_OpenSceneOnClick_trigger = CLICK = quando é pressionado e solto no elemento, TOUCH_START = assim que é pressionado.
bhv_p_OpenSceneOnClick_delay = Atraso
bhv_pd_OpenSceneOnClick_delay = Espera este tempo antes de o cenário mudar (tempo para um som ou um efeito).
bhv_p_OpenSceneOnClick_fadeOverlay = Sobreposição de fade
bhv_pd_OpenSceneOnClick_fadeOverlay = Uma caixa preta grande sobre a tela inteira (opcional): ela aparece gradualmente antes de o cenário mudar. Deixe-a invisível ou com 0% de opacidade no editor.
bhv_p_OpenSceneOnClick_fadeTime = Tempo do fade
bhv_pd_OpenSceneOnClick_fadeTime = Quanto tempo a sobreposição leva para aparecer.
bhv_p_OpenSceneOnClick_clickSound = Som de clique
bhv_pd_OpenSceneOnClick_clickSound = Som tocado quando o toque é aceito (opcional).
bhv_n_SwipeDetector = Detector de deslize
bhv_d_SwipeDetector = Detecta um deslize do dedo para esquerda, direita, cima ou baixo, no elemento ou em qualquer lugar da tela. Para virar páginas, menus e jogos controlados por deslize.
bhv_p_SwipeDetector_onlyOnElement = Somente no elemento
bhv_pd_SwipeDetector_onlyOnElement = Só contam deslizes que começam neste elemento. Desativado = um deslize em qualquer lugar da tela.
bhv_p_SwipeDetector_minDistance = Distância mín.
bhv_pd_SwipeDetector_minDistance = Quanto o dedo deve percorrer (pixels da tela).
bhv_p_SwipeDetector_maxTime = Tempo máx.
bhv_pd_SwipeDetector_maxTime = Um deslize deve ser feito dentro deste tempo; arrastos mais lentos são ignorados (0 = sem limite).
bhv_p_SwipeDetector_fireWhileMoving = Disparar durante o movimento
bhv_pd_SwipeDetector_fireWhileMoving = Reage assim que a distância é atingida, sem esperar o dedo levantar.
bhv_n_ToggleOnClick = Alternar ao clicar
bhv_d_ToggleOnClick = Tocar no elemento mostra ou oculta outros elementos: um painel de configurações, um menu, uma dica.
bhv_p_ToggleOnClick_targets = Alvos
bhv_pd_ToggleOnClick_targets = Os elementos que são mostrados / ocultados.
bhv_p_ToggleOnClick_action = Ação
bhv_pd_ToggleOnClick_action = TOGGLE = alterna a cada vez, SHOW = sempre mostra, HIDE = sempre oculta.
bhv_p_ToggleOnClick_trigger = Gatilho
bhv_pd_ToggleOnClick_trigger = CLICK = quando é pressionado e solto no elemento, TOUCH_START = assim que é pressionado.
bhv_p_ToggleOnClick_startHidden = Começar oculto
bhv_pd_ToggleOnClick_startHidden = Oculta os alvos quando o cenário começa.
bhv_p_ToggleOnClick_affectPhysics = Afetar a física
bhv_pd_ToggleOnClick_affectPhysics = Elementos físicos ocultos também param de colidir e de se mover.
bhv_n_Lifetime = Tempo de vida
bhv_d_Lifetime = O elemento se remove após um tempo, esmaecendo (e opcionalmente encolhendo) antes. Balas, partículas, plataformas temporárias, dicas.
bhv_g_Logic = Lógica
bhv_p_Lifetime_seconds = Segundos
bhv_pd_Lifetime_seconds = Quanto tempo ele vive, contado a partir do início do cenário (ou do reset).
bhv_p_Lifetime_randomExtra = Extra aleatório
bhv_pd_Lifetime_randomExtra = Vida extra aleatória entre -x e +x segundos, para uma multidão não sumir toda de uma vez.
bhv_p_Lifetime_fadeTime = Tempo do fade
bhv_pd_Lifetime_fadeTime = Esmaece durante os últimos segundos.
bhv_p_Lifetime_shrink = Encolher
bhv_pd_Lifetime_shrink = Também encolhe até sumir enquanto esmaece.
bhv_p_Lifetime_endAction = Ação final
bhv_pd_Lifetime_endAction = DESTROY remove o elemento, HIDE o mantém invisível e inativo.
bhv_n_ProgressBind = Vínculo de progresso
bhv_d_ProgressBind = Mantém uma barra Progress em sincronia com um número: um valor salvo com setValue, outra barra ou o número escrito em um Text. Vida, carregamento, XP, temporizadores.
bhv_p_ProgressBind_source = Origem
bhv_pd_ProgressBind_source = De onde vem o número. SAVED_VALUE = um valor salvo por nome (setValue / getValue), OTHER_PROGRESS = o valor de outro elemento Progress, OTHER_TEXT = o primeiro número escrito em um elemento Text, MANUAL = apenas o bloco de definir valor.
bhv_p_ProgressBind_valueName = Nome do valor
bhv_pd_ProgressBind_valueName = Nome do valor salvo (SAVED_VALUE).
bhv_p_ProgressBind_other = Outro
bhv_pd_ProgressBind_other = O outro elemento (OTHER_PROGRESS / OTHER_TEXT).
bhv_p_ProgressBind_minValue = Valor mín.
bhv_pd_ProgressBind_minValue = Número que mostra uma barra vazia.
bhv_p_ProgressBind_maxValue = Valor máx.
bhv_pd_ProgressBind_maxValue = Número que mostra uma barra cheia.
bhv_p_ProgressBind_smoothing = Suavização
bhv_pd_ProgressBind_smoothing = Quão rápido a barra acompanha (0 = instantaneamente).
bhv_p_ProgressBind_pollInterval = Intervalo de leitura
bhv_pd_ProgressBind_pollInterval = Com que frequência a origem é lida; um valor salvo por nome é lido do armazenamento.
bhv_n_ScoreCounter = Score Counter
bhv_d_ScoreCounter = Mostra uma variável do cenário (pontuação, moedas, vidas...) em um elemento Text com prefixo, preenchimento e uma animação de contagem, e guarda a pontuação máxima no dispositivo.
bhv_p_ScoreCounter_variable = Variável
bhv_pd_ScoreCounter_variable = Variável do cenário a mostrar (um int ou float criado em Variáveis). Collectible e Timer escrevem em variáveis pelo nome. Vazio = o contador mantém seu próprio número.
bhv_g_Value = Valor
bhv_p_ScoreCounter_display = Exibição
bhv_pd_ScoreCounter_display = O elemento Text que a mostra. Vazio = este elemento (quando é um Text).
bhv_p_ScoreCounter_prefix = Prefixo
bhv_pd_ScoreCounter_prefix = Escrito antes do número, ex.: SCORE
bhv_p_ScoreCounter_suffix = Sufixo
bhv_pd_ScoreCounter_suffix = Escrito depois do número, ex.:  pts
bhv_p_ScoreCounter_decimals = Decimais
bhv_pd_ScoreCounter_decimals = Dígitos depois da vírgula decimal.
bhv_p_ScoreCounter_padDigits = Completar dígitos
bhv_pd_ScoreCounter_padDigits = Preenche com zeros até esta quantidade de dígitos (0005). 0 = desativado.
bhv_p_ScoreCounter_thousandsSeparator = Separador de milhares
bhv_pd_ScoreCounter_thousandsSeparator = Agrupa os dígitos: 12,345.
bhv_p_ScoreCounter_animate = Animar
bhv_pd_ScoreCounter_animate = O número sobe/desce até o novo valor em vez de saltar.
bhv_p_ScoreCounter_animateTime = Tempo da animação
bhv_pd_ScoreCounter_animateTime = Quanto tempo a contagem leva, no máximo.
bhv_p_ScoreCounter_highScoreKey = Chave da pontuação máxima
bhv_pd_ScoreCounter_highScoreKey = Nome sob o qual o melhor valor é guardado no dispositivo (ex.: highscore_level1). Vazio = sem pontuação máxima.
bhv_g_High_score = Pontuação máxima
bhv_p_ScoreCounter_highScoreDisplay = Exibição da pontuação máxima
bhv_pd_ScoreCounter_highScoreDisplay = Elemento Text que mostra a pontuação máxima (opcional).
bhv_p_ScoreCounter_highScorePrefix = Prefixo da pontuação máxima
bhv_pd_ScoreCounter_highScorePrefix = Escrito antes da pontuação máxima.
bhv_n_Timer = Timer
bhv_d_Timer = Uma contagem regressiva ou um cronômetro mostrado em um elemento Text: limites de tempo de fase, tempos de corrida, exibição de recarga. Inicie, pause e reinicie com blocos; ele também pode escrever os segundos em uma variável do cenário.
bhv_p_Timer_mode = Modo
bhv_pd_Timer_mode = COUNTDOWN conta regressivamente dos segundos abaixo até 0, STOPWATCH conta progressivamente.
bhv_g_Timer = Timer
bhv_p_Timer_seconds = Segundos
bhv_pd_Timer_seconds = Contagem regressiva: onde começa. Cronômetro: para (onTimeout) neste tempo, 0 = nunca.
bhv_p_Timer_autoStart = Início automático
bhv_pd_Timer_autoStart = Começa quando o cenário começa. Desativado: chame start timer.
bhv_p_Timer_loop = Repetir
bhv_pd_Timer_loop = Recomeça sozinho depois de onTimeout.
bhv_p_Timer_display = Exibição
bhv_pd_Timer_display = O elemento Text que mostra o tempo. Vazio = este elemento (quando é um Text).
bhv_p_Timer_format = Formato
bhv_pd_Timer_format = M_SS = 1:05, SECONDS = 65, TENTHS = 65.3, M_SS_CC = 01:05.30.
bhv_p_Timer_prefix = Prefixo
bhv_pd_Timer_prefix = Escrito antes do tempo, ex.: TIME
bhv_p_Timer_suffix = Sufixo
bhv_pd_Timer_suffix = Escrito depois do tempo, ex.: s
bhv_p_Timer_warnAt = Avisar em
bhv_pd_Timer_warnAt = Contagem regressiva: o texto fica com a cor de aviso e onWarning dispara quando faltam tantos segundos. 0 = desativado.
bhv_p_Timer_warnColor = Cor do aviso
bhv_pd_Timer_warnColor = Cor do texto durante o aviso.
bhv_p_Timer_variable = Variável
bhv_pd_Timer_variable = Variável do cenário (int ou float) que recebe o tempo em segundos. Vazio = nenhuma.
bhv_g_Variable = Variável
bhv_n_Floating = Floating
bhv_d_Floating = O elemento balança para cima e para baixo (e/ou para os lados) para sempre. Elementos físicos ficam kinematic enquanto ele roda.
bhv_g_Motion = Movimento
bhv_p_Floating_amplitudeY = Amplitude y
bhv_pd_Floating_amplitudeY = Distância vertical para cada lado.
bhv_p_Floating_amplitudeX = Amplitude x
bhv_pd_Floating_amplitudeX = Distância horizontal para cada lado.
bhv_p_Floating_frequency = Frequência
bhv_pd_Floating_frequency = Ciclos completos por segundo.
bhv_p_Floating_phase = Fase
bhv_pd_Floating_phase = Deslocamento inicial no ciclo (0..1) para vários elementos não se moverem juntos.
bhv_set_type = Tipo
bhv_n_Spin = Spin
bhv_d_Spin = Gira o elemento continuamente (moedas, serras, ícones de carregamento). Elementos físicos ficam kinematic enquanto ele roda.
bhv_p_Spin_speed = Velocidade
bhv_pd_Spin_speed = Graus por segundo.
bhv_p_Spin_clockwise = Sentido horário
bhv_n_Bounce = Efeito elástico
bhv_d_Bounce = Uma bola que nunca para: mantém velocidade constante e quica em tudo (Pong, Breakout, protetores de tela). Elementos físicos quicam em paredes e outros corpos; elementos de UI quicam nas bordas da tela.
bhv_g_Movement = Movimento
bhv_p_Bounce_speed = Velocidade
bhv_pd_Bounce_speed = Velocidade da bola.
bhv_g_Ball = Bola
bhv_p_Bounce_keepSpeed = Manter velocidade
bhv_pd_Bounce_keepSpeed = Mantém a velocidade constante após cada quique. Desativado: elasticidade normal da física.
bhv_p_Bounce_speedGain = Ganho de velocidade
bhv_pd_Bounce_speedGain = A bola acelera tanto a cada quique (até a velocidade máxima).
bhv_p_Bounce_maxSpeed = Velocidade máxima
bhv_pd_Bounce_maxSpeed = Limite de velocidade quando a bola acelera.
bhv_p_Bounce_bounciness = Elasticidade
bhv_pd_Bounce_bounciness = Físico: quanta energia um quique mantém (1 = toda).
bhv_p_Bounce_minAngle = Ângulo mín.
bhv_pd_Bounce_minAngle = Nunca se mover quase em linha reta em um eixo: o trajeto é mantido pelo menos tão longe da horizontal/vertical (impede ping-pong infinito em Pong/Breakout).
bhv_p_Bounce_startAngle = Ângulo inicial
bhv_pd_Bounce_startAngle = Direção no início: 0 = direita, 90 = cima, 45 = cima-direita.
bhv_g_Launch = Lançamento
bhv_p_Bounce_randomStart = Início aleatório
bhv_pd_Bounce_randomStart = Escolhe uma direção diagonal aleatória no início.
bhv_p_Bounce_launchOnStart = Lançar ao iniciar
bhv_pd_Bounce_launchOnStart = Lança quando o jogo começa. Desativado: chame launch pelos seus blocos.
bhv_p_Bounce_bounceOffView = Quicar na visão
bhv_pd_Bounce_bounceOffView = Físico: também quica nas bordas da visão da câmera (elementos de UI sempre quicam na tela).
bhv_g_Screen_edges = Bordas da tela
bhv_set_gravityScale = Escala de gravidade
bhv_set_linearDamping = Amortecimento linear
bhv_n_Follow = Seguir
bhv_d_Follow = Mantém o elemento perto de outro, com um deslocamento e alcance suave: bichinhos, barras de vida sobre um personagem, um perseguidor tipo câmera, uma sombra. Funciona para elementos de UI e físicos.
bhv_p_Follow_target = Alvo
bhv_pd_Follow_target = O elemento a seguir.
bhv_p_Follow_offsetX = Deslocamento x
bhv_pd_Follow_offsetX = Onde ficar, em relação ao centro do alvo (x, direita é positivo).
bhv_p_Follow_offsetY = Deslocamento y
bhv_pd_Follow_offsetY = Onde ficar, em relação ao centro do alvo (y, cima é positivo).
bhv_p_Follow_followX = Seguir x
bhv_pd_Follow_followX = Seguir no eixo esquerda/direita.
bhv_p_Follow_followY = Seguir y
bhv_pd_Follow_followY = Seguir no eixo cima/baixo (um elemento físico então ignora a gravidade).
bhv_p_Follow_mirrorOffset = Espelhar deslocamento
bhv_pd_Follow_mirrorOffset = Espelha o deslocamento x quando o alvo olha para a esquerda (a imagem dele está invertida).
bhv_p_Follow_stiffness = Rigidez
bhv_pd_Follow_stiffness = Quão firme ele segue: maior = alcança mais rápido. 0 = colado ao alvo (salta para lá).
bhv_p_Follow_maxSpeed = Velocidade máxima
bhv_pd_Follow_maxSpeed = Limite de velocidade. 0 = sem limite (elementos físicos são limitados a 450 px/s).
bhv_p_Follow_stopDistance = Distância de parada
bhv_pd_Follow_stopDistance = Para de se mover quando está mais perto que isto do ponto desejado.
bhv_p_Follow_matchRotation = Copiar rotação
bhv_pd_Follow_matchRotation = Copia também a rotação do alvo.
bhv_n_JoystickMovement = Movimento por joystick
bhv_d_JoystickMovement = Move o elemento com um joystick: visto de cima (todas as direções) ou plataforma lateral (só esquerda/direita).
bhv_p_JoystickMovement_joystick = Joystick
bhv_pd_JoystickMovement_joystick = O elemento joystick que controla este.
bhv_p_JoystickMovement_mode = Modo
bhv_p_JoystickMovement_speed = Velocidade
bhv_p_JoystickMovement_deadZone = Zona morta
bhv_pd_JoystickMovement_deadZone = Ignora movimentos minúsculos do joystick.
bhv_p_JoystickMovement_rotateToDirection = Girar para a direção
bhv_pd_JoystickMovement_rotateToDirection = Vira o elemento para onde ele se move.
bhv_p_JoystickMovement_faceOffset = Deslocamento de orientação
bhv_pd_JoystickMovement_faceOffset = Ângulo da imagem quando ela olha para a direita (0 = direita, 90 = cima...).
bhv_n_JumpPad = Jump pad
bhv_d_JumpPad = Lança tudo o que o toca (trampolins, molas, canhões, plataformas de impulso) em uma direção escolhida. Escolha quem é afetado com uma lista ou um filtro de nome; pode funcionar como um sensor pelo qual se passa.
bhv_note_JumpPad = Requer um elemento físico (geralmente STATIC).
bhv_p_JumpPad_angle = Ângulo
bhv_pd_JumpPad_angle = Direção do lançamento: 90 = cima, 0 = direita, 180 = esquerda, 270 = baixo.
bhv_p_JumpPad_power = Potência
bhv_pd_JumpPad_power = Velocidade do lançamento.
bhv_p_JumpPad_additive = Aditivo
bhv_pd_JumpPad_additive = Ligado: soma à velocidade atual. Desligado: a substitui (o mesmo pulo sempre).
bhv_p_JumpPad_onlyFromFront = Só pela frente
bhv_pd_JumpPad_onlyFromFront = Só lança o que vem da frente (o lado para onde a seta aponta), não por trás.
bhv_p_JumpPad_cooldown = Intervalo mínimo
bhv_pd_JumpPad_cooldown = Tempo antes de a plataforma poder lançar de novo.
bhv_p_JumpPad_targets = Alvos
bhv_pd_JumpPad_targets = Só estes elementos são lançados. Vazio = todo corpo em movimento.
bhv_p_JumpPad_nameFilter = Filtro de nome
bhv_pd_JumpPad_nameFilter = Só elementos cujo nome contém este texto são lançados (uma tag improvisada, ex.: "Player"). Vazio = qualquer.
bhv_p_JumpPad_sensor = Sensor
bhv_pd_JumpPad_sensor = As coisas atravessam a plataforma e são lançadas enquanto se sobrepõem a ela (sem superfície sólida).
bhv_n_LimitToScreen = Limitar à tela
bhv_d_LimitToScreen = Mantém o elemento dentro da tela (ou da visão da câmera, do cenário ou de um retângulo) com uma margem opcional, para o jogador ou uma raquete nunca saírem. Um elemento físico perde (ou rebate) a velocidade que o empurra para fora.
bhv_p_LimitToScreen_area = Área
bhv_pd_LimitToScreen_area = VIEW: o que a câmera mostra agora (ou a tela para UI). SCENE: a primeira tela (0,0 até o tamanho do cenário). CUSTOM: o retângulo abaixo.
bhv_p_LimitToScreen_limitX = Limitar x
bhv_pd_LimitToScreen_limitX = Limitar esquerda/direita.
bhv_p_LimitToScreen_limitY = Limitar y
bhv_pd_LimitToScreen_limitY = Limitar cima/baixo.
bhv_p_LimitToScreen_margin = Margem
bhv_pd_LimitToScreen_margin = Espaço mantido livre nas bordas.
bhv_p_LimitToScreen_keepFullyInside = Manter totalmente dentro
bhv_pd_LimitToScreen_keepFullyInside = O elemento inteiro deve ficar dentro (desligado: só o centro dele).
bhv_p_LimitToScreen_bounciness = Elasticidade
bhv_pd_LimitToScreen_bounciness = Físico: 0 = para na borda, 1 = rebate com a mesma velocidade.
bhv_p_LimitToScreen_customLeft = Esquerda personalizada
bhv_pd_LimitToScreen_customLeft = Área CUSTOM: borda esquerda.
bhv_p_LimitToScreen_customBottom = Base personalizada
bhv_pd_LimitToScreen_customBottom = Área CUSTOM: borda inferior.
bhv_p_LimitToScreen_customRight = Direita personalizada
bhv_pd_LimitToScreen_customRight = Área CUSTOM: borda direita.
bhv_p_LimitToScreen_customTop = Topo personalizado
bhv_pd_LimitToScreen_customTop = Área CUSTOM: borda superior.
bhv_n_LookAtTarget = Olhar para o alvo
bhv_d_LookAtTarget = Vira o elemento para outro elemento ou para o dedo, com uma velocidade de giro: torres, olhos, setas, armas de mira.
bhv_p_LookAtTarget_source = Origem
bhv_pd_LookAtTarget_source = TARGET: olha para o elemento abaixo. FINGER: olha para o ponto que você toca.
bhv_p_LookAtTarget_target = Alvo
bhv_pd_LookAtTarget_target = O elemento a encarar (TARGET).
bhv_p_LookAtTarget_faceOffset = Deslocamento de orientação
bhv_pd_LookAtTarget_faceOffset = Ângulo da imagem quando ela olha para a direita (0 = direita, 90 = cima...).
bhv_p_LookAtTarget_turnSpeed = Velocidade de giro
bhv_pd_LookAtTarget_turnSpeed = Quão rápido ele gira. 0 = instantaneamente.
bhv_p_LookAtTarget_keepLastTouch = Manter último toque
bhv_pd_LookAtTarget_keepLastTouch = Somente FINGER: continua olhando para o último toque depois que o dedo é levantado.
bhv_p_LookAtTarget_tolerance = Tolerância
bhv_pd_LookAtTarget_tolerance = Conta como alinhado quando a diferença de ângulo é menor que isto (onAligned).
bhv_set_fixedRotation = Rotação fixa
bhv_n_MovingPlatform = Plataforma móvel
bhv_d_MovingPlatform = Uma plataforma que desliza entre dois pontos (elevadores, pontes móveis, portas deslizantes) e carrega o que está sobre ela. Fica kinematic enquanto roda.
bhv_note_MovingPlatform = Requer um elemento físico (ele fica kinematic enquanto o jogo roda).
bhv_p_MovingPlatform_axis = Eixo
bhv_pd_MovingPlatform_axis = Modo de alcance: move para esquerda/direita ou cima/baixo a partir do início.
bhv_g_Route = Rota
bhv_p_MovingPlatform_distance = Distância
bhv_pd_MovingPlatform_distance = Modo de alcance: quanto ela se move do início até a outra ponta (negativo = esquerda / baixo).
bhv_p_MovingPlatform_pointB = Ponto b
bhv_pd_MovingPlatform_pointB = Modo de pontos: um elemento marcando a outra ponta. Quando definido, substitui o alcance.
bhv_p_MovingPlatform_pointA = Ponto a
bhv_pd_MovingPlatform_pointA = Modo de pontos: um elemento marcando a primeira ponta. Vazio = a posição inicial desta plataforma.
bhv_p_MovingPlatform_speed = Velocidade
bhv_pd_MovingPlatform_speed = Velocidade ao longo da rota.
bhv_p_MovingPlatform_pause = Pausa
bhv_pd_MovingPlatform_pause = Quanto tempo espera em cada ponta.
bhv_p_MovingPlatform_smooth = Suave
bhv_pd_MovingPlatform_smooth = Desacelera suavemente perto das pontas.
bhv_p_MovingPlatform_carryRiders = Carregar passageiros
bhv_pd_MovingPlatform_carryRiders = Move para os lados o que está sobre ela (necessário para um jogador que define a própria velocidade).
bhv_n_Orbit = Órbita
bhv_d_Orbit = Gira em torno de outro elemento (planetas, escudos, satélites, serras giratórias) ou de um ponto, com formato oval e espiral para dentro/fora opcionais. Elementos físicos continuam físicos (empurram coisas) e ignoram a gravidade.
bhv_p_Orbit_center = Centro
bhv_pd_Orbit_center = O elemento em torno do qual girar. Vazio = um ponto escolhido para que o elemento comece no próprio círculo.
bhv_p_Orbit_radius = Raio
bhv_pd_Orbit_radius = Distância do centro. 0 = a distância atual até o elemento central (100 quando não há elemento central).
bhv_p_Orbit_speed = Velocidade
bhv_pd_Orbit_speed = Graus por segundo.
bhv_p_Orbit_clockwise = Sentido horário
bhv_pd_Orbit_clockwise = Girar no sentido horário (desligado: anti-horário).
bhv_p_Orbit_ovalRatio = Proporção oval
bhv_pd_Orbit_ovalRatio = Altura do oval em relação à largura (1 = círculo).
bhv_p_Orbit_spiral = Espiral
bhv_pd_Orbit_spiral = O raio cresce (positivo) ou diminui (negativo) tanto a cada segundo: espirais.
bhv_p_Orbit_minRadius = Raio mín.
bhv_pd_Orbit_minRadius = Menor raio ao espiralar para dentro.
bhv_p_Orbit_faceMovement = Acompanhar movimento
bhv_pd_Orbit_faceMovement = Vira o elemento ao longo do trajeto (flechas, aviões).
bhv_p_Orbit_faceOffset = Deslocamento de orientação
bhv_pd_Orbit_faceOffset = Ângulo da imagem quando ela olha para a direita (0 = direita, 90 = cima...).
bhv_n_PlatformerPlayer = Jogador de plataforma
bhv_d_PlatformerPlayer = Corra e pule com botões na tela ou o teclado: pulo duplo, coyote time e buffer de pulo. Precisa de gravidade no cenário.
bhv_note_PlatformerPlayer = Requer um elemento físico DYNAMIC e gravidade no cenário.
bhv_p_PlatformerPlayer_leftButton = Botão esquerdo
bhv_pd_PlatformerPlayer_leftButton = Botão (qualquer elemento) que move para a esquerda enquanto pressionado.
bhv_p_PlatformerPlayer_rightButton = Botão direito
bhv_p_PlatformerPlayer_jumpButton = Botão de pulo
bhv_p_PlatformerPlayer_useKeyboard = Usar teclado
bhv_pd_PlatformerPlayer_useKeyboard = Setas / A D W / espaço também funcionam (desktop, testes).
bhv_p_PlatformerPlayer_speed = Velocidade
bhv_p_PlatformerPlayer_acceleration = Aceleração
bhv_pd_PlatformerPlayer_acceleration = 0 = instantâneo; senão, quão rápido atinge a velocidade.
bhv_p_PlatformerPlayer_flipToDirection = Inverter conforme a direção
bhv_pd_PlatformerPlayer_flipToDirection = Espelha a imagem ao andar para a esquerda.
bhv_p_PlatformerPlayer_jumpSpeed = Velocidade do pulo
bhv_g_Jump = Pulo
bhv_p_PlatformerPlayer_maxJumps = Máx. de pulos
bhv_pd_PlatformerPlayer_maxJumps = 2 = pulo duplo, 1 = pulo simples.
bhv_p_PlatformerPlayer_coyoteTime = Coyote time
bhv_pd_PlatformerPlayer_coyoteTime = Tempo após sair de uma plataforma em que o pulo ainda funciona.
bhv_p_PlatformerPlayer_jumpBuffer = Buffer de pulo
bhv_pd_PlatformerPlayer_jumpBuffer = Um pulo pressionado um pouco antes de pousar é lembrado por este tempo.
bhv_n_TapToMove = Tocar para mover
bhv_d_TapToMove = Move para onde você toca: TAP anda até o ponto tocado (estratégia, point-and-click), HOLD segue o dedo enquanto ele está pressionado, DRAG_ITEM permite pegar o próprio elemento e arrastá-lo (peças de quebra-cabeça, cartas). Toques nos botões/joystick da lista de ignorados não são usados.
bhv_p_TapToMove_mode = Modo
bhv_pd_TapToMove_mode = TAP: vai até o ponto tocado. HOLD: segue o dedo enquanto ele está pressionado. DRAG_ITEM: toque no elemento e arraste-o.
bhv_g_Touch = Toque
bhv_p_TapToMove_ignoreTouchesOn = Ignorar toques em
bhv_pd_TapToMove_ignoreTouchesOn = Toques que começam nestes elementos (botões, joystick, painéis) são ignorados.
bhv_p_TapToMove_marker = Marcador
bhv_pd_TapToMove_marker = Elemento opcional mostrado no ponto tocado (modo TAP); ele some quando o elemento chega.
bhv_p_TapToMove_speed = Velocidade
bhv_pd_TapToMove_speed = Velocidade de caminhada.
bhv_p_TapToMove_stopDistance = Distância de parada
bhv_pd_TapToMove_stopDistance = Conta como chegou quando está tão perto.
bhv_p_TapToMove_horizontalOnly = Somente horizontal
bhv_pd_TapToMove_horizontalOnly = Só esquerda/direita (personagens de plataforma mantêm a gravidade). Desligado: move em todas as direções e ignora a gravidade.
bhv_p_TapToMove_dragStiffness = Rigidez do arrasto
bhv_pd_TapToMove_dragStiffness = DRAG_ITEM: quão firme o elemento segue o dedo (elementos físicos; maior = mais justo).
bhv_p_TapToMove_rotateToDirection = Girar para a direção
bhv_pd_TapToMove_rotateToDirection = Vira o elemento para onde ele vai.
bhv_p_TapToMove_flipToDirection = Inverter conforme a direção
bhv_pd_TapToMove_flipToDirection = Espelha a imagem ao ir para a esquerda.
bhv_p_TapToMove_faceOffset = Deslocamento de orientação
bhv_pd_TapToMove_faceOffset = Ângulo da imagem quando ela olha para a direita (0 = direita, 90 = cima...).
bhv_n_TiltMove = Mover por inclinação
bhv_d_TiltMove = Move o elemento inclinando o celular (acelerômetro): uma bola que rola, um labirinto de bolinha, um pegador de objetos que caem. As setas simulam a inclinação no computador.
bhv_p_TiltMove_mode = Modo
bhv_pd_TiltMove_mode = VELOCITY: a inclinação define a velocidade. ROLL: a inclinação empurra como a gravidade em uma bola (ela continua rolando).
bhv_g_Tilt = Inclinação
bhv_p_TiltMove_fullTilt = Inclinação total
bhv_pd_TiltMove_fullTilt = Inclinação que dá a velocidade máxima. 9.8 = celular na vertical, cerca de 4 = uma inclinação confortável.
bhv_p_TiltMove_deadZone = Zona morta
bhv_pd_TiltMove_deadZone = Inclinações menores que isto são ignoradas.
bhv_p_TiltMove_smoothing = Suavização
bhv_pd_TiltMove_smoothing = Suaviza o sensor tremido. Maior = mais suave, porém mais lento para reagir.
bhv_p_TiltMove_orientation = Orientação
bhv_pd_TiltMove_orientation = AUTO segue a rotação da tela. Defina manualmente se as direções estiverem erradas no seu celular.
bhv_p_TiltMove_useKeyboard = Usar teclado
bhv_pd_TiltMove_useKeyboard = Setas / WASD simulam a inclinação (desktop, testes).
bhv_p_TiltMove_horizontal = Horizontal
bhv_pd_TiltMove_horizontal = Mover para esquerda/direita.
bhv_p_TiltMove_vertical = Vertical
bhv_pd_TiltMove_vertical = Mover para cima/baixo (desliga a gravidade deste elemento enquanto roda).
bhv_p_TiltMove_invertX = Inverter x
bhv_pd_TiltMove_invertX = Troca esquerda e direita.
bhv_p_TiltMove_invertY = Inverter y
bhv_pd_TiltMove_invertY = Troca cima e baixo.
bhv_p_TiltMove_speed = Velocidade
bhv_pd_TiltMove_speed = Velocidade máxima.
bhv_p_TiltMove_acceleration = Aceleração
bhv_pd_TiltMove_acceleration = Somente ROLL: aceleração com inclinação total.
bhv_p_TiltMove_damping = Amortecimento
bhv_pd_TiltMove_damping = Somente ROLL: desacelera a bola (0 = nunca).
bhv_n_TopDownPlayer = Jogador visto de cima
bhv_d_TopDownPlayer = Move o elemento em todas as direções (RPG, tiro, labirinto): joystick, 4 botões ou o teclado, com aceleração, atrito, ajuste a 4/8 direções e giro opcional em direção ao movimento. Use gravidade 0 no cenário.
bhv_p_TopDownPlayer_joystick = Joystick
bhv_pd_TopDownPlayer_joystick = Elemento joystick que controla este (opcional).
bhv_p_TopDownPlayer_upButton = Botão para cima
bhv_pd_TopDownPlayer_upButton = Botão (qualquer elemento) que move para cima enquanto pressionado.
bhv_p_TopDownPlayer_downButton = Botão para baixo
bhv_pd_TopDownPlayer_downButton = Botão (qualquer elemento) que move para baixo enquanto pressionado.
bhv_p_TopDownPlayer_leftButton = Botão esquerdo
bhv_pd_TopDownPlayer_leftButton = Botão (qualquer elemento) que move para a esquerda enquanto pressionado.
bhv_p_TopDownPlayer_rightButton = Botão direito
bhv_pd_TopDownPlayer_rightButton = Botão (qualquer elemento) que move para a direita enquanto pressionado.
bhv_p_TopDownPlayer_useKeyboard = Usar teclado
bhv_pd_TopDownPlayer_useKeyboard = Setas / WASD também movem o elemento (desktop, testes).
bhv_p_TopDownPlayer_deadZone = Zona morta
bhv_pd_TopDownPlayer_deadZone = Empurrões do joystick menores que isto são ignorados.
bhv_p_TopDownPlayer_directions = Direções
bhv_pd_TopDownPlayer_directions = ANY = direções suaves do joystick, EIGHT = ajusta a 8 direções, FOUR = só cima/baixo/esquerda/direita.
bhv_p_TopDownPlayer_speed = Velocidade
bhv_pd_TopDownPlayer_speed = Velocidade máxima.
bhv_p_TopDownPlayer_acceleration = Aceleração
bhv_pd_TopDownPlayer_acceleration = Quão rápido atinge a velocidade máxima. 0 = instantaneamente.
bhv_p_TopDownPlayer_friction = Atrito
bhv_pd_TopDownPlayer_friction = Quão rápido para quando nada está pressionado. 0 = instantaneamente.
bhv_p_TopDownPlayer_rotateToDirection = Girar para a direção
bhv_pd_TopDownPlayer_rotateToDirection = Vira o elemento para onde ele se move.
bhv_g_Facing = Orientação
bhv_p_TopDownPlayer_faceOffset = Deslocamento de orientação
bhv_pd_TopDownPlayer_faceOffset = Ângulo da imagem quando ela olha para a direita (0 = direita, 90 = cima...).
bhv_p_TopDownPlayer_turnSpeed = Velocidade de giro
bhv_pd_TopDownPlayer_turnSpeed = Quão rápido ele gira. 0 = instantaneamente.
bhv_p_TopDownPlayer_flipToDirection = Inverter conforme a direção
bhv_pd_TopDownPlayer_flipToDirection = Espelha a imagem ao mover para a esquerda (para vistas laterais).
bhv_n_WrapScreen = Dar a volta na tela
bhv_d_WrapScreen = Quando o elemento sai por um lado da tela, ele volta pelo lado oposto (Asteroids, túneis do Pac-Man, corredores infinitos). A velocidade é mantida.
bhv_p_WrapScreen_area = Área
bhv_pd_WrapScreen_area = VIEW: o que a câmera mostra agora (ou a tela para UI). SCENE: a primeira tela (0,0 até o tamanho do cenário). CUSTOM: o retângulo abaixo.
bhv_p_WrapScreen_wrapX = Volta em x
bhv_pd_WrapScreen_wrapX = Dá a volta nas bordas esquerda/direita.
bhv_p_WrapScreen_wrapY = Volta em y
bhv_pd_WrapScreen_wrapY = Dá a volta nas bordas superior/inferior.
bhv_p_WrapScreen_margin = Margem
bhv_pd_WrapScreen_margin = Espaço extra fora da área antes de dar a volta.
bhv_p_WrapScreen_customLeft = Esquerda personalizada
bhv_pd_WrapScreen_customLeft = Área CUSTOM: borda esquerda.
bhv_p_WrapScreen_customBottom = Base personalizada
bhv_pd_WrapScreen_customBottom = Área CUSTOM: borda inferior.
bhv_p_WrapScreen_customRight = Direita personalizada
bhv_pd_WrapScreen_customRight = Área CUSTOM: borda direita.
bhv_p_WrapScreen_customTop = Topo personalizado
bhv_pd_WrapScreen_customTop = Área CUSTOM: borda superior.
bhv_n_CountUp = Contagem crescente
bhv_d_CountUp = Um elemento Text conta de um número a outro, como uma pontuação. Prefixo, sufixo e separador de milhares opcionais.
bhv_g_Text = Texto
bhv_p_CountUp_from = De
bhv_pd_CountUp_from = Número de onde começa.
bhv_p_CountUp_to = Até
bhv_pd_CountUp_to = Número até onde conta.
bhv_p_CountUp_duration = Duração
bhv_pd_CountUp_duration = Quanto tempo a contagem dura.
bhv_p_CountUp_delay = Atraso
bhv_pd_CountUp_delay = Espera este tempo antes de contar.
bhv_p_CountUp_decimals = Decimais
bhv_pd_CountUp_decimals = Dígitos depois do ponto.
bhv_p_CountUp_prefix = Prefixo
bhv_pd_CountUp_prefix = Texto antes do número, ex.: $ ou Pontos:
bhv_p_CountUp_suffix = Sufixo
bhv_pd_CountUp_suffix = Texto depois do número, ex.: % ou pts
bhv_p_CountUp_thousandsSeparator = Separador de milhares
bhv_pd_CountUp_thousandsSeparator = Escreve 1,234,567 em vez de 1234567.
bhv_p_CountUp_ease = Suavização
bhv_pd_CountUp_ease = Como a velocidade muda durante a contagem.
bhv_p_CountUp_autoPlay = Reprodução automática
bhv_pd_CountUp_autoPlay = Começa a contar assim que o cenário começa. Senão, use o bloco de contar.
bhv_n_Typewriter = Máquina de escrever
bhv_d_Typewriter = Um elemento Text digita seu texto letra por letra, como uma caixa de diálogo. Toque para mostrar tudo de uma vez.
bhv_p_Typewriter_speed = Velocidade
bhv_pd_Typewriter_speed = Letras por segundo.
bhv_p_Typewriter_startDelay = Atraso inicial
bhv_pd_Typewriter_startDelay = Espera este tempo antes de começar a digitar.
bhv_p_Typewriter_punctuationPause = Pausa na pontuação
bhv_pd_Typewriter_punctuationPause = Pausa extra depois de . , ! ? para as frases respirarem (0 = nenhuma).
bhv_p_Typewriter_customText = Texto personalizado
bhv_pd_Typewriter_customText = Digita outro texto em vez do escrito no elemento (vazio = usa o texto do elemento).
bhv_p_Typewriter_tapToSkip = Tocar para pular
bhv_pd_Typewriter_tapToSkip = Tocar no texto mostra tudo de uma vez.
bhv_p_Typewriter_autoPlay = Reprodução automática
bhv_pd_Typewriter_autoPlay = Começa assim que o cenário começa. Senão, use o bloco de digitar texto.
bhv_p_Typewriter_tickSound = Som de tecla
bhv_pd_Typewriter_tickSound = Som minúsculo para as letras (opcional).
bhv_p_Typewriter_tickEvery = Som a cada
bhv_pd_Typewriter_tickEvery = Toca o som de tecla a cada tantas letras.
bhv_n_Blink = Piscar
bhv_d_Blink = O elemento pisca, ligando e desligando (ou esmaecendo e reaparecendo). Bom para textos "Toque para começar", avisos e invencibilidade.
bhv_g_UI_effects = Efeitos de UI
bhv_p_Blink_onTime = Tempo ligado
bhv_pd_Blink_onTime = Quanto tempo fica visível a cada vez.
bhv_p_Blink_offTime = Tempo desligado
bhv_pd_Blink_offTime = Quanto tempo fica oculto a cada vez.
bhv_p_Blink_offOpacity = Opacidade desligado
bhv_pd_Blink_offOpacity = Opacidade enquanto "desligado" (0 = invisível).
bhv_p_Blink_smooth = Suave
bhv_pd_Blink_smooth = Esmaece suavemente em vez de trocar de uma vez.
bhv_p_Blink_count = Quantidade
bhv_pd_Blink_count = Número de piscadas; depois para visível. 0 = para sempre.
bhv_p_Blink_autoPlay = Reprodução automática
bhv_pd_Blink_autoPlay = Começa a piscar assim que o cenário começa.
bhv_n_FadeIn = Aparecer suavemente
bhv_d_FadeIn = O elemento aparece suavemente: de invisível (e opcionalmente menor) até o visual normal. Bom para menus e títulos.
bhv_p_FadeIn_duration = Duração
bhv_pd_FadeIn_duration = Quanto tempo o fade dura.
bhv_p_FadeIn_delay = Atraso
bhv_pd_FadeIn_delay = Espera este tempo antes de começar.
bhv_p_FadeIn_fromOpacity = Opacidade inicial
bhv_pd_FadeIn_fromOpacity = Opacidade no início (0 = invisível).
bhv_p_FadeIn_fromScale = Escala inicial
bhv_pd_FadeIn_fromScale = Tamanho no início, 1 = tamanho normal. Use 0.5 para fazê-lo "surgir".
bhv_p_FadeIn_ease = Suavização
bhv_pd_FadeIn_ease = Como a velocidade muda durante o fade.
bhv_p_FadeIn_autoPlay = Reprodução automática
bhv_pd_FadeIn_autoPlay = Começa assim que o cenário começa. Senão, o elemento é mostrado normalmente até o bloco de reproduzir rodar.
bhv_n_FadeOut = Desaparecer suavemente
bhv_d_FadeOut = O elemento esmaece suavemente e depois pode se ocultar ou se remover. Bom para mensagens, itens e fechamento de menus.
bhv_p_FadeOut_trigger = Gatilho
bhv_pd_FadeOut_trigger = Quando o fade começa. MANUAL = somente quando o bloco de reproduzir roda.
bhv_p_FadeOut_duration = Duração
bhv_pd_FadeOut_duration = Quanto tempo o fade dura.
bhv_p_FadeOut_delay = Atraso
bhv_pd_FadeOut_delay = Espera este tempo antes de começar (uma mensagem que desaparece sozinha).
bhv_p_FadeOut_toOpacity = Opacidade final
bhv_pd_FadeOut_toOpacity = Opacidade no fim (0 = invisível).
bhv_p_FadeOut_toScale = Escala final
bhv_pd_FadeOut_toScale = Tamanho no fim, 1 = tamanho normal. Use 0 para encolher até sumir.
bhv_p_FadeOut_ease = Suavização
bhv_pd_FadeOut_ease = Como a velocidade muda durante o fade.
bhv_p_FadeOut_then = Depois
bhv_pd_FadeOut_then = O que acontece no fim: STAY = fica lá (esmaecido), HIDE = oculto (e com a física desligada), DESTROY = removido.
bhv_n_Parallax = Parallax
bhv_d_Parallax = Uma camada de fundo que se move mais devagar que o mundo quando a câmera se move, para dar profundidade. Funciona para fundos de tela (UI) e elementos do mundo.
bhv_p_Parallax_factorX = Fator x
bhv_pd_Parallax_factorX = Velocidade lateral relativa ao mundo: 0 = move com o mundo (sem efeito), 0.5 = metade da velocidade (longe), 1 = fica parado na tela (muito longe).
bhv_p_Parallax_factorY = Fator y
bhv_pd_Parallax_factorY = O mesmo, para cima e para baixo. Usado somente quando "Afetar vertical" está ligado.
bhv_p_Parallax_affectVertical = Afetar vertical
bhv_pd_Parallax_affectVertical = Também reage quando a câmera se move para cima e para baixo.
bhv_p_Parallax_loopWidth = Largura do loop
bhv_pd_Parallax_loopWidth = Repete o movimento a cada tantos pixels para os lados, para uma fileira de ladrilhos idênticos rolar para sempre (0 = sem repetição).
bhv_p_Parallax_loopHeight = Altura do loop
bhv_pd_Parallax_loopHeight = O mesmo, para cima e para baixo (0 = sem repetição).
bhv_n_Pulse = Pulsar
bhv_d_Pulse = O elemento cresce e encolhe repetidamente, como um coração batendo. Bom para botões "Jogar" e itens.
bhv_p_Pulse_minScale = Escala mín.
bhv_pd_Pulse_minScale = Menor tamanho, 1 = tamanho normal.
bhv_p_Pulse_maxScale = Escala máx.
bhv_pd_Pulse_maxScale = Maior tamanho, 1 = tamanho normal.
bhv_p_Pulse_speed = Velocidade
bhv_pd_Pulse_speed = Batidas por segundo.
bhv_p_Pulse_lowOpacity = Opacidade baixa
bhv_pd_Pulse_lowOpacity = Opacidade no menor tamanho (1 = sem esmaecer).
bhv_p_Pulse_autoPlay = Reprodução automática
bhv_pd_Pulse_autoPlay = Começa a pulsar assim que o cenário começa. Senão, use os blocos de iniciar / pulsar uma vez.
bhv_p_Pulse_pulseWhileTouched = Pulsar ao ser tocado
bhv_pd_Pulse_pulseWhileTouched = Continua pulsando enquanto o elemento é tocado.
bhv_n_ScaleTouchEffect = Efeito de escala ao toque
bhv_d_ScaleTouchEffect = O elemento encolhe (ou cresce) enquanto é tocado e volta quando solto.
bhv_p_ScaleTouchEffect_pressedScale = Escala pressionado
bhv_pd_ScaleTouchEffect_pressedScale = Escala enquanto tocado, 1 = tamanho normal.
bhv_p_ScaleTouchEffect_speed = Velocidade
bhv_pd_ScaleTouchEffect_speed = Quão rápido vai para o novo tamanho.
bhv_p_ScaleTouchEffect_pressedAlpha = Alfa pressionado
bhv_pd_ScaleTouchEffect_pressedAlpha = Também esmaece um pouco enquanto tocado (1 = sem esmaecer).
bhv_n_Shake = Tremor
bhv_d_Shake = O elemento treme por um instante: quando o cenário começa, quando é tocado ou por um bloco. Bom para respostas erradas, golpes e botões.
bhv_p_Shake_trigger = Gatilho
bhv_pd_Shake_trigger = Quando ele treme. MANUAL = somente quando o bloco de tremer roda.
bhv_p_Shake_axis = Eixo
bhv_pd_Shake_axis = Em que direção ele se move.
bhv_p_Shake_intensity = Intensidade
bhv_pd_Shake_intensity = Quanto ele se afasta do seu lugar.
bhv_p_Shake_duration = Duração
bhv_pd_Shake_duration = Quanto tempo dura um tremor.
bhv_p_Shake_frequency = Frequência
bhv_pd_Shake_frequency = Mudanças de direção por segundo: maior = nervoso, menor = balançando.
bhv_p_Shake_rotation = Rotação
bhv_pd_Shake_rotation = Também gira um pouco para lá e para cá (0 = sem giro).
bhv_p_Shake_decay = Atenuação
bhv_pd_Shake_decay = O tremor enfraquece até parar.
bhv_p_Shake_loop = Repetir
bhv_pd_Shake_loop = Continua tremendo até o bloco de parar rodar (a duração é ignorada).
bhv_n_SlideIn = Deslizar para dentro
bhv_d_SlideIn = O elemento desliza até seu lugar vindo de um lado, com quique ou suavização se quiser. Um bloco o desliza de volta para fora. Bom para menus e painéis.
bhv_p_SlideIn_from = De
bhv_pd_SlideIn_from = O lado de onde ele vem.
bhv_p_SlideIn_distance = Distância
bhv_pd_SlideIn_distance = A que distância ele começa.
bhv_p_SlideIn_duration = Duração
bhv_pd_SlideIn_duration = Quanto tempo o deslize dura.
bhv_p_SlideIn_delay = Atraso
bhv_pd_SlideIn_delay = Espera este tempo antes de começar (use valores diferentes para deslizar uma lista um item por vez).
bhv_p_SlideIn_ease = Suavização
bhv_pd_SlideIn_ease = Como a velocidade muda durante o deslize.
bhv_p_SlideIn_fade = Fade
bhv_pd_SlideIn_fade = Também aparece suavemente enquanto desliza.
bhv_p_SlideIn_autoPlay = Reprodução automática
bhv_pd_SlideIn_autoPlay = Começa assim que o cenário começa. Senão, o elemento fica no lugar até o bloco de reproduzir rodar.
bhv_n_TintCycle = Ciclo de tom
bhv_d_TintCycle = A cor do elemento muda lentamente: de um lado para o outro entre duas cores, ou por todo o arco-íris. Bom para títulos, power-ups e sinais de perigo.
bhv_p_TintCycle_mode = Modo
bhv_pd_TintCycle_mode = BETWEEN = alterna suavemente entre as duas cores, RAINBOW = passa por todas as cores.
bhv_p_TintCycle_colorA = Cor a
bhv_pd_TintCycle_colorA = Primeira cor (BETWEEN).
bhv_p_TintCycle_colorB = Cor b
bhv_pd_TintCycle_colorB = Segunda cor (BETWEEN).
bhv_p_TintCycle_speed = Velocidade
bhv_pd_TintCycle_speed = Ciclos completos por segundo.
bhv_p_TintCycle_saturation = Saturação
bhv_pd_TintCycle_saturation = Quão fortes são as cores (RAINBOW).
bhv_p_TintCycle_brightness = Brilho
bhv_pd_TintCycle_brightness = Quão claras são as cores (RAINBOW).
bhv_p_TintCycle_autoPlay = Reprodução automática
bhv_pd_TintCycle_autoPlay = Começa assim que o cenário começa.
bhv_n_Wobble = Balançar
