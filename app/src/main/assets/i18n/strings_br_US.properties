tintDetails = funciona como um filtro de cor para os elementos.
collisionDetails = Os itens que você especificar aqui não colidirão com este item e o atravessarão.
attachToDetails = adiciona a luz a um elemento, para que ela sempre o siga.
parentDetails = selecionar o elemento pai deste elemento.
PointsDetails = especificar os pontos do colisor personalizado.
scriptDetails = selecionar o script do elemento a partir de outro elemento.
