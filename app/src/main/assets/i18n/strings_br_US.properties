ui_joint_desc_RevoluteJoint=Gira em torno de um ponto: rodas, portas, pêndulos.
ui_joint_desc_PrismaticJoint=Desliza ao longo de um eixo: pistões, elevadores.
ui_joint_desc_DistanceJoint=Mantém dois corpos a uma distância (haste / mola).
ui_joint_desc_PulleyJoint=Dois corpos pendurados numa polia.
