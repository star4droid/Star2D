tpl_EndlessRoad3D_tag = 3D / Arcade
tpl_EndlessRoad3D_desc = Endless highway: dodge traffic, collect coins, speed grows with the distance. Score, distance and speed on the HUD.
tpl_SeaDock3D_title = 3D Sea Dock
tpl_SeaDock3D_tag = 3D / Relax
tpl_SeaDock3D_desc = A pier on a calm sea with customizable water simulation. Walk to the bench and tap Sit: the camera sits down and stands up again.
