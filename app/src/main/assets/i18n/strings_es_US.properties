bhv_p_Patrol3D_lookAround = Mirar alrededor
bhv_pd_Patrol3D_lookAround = Mira a izquierda y derecha al detenerse.
bhv_p_Patrol3D_modelYawOffset = Desfase de rumbo del modelo
bhv_pd_Patrol3D_modelYawOffset = Rumbo extra cuando el modelo mira a +Z en lugar de -Z.
bhv_p_Patrol3D_walkClip = Clip de caminar
bhv_pd_Patrol3D_walkClip = Clip al caminar (vacío = ninguno).
bhv_p_Patrol3D_idleClip = Clip de reposo
bhv_pd_Patrol3D_idleClip = Clip al detenerse (vacío = ninguno).
bhv_n_Pickup3D = Recogible 3D
bhv_d_Pickup3D = Un objeto que el jugador guarda en el inventario: llaves, pilas, monedas, notas, munición. Se recoge pasando por encima o tocando un botón 2D al acercarse; suena, vuela hacia el jugador y desaparece (o vuelve más tarde).
