bhv_n_Orbit3D = Órbita 3D
bhv_d_Orbit3D = Gira alrededor de un elemento central o del punto de inicio: lunas, guardias alrededor de una torre, una cámara girando alrededor de un coche en un menú, una luz rodeando un escenario. Puede mirar hacia donde se mueve o al centro.
