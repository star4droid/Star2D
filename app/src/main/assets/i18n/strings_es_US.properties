bhv_p_Seat3D_tapObject = Tocar el objeto
bhv_pd_Seat3D_tapObject = Tocar el propio asiento también sienta.
bhv_p_Seat3D_useKeyboard = Usar teclado
bhv_pd_Seat3D_useKeyboard = La tecla E sienta / levanta (ordenador, pruebas).
bhv_n_Shooter3D = Tirador 3D
bhv_d_Shooter3D = Dispara al tocar o mantener el botón de disparo: impactos instantáneos en la mira (HITSCAN) o copias de una plantilla de bala (con Proyectil 3D). Apunta adonde mira la cámara o hacia el frente del elemento; cadencia, dispersión, munición del inventario, sonidos y retroceso de cámara.
