bhv_n_SmartChase = Persecución inteligente
bhv_d_SmartChase = Corre tras un objetivo por el camino más corto alrededor de los muros de una NavGrid (búsqueda de caminos): busca un nuevo camino cuando el objetivo se mueve o se cierra una puerta, y puede huir en su lugar. Los elementos físicos se mueven por velocidad y siguen chocando.
bhv_p_SmartChase_target = Objetivo
bhv_pd_SmartChase_target = El elemento a perseguir (normalmente el jugador).
bhv_p_SmartChase_navGrid = Cuadrícula de navegación
bhv_pd_SmartChase_navGrid = El elemento NavGrid por el que caminar (vacío = la cuadrícula de la escena).
