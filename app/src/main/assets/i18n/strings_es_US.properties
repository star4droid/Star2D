bhv_pd_Oscillator3D_motion = Cómo acelera y frena.
bhv_p_Oscillator3D_phase = Fase
bhv_pd_Oscillator3D_phase = Punto inicial del ciclo (0..1) para que las copias vayan desfasadas.
bhv_n_PathFollower3D = Seguidor de ruta 3D
bhv_d_PathFollower3D = Recorre una lista de elementos punto de ruta (objetos vacíos o marcadores): en bucle, ida y vuelta o una vez. Camina por el suelo o vuela recto; espera en cada punto. Las cámaras hacen un recorrido cinematográfico.
bhv_e_PathFollower3D_onWaypoint = En un punto de ruta
bhv_e_PathFollower3D_onPathEnd = Al final de la ruta
bhv_p_PathFollower3D_waypoints = Puntos de ruta
bhv_pd_PathFollower3D_waypoints = Los puntos a visitar, en orden (cualquier elemento 3D; ocúltalos o usa objetos EMPTY).
bhv_p_PathFollower3D_loop = Bucle
bhv_pd_PathFollower3D_loop = LOOP: vuelve al primer punto. PING_PONG: ida y vuelta. ONCE: se detiene en el último.
bhv_p_PathFollower3D_onGround = En el suelo
bhv_pd_PathFollower3D_onGround = Camina por el suelo (gravedad, escalones) en lugar de volar recto a cada punto.
bhv_p_PathFollower3D_speed = Velocidad
bhv_pd_PathFollower3D_speed = Velocidad de movimiento.
bhv_p_PathFollower3D_acceleration = Aceleración
bhv_pd_PathFollower3D_acceleration = Qué tan rápido alcanza su velocidad (0 = al instante).
bhv_p_PathFollower3D_turnSpeed = Velocidad de giro
bhv_pd_PathFollower3D_turnSpeed = Velocidad de giro hacia el siguiente punto (0 = nunca gira).
bhv_p_PathFollower3D_arriveDistance = Distancia de llegada
bhv_pd_PathFollower3D_arriveDistance = Cuenta como llegado a esta distancia de un punto.
bhv_p_PathFollower3D_waitTime = Tiempo de espera
bhv_pd_PathFollower3D_waitTime = Espera en cada punto.
bhv_p_PathFollower3D_modelYawOffset = Desfase de rumbo del modelo
bhv_pd_PathFollower3D_modelYawOffset = Rumbo extra cuando el modelo mira a +Z en lugar de -Z.
bhv_n_Patrol3D = Patrulla 3D
bhv_d_Patrol3D = Guardias y monstruos caminan entre puntos de patrulla (o deambulan alrededor de su inicio), se detienen, miran alrededor y siguen, con clips de caminar y reposo. Se pausa solo mientras una Persecución 3D del mismo elemento persigue.
bhv_e_Patrol3D_onArrive = Al llegar
bhv_p_Patrol3D_points = Puntos
bhv_pd_Patrol3D_points = Puntos de patrulla en orden (vacío = deambular al azar alrededor del inicio).
bhv_p_Patrol3D_wanderRadius = Radio de deambular
bhv_pd_Patrol3D_wanderRadius = Distancia de deambular desde el inicio cuando no hay puntos.
bhv_p_Patrol3D_randomOrder = Orden aleatorio
bhv_pd_Patrol3D_randomOrder = Visitar los puntos en orden aleatorio.
bhv_p_Patrol3D_speed = Velocidad
bhv_pd_Patrol3D_speed = Velocidad al caminar.
bhv_p_Patrol3D_turnSpeed = Velocidad de giro
bhv_pd_Patrol3D_turnSpeed = Velocidad de giro.
