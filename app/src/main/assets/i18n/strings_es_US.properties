bhv_n_Projectile3D = Proyectil 3D
bhv_d_Projectile3D = Una bala, flecha, bola de fuego o pelota lanzada: vuela hacia adelante (su -Z) con gravedad opcional, nunca atraviesa paredes finas, hiere lo que golpea (Salud 3D), muestra un efecto de impacto y desaparece. Ponlo en la plantilla que copia Tirador 3D o Generador 3D.
