bhv_p_Pickup3D_respawnTime = Tiempo de reaparición
bhv_pd_Pickup3D_respawnTime = Vuelve tras estos segundos (0 = nunca).
bhv_p_Pickup3D_destroyWhenTaken = Destruir al tomarlo
bhv_pd_Pickup3D_destroyWhenTaken = Quita el elemento de la escena al tomarlo (sin reaparición).
bhv_n_PlatformMover3D = Plataforma móvil 3D
bhv_d_PlatformMover3D = Una plataforma móvil, ascensor o ferry: viaja entre su inicio y un desplazamiento (o por puntos), espera en cada parada y lleva lo que tenga encima (personajes, cajas, el jugador en primera persona). Dale un cuerpo KINEMATIC.
