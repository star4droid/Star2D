bhv_p_Projectile3D_targetPrefix = Prefijo del objetivo
bhv_pd_Projectile3D_targetPrefix = Solo hiere elementos cuyo nombre empieza así (vacío = cualquier cosa con salud).
bhv_p_Projectile3D_destroyOnHit = Destruir al impactar
bhv_pd_Projectile3D_destroyOnHit = Desaparece al golpear algo.
bhv_p_Projectile3D_impactEffect = Efecto de impacto
bhv_pd_Projectile3D_impactEffect = Elemento copiado en el punto de impacto (chispas, marca; se quita tras 2 s). Opcional.
