bhv_pd_Seat3D_player = El elemento del jugador cuyo control se pausa (vacío = lo que sigue la cámara principal, o la propia cámara).
bhv_p_Seat3D_camera = Cámara
bhv_pd_Seat3D_camera = Cámara que va al asiento (vacío = la cámara principal).
