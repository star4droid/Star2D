bhv_n_CameraFollow = Camera Follow
bhv_d_CameraFollow = La cámara sigue a un elemento con suavidad, con zona muerta, anticipación en la dirección del movimiento, límites de escena y zoom. Funciona junto con Camera Shake. Ponlo en el jugador o en cualquier elemento y elige el objetivo.
