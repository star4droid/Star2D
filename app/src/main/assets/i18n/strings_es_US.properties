ui_joint_desc_RevoluteJoint=Gira alrededor de un punto: ruedas, puertas, péndulos.
ui_joint_desc_PrismaticJoint=Se desliza a lo largo de un eje: pistones, ascensores.
ui_joint_desc_DistanceJoint=Mantiene dos cuerpos a una distancia (barra / resorte).
ui_joint_desc_PulleyJoint=Dos cuerpos colgados de una polea.
