ui_joint_desc_MotorJoint=Mueve un cuerpo respecto a otro.

# --- racing v2, sizes ---
tut_set_w=Los elementos nuevos son pequeños. Pon el ancho en %1$s.
tut_set_h=Pon la altura en %1$s.
tut_bounce_zero=Pon restitution (rebote) en %1$s para que el héroe aterrice sin rebotar.
tut_road_info=Ahora la carretera. road1 y road2 comparten los mismos eventos (su Script es road), así que los bloques sirven para ambos tramos.
tut_road_created=Toca OnBodyCreated: se ejecuta una vez por cada tramo.
tut_road_speed=Pon la velocidad en %1$s: la carretera baja y el coche parece avanzar.
tut_road_update=Toca OnBodyUpdate: cuando un tramo sale por abajo, salta encima del otro.
tut_road_limit=Escribe %1$s en el segundo círculo: el centro del tramo está media pantalla abajo, fuera de vista.
tut_moveby_inside=Arrastra "%1$s" dentro de "%2$s": mueve un elemento una distancia.
tut_moveby_dx=Pon dx en %1$s (sin movimiento lateral).
tut_moveby_dy=Pon dy en %1$s: dos tramos hacia arriba, justo encima del otro.
tut_rival_info=Los tres coches rivales también comparten eventos (Script: rival). Bajan más despacio que la carretera, como coches lentos que adelantas.

