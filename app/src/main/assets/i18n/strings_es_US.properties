tut_add_finish=Añade "%1$s" debajo: cierra la escena antigua y solo sigue la nueva.
tut_finish_inside=Arrastra también "%1$s" a la apertura "si no", debajo de "%2$s": cierra la escena antigua para que solo funcione la nueva.
