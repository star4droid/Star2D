ui_tip_Cell_Shape = SQUARE: celdas cuadradas (4 u 8 direcciones). HEX: hexágonos (6 direcciones, caminos más redondeados).
ui_tip_Cell_Width = Ancho de una celda (px en 2D, metros en 3D). Celdas más pequeñas = caminos más precisos pero más trabajo. Hexágonos: la distancia entre dos celdas de una fila.
ui_tip_Cell_Height = Alto de una celda. Hexágonos: la distancia entre dos filas (hexágono regular = ancho x 0.866).
ui_tip_Diagonal = Celdas cuadradas: los personajes también pueden moverse en diagonal (8 direcciones).
ui_tip_Cut_Corners = Los movimientos en diagonal pueden pasar por la esquina de un muro (desactivado: la rodean).
ui_tip_Agent_Size = Ancho de los personajes: los caminos se mantienen a esta distancia de los muros. 0 = los caminos pueden tocar los muros.
ui_tip_Obstacles = Elementos que bloquean las celdas que cubren. Se siguen cuando se mueven, y sus celdas se abren de nuevo cuando se destruyen (puertas, cajas).
ui_tip_Use_Static_Bodies = Al empezar el juego, cada elemento físico STATIC bloquea las celdas que cubre.
ui_tip_Show_In_Game = Dibuja la cuadrícula mientras se juega (para probar los caminos).
ui_tip_Room_Name = Nombre que ven los otros jugadores al buscar partidas (vacío = el nombre del dispositivo).
ui_tip_Max_Players = Máximo de jugadores en una partida, incluido el anfitrión.
ui_tip_Send_Rate = Actualizaciones enviadas por segundo: 20 es fluido en Wi-Fi, menos ahorra batería.
ui_tip_Player_Template = Un elemento copiado para cada jugador que se une; cada copia la mueve su propio jugador. Vacío = crea los jugadores tú mismo con bloques.
ui_tip_Spawn_Radius = Las copias de la plantilla de jugador aparecen a su alrededor, hasta esta distancia.
ui_tip_Game_Version = Solo pueden unirse jugadores con la misma versión: cámbiala cuando cambies el juego.
ui_tip_Lobby = Muestra el lobby listo (hospedar, salas, jugadores, empezar) al empezar la escena.
ui_tip_Game_Scene = La escena que el lobby abre para todos cuando el anfitrión pulsa Empezar.
ui_tip_TCP_Port = Puerto de red para mensajes fiables (deja el valor por defecto salvo que otra app lo use).
ui_tip_UDP_Port = Puerto de red para actualizaciones rápidas y para buscar partidas (deja el valor por defecto).
tpl_MazeChase_title = Persecución en el laberinto
tpl_MazeChase_tag = Búsqueda de rutas
tpl_MazeChase_desc = Toca a dónde ir: el jugador sigue el camino más corto por el laberinto. Fantasmas Smart Chase rodean las paredes, un guardia recorre una ruta dibujada y la llave abre una puerta para que los fantasmas encuentren nuevos caminos. Una segunda escena usa una cuadrícula hexagonal.
tpl_WifiStars_title = Estrellas Wi-Fi
tpl_WifiStars_tag = Multijugador / Wi-Fi
tpl_WifiStars_desc = Multijugador local hecho con bloques: crea o busca una partida en el mismo Wi-Fi (o el punto de acceso de un teléfono), mira las salas y los jugadores, empieza para todos. Cada teléfono mueve su bola con un joystick; el anfitrión crea las estrellas y cuenta los puntos, el primero en llegar a 10 gana.
