bhv_pd_Orbit3D_speed = Velocidad de giro (negativo = hacia el otro lado).
bhv_p_Orbit3D_height = Altura
bhv_pd_Orbit3D_height = Altura sobre el centro.
bhv_p_Orbit3D_wave = Onda
bhv_pd_Orbit3D_wave = Onda de subida y bajada al girar (0 = plano).
bhv_p_Orbit3D_facing = Orientación
bhv_pd_Orbit3D_facing = Hacia dónde mira al girar.
bhv_n_Oscillator3D = Oscilador 3D
bhv_d_Oscillator3D = Va y viene entre su inicio y un desplazamiento: paredes deslizantes, pistones, sierras, trampas, ascensores sin pasajeros. Suave o lineal, con pausa en ambos extremos.
bhv_e_Oscillator3D_onEnd = En el extremo
bhv_p_Oscillator3D_offsetX = Desplazamiento x
bhv_pd_Oscillator3D_offsetX = Desplazamiento del extremo lejano en X desde el inicio.
bhv_p_Oscillator3D_offsetY = Desplazamiento y
bhv_pd_Oscillator3D_offsetY = Desplazamiento del extremo lejano en Y (arriba).
bhv_p_Oscillator3D_offsetZ = Desplazamiento z
bhv_pd_Oscillator3D_offsetZ = Desplazamiento del extremo lejano en Z.
bhv_p_Oscillator3D_localOffset = Desplazamiento local
