bhv_p_Orbit3D_center = Centro
bhv_pd_Orbit3D_center = Elemento alrededor del cual girar (vacío = el punto de inicio menos el radio).
bhv_p_Orbit3D_radius = Radio
bhv_pd_Orbit3D_radius = Distancia al centro (0 = la distancia al inicio).
