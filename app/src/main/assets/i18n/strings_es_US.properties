bhv_p_LookAtTarget3D_range = Alcance
bhv_pd_LookAtTarget3D_range = Solo mira cuando el objetivo está así de cerca (0 = siempre).
bhv_p_LookAtTarget3D_heightOffset = Desfase de altura
bhv_pd_LookAtTarget3D_heightOffset = Mira a esta altura sobre la posición del objetivo.
bhv_p_LookAtTarget3D_yawOnly = Solo rumbo
bhv_pd_LookAtTarget3D_yawOnly = Solo gira en Y (se mantiene vertical).
bhv_p_LookAtTarget3D_turnSpeed = Velocidad de giro
bhv_pd_LookAtTarget3D_turnSpeed = Velocidad de giro (0 = al instante).
bhv_p_LookAtTarget3D_yawOffset = Desfase de rumbo
