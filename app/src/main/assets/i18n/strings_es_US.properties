bhv_n_LookAtTarget3D = Mirar al objetivo 3D
bhv_d_LookAtTarget3D = Gira suavemente hacia un objetivo mientras está en alcance: torretas, cámaras de seguridad, estatuas cuyos ojos te siguen, un foco que sigue al jugador. Puede barrer a izquierda y derecha cuando no ve a nadie.
