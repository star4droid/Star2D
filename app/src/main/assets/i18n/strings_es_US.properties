bhv_d_Seat3D = Una silla, banco o sofá donde el jugador puede sentarse: aparece un botón 2D al acercarse, la cámara se desliza suave al asiento (aún puedes mirar alrededor) y el control de movimiento se pausa; toca otra vez para levantarte delante.
