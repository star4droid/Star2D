bhv_p_Pickup3D_itemId = Id del objeto
bhv_pd_Pickup3D_itemId = Id del inventario que añade ("key_red", "battery", "coin").
bhv_p_Pickup3D_count = Cantidad
bhv_pd_Pickup3D_count = Cuántos añade.
bhv_p_Pickup3D_player = Jugador
