bhv_n_Buoyancy3D = Flotación 3D
bhv_d_Buoyancy3D = Flota sobre un elemento WATER y se mece con sus olas: barcos, balsas, barriles, un banco bañado por el mar, patos. Sin cuerpo sigue la superficie con exactitud; con un cuerpo DYNAMIC las olas empujan sus esquinas y se inclina y balancea de verdad.
