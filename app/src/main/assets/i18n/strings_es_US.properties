bhv_n_Chase = Persecución
bhv_d_Chase = Corre tras un objetivo (el jugador) cuando se acerca, se rinde si se aleja demasiado y puede volver a casa. Úsalo en enemigos; pon una Patrulla en el mismo elemento para guardias que te persiguen al verte.
bhv_p_Chase_target = Objetivo
bhv_pd_Chase_target = El elemento a perseguir (normalmente el jugador).
bhv_p_Chase_sightRange = Alcance de visión
bhv_pd_Chase_sightRange = Empieza a perseguir cuando el objetivo está más cerca que esto.
bhv_p_Chase_giveUpRange = Alcance de rendición
bhv_pd_Chase_giveUpRange = Deja de perseguir cuando el objetivo está más lejos que esto (usa más que el alcance de visión).
bhv_p_Chase_needLineOfSight = Necesita línea de visión
bhv_pd_Chase_needLineOfSight = Activado: las paredes entre él y el objetivo lo ocultan. Desactivado: siente el objetivo a través de paredes.
bhv_p_Chase_speed = Velocidad
bhv_pd_Chase_speed = Velocidad de carrera.
bhv_p_Chase_acceleration = Aceleración
bhv_pd_Chase_acceleration = Qué tan rápido alcanza la velocidad. 0 = al instante.
bhv_p_Chase_stopDistance = Distancia de parada
bhv_pd_Chase_stopDistance = Se detiene a esta distancia del objetivo (y lanza onReachTarget).
bhv_p_Chase_horizontalOnly = Solo horizontal
bhv_pd_Chase_horizontalOnly = Solo izquierda/derecha (enemigos terrestres con gravedad). Desactivado: vuela directo al objetivo ignorando la gravedad.
bhv_p_Chase_returnHome = Volver a casa
bhv_pd_Chase_returnHome = Tras rendirse, vuelve a donde empezó.
bhv_p_Chase_flipToDirection = Voltear hacia el movimiento
bhv_pd_Chase_flipToDirection = Refleja la imagen hacia el movimiento.
bhv_p_Chase_artFacesLeft = La imagen mira a la izquierda
bhv_pd_Chase_artFacesLeft = La imagen está dibujada mirando a la izquierda.
bhv_p_Chase_faceTarget = Mirar al objetivo
bhv_pd_Chase_faceTarget = Gira el elemento hacia el objetivo (enemigos vistos desde arriba).
bhv_p_Chase_faceOffset = Ángulo de frente
bhv_pd_Chase_faceOffset = Ángulo de la imagen cuando mira a la derecha (0 = derecha, 90 = arriba...).
bhv_n_Patrol = Patrulla
bhv_d_Patrol = Camina de un lado a otro solo (enemigos, guardias, peligros móviles): una distancia a cada lado o elementos de puntos de ruta. Espera en los extremos, voltea su imagen y puede girar en paredes y bordes. Se pausa mientras una Persecución del mismo elemento persigue.
bhv_p_Patrol_mode = Modo
bhv_pd_Patrol_mode = DISTANCE: va y viene alrededor de la posición inicial. WAYPOINTS: visita los elementos de la lista en orden.
bhv_p_Patrol_axis = Eje
bhv_pd_Patrol_axis = Solo DISTANCE: izquierda/derecha o arriba/abajo.
bhv_p_Patrol_rangeBack = Alcance atrás
bhv_pd_Patrol_rangeBack = Solo DISTANCE: cuánto camina a la izquierda (o abajo) del inicio.
bhv_p_Patrol_rangeForward = Alcance adelante
bhv_pd_Patrol_rangeForward = Solo DISTANCE: cuánto camina a la derecha (o arriba) del inicio.
bhv_p_Patrol_startBackwards = Empezar hacia atrás
bhv_pd_Patrol_startBackwards = Solo DISTANCE: primero camina a la izquierda / abajo.
bhv_p_Patrol_waypoints = Puntos de ruta
bhv_pd_Patrol_waypoints = Solo WAYPOINTS: los elementos a los que va, en orden (pueden estar invisibles).
bhv_p_Patrol_loopWaypoints = Repetir puntos
bhv_pd_Patrol_loopWaypoints = Solo WAYPOINTS: tras el último vuelve al primero (bucle). Desactivado = vuelve por la misma ruta.
bhv_p_Patrol_speed = Velocidad
bhv_pd_Patrol_speed = Velocidad al caminar.
bhv_p_Patrol_waitTime = Tiempo de espera
bhv_pd_Patrol_waitTime = Cuánto espera en cada extremo / punto.
bhv_p_Patrol_flying = Vuela
bhv_pd_Patrol_flying = Ignora la gravedad (aves, drones). Las rutas verticales y los puntos de ruta siempre la ignoran.
bhv_p_Patrol_flipOnTurn = Voltear al girar
bhv_pd_Patrol_flipOnTurn = Refleja la imagen cuando camina a la izquierda.
bhv_p_Patrol_artFacesLeft = La imagen mira a la izquierda
bhv_pd_Patrol_artFacesLeft = La imagen está dibujada mirando a la izquierda (se refleja al ir a la derecha).
bhv_p_Patrol_turnAtWalls = Girar en paredes
bhv_pd_Patrol_turnAtWalls = Da la vuelta cuando hay una pared (estática o plataforma móvil) justo delante. Solo elementos físicos.
bhv_p_Patrol_turnAtLedges = Girar en bordes
bhv_pd_Patrol_turnAtLedges = Da la vuelta en vez de caer por un borde. Solo elementos físicos.
bhv_p_Patrol_ledgeDepth = Profundidad del borde
bhv_pd_Patrol_ledgeDepth = Cuánto suelo debe haber bajo sus pies para seguir caminando.
bhv_p_Patrol_yieldToChase = Ceder a la persecución
bhv_pd_Patrol_yieldToChase = No hace nada mientras una Persecución de este elemento persigue.
