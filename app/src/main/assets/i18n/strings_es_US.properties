bhv_p_Draggable_snapBack = Volver al origen
bhv_pd_Draggable_snapBack = Vuelve al lugar de partida al soltarlo.
bhv_p_Draggable_snapBackTime = Tiempo de vuelta
bhv_pd_Draggable_snapBackTime = Cuánto dura el viaje de vuelta (0 = de golpe).
bhv_p_Draggable_dropTargets = Objetivos de soltado
bhv_pd_Draggable_dropTargets = Elementos sobre los que se puede soltar (opcional). onDropOn se ejecuta al soltarlo sobre uno.
bhv_p_Draggable_snapToTarget = Ajustar al objetivo
bhv_pd_Draggable_snapToTarget = Se mueve al centro del objetivo sobre el que se soltó.
bhv_p_Draggable_dragScale = Escala al arrastrar
bhv_pd_Draggable_dragScale = Tamaño al arrastrar (1 = normal), para que parezca levantado.
bhv_p_Draggable_bringToFront = Traer al frente
bhv_pd_Draggable_bringToFront = Trae el elemento delante de los demás mientras se arrastra.
bhv_p_Draggable_freezePhysics = Congelar física
bhv_pd_Draggable_freezePhysics = Un elemento físico deja de moverse por sí solo mientras se sujeta.
bhv_n_LongPress = Pulsación larga
bhv_d_LongPress = Distingue entre un toque rápido y mantener pulsado el elemento. Botones de mantener para confirmar, menús ocultos, cargas.
bhv_p_LongPress_holdTime = Tiempo de pulsación
bhv_pd_LongPress_holdTime = Cuánto debe permanecer el dedo pulsando.
bhv_p_LongPress_moveTolerance = Tolerancia de movimiento
bhv_pd_LongPress_moveTolerance = Si el dedo se mueve más lejos que esto (píxeles de pantalla) deja de ser una pulsación.
bhv_p_LongPress_repeat = Repetir
bhv_pd_LongPress_repeat = Sigue disparando onLongPress cada tiempo de pulsación mientras el dedo siga pulsando.
bhv_p_LongPress_holdBar = Barra de pulsación
bhv_pd_LongPress_holdBar = Un elemento Progress que se llena mientras se mantiene pulsado (opcional): mantener para confirmar.
bhv_n_OpenSceneOnClick = Abrir escena al hacer clic
bhv_d_OpenSceneOnClick = Tocar el elemento abre otra escena, tras una espera y un fundido opcionales. Para botones de Jugar y menús.
bhv_p_OpenSceneOnClick_scene = Escena
bhv_pd_OpenSceneOnClick_scene = Nombre de la escena a abrir (tal como aparece en la lista de escenas).
bhv_p_OpenSceneOnClick_trigger = Activador
bhv_pd_OpenSceneOnClick_trigger = CLICK = cuando se pulsa y se suelta sobre el elemento, TOUCH_START = en cuanto se pulsa.
bhv_p_OpenSceneOnClick_delay = Retraso
bhv_pd_OpenSceneOnClick_delay = Espera este tiempo antes de cambiar de escena (tiempo para un sonido o un efecto).
bhv_p_OpenSceneOnClick_fadeOverlay = Capa de fundido
bhv_pd_OpenSceneOnClick_fadeOverlay = Una gran caja negra sobre toda la pantalla (opcional): aparece gradualmente antes de cambiar de escena. Hazla invisible o con 0% de opacidad en el editor.
bhv_p_OpenSceneOnClick_fadeTime = Tiempo de fundido
bhv_pd_OpenSceneOnClick_fadeTime = Cuánto tarda la capa en aparecer gradualmente.
bhv_p_OpenSceneOnClick_clickSound = Sonido de clic
bhv_pd_OpenSceneOnClick_clickSound = Sonido que se reproduce cuando se acepta el toque (opcional).
bhv_n_SwipeDetector = Detector de deslizamiento
bhv_d_SwipeDetector = Detecta un deslizamiento del dedo a izquierda, derecha, arriba o abajo, sobre el elemento o en cualquier parte de la pantalla. Para pasar páginas, menús y juegos controlados por deslizamiento.
bhv_p_SwipeDetector_onlyOnElement = Solo sobre el elemento
bhv_pd_SwipeDetector_onlyOnElement = Solo cuentan los deslizamientos que empiezan en este elemento. Desactivado = un deslizamiento en cualquier parte de la pantalla.
bhv_p_SwipeDetector_minDistance = Distancia mínima
bhv_pd_SwipeDetector_minDistance = Cuánto debe recorrer el dedo (píxeles de pantalla).
bhv_p_SwipeDetector_maxTime = Tiempo máximo
bhv_pd_SwipeDetector_maxTime = Un deslizamiento debe hacerse dentro de este tiempo; los arrastres más lentos se ignoran (0 = sin límite).
bhv_p_SwipeDetector_fireWhileMoving = Disparar en movimiento
bhv_pd_SwipeDetector_fireWhileMoving = Reacciona en cuanto se alcanza la distancia, sin esperar a que se levante el dedo.
bhv_n_ToggleOnClick = Alternar al hacer clic
bhv_d_ToggleOnClick = Tocar el elemento muestra u oculta otros elementos: un panel de ajustes, un menú, una pista.
bhv_p_ToggleOnClick_targets = Objetivos
bhv_pd_ToggleOnClick_targets = Los elementos que se muestran / ocultan.
bhv_p_ToggleOnClick_action = Acción
bhv_pd_ToggleOnClick_action = TOGGLE = alterna cada vez, SHOW = muestra siempre, HIDE = oculta siempre.
bhv_p_ToggleOnClick_trigger = Activador
bhv_pd_ToggleOnClick_trigger = CLICK = cuando se pulsa y se suelta sobre el elemento, TOUCH_START = en cuanto se pulsa.
bhv_p_ToggleOnClick_startHidden = Empezar oculto
bhv_pd_ToggleOnClick_startHidden = Oculta los objetivos al empezar la escena.
bhv_p_ToggleOnClick_affectPhysics = Afectar a la física
bhv_pd_ToggleOnClick_affectPhysics = Los elementos físicos ocultos también dejan de colisionar y de moverse.
bhv_n_Lifetime = Tiempo de vida
bhv_d_Lifetime = El elemento se elimina solo pasado un tiempo, desvaneciéndose (y opcionalmente encogiéndose) antes. Balas, partículas, plataformas temporales, pistas.
bhv_g_Logic = Lógica
bhv_p_Lifetime_seconds = Segundos
bhv_pd_Lifetime_seconds = Cuánto vive, contado desde que empieza la escena (o desde reset).
bhv_p_Lifetime_randomExtra = Extra aleatorio
bhv_pd_Lifetime_randomExtra = Vida extra aleatoria entre -x y +x segundos, para que un grupo no desaparezca de golpe.
bhv_p_Lifetime_fadeTime = Tiempo de fundido
bhv_pd_Lifetime_fadeTime = Se desvanece durante los últimos segundos.
bhv_p_Lifetime_shrink = Encoger
bhv_pd_Lifetime_shrink = También se encoge hasta desaparecer mientras se desvanece.
bhv_p_Lifetime_endAction = Acción final
bhv_pd_Lifetime_endAction = DESTROY elimina el elemento, HIDE lo mantiene invisible e inactivo.
bhv_n_ProgressBind = Vínculo de progreso
bhv_d_ProgressBind = Mantiene una barra de progreso sincronizada con un número: un valor guardado con setValue, otra barra o el número escrito en un Texto. Vida, carga, XP, temporizadores.
bhv_p_ProgressBind_source = Origen
bhv_pd_ProgressBind_source = De dónde viene el número. SAVED_VALUE = un valor guardado por nombre (setValue / getValue), OTHER_PROGRESS = el valor de otro elemento Progress, OTHER_TEXT = el primer número escrito en un elemento de Texto, MANUAL = solo el bloque de fijar valor.
bhv_p_ProgressBind_valueName = Nombre del valor
bhv_pd_ProgressBind_valueName = Nombre del valor guardado (SAVED_VALUE).
bhv_p_ProgressBind_other = Otro
bhv_pd_ProgressBind_other = El otro elemento (OTHER_PROGRESS / OTHER_TEXT).
bhv_p_ProgressBind_minValue = Valor mínimo
bhv_pd_ProgressBind_minValue = Número que muestra una barra vacía.
bhv_p_ProgressBind_maxValue = Valor máximo
bhv_pd_ProgressBind_maxValue = Número que muestra una barra llena.
bhv_p_ProgressBind_smoothing = Suavizado
bhv_pd_ProgressBind_smoothing = Qué tan rápido sigue la barra (0 = al instante).
bhv_p_ProgressBind_pollInterval = Intervalo de lectura
bhv_pd_ProgressBind_pollInterval = Con qué frecuencia se lee el origen; un valor guardado por nombre se lee del almacenamiento.
bhv_n_ScoreCounter = Score Counter
bhv_d_ScoreCounter = Muestra una variable de escena (puntuación, monedas, vidas...) en un elemento de Texto con prefijo, relleno y una animación de conteo, y guarda una puntuación máxima en el dispositivo.
bhv_p_ScoreCounter_variable = Variable
bhv_pd_ScoreCounter_variable = Variable de escena a mostrar (un int o float creado en Variables). Collectible y Timer escriben en variables por nombre. Vacío = el contador guarda su propio número.
bhv_g_Value = Valor
bhv_p_ScoreCounter_display = Pantalla
bhv_pd_ScoreCounter_display = El elemento de Texto que lo muestra. Vacío = este elemento (cuando es un Texto).
bhv_p_ScoreCounter_prefix = Prefijo
bhv_pd_ScoreCounter_prefix = Se escribe antes del número, p. ej. SCORE
bhv_p_ScoreCounter_suffix = Sufijo
bhv_pd_ScoreCounter_suffix = Se escribe después del número, p. ej.  pts
bhv_p_ScoreCounter_decimals = Decimales
bhv_pd_ScoreCounter_decimals = Dígitos tras el punto decimal.
bhv_p_ScoreCounter_padDigits = Dígitos de relleno
bhv_pd_ScoreCounter_padDigits = Rellena con ceros hasta este número de dígitos (0005). 0 = desactivado.
bhv_p_ScoreCounter_thousandsSeparator = Separador de miles
bhv_pd_ScoreCounter_thousandsSeparator = Agrupa los dígitos: 12,345.
bhv_p_ScoreCounter_animate = Animar
bhv_pd_ScoreCounter_animate = El número sube/baja hasta el nuevo valor en lugar de saltar.
bhv_p_ScoreCounter_animateTime = Tiempo de animación
bhv_pd_ScoreCounter_animateTime = Cuánto dura el conteo como máximo.
bhv_p_ScoreCounter_highScoreKey = Clave de puntuación máxima
bhv_pd_ScoreCounter_highScoreKey = Nombre bajo el cual se guarda en el dispositivo el mejor valor (p. ej. highscore_level1). Vacío = sin puntuación máxima.
bhv_g_High_score = Puntuación máxima
bhv_p_ScoreCounter_highScoreDisplay = Visor de puntuación máxima
bhv_pd_ScoreCounter_highScoreDisplay = Elemento de Texto que muestra la puntuación máxima (opcional).
bhv_p_ScoreCounter_highScorePrefix = Prefijo de puntuación máxima
bhv_pd_ScoreCounter_highScorePrefix = Se escribe antes de la puntuación máxima.
bhv_n_Timer = Timer
bhv_d_Timer = Una cuenta atrás o un cronómetro mostrado en un elemento de Texto: límites de tiempo de nivel, tiempos de carrera, indicadores de enfriamiento. Inícialo, páusalo y reinícialo con bloques; también puede escribir los segundos en una variable de escena.
bhv_p_Timer_mode = Modo
bhv_pd_Timer_mode = COUNTDOWN cuenta atrás desde los segundos de abajo hasta 0, STOPWATCH cuenta hacia arriba.
bhv_g_Timer = Timer
bhv_p_Timer_seconds = Segundos
bhv_pd_Timer_seconds = Cuenta atrás: desde dónde empieza. Cronómetro: se detiene (onTimeout) en este tiempo, 0 = nunca.
bhv_p_Timer_autoStart = Inicio automático
bhv_pd_Timer_autoStart = Empieza cuando empieza la escena. Desactivado: llama a start timer.
bhv_p_Timer_loop = Bucle
bhv_pd_Timer_loop = Vuelve a empezar solo tras onTimeout.
bhv_p_Timer_display = Pantalla
bhv_pd_Timer_display = El elemento de Texto que muestra el tiempo. Vacío = este elemento (cuando es un Texto).
bhv_p_Timer_format = Formato
bhv_pd_Timer_format = M_SS = 1:05, SECONDS = 65, TENTHS = 65.3, M_SS_CC = 01:05.30.
bhv_p_Timer_prefix = Prefijo
bhv_pd_Timer_prefix = Se escribe antes del tiempo, p. ej. TIME
bhv_p_Timer_suffix = Sufijo
bhv_pd_Timer_suffix = Se escribe después del tiempo, p. ej. s
bhv_p_Timer_warnAt = Avisar en
bhv_pd_Timer_warnAt = Cuenta atrás: el texto toma el color de aviso y se dispara onWarning cuando quedan tantos segundos. 0 = desactivado.
bhv_p_Timer_warnColor = Color de aviso
bhv_pd_Timer_warnColor = Color del texto durante el aviso.
bhv_p_Timer_variable = Variable
bhv_pd_Timer_variable = Variable de escena (int o float) que recibe el tiempo en segundos. Vacío = ninguna.
bhv_g_Variable = Variable
bhv_n_Floating = Floating
bhv_d_Floating = El elemento oscila arriba y abajo (y/o de lado a lado) para siempre. Los elementos físicos pasan a ser kinemáticos mientras se ejecuta.
bhv_g_Motion = Movimiento
bhv_p_Floating_amplitudeY = Amplitud y
bhv_pd_Floating_amplitudeY = Distancia vertical en cada sentido.
bhv_p_Floating_amplitudeX = Amplitud x
bhv_pd_Floating_amplitudeX = Distancia horizontal en cada sentido.
bhv_p_Floating_frequency = Frecuencia
bhv_pd_Floating_frequency = Ciclos completos por segundo.
bhv_p_Floating_phase = Fase
bhv_pd_Floating_phase = Desfase inicial en el ciclo (0..1) para que varios elementos no se muevan a la vez.
bhv_set_type = Tipo
bhv_n_Spin = Spin
bhv_d_Spin = Rota el elemento continuamente (monedas, sierras, iconos de carga). Los elementos físicos pasan a ser kinemáticos mientras se ejecuta.
bhv_p_Spin_speed = Velocidad
bhv_pd_Spin_speed = Grados por segundo.
bhv_p_Spin_clockwise = Sentido horario
bhv_n_Bounce = Rebote
bhv_d_Bounce = Una bola que nunca se detiene: mantiene una velocidad constante y rebota en todo (Pong, Breakout, salvapantallas). Los elementos físicos rebotan en paredes y otros cuerpos; los elementos UI rebotan en los bordes de la pantalla.
bhv_g_Movement = Movimiento
bhv_p_Bounce_speed = Velocidad
bhv_pd_Bounce_speed = Velocidad de la bola.
bhv_g_Ball = Bola
bhv_p_Bounce_keepSpeed = Mantener velocidad
bhv_pd_Bounce_keepSpeed = Mantiene la velocidad constante tras cada rebote. Desactivado: rebote normal de la física.
bhv_p_Bounce_speedGain = Aumento de velocidad
bhv_pd_Bounce_speedGain = La bola acelera tanto en cada rebote (hasta la velocidad máxima).
bhv_p_Bounce_maxSpeed = Velocidad máxima
bhv_pd_Bounce_maxSpeed = Límite de velocidad cuando la bola acelera.
bhv_p_Bounce_bounciness = Elasticidad
bhv_pd_Bounce_bounciness = Físico: cuánta energía conserva un rebote (1 = toda).
bhv_p_Bounce_minAngle = Ángulo mínimo
bhv_pd_Bounce_minAngle = Nunca se mueve casi recto a lo largo de un eje: la trayectoria se mantiene al menos a este ángulo de la horizontal/vertical (evita el ping-pong infinito en Pong/Breakout).
bhv_p_Bounce_startAngle = Ángulo inicial
bhv_pd_Bounce_startAngle = Dirección al inicio: 0 = derecha, 90 = arriba, 45 = arriba-derecha.
bhv_g_Launch = Lanzamiento
bhv_p_Bounce_randomStart = Inicio aleatorio
bhv_pd_Bounce_randomStart = Elige una dirección diagonal aleatoria al inicio.
bhv_p_Bounce_launchOnStart = Lanzar al inicio
bhv_pd_Bounce_launchOnStart = Lanza al empezar el juego. Desactivado: llama a launch desde tus bloques.
bhv_p_Bounce_bounceOffView = Rebotar en la vista
bhv_pd_Bounce_bounceOffView = Físico: también rebota en los bordes de la vista de la cámara (los elementos UI siempre rebotan en la pantalla).
bhv_g_Screen_edges = Bordes de pantalla
bhv_set_gravityScale = Escala de gravedad
bhv_set_linearDamping = Amortiguación lineal
bhv_n_Follow = Follow
bhv_d_Follow = Mantiene el elemento junto a otro, con un desplazamiento y alcance suave: mascotas, barras de vida sobre un personaje, un perseguidor tipo cámara, una sombra. Funciona con elementos UI y físicos.
bhv_p_Follow_target = Objetivo
bhv_pd_Follow_target = El elemento a seguir.
bhv_p_Follow_offsetX = Desplazamiento x
bhv_pd_Follow_offsetX = Dónde permanecer, respecto al centro del objetivo (x, la derecha es positiva).
bhv_p_Follow_offsetY = Desplazamiento y
bhv_pd_Follow_offsetY = Dónde permanecer, respecto al centro del objetivo (y, arriba es positivo).
bhv_p_Follow_followX = Seguir x
bhv_pd_Follow_followX = Seguir en el eje izquierda/derecha.
bhv_p_Follow_followY = Seguir y
bhv_pd_Follow_followY = Seguir en el eje arriba/abajo (un elemento físico entonces ignora la gravedad).
bhv_p_Follow_mirrorOffset = Reflejar desplazamiento
bhv_pd_Follow_mirrorOffset = Refleja el desplazamiento x cuando el objetivo mira a la izquierda (su imagen está volteada).
bhv_p_Follow_stiffness = Rigidez
bhv_pd_Follow_stiffness = Qué tan ceñido sigue: más alto = alcanza más rápido. 0 = pegado al objetivo (salta hasta allí).
bhv_p_Follow_maxSpeed = Velocidad máxima
bhv_pd_Follow_maxSpeed = Límite de velocidad. 0 = sin límite (los elementos físicos se limitan a 450 px/s).
bhv_p_Follow_stopDistance = Distancia de parada
bhv_pd_Follow_stopDistance = Deja de moverse cuando está más cerca que esto del punto deseado.
bhv_p_Follow_matchRotation = Igualar rotación
bhv_pd_Follow_matchRotation = Copia también la rotación del objetivo.
bhv_n_JoystickMovement = Movimiento con joystick
bhv_d_JoystickMovement = Mueve el elemento con un joystick: vista cenital (todas las direcciones) o de desplazamiento lateral (solo izquierda/derecha).
bhv_p_JoystickMovement_joystick = Joystick
bhv_pd_JoystickMovement_joystick = El elemento joystick que controla a este.
bhv_p_JoystickMovement_mode = Modo
bhv_p_JoystickMovement_speed = Velocidad
bhv_p_JoystickMovement_deadZone = Zona muerta
bhv_pd_JoystickMovement_deadZone = Ignora los movimientos diminutos del joystick.
bhv_p_JoystickMovement_rotateToDirection = Girar hacia la dirección
bhv_pd_JoystickMovement_rotateToDirection = Gira el elemento para mirar hacia donde se mueve.
bhv_p_JoystickMovement_faceOffset = Desfase de orientación
bhv_pd_JoystickMovement_faceOffset = Ángulo de la imagen cuando mira a la derecha (0 = derecha, 90 = arriba...).
bhv_n_JumpPad = Plataforma de salto
bhv_d_JumpPad = Lanza lo que lo toque (trampolines, resortes, cañones, plataformas de impulso) en una dirección elegida. Elige a quién afecta con una lista o un filtro de nombre; puede funcionar como un sensor que se atraviesa.
bhv_note_JumpPad = Requiere un elemento físico (normalmente STATIC).
bhv_p_JumpPad_angle = Ángulo
bhv_pd_JumpPad_angle = Dirección de lanzamiento: 90 = arriba, 0 = derecha, 180 = izquierda, 270 = abajo.
bhv_p_JumpPad_power = Potencia
bhv_pd_JumpPad_power = Velocidad de lanzamiento.
bhv_p_JumpPad_additive = Aditivo
bhv_pd_JumpPad_additive = Activado: se suma a la velocidad actual. Desactivado: la reemplaza (el mismo salto cada vez).
bhv_p_JumpPad_onlyFromFront = Solo desde el frente
bhv_pd_JumpPad_onlyFromFront = Solo lanza lo que viene de frente (el lado al que apunta la flecha), no por detrás.
bhv_p_JumpPad_cooldown = Enfriamiento
bhv_pd_JumpPad_cooldown = Tiempo antes de que la plataforma pueda lanzar de nuevo.
bhv_p_JumpPad_targets = Objetivos
bhv_pd_JumpPad_targets = Solo se lanzan estos elementos. Vacío = todo cuerpo en movimiento.
bhv_p_JumpPad_nameFilter = Filtro de nombre
bhv_pd_JumpPad_nameFilter = Solo se lanzan los elementos cuyo nombre contenga este texto (una etiqueta improvisada, p. ej. "Player"). Vacío = cualquiera.
bhv_p_JumpPad_sensor = Sensor
bhv_pd_JumpPad_sensor = Las cosas atraviesan la plataforma y son lanzadas mientras se solapan con ella (sin superficie sólida).
bhv_n_LimitToScreen = Limitar a la pantalla
bhv_d_LimitToScreen = Mantiene el elemento dentro de la pantalla (o de la vista de la cámara, la escena o un rectángulo) con un margen opcional, para que el jugador o una pala nunca puedan salir. Un elemento físico pierde (o rebota con) la velocidad que lo empuja hacia fuera.
bhv_p_LimitToScreen_area = Área
bhv_pd_LimitToScreen_area = VIEW: lo que muestra la cámara ahora (o la pantalla para UI). SCENE: la primera pantalla (de 0,0 al tamaño de la escena). CUSTOM: el rectángulo de abajo.
bhv_p_LimitToScreen_limitX = Limitar x
bhv_pd_LimitToScreen_limitX = Limitar izquierda/derecha.
bhv_p_LimitToScreen_limitY = Limitar y
bhv_pd_LimitToScreen_limitY = Limitar arriba/abajo.
bhv_p_LimitToScreen_margin = Margen
bhv_pd_LimitToScreen_margin = Espacio que se deja libre en los bordes.
bhv_p_LimitToScreen_keepFullyInside = Mantener totalmente dentro
bhv_pd_LimitToScreen_keepFullyInside = Todo el elemento debe permanecer dentro (desactivado: solo su centro).
bhv_p_LimitToScreen_bounciness = Elasticidad
bhv_pd_LimitToScreen_bounciness = Físico: 0 = se detiene en el borde, 1 = rebota con la misma velocidad.
bhv_p_LimitToScreen_customLeft = Izquierda personalizada
bhv_pd_LimitToScreen_customLeft = Área CUSTOM: borde izquierdo.
bhv_p_LimitToScreen_customBottom = Inferior personalizado
bhv_pd_LimitToScreen_customBottom = Área CUSTOM: borde inferior.
bhv_p_LimitToScreen_customRight = Derecha personalizada
bhv_pd_LimitToScreen_customRight = Área CUSTOM: borde derecho.
bhv_p_LimitToScreen_customTop = Superior personalizado
bhv_pd_LimitToScreen_customTop = Área CUSTOM: borde superior.
bhv_n_LookAtTarget = Mirar al objetivo
bhv_d_LookAtTarget = Gira el elemento para mirar a otro elemento o al dedo, con una velocidad de giro: torretas, ojos, flechas, armas que apuntan.
bhv_p_LookAtTarget_source = Origen
bhv_pd_LookAtTarget_source = TARGET: mira al elemento de abajo. FINGER: mira al punto que tocas.
bhv_p_LookAtTarget_target = Objetivo
bhv_pd_LookAtTarget_target = El elemento al que mirar (TARGET).
bhv_p_LookAtTarget_faceOffset = Desfase de orientación
bhv_pd_LookAtTarget_faceOffset = Ángulo de la imagen cuando mira a la derecha (0 = derecha, 90 = arriba...).
bhv_p_LookAtTarget_turnSpeed = Velocidad de giro
bhv_pd_LookAtTarget_turnSpeed = Qué tan rápido gira. 0 = al instante.
bhv_p_LookAtTarget_keepLastTouch = Conservar último toque
bhv_pd_LookAtTarget_keepLastTouch = Solo FINGER: sigue mirando al último toque tras levantar el dedo.
bhv_p_LookAtTarget_tolerance = Tolerancia
bhv_pd_LookAtTarget_tolerance = Cuenta como alineado cuando la diferencia de ángulo es menor que esto (onAligned).
bhv_set_fixedRotation = Rotación fija
bhv_n_MovingPlatform = Plataforma móvil
bhv_d_MovingPlatform = Una plataforma que se desliza entre dos puntos (ascensores, puentes móviles, puertas correderas) y lleva lo que esté sobre ella. Pasa a ser kinemática mientras se ejecuta.
bhv_note_MovingPlatform = Requiere un elemento físico (pasa a ser kinemático mientras el juego se ejecuta).
bhv_p_MovingPlatform_axis = Eje
bhv_pd_MovingPlatform_axis = Modo rango: moverse izquierda/derecha o arriba/abajo desde el inicio.
bhv_g_Route = Ruta
bhv_p_MovingPlatform_distance = Distancia
bhv_pd_MovingPlatform_distance = Modo rango: cuánto se mueve desde el inicio hasta el otro extremo (negativo = izquierda / abajo).
bhv_p_MovingPlatform_pointB = Punto b
bhv_pd_MovingPlatform_pointB = Modo puntos: un elemento que marca el otro extremo. Si se define, reemplaza al rango.
bhv_p_MovingPlatform_pointA = Punto a
bhv_pd_MovingPlatform_pointA = Modo puntos: un elemento que marca el primer extremo. Vacío = la posición inicial de esta plataforma.
bhv_p_MovingPlatform_speed = Velocidad
bhv_pd_MovingPlatform_speed = Velocidad a lo largo de la ruta.
bhv_p_MovingPlatform_pause = Pausa
bhv_pd_MovingPlatform_pause = Cuánto espera en cada extremo.
bhv_p_MovingPlatform_smooth = Suave
bhv_pd_MovingPlatform_smooth = Frena suavemente cerca de los extremos.
bhv_p_MovingPlatform_carryRiders = Llevar pasajeros
bhv_pd_MovingPlatform_carryRiders = Mueve lateralmente lo que está sobre ella (necesario para un jugador que fija su propia velocidad).
bhv_n_Orbit = Orbit
bhv_d_Orbit = Gira alrededor de otro elemento (planetas, escudos, satélites, sierras giratorias) o de un punto, con forma ovalada opcional y espiral hacia dentro/fuera. Los elementos físicos siguen siendo físicos (empujan cosas) e ignoran la gravedad.
bhv_p_Orbit_center = Centro
bhv_pd_Orbit_center = El elemento alrededor del cual girar. Vacío = un punto elegido para que el elemento empiece sobre su propio círculo.
bhv_p_Orbit_radius = Radio
bhv_pd_Orbit_radius = Distancia al centro. 0 = la distancia actual al elemento central (100 cuando no hay elemento central).
bhv_p_Orbit_speed = Velocidad
bhv_pd_Orbit_speed = Grados por segundo.
bhv_p_Orbit_clockwise = Sentido horario
bhv_pd_Orbit_clockwise = Girar en sentido horario (desactivado: antihorario).
bhv_p_Orbit_ovalRatio = Proporción del óvalo
bhv_pd_Orbit_ovalRatio = Alto del óvalo respecto a su ancho (1 = círculo).
bhv_p_Orbit_spiral = Espiral
bhv_pd_Orbit_spiral = El radio crece (positivo) o se reduce (negativo) esta cantidad cada segundo: espirales.
bhv_p_Orbit_minRadius = Radio mínimo
bhv_pd_Orbit_minRadius = Radio más pequeño al espiralar hacia dentro.
bhv_p_Orbit_faceMovement = Orientar al movimiento
bhv_pd_Orbit_faceMovement = Gira el elemento a lo largo de su trayectoria (flechas, aviones).
bhv_p_Orbit_faceOffset = Desfase de orientación
bhv_pd_Orbit_faceOffset = Ángulo de la imagen cuando mira a la derecha (0 = derecha, 90 = arriba...).
bhv_n_PlatformerPlayer = Jugador de plataformas
bhv_d_PlatformerPlayer = Corre y salta con botones en pantalla o el teclado: doble salto, tiempo coyote y búfer de salto. Requiere gravedad en la escena.
bhv_note_PlatformerPlayer = Requiere un elemento físico DYNAMIC y gravedad en la escena.
bhv_p_PlatformerPlayer_leftButton = Botón izquierdo
bhv_pd_PlatformerPlayer_leftButton = Botón (cualquier elemento) que mueve a la izquierda mientras se mantiene pulsado.
bhv_p_PlatformerPlayer_rightButton = Botón derecho
bhv_p_PlatformerPlayer_jumpButton = Botón de salto
bhv_p_PlatformerPlayer_useKeyboard = Usar teclado
bhv_pd_PlatformerPlayer_useKeyboard = Las flechas / A D W / espacio también funcionan (escritorio, pruebas).
bhv_p_PlatformerPlayer_speed = Velocidad
bhv_p_PlatformerPlayer_acceleration = Aceleración
bhv_pd_PlatformerPlayer_acceleration = 0 = instantáneo; si no, qué tan rápido alcanza la velocidad.
bhv_p_PlatformerPlayer_flipToDirection = Voltear según la dirección
bhv_pd_PlatformerPlayer_flipToDirection = Refleja la imagen al caminar a la izquierda.
bhv_p_PlatformerPlayer_jumpSpeed = Velocidad de salto
bhv_g_Jump = Salto
bhv_p_PlatformerPlayer_maxJumps = Saltos máximos
bhv_pd_PlatformerPlayer_maxJumps = 2 = doble salto, 1 = simple.
bhv_p_PlatformerPlayer_coyoteTime = Tiempo coyote
bhv_pd_PlatformerPlayer_coyoteTime = Tiempo tras dejar una plataforma en el que el salto todavía funciona.
bhv_p_PlatformerPlayer_jumpBuffer = Búfer de salto
bhv_pd_PlatformerPlayer_jumpBuffer = Un salto pulsado justo antes de aterrizar se recuerda durante este tiempo.
bhv_n_TapToMove = Tocar para mover
bhv_d_TapToMove = Se mueve adonde tocas: TAP camina hasta el punto tocado (estrategia, point-and-click), HOLD sigue al dedo mientras está pulsando, DRAG_ITEM te deja agarrar el propio elemento y arrastrarlo (piezas de puzle, cartas). Los toques en los botones/joystick de la lista de ignorados no se usan.
bhv_p_TapToMove_mode = Modo
bhv_pd_TapToMove_mode = TAP: ir al punto tocado. HOLD: seguir al dedo mientras está pulsando. DRAG_ITEM: tocar el elemento y arrastrarlo.
bhv_g_Touch = Toque
bhv_p_TapToMove_ignoreTouchesOn = Ignorar toques en
bhv_pd_TapToMove_ignoreTouchesOn = Los toques que empiezan en estos elementos (botones, joystick, paneles) se ignoran.
bhv_p_TapToMove_marker = Marcador
bhv_pd_TapToMove_marker = Elemento opcional mostrado en el punto tocado (modo TAP); se oculta cuando llega el elemento.
bhv_p_TapToMove_speed = Velocidad
bhv_pd_TapToMove_speed = Velocidad al caminar.
bhv_p_TapToMove_stopDistance = Distancia de parada
bhv_pd_TapToMove_stopDistance = Cuenta como llegado cuando está así de cerca.
bhv_p_TapToMove_horizontalOnly = Solo horizontal
bhv_pd_TapToMove_horizontalOnly = Solo izquierda/derecha (los personajes tipo plataformas conservan la gravedad). Desactivado: se mueve en todas las direcciones e ignora la gravedad.
bhv_p_TapToMove_dragStiffness = Rigidez de arrastre
bhv_pd_TapToMove_dragStiffness = DRAG_ITEM: qué tan rígidamente sigue el elemento al dedo (elementos físicos; más alto = más ceñido).
bhv_p_TapToMove_rotateToDirection = Girar hacia la dirección
bhv_pd_TapToMove_rotateToDirection = Gira el elemento hacia donde va.
bhv_p_TapToMove_flipToDirection = Voltear según la dirección
bhv_pd_TapToMove_flipToDirection = Refleja la imagen al ir a la izquierda.
bhv_p_TapToMove_faceOffset = Desfase de orientación
bhv_pd_TapToMove_faceOffset = Ángulo de la imagen cuando mira a la derecha (0 = derecha, 90 = arriba...).
bhv_n_TiltMove = Movimiento por inclinación
bhv_d_TiltMove = Mueve el elemento al inclinar el teléfono (acelerómetro): una bola que rueda, un laberinto de canicas, un atrapador de objetos que caen. Las flechas simulan la inclinación en un ordenador.
bhv_p_TiltMove_mode = Modo
bhv_pd_TiltMove_mode = VELOCITY: la inclinación fija la velocidad. ROLL: la inclinación empuja como la gravedad sobre una bola (sigue rodando).
bhv_g_Tilt = Inclinación
bhv_p_TiltMove_fullTilt = Inclinación máxima
bhv_pd_TiltMove_fullTilt = Inclinación que da la velocidad máxima. 9.8 = el teléfono vertical, unos 4 = una inclinación cómoda.
bhv_p_TiltMove_deadZone = Zona muerta
bhv_pd_TiltMove_deadZone = Las inclinaciones menores que esto se ignoran.
bhv_p_TiltMove_smoothing = Suavizado
bhv_pd_TiltMove_smoothing = Suaviza el sensor tembloroso. Más alto = más suave pero reacciona más lento.
bhv_p_TiltMove_orientation = Orientación
bhv_pd_TiltMove_orientation = AUTO sigue la rotación de la pantalla. Ajústalo a mano si las direcciones son incorrectas en tu teléfono.
bhv_p_TiltMove_useKeyboard = Usar teclado
bhv_pd_TiltMove_useKeyboard = Las flechas / WASD simulan la inclinación (escritorio, pruebas).
bhv_p_TiltMove_horizontal = Horizontal
bhv_pd_TiltMove_horizontal = Mover izquierda/derecha.
bhv_p_TiltMove_vertical = Vertical
bhv_pd_TiltMove_vertical = Mover arriba/abajo (desactiva la gravedad de este elemento mientras se ejecuta).
bhv_p_TiltMove_invertX = Invertir x
bhv_pd_TiltMove_invertX = Intercambia izquierda y derecha.
bhv_p_TiltMove_invertY = Invertir y
bhv_pd_TiltMove_invertY = Intercambia arriba y abajo.
bhv_p_TiltMove_speed = Velocidad
bhv_pd_TiltMove_speed = Velocidad máxima.
bhv_p_TiltMove_acceleration = Aceleración
bhv_pd_TiltMove_acceleration = Solo ROLL: aceleración a inclinación máxima.
bhv_p_TiltMove_damping = Amortiguación
bhv_pd_TiltMove_damping = Solo ROLL: frena la bola (0 = nunca).
bhv_n_TopDownPlayer = Jugador cenital
bhv_d_TopDownPlayer = Mueve el elemento en todas las direcciones (RPG, shooter, laberinto): joystick, 4 botones o el teclado, con aceleración, fricción, ajuste a 4/8 direcciones y giro opcional hacia el movimiento. Usa gravedad 0 en la escena.
bhv_p_TopDownPlayer_joystick = Joystick
bhv_pd_TopDownPlayer_joystick = Elemento joystick que controla a este (opcional).
bhv_p_TopDownPlayer_upButton = Botón arriba
bhv_pd_TopDownPlayer_upButton = Botón (cualquier elemento) que mueve hacia arriba mientras se mantiene pulsado.
bhv_p_TopDownPlayer_downButton = Botón abajo
bhv_pd_TopDownPlayer_downButton = Botón (cualquier elemento) que mueve hacia abajo mientras se mantiene pulsado.
bhv_p_TopDownPlayer_leftButton = Botón izquierdo
bhv_pd_TopDownPlayer_leftButton = Botón (cualquier elemento) que mueve a la izquierda mientras se mantiene pulsado.
bhv_p_TopDownPlayer_rightButton = Botón derecho
bhv_pd_TopDownPlayer_rightButton = Botón (cualquier elemento) que mueve a la derecha mientras se mantiene pulsado.
bhv_p_TopDownPlayer_useKeyboard = Usar teclado
bhv_pd_TopDownPlayer_useKeyboard = Las flechas / WASD también mueven el elemento (escritorio, pruebas).
bhv_p_TopDownPlayer_deadZone = Zona muerta
bhv_pd_TopDownPlayer_deadZone = Los empujes del joystick menores que esto se ignoran.
bhv_p_TopDownPlayer_directions = Direcciones
bhv_pd_TopDownPlayer_directions = ANY = direcciones suaves del joystick, EIGHT = se ajusta a 8 direcciones, FOUR = solo arriba/abajo/izquierda/derecha.
bhv_p_TopDownPlayer_speed = Velocidad
bhv_pd_TopDownPlayer_speed = Velocidad máxima.
bhv_p_TopDownPlayer_acceleration = Aceleración
bhv_pd_TopDownPlayer_acceleration = Qué tan rápido alcanza la velocidad máxima. 0 = al instante.
bhv_p_TopDownPlayer_friction = Fricción
bhv_pd_TopDownPlayer_friction = Qué tan rápido se detiene cuando no se pulsa nada. 0 = al instante.
bhv_p_TopDownPlayer_rotateToDirection = Girar hacia la dirección
bhv_pd_TopDownPlayer_rotateToDirection = Gira el elemento hacia donde se mueve.
bhv_g_Facing = Orientación
bhv_p_TopDownPlayer_faceOffset = Desfase de orientación
bhv_pd_TopDownPlayer_faceOffset = Ángulo de la imagen cuando mira a la derecha (0 = derecha, 90 = arriba...).
bhv_p_TopDownPlayer_turnSpeed = Velocidad de giro
bhv_pd_TopDownPlayer_turnSpeed = Qué tan rápido gira. 0 = al instante.
bhv_p_TopDownPlayer_flipToDirection = Voltear según la dirección
bhv_pd_TopDownPlayer_flipToDirection = Refleja la imagen al moverse a la izquierda (para vistas laterales).
bhv_n_WrapScreen = Dar la vuelta a la pantalla
bhv_d_WrapScreen = Cuando el elemento sale por un lado de la pantalla vuelve a entrar por el lado opuesto (Asteroids, túneles de Pac-Man, juegos de carrera infinita). Se mantiene la velocidad.
bhv_p_WrapScreen_area = Área
bhv_pd_WrapScreen_area = VIEW: lo que muestra la cámara ahora (o la pantalla para UI). SCENE: la primera pantalla (de 0,0 al tamaño de la escena). CUSTOM: el rectángulo de abajo.
bhv_p_WrapScreen_wrapX = Envolver x
bhv_pd_WrapScreen_wrapX = Envolver en los bordes izquierdo/derecho.
bhv_p_WrapScreen_wrapY = Envolver y
bhv_pd_WrapScreen_wrapY = Envolver en los bordes superior/inferior.
bhv_p_WrapScreen_margin = Margen
bhv_pd_WrapScreen_margin = Espacio extra fuera del área antes de envolver.
bhv_p_WrapScreen_customLeft = Izquierda personalizada
bhv_pd_WrapScreen_customLeft = Área CUSTOM: borde izquierdo.
bhv_p_WrapScreen_customBottom = Inferior personalizado
bhv_pd_WrapScreen_customBottom = Área CUSTOM: borde inferior.
bhv_p_WrapScreen_customRight = Derecha personalizada
bhv_pd_WrapScreen_customRight = Área CUSTOM: borde derecho.
bhv_p_WrapScreen_customTop = Superior personalizado
bhv_pd_WrapScreen_customTop = Área CUSTOM: borde superior.
bhv_n_CountUp = Contar hacia arriba
bhv_d_CountUp = Un elemento de Texto cuenta de un número a otro, como una puntuación. Prefijo, sufijo y separador de miles opcionales.
bhv_g_Text = Texto
bhv_p_CountUp_from = Desde
bhv_pd_CountUp_from = Número desde el que empieza.
bhv_p_CountUp_to = Hasta
bhv_pd_CountUp_to = Número hasta el que cuenta.
bhv_p_CountUp_duration = Duración
bhv_pd_CountUp_duration = Cuánto dura el conteo.
bhv_p_CountUp_delay = Retraso
bhv_pd_CountUp_delay = Espera este tiempo antes de contar.
bhv_p_CountUp_decimals = Decimales
bhv_pd_CountUp_decimals = Dígitos tras el punto.
bhv_p_CountUp_prefix = Prefijo
bhv_pd_CountUp_prefix = Texto antes del número, p. ej. $ o Puntos:
bhv_p_CountUp_suffix = Sufijo
bhv_pd_CountUp_suffix = Texto después del número, p. ej. % o pts
bhv_p_CountUp_thousandsSeparator = Separador de miles
bhv_pd_CountUp_thousandsSeparator = Escribe 1,234,567 en lugar de 1234567.
bhv_p_CountUp_ease = Suavizado
bhv_pd_CountUp_ease = Cómo cambia la velocidad durante el conteo.
bhv_p_CountUp_autoPlay = Reproducción automática
bhv_pd_CountUp_autoPlay = Empieza a contar en cuanto empieza la escena. Si no, usa el bloque de contar hasta.
bhv_n_Typewriter = Máquina de escribir
bhv_d_Typewriter = Un elemento de Texto escribe su texto letra por letra, como un cuadro de diálogo. Toca para mostrarlo todo de golpe.
bhv_p_Typewriter_speed = Velocidad
bhv_pd_Typewriter_speed = Letras por segundo.
bhv_p_Typewriter_startDelay = Retraso de inicio
bhv_pd_Typewriter_startDelay = Espera este tiempo antes de empezar a escribir.
bhv_p_Typewriter_punctuationPause = Pausa en la puntuación
bhv_pd_Typewriter_punctuationPause = Pausa extra tras . , ! ? para que las frases respiren (0 = ninguna).
bhv_p_Typewriter_customText = Texto personalizado
bhv_pd_Typewriter_customText = Escribe otro texto en lugar del escrito en el elemento (vacío = usar el texto del elemento).
bhv_p_Typewriter_tapToSkip = Tocar para saltar
bhv_pd_Typewriter_tapToSkip = Tocar el texto lo muestra todo de golpe.
bhv_p_Typewriter_autoPlay = Reproducción automática
bhv_pd_Typewriter_autoPlay = Empieza en cuanto empieza la escena. Si no, usa el bloque de escribir texto.
bhv_p_Typewriter_tickSound = Sonido de tecleo
bhv_pd_Typewriter_tickSound = Sonido diminuto para las letras (opcional).
bhv_p_Typewriter_tickEvery = Sonar cada
bhv_pd_Typewriter_tickEvery = Reproduce el sonido de tecleo cada tantas letras.
bhv_n_Blink = Parpadeo
bhv_d_Blink = El elemento parpadea (o se desvanece y reaparece). Útil para textos de "Toca para empezar", avisos e invencibilidad.
bhv_g_UI_effects = Efectos de UI
bhv_p_Blink_onTime = Tiempo visible
bhv_pd_Blink_onTime = Cuánto permanece visible cada vez.
bhv_p_Blink_offTime = Tiempo oculto
bhv_pd_Blink_offTime = Cuánto permanece oculto cada vez.
bhv_p_Blink_offOpacity = Opacidad apagado
bhv_pd_Blink_offOpacity = Opacidad mientras está "apagado" (0 = invisible).
bhv_p_Blink_smooth = Suave
bhv_pd_Blink_smooth = Se desvanece suavemente en lugar de cambiar de golpe.
bhv_p_Blink_count = Cantidad
bhv_pd_Blink_count = Número de parpadeos; después se queda visible. 0 = para siempre.
bhv_p_Blink_autoPlay = Reproducción automática
bhv_pd_Blink_autoPlay = Empieza a parpadear en cuanto empieza la escena.
bhv_n_FadeIn = Aparecer gradualmente
bhv_d_FadeIn = El elemento aparece suavemente: de invisible (y opcionalmente más pequeño) a su aspecto normal. Útil para menús y títulos.
bhv_p_FadeIn_duration = Duración
bhv_pd_FadeIn_duration = Cuánto dura el fundido.
bhv_p_FadeIn_delay = Retraso
bhv_pd_FadeIn_delay = Espera este tiempo antes de empezar.
bhv_p_FadeIn_fromOpacity = Opacidad inicial
bhv_pd_FadeIn_fromOpacity = Opacidad al inicio (0 = invisible).
bhv_p_FadeIn_fromScale = Escala inicial
bhv_pd_FadeIn_fromScale = Tamaño al inicio, 1 = tamaño normal. Usa 0.5 para que aparezca con efecto "pop".
bhv_p_FadeIn_ease = Suavizado
bhv_pd_FadeIn_ease = Cómo cambia la velocidad durante el fundido.
bhv_p_FadeIn_autoPlay = Reproducción automática
bhv_pd_FadeIn_autoPlay = Empieza en cuanto empieza la escena. Si no, el elemento se muestra normalmente hasta que se ejecuta el bloque de reproducir.
bhv_n_FadeOut = Desvanecer
bhv_d_FadeOut = El elemento se desvanece suavemente y luego puede ocultarse o eliminarse. Útil para mensajes, objetos recogibles y cierre de menús.
bhv_p_FadeOut_trigger = Activador
bhv_pd_FadeOut_trigger = Cuándo empieza el fundido. MANUAL = solo cuando se ejecuta el bloque de reproducir.
bhv_p_FadeOut_duration = Duración
bhv_pd_FadeOut_duration = Cuánto dura el fundido.
bhv_p_FadeOut_delay = Retraso
bhv_pd_FadeOut_delay = Espera este tiempo antes de empezar (un mensaje que desaparece solo).
bhv_p_FadeOut_toOpacity = Opacidad final
bhv_pd_FadeOut_toOpacity = Opacidad al final (0 = invisible).
bhv_p_FadeOut_toScale = Escala final
bhv_pd_FadeOut_toScale = Tamaño al final, 1 = tamaño normal. Usa 0 para encogerse hasta desaparecer.
bhv_p_FadeOut_ease = Suavizado
bhv_pd_FadeOut_ease = Cómo cambia la velocidad durante el fundido.
bhv_p_FadeOut_then = Después
bhv_pd_FadeOut_then = Qué ocurre al final: STAY = se queda ahí (desvanecido), HIDE = oculto (y su física desactivada), DESTROY = eliminado.
bhv_n_Parallax = Paralaje
bhv_d_Parallax = Una capa de fondo que se mueve más lento que el mundo cuando la cámara se mueve, para dar profundidad. Funciona con fondos de pantalla (UI) y elementos del mundo.
bhv_p_Parallax_factorX = Factor x
bhv_pd_Parallax_factorX = Velocidad lateral respecto al mundo: 0 = se mueve con el mundo (sin efecto), 0.5 = media velocidad (lejos), 1 = queda quieto en la pantalla (muy lejos).
bhv_p_Parallax_factorY = Factor y
bhv_pd_Parallax_factorY = Lo mismo, para arriba y abajo. Solo se usa cuando "Afectar vertical" está activado.
bhv_p_Parallax_affectVertical = Afectar vertical
bhv_pd_Parallax_affectVertical = También reacciona cuando la cámara se mueve arriba y abajo.
bhv_p_Parallax_loopWidth = Ancho de bucle
bhv_pd_Parallax_loopWidth = Repite el movimiento cada tantos píxeles en horizontal, para que una fila de mosaicos idénticos se desplace sin fin (0 = sin repetición).
bhv_p_Parallax_loopHeight = Alto de bucle
bhv_pd_Parallax_loopHeight = Lo mismo, para arriba y abajo (0 = sin repetición).
bhv_n_Pulse = Pulso
bhv_d_Pulse = El elemento crece y se encoge una y otra vez, como un corazón latiendo. Útil para botones de "Jugar" y objetos recogibles.
bhv_p_Pulse_minScale = Escala mínima
bhv_pd_Pulse_minScale = Tamaño más pequeño, 1 = tamaño normal.
bhv_p_Pulse_maxScale = Escala máxima
bhv_pd_Pulse_maxScale = Tamaño más grande, 1 = tamaño normal.
bhv_p_Pulse_speed = Velocidad
bhv_pd_Pulse_speed = Latidos por segundo.
bhv_p_Pulse_lowOpacity = Opacidad baja
bhv_pd_Pulse_lowOpacity = Opacidad en el tamaño más pequeño (1 = sin desvanecer).
bhv_p_Pulse_autoPlay = Reproducción automática
bhv_pd_Pulse_autoPlay = Empieza a pulsar en cuanto empieza la escena. Si no, usa los bloques de iniciar / pulsar una vez.
bhv_p_Pulse_pulseWhileTouched = Pulsar al tocar
bhv_pd_Pulse_pulseWhileTouched = Sigue pulsando mientras se toca el elemento.
bhv_n_ScaleTouchEffect = Efecto de escala al tocar
bhv_d_ScaleTouchEffect = El elemento se encoge (o crece) mientras se toca y vuelve a su tamaño al soltarlo.
bhv_p_ScaleTouchEffect_pressedScale = Escala al pulsar
bhv_pd_ScaleTouchEffect_pressedScale = Escala al tocar, 1 = tamaño normal.
bhv_p_ScaleTouchEffect_speed = Velocidad
bhv_pd_ScaleTouchEffect_speed = Qué tan rápido pasa al nuevo tamaño.
bhv_p_ScaleTouchEffect_pressedAlpha = Opacidad al pulsar
bhv_pd_ScaleTouchEffect_pressedAlpha = También se atenúa un poco al tocarlo (1 = sin atenuar).
bhv_n_Shake = Temblor
bhv_d_Shake = El elemento tiembla un momento: al empezar la escena, al tocarlo o desde un bloque. Útil para respuestas incorrectas, golpes y botones.
bhv_p_Shake_trigger = Activador
bhv_pd_Shake_trigger = Cuándo tiembla. MANUAL = solo cuando se ejecuta el bloque de temblar.
bhv_p_Shake_axis = Eje
bhv_pd_Shake_axis = En qué dirección se mueve.
bhv_p_Shake_intensity = Intensidad
bhv_pd_Shake_intensity = Cuánto se aleja de su lugar.
bhv_p_Shake_duration = Duración
bhv_pd_Shake_duration = Cuánto dura un temblor.
bhv_p_Shake_frequency = Frecuencia
bhv_pd_Shake_frequency = Cambios de dirección por segundo: más alto = nervioso, más bajo = balanceo.
bhv_p_Shake_rotation = Rotación
bhv_pd_Shake_rotation = También gira un poco de un lado a otro (0 = sin giro).
bhv_p_Shake_decay = Atenuación
bhv_pd_Shake_decay = El temblor se debilita hasta detenerse.
bhv_p_Shake_loop = Bucle
bhv_pd_Shake_loop = Sigue temblando hasta que se ejecuta el bloque de detener (se ignora la duración).
bhv_n_SlideIn = Deslizar hacia dentro
bhv_d_SlideIn = El elemento se desliza a su lugar desde un lado, con rebote o suavizado si quieres. Un bloque lo desliza de vuelta hacia fuera. Útil para menús y paneles.
bhv_p_SlideIn_from = Desde
bhv_pd_SlideIn_from = El lado del que viene.
bhv_p_SlideIn_distance = Distancia
bhv_pd_SlideIn_distance = A qué distancia empieza.
bhv_p_SlideIn_duration = Duración
bhv_pd_SlideIn_duration = Cuánto dura el deslizamiento.
bhv_p_SlideIn_delay = Retraso
bhv_pd_SlideIn_delay = Espera este tiempo antes de empezar (usa valores distintos para deslizar una lista uno a uno).
bhv_p_SlideIn_ease = Suavizado
bhv_pd_SlideIn_ease = Cómo cambia la velocidad durante el deslizamiento.
bhv_p_SlideIn_fade = Fundido
bhv_pd_SlideIn_fade = También aparece gradualmente mientras se desliza.
bhv_p_SlideIn_autoPlay = Reproducción automática
bhv_pd_SlideIn_autoPlay = Empieza en cuanto empieza la escena. Si no, el elemento permanece en su sitio hasta que se ejecuta el bloque de reproducir.
bhv_n_TintCycle = Ciclo de tinte
bhv_d_TintCycle = El color del elemento cambia lentamente: de ida y vuelta entre dos colores, o por todo el arcoíris. Útil para títulos, potenciadores y señales de peligro.
bhv_p_TintCycle_mode = Modo
bhv_pd_TintCycle_mode = BETWEEN = se funde entre los dos colores, RAINBOW = recorre todos los colores.
bhv_p_TintCycle_colorA = Color a
