# --- Animation editor, number pad, help, tips ---
anim_help=Toca las imágenes de la lista para añadirlas como fotogramas. Arrastra un fotograma para cambiar el orden, ✕ lo quita, toca un fotograma para verlo. "Duración del fotograma" define cuánto tiempo se muestra cada fotograma (milisegundos). Usa la animación en los bloques con setAnimation y su nombre.
anim_empty=Aún no hay fotogramas.\nToca las imágenes de abajo para añadirlas.
anim_prev=Fotograma anterior
anim_next=Fotograma siguiente
anim_frame_time=Duración del fotograma (ms)
anim_add_frames=Imágenes: toca para añadir un fotograma
anim_add_all=Añadir todas
anim_save_q=¿Guardar esta animación antes de cerrar?
ui_clear=Borrar
tut_params_intro=El bloque amarillo muestra el evento (%1$s) y sus entradas. "%2$s" es este elemento: mantenlo pulsado y arrástralo a cualquier campo para usarlo.
tut_numpad_intro=Los campos numéricos abren un teclado numérico: toca los dígitos, ⌫ borra el último, C lo borra todo, y luego OK.
tut_drag_body2=El bloque amarillo muestra las entradas de este evento. Mantén pulsado %1$s (el cuerpo que chocó con la roca) y arrástralo al primer círculo.
tut_drag_body2_coin=Mantén pulsado %1$s en el bloque amarillo (el cuerpo que tocó la moneda) y arrástralo al primer círculo.
blk_browse=Explorar
blk_p_current=el elemento al que pertenece este evento
blk_p_body2=el otro cuerpo de la colisión
blk_p_body1=el primer cuerpo de la colisión
blk_p_event=el evento táctil (posición, puntero…)
blk_p_drag=Mantenlo pulsado y arrastra una copia a cualquier campo.
ui_light_blur=Bordes de luz suaves (difuminados)
ui_light_shadows=Los cuerpos proyectan sombras
ui_light_culling=Omitir luces fuera de la pantalla (más rápido)
ui_light_diffuse=Luz difusa (más suave, menos contraste)
ui_light_gamma=Corrección gamma
ui_add_desc_boxBody=Un rectángulo con física. Jugadores, paredes, plataformas.
ui_add_desc_circleBody=Un cuerpo redondo: pelotas, ruedas, monedas.
ui_add_desc_textItem=Muestra texto: puntuación, títulos, mensajes.
ui_add_desc_joystickItem=Joystick en pantalla para controlar al jugador.
ui_add_desc_progressBar=Barras de vida, barras de carga, temporizadores.
ui_add_desc_customBody=Cuerpo con una forma de colisión personalizada (polígono).
ui_add_desc_particleEffect=Efectos de fuego, humo, chispas, lluvia.
ui_add_desc_camera=Controla qué parte del mundo se ve.
ui_add_desc_tiledMap=Carga un nivel hecho con Tiled (.tmx).
ui_add_desc_pointLight=Luz que brilla en todas las direcciones.
ui_add_desc_directionalLight=Luz como la del sol, desde una dirección.
ui_add_desc_coneLight=Cono de linterna / foco.
ui_ev_desc_OnCreate = Se ejecuta una vez al iniciar la escena.
ui_ev_desc_OnStep = Se ejecuta en cada cuadro (unas 60 veces por segundo).
ui_ev_desc_OnPause = Cuando el juego se pausa o la app pasa a segundo plano.
ui_ev_desc_OnResume = Cuando el juego vuelve.
ui_ev_desc_onCollisionStart = Cuando dos cuerpos empiezan a tocarse (body1, body2).
ui_ev_desc_onCollisionEnd = Cuando dos cuerpos dejan de tocarse.
ui_ev_desc_onClick = Cuando se toca este elemento.
ui_ev_desc_OnBodyCreated = Cuando se crea este elemento.
ui_ev_desc_OnBodyUpdate = En cada cuadro, para este elemento.
ui_ev_desc_onTouchStart = Cuando un dedo empieza a tocarlo.
ui_ev_desc_onTouchEnd = Cuando se levanta el dedo.
ui_ev_desc_onBodyCollided = Cuando choca con otro cuerpo (body2).
ui_ev_desc_onBodyCollideEnd = Cuando deja de tocar otro cuerpo.
ui_tip_name=Nombre único del elemento. Se usa en los bloques y el código para encontrarlo.
ui_tip_type=DYNAMIC: se mueve y cae con la gravedad (jugadores, pelotas).\nSTATIC: nunca se mueve (suelo, paredes).\nKINAMATIC: solo se mueve por código, la gravedad no le afecta (plataformas móviles).\nUI: se queda fijo en la pantalla (botones, puntuación).
ui_tip_lock=Los elementos bloqueados no se pueden mover tocándolos en el editor.
ui_tip_Script=Qué script de cuerpo (código) controla este elemento.
ui_tip_parent=Une este elemento a otro; sigue a su padre.
ui_tip_x=Posición horizontal en el mundo.
ui_tip_y=Posición vertical en el mundo.
ui_tip_z=Orden de dibujo: los valores más altos se dibujan encima.
ui_tip_rotation=Ángulo en grados.
ui_tip_width=Ancho del elemento.
ui_tip_height=Alto del elemento.
ui_tip_radius=Radio del círculo.
ui_tip_density=Cuánto pesa el cuerpo. Más alto = más pesado.
ui_tip_friction=Cuánto se desliza. 0 = hielo, 1 = goma.
ui_tip_restitution=Rebote. 0 = sin rebote, 1 = rebote completo.
ui_tip_Gravity_Scale=Multiplicador de la gravedad en este cuerpo. 0 = flota.
ui_tip_Fixed_Rotation=Impide que el cuerpo gire (ideal para jugadores).
ui_tip_Bullet=Mejor colisión para objetos muy rápidos.
ui_tip_isSensor=Detecta colisiones pero no bloquea (activadores, monedas).
ui_tip_Active=Los cuerpos inactivos no participan en la física.
ui_tip_Visible=Mostrar u ocultar el elemento.
ui_tip_image=Imagen que se muestra para este elemento (de la carpeta images).
ui_tip_Tint=Color multiplicado sobre la imagen.
ui_tip_Collision=Elementos con los que este NO debe chocar.
ui_tip_Points=Puntos del polígono de colisión personalizado.
ui_tip_Text=Texto que se muestra.
ui_tip_Font_Scale=Tamaño del texto.
ui_tip_tileX=Repetir la imagen en horizontal.
ui_tip_tileY=Repetir la imagen en vertical.
ui_tip_Zoom=Zoom de la cámara. Más pequeño = más cerca.
ui_tip_Duration=Duración del efecto en segundos.
ui_tip_Distance=Hasta dónde llega la luz.
ui_tip_rays=Calidad de la luz (más rayos = más suave, más lento).
ui_tip_Static_Light=Las luces estáticas consumen menos (no se mueven).
ui_tip_attach_To=Une la luz a un elemento para que lo siga.
help_add_t=➕ Añadir elementos
help_add_d=Toca el botón azul + y elige un tipo (caja, círculo, texto, joystick...).
help_tools_t=✋ Herramientas
help_tools_d=Mano = seleccionar y mover la cámara; luego mover, redimensionar y rotar. El botón XY limita el arrastre a un eje.
help_props_t=⚙ Propiedades
help_props_d=Abre Propiedades desde la barra lateral para cambiar el nombre, la imagen, el tipo (estático/dinámico), la física y más. Los campos numéricos abren un teclado numérico.
help_events_t=⚡ Eventos
help_events_d=Selecciona un elemento, abre Eventos (p. ej. onClick) y arrastra bloques dentro para crear la lógica sin código.
help_blocks_t=🧩 Bloques
help_blocks_d=Mantén pulsado un bloque en la paleta y arrástralo debajo de otro (o simplemente tócalo). Toca un campo para escribir un valor o poner un bloque de valor en él; los bloques de valor pueden ir unos dentro de otros. Mantén pulsado un bloque para ver sus opciones, (!) lo explica.
help_params_t=🔹 Parámetros del evento
help_params_d=El primer bloque de un evento muestra sus parámetros: current (este elemento), body2 (con qué chocó), event (el toque). Mantén pulsado uno y arrastra una copia a cualquier campo.
help_numbers_t=🔢 Números y archivos
help_numbers_d=Los campos numéricos abren un teclado (⌫ borra, C lo borra todo). Los campos de imágenes, sonidos, animaciones y escenas tienen un botón Explorar que abre la carpeta correcta.
help_anims_t=🎞 Animaciones
help_anims_d=En Archivos, abre (o crea) una animación en la carpeta anims: toca imágenes para añadir fotogramas, arrastra fotogramas para reordenarlos, ajusta la duración del fotograma y pulsa reproducir. Úsala con el bloque setAnimation.
help_joints_t=🔗 Joints (articulaciones)
help_joints_d=Los joints (articulaciones) conectan dos cuerpos físicamente: ruedas, puertas, cuerdas...
help_vars_t=𝑥 Variables
help_vars_d=Crea variables como score o lives y úsalas en los bloques.
help_assets_t=🖼 Colecciones
help_assets_d=Imágenes gratuitas (CC0) que puedes añadir a tu proyecto desde Archivos → Colecciones.
help_play_t=▶ Jugar
help_play_d=El botón verde Jugar compila y ejecuta tu juego. Pulsa Atrás para detenerlo. Si falla, toca “Pedir a la IA que lo arregle”.
help_lessons_t=🎓 Lecciones
help_lessons_d=En la pantalla de inicio, la pestaña Aprender tiene lecciones paso a paso que crean juegos reales contigo.
help_ai_t=✨ Asistente de IA
help_ai_d=Describe lo que quieres, p. ej. “haz que el jugador salte cuando toque la pantalla”, y escribe el código o explica los pasos.

