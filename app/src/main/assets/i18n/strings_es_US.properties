bhv_pd_Projectile3D_impactSound = Sonido en el punto de impacto.
bhv_n_Respawn3D = Reaparición 3D
bhv_d_Respawn3D = Devuelve al jugador (o un coche, una pelota) al inicio o al último punto de control cuando cae del mundo o muere (Salud 3D): detenido, de pie y mirando hacia la dirección guardada. Los puntos de control se guardan con bloques o eventos de Zona 3D.
