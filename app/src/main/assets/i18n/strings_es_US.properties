bhv_pd_SmartChase_sightRange = Empieza a perseguir cuando el objetivo está más cerca que esto (0 = siempre persigue).
bhv_p_SmartChase_giveUpRange = Distancia de abandono
bhv_pd_SmartChase_giveUpRange = Se rinde cuando el objetivo está más lejos que esto (0 = nunca se rinde).
bhv_p_SmartChase_flee = Huir
bhv_pd_SmartChase_flee = Huye del objetivo en vez de perseguirlo.
bhv_p_SmartChase_fleeDistance = Distancia de huida
bhv_pd_SmartChase_fleeDistance = Al huir: cuánto intenta alejarse del objetivo.
bhv_p_SmartChase_speed = Velocidad
bhv_pd_SmartChase_speed = Velocidad de carrera.
bhv_p_SmartChase_stopDistance = Distancia de parada
bhv_pd_SmartChase_stopDistance = Se detiene a esta distancia del objetivo y lanza onReachTarget (0 = justo al lado).
bhv_p_SmartChase_repathTime = Tiempo de recálculo
bhv_pd_SmartChase_repathTime = Busca un nuevo camino como mucho con esta frecuencia mientras el objetivo se mueve.
bhv_p_SmartChase_facing = Orientación
bhv_pd_SmartChase_facing = MIRROR: voltea la imagen hacia el movimiento (vistas laterales). TURN: gira el elemento hacia él (vista desde arriba).
bhv_p_SmartChase_artFacesLeft = Arte mirando a la izquierda
