net_card_help = Un elemento en red es el mismo en todos los teléfonos de la partida.\n\nDueño: el teléfono que lo mueve (su joystick, su física). Anfitrión = jugador 1; Jugador 2 = el primero que se une, y así sucesivamente. Los otros teléfonos lo muestran con suavidad y el anfitrión lo corrige.\n\nLa plantilla de jugador del elemento Red se copia sola para cada jugador (no actives esto para ella).\n\nVariables sincronizadas: variables del elemento marcadas "Sincronizado por la red".
