bhv_d_Checkpoint = Una bandera que recuerda adónde volver: cuando el jugador la toca, el comportamiento Respawn lo devuelve allí tras morir o caer. Funciona entre reinicios de escena (y, si quieres, entre ejecuciones de la app).
