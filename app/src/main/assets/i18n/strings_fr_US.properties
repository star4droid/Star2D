bhv_pd_PlatformMover3D_carryRiders = Transporte les éléments posés dessus.
bhv_n_Projectile3D = Projectile 3D
bhv_d_Projectile3D = Une balle, une flèche, une boule de feu ou une balle lancée : vole vers l'avant (son -Z) avec gravité facultative, ne traverse jamais les murs fins, blesse ce qu'il touche (Santé 3D), montre un effet d'impact et disparaît. Mettez-le sur le modèle que copie Tireur 3D ou Générateur 3D.
bhv_e_Projectile3D_onHit = À l'impact
bhv_e_Projectile3D_onExpire = À l'expiration
bhv_p_Projectile3D_speed = Vitesse
bhv_pd_Projectile3D_speed = Vitesse vers l'avant au départ (Tireur 3D fixe la sienne).
bhv_p_Projectile3D_gravity = Gravité
