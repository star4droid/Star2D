bhv_p_Respawn_livesVariable = Variable des vies
bhv_pd_Respawn_livesVariable = Variable de scène (int) qui affiche toujours les vies restantes, ex. lives. Vide = aucune.
bhv_p_Respawn_gameOverScene = Scène de game over
bhv_pd_Respawn_gameOverScene = Scène à ouvrir quand il n’y a plus de vies (game over). Vide = ne rien faire, seul l’événement se déclenche.
bhv_n_ButtonSound = Button sound
bhv_d_ButtonSound = Joue un son quand l’élément est touché, relâché ou cliqué. Ajoutez-le à chaque bouton de votre menu.
bhv_g_Input = Entrée
bhv_p_ButtonSound_sound = Son
bhv_pd_ButtonSound_sound = Son joué au début du toucher / au clic (un fichier des sons du projet).
bhv_p_ButtonSound_releaseSound = Son de relâchement
bhv_pd_ButtonSound_releaseSound = Son joué quand le doigt se relève (facultatif).
bhv_p_ButtonSound_when = Quand
bhv_pd_ButtonSound_when = TOUCH_START = dès l’appui, CLICK = seulement quand il est appuyé puis relâché dessus.
bhv_p_ButtonSound_cooldown = Temps de récupération
bhv_pd_ButtonSound_cooldown = Ignore les touchers arrivant plus tôt que ce délai après le dernier son.
bhv_n_Draggable = Draggable
bhv_d_Draggable = Le joueur peut faire glisser l’élément avec un doigt. Gardez-le dans une zone, aimantez-le à une grille, renvoyez-le à son point de départ ou déposez-le sur des cibles (puzzles, inventaires, curseurs).
bhv_p_Draggable_lockX = Verrouiller x
bhv_pd_Draggable_lockX = Ne pas bouger sur les côtés.
bhv_p_Draggable_lockY = Verrouiller y
bhv_pd_Draggable_lockY = Ne pas bouger de haut en bas.
bhv_p_Draggable_area = Zone
bhv_pd_Draggable_area = Garde l’élément à l’intérieur de la boîte de cet autre élément (facultatif).
bhv_p_Draggable_gridSize = Taille de grille
bhv_pd_Draggable_gridSize = Au relâchement, s’aimante à une grille de cette taille (0 = pas de grille).
bhv_p_Draggable_snapBack = Retour
bhv_pd_Draggable_snapBack = Retourne à sa place de départ au relâchement.
bhv_p_Draggable_snapBackTime = Durée du retour
bhv_pd_Draggable_snapBackTime = Durée du trajet de retour (0 = immédiat).
bhv_p_Draggable_dropTargets = Cibles de dépôt
bhv_pd_Draggable_dropTargets = Éléments sur lesquels il peut être déposé (facultatif). onDropOn s’exécute quand il est relâché au-dessus de l’un d’eux.
bhv_p_Draggable_snapToTarget = Aimanter à la cible
bhv_pd_Draggable_snapToTarget = Se déplace au centre de la cible sur laquelle il a été déposé.
bhv_p_Draggable_dragScale = Échelle de glissement
bhv_pd_Draggable_dragScale = Taille pendant le glissement (1 = normal), pour qu’il paraisse soulevé.
bhv_p_Draggable_bringToFront = Mettre au premier plan
bhv_pd_Draggable_bringToFront = Met l’élément devant les autres pendant le glissement.
bhv_p_Draggable_freezePhysics = Geler la physique
bhv_pd_Draggable_freezePhysics = Un élément physique cesse de bouger tout seul tant qu’il est tenu.
bhv_n_LongPress = Long press
bhv_d_LongPress = Distingue un toucher rapide d’un maintien sur l’élément. Boutons à maintenir pour confirmer, menus cachés, charge.
bhv_p_LongPress_holdTime = Durée de maintien
bhv_pd_LongPress_holdTime = Durée pendant laquelle le doigt doit rester appuyé.
bhv_p_LongPress_moveTolerance = Tolérance de mouvement
bhv_pd_LongPress_moveTolerance = Si le doigt bouge plus loin que cela (pixels d’écran), ce n’est plus un appui.
bhv_p_LongPress_repeat = Répéter
bhv_pd_LongPress_repeat = Continue de déclencher onLongPress à chaque durée de maintien tant que le doigt reste appuyé.
bhv_p_LongPress_holdBar = Barre de maintien
bhv_pd_LongPress_holdBar = Un élément Progress qui se remplit pendant le maintien (facultatif) : maintenir pour confirmer.
bhv_n_OpenSceneOnClick = Open scene on click
bhv_d_OpenSceneOnClick = Toucher l’élément ouvre une autre scène, après une attente et un fondu facultatifs. Pour les boutons Jouer et les menus.
bhv_p_OpenSceneOnClick_scene = Scène
bhv_pd_OpenSceneOnClick_scene = Nom de la scène à ouvrir (tel qu’écrit dans la liste des scènes).
bhv_p_OpenSceneOnClick_trigger = Déclencheur
bhv_pd_OpenSceneOnClick_trigger = CLICK = quand il est appuyé puis relâché sur l’élément, TOUCH_START = dès l’appui.
bhv_p_OpenSceneOnClick_delay = Délai
bhv_pd_OpenSceneOnClick_delay = Attend ce temps avant le changement de scène (le temps d’un son ou d’un effet).
bhv_p_OpenSceneOnClick_fadeOverlay = Calque de fondu
bhv_pd_OpenSceneOnClick_fadeOverlay = Une grande boîte noire sur tout l’écran (facultatif) : elle apparaît en fondu avant le changement de scène. Rendez-la invisible ou à 0 % d’opacité dans l’éditeur.
bhv_p_OpenSceneOnClick_fadeTime = Durée du fondu
bhv_pd_OpenSceneOnClick_fadeTime = Temps que met le calque à apparaître.
bhv_p_OpenSceneOnClick_clickSound = Son du clic
bhv_pd_OpenSceneOnClick_clickSound = Son joué quand le toucher est accepté (facultatif).
bhv_n_SwipeDetector = Swipe detector
bhv_d_SwipeDetector = Détecte un balayage du doigt vers la gauche, la droite, le haut ou le bas, sur l’élément ou n’importe où sur l’écran. Pour tourner des pages, les menus et les jeux contrôlés par balayage.
bhv_p_SwipeDetector_onlyOnElement = Seulement sur l’élément
bhv_pd_SwipeDetector_onlyOnElement = Seuls les balayages commençant sur cet élément comptent. Désactivé = un balayage n’importe où sur l’écran.
bhv_p_SwipeDetector_minDistance = Distance min
bhv_pd_SwipeDetector_minDistance = Distance que le doigt doit parcourir (pixels d’écran).
bhv_p_SwipeDetector_maxTime = Temps max
bhv_pd_SwipeDetector_maxTime = Un balayage doit être fait dans ce temps ; les glissements plus lents sont ignorés (0 = pas de limite).
bhv_p_SwipeDetector_fireWhileMoving = Réagir en mouvement
bhv_pd_SwipeDetector_fireWhileMoving = Réagit dès que la distance est atteinte, sans attendre que le doigt se relève.
bhv_n_ToggleOnClick = Toggle on click
bhv_d_ToggleOnClick = Toucher l’élément affiche ou masque d’autres éléments : un panneau de paramètres, un menu, une astuce.
bhv_p_ToggleOnClick_targets = Cibles
bhv_pd_ToggleOnClick_targets = Les éléments affichés / masqués.
bhv_p_ToggleOnClick_action = Action
bhv_pd_ToggleOnClick_action = TOGGLE = bascule à chaque fois, SHOW = toujours afficher, HIDE = toujours masquer.
bhv_p_ToggleOnClick_trigger = Déclencheur
bhv_pd_ToggleOnClick_trigger = CLICK = quand il est appuyé puis relâché sur l’élément, TOUCH_START = dès l’appui.
bhv_p_ToggleOnClick_startHidden = Démarrer masqué
bhv_pd_ToggleOnClick_startHidden = Masque les cibles au démarrage de la scène.
bhv_p_ToggleOnClick_affectPhysics = Affecter la physique
bhv_pd_ToggleOnClick_affectPhysics = Les éléments physiques masqués cessent aussi de collisionner et de bouger.
bhv_n_Lifetime = Durée de vie
bhv_d_Lifetime = L’élément se retire au bout d’un moment, en s’estompant (et éventuellement en rétrécissant) d’abord. Balles, particules, plateformes temporaires, astuces.
bhv_g_Logic = Logique
bhv_p_Lifetime_seconds = Secondes
bhv_pd_Lifetime_seconds = Durée de vie, comptée depuis le début de la scène (ou depuis reset).
bhv_p_Lifetime_randomExtra = Supplément aléatoire
bhv_pd_Lifetime_randomExtra = Durée de vie supplémentaire aléatoire entre -x et +x secondes, pour qu’une foule ne disparaisse pas d’un coup.
bhv_p_Lifetime_fadeTime = Durée du fondu
bhv_pd_Lifetime_fadeTime = S’estompe pendant les dernières secondes.
bhv_p_Lifetime_shrink = Rétrécir
bhv_pd_Lifetime_shrink = Rétrécit aussi jusqu’à disparaître pendant qu’il s’estompe.
bhv_p_Lifetime_endAction = Action de fin
bhv_pd_Lifetime_endAction = DESTROY retire l’élément, HIDE le garde invisible et inactif.
bhv_n_ProgressBind = Progress bind
bhv_d_ProgressBind = Synchronise une barre Progress avec un nombre : une valeur sauvegardée avec setValue, une autre barre, ou le nombre écrit dans un Texte. Vie, chargement, XP, minuteurs.
bhv_p_ProgressBind_source = Source
bhv_pd_ProgressBind_source = D’où vient le nombre. SAVED_VALUE = une valeur sauvegardée par nom (setValue / getValue), OTHER_PROGRESS = la valeur d’un autre élément Progress, OTHER_TEXT = le premier nombre écrit dans un élément Texte, MANUAL = seulement le bloc définir la valeur.
bhv_p_ProgressBind_valueName = Nom de la valeur
bhv_pd_ProgressBind_valueName = Nom de la valeur sauvegardée (SAVED_VALUE).
bhv_p_ProgressBind_other = Autre
bhv_pd_ProgressBind_other = L’autre élément (OTHER_PROGRESS / OTHER_TEXT).
bhv_p_ProgressBind_minValue = Valeur min
bhv_pd_ProgressBind_minValue = Nombre qui affiche une barre vide.
bhv_p_ProgressBind_maxValue = Valeur max
bhv_pd_ProgressBind_maxValue = Nombre qui affiche une barre pleine.
bhv_p_ProgressBind_smoothing = Lissage
bhv_pd_ProgressBind_smoothing = Vitesse de suivi de la barre (0 = immédiat).
bhv_p_ProgressBind_pollInterval = Intervalle de lecture
bhv_pd_ProgressBind_pollInterval = Fréquence de lecture de la source ; une valeur sauvegardée par nom est lue dans le stockage.
bhv_n_ScoreCounter = Score Counter
bhv_d_ScoreCounter = Affiche une variable de scène (score, pièces, vies...) dans un élément Texte avec un préfixe, un remplissage et une animation de comptage, et garde un meilleur score sur l’appareil.
bhv_p_ScoreCounter_variable = Variable
bhv_pd_ScoreCounter_variable = Variable de scène à afficher (un int ou float créé dans Variables). Collectible et Timer écrivent dans des variables par nom. Vide = le compteur garde son propre nombre.
bhv_g_Value = Valeur
bhv_p_ScoreCounter_display = Affichage
bhv_pd_ScoreCounter_display = L’élément Texte qui l’affiche. Vide = cet élément (quand c’est un Texte).
bhv_p_ScoreCounter_prefix = Préfixe
bhv_pd_ScoreCounter_prefix = Écrit avant le nombre, ex. SCORE
bhv_p_ScoreCounter_suffix = Suffixe
bhv_pd_ScoreCounter_suffix = Écrit après le nombre, ex.  pts
bhv_p_ScoreCounter_decimals = Décimales
bhv_pd_ScoreCounter_decimals = Chiffres après la virgule.
bhv_p_ScoreCounter_padDigits = Remplir de zéros
bhv_pd_ScoreCounter_padDigits = Complète avec des zéros jusqu’à ce nombre de chiffres (0005). 0 = désactivé.
bhv_p_ScoreCounter_thousandsSeparator = Séparateur de milliers
bhv_pd_ScoreCounter_thousandsSeparator = Regroupe les chiffres : 12,345.
bhv_p_ScoreCounter_animate = Animer
bhv_pd_ScoreCounter_animate = Le nombre monte/descend jusqu’à la nouvelle valeur au lieu de sauter.
bhv_p_ScoreCounter_animateTime = Durée d’animation
bhv_pd_ScoreCounter_animateTime = Durée maximale du comptage.
bhv_p_ScoreCounter_highScoreKey = Clé du meilleur score
bhv_pd_ScoreCounter_highScoreKey = Nom sous lequel la meilleure valeur est stockée sur l’appareil (ex. highscore_level1). Vide = pas de meilleur score.
bhv_g_High_score = Meilleur score
bhv_p_ScoreCounter_highScoreDisplay = Affichage du meilleur score
bhv_pd_ScoreCounter_highScoreDisplay = Élément Texte qui affiche le meilleur score (facultatif).
bhv_p_ScoreCounter_highScorePrefix = Préfixe du meilleur score
bhv_pd_ScoreCounter_highScorePrefix = Écrit avant le meilleur score.
bhv_n_Timer = Timer
bhv_d_Timer = Un compte à rebours ou un chronomètre affiché dans un élément Texte : limites de temps de niveau, temps de course, affichages de récupération. Démarrez-le, mettez-le en pause et réinitialisez-le avec des blocs ; il peut aussi écrire les secondes dans une variable de scène.
bhv_p_Timer_mode = Mode
bhv_pd_Timer_mode = COUNTDOWN décompte depuis les secondes ci-dessous jusqu’à 0, STOPWATCH compte vers le haut.
bhv_g_Timer = Timer
bhv_p_Timer_seconds = Secondes
bhv_pd_Timer_seconds = Compte à rebours : point de départ. Chronomètre : s’arrête (onTimeout) à ce temps, 0 = jamais.
bhv_p_Timer_autoStart = Démarrage auto
bhv_pd_Timer_autoStart = Démarre au début de la scène. Désactivé : appelez start timer.
bhv_p_Timer_loop = Boucle
bhv_pd_Timer_loop = Redémarre tout seul après onTimeout.
bhv_p_Timer_display = Affichage
bhv_pd_Timer_display = L’élément Texte qui affiche le temps. Vide = cet élément (quand c’est un Texte).
bhv_p_Timer_format = Format
bhv_pd_Timer_format = M_SS = 1:05, SECONDS = 65, TENTHS = 65.3, M_SS_CC = 01:05.30.
bhv_p_Timer_prefix = Préfixe
bhv_pd_Timer_prefix = Écrit avant le temps, ex. TIME
bhv_p_Timer_suffix = Suffixe
bhv_pd_Timer_suffix = Écrit après le temps, ex. s
bhv_p_Timer_warnAt = Alerter à
bhv_pd_Timer_warnAt = Compte à rebours : le texte prend la couleur d’alerte et onWarning se déclenche quand il reste ce nombre de secondes. 0 = désactivé.
bhv_p_Timer_warnColor = Couleur d’alerte
bhv_pd_Timer_warnColor = Couleur du texte pendant l’alerte.
bhv_p_Timer_variable = Variable
bhv_pd_Timer_variable = Variable de scène (int ou float) qui reçoit le temps en secondes. Vide = aucune.
bhv_g_Variable = Variable
bhv_n_Floating = Floating
bhv_d_Floating = L’élément oscille de haut en bas (et/ou sur les côtés) sans fin. Les éléments physiques deviennent cinématiques pendant ce temps.
bhv_g_Motion = Mouvement
bhv_p_Floating_amplitudeY = Amplitude y
bhv_pd_Floating_amplitudeY = Distance verticale dans chaque sens.
bhv_p_Floating_amplitudeX = Amplitude x
bhv_pd_Floating_amplitudeX = Distance horizontale dans chaque sens.
bhv_p_Floating_frequency = Fréquence
bhv_pd_Floating_frequency = Cycles complets par seconde.
bhv_p_Floating_phase = Phase
bhv_pd_Floating_phase = Décalage de départ dans le cycle (0..1) pour que plusieurs éléments ne bougent pas ensemble.
bhv_set_type = Type
bhv_n_Spin = Spin
bhv_d_Spin = Fait tourner l’élément en continu (pièces, scies, icônes de chargement). Les éléments physiques deviennent cinématiques pendant ce temps.
bhv_p_Spin_speed = Vitesse
bhv_pd_Spin_speed = Degrés par seconde.
bhv_p_Spin_clockwise = Sens horaire
bhv_n_Bounce = Rebond
bhv_d_Bounce = Une balle qui ne s’arrête jamais : garde une vitesse constante et rebondit sur tout (Pong, Breakout, économiseurs d’écran). Les éléments physiques rebondissent sur les murs et les autres corps ; les éléments UI rebondissent sur les bords de l’écran.
bhv_g_Movement = Mouvement
bhv_p_Bounce_speed = Vitesse
bhv_pd_Bounce_speed = Vitesse de la balle.
bhv_g_Ball = Balle
bhv_p_Bounce_keepSpeed = Garder la vitesse
bhv_pd_Bounce_keepSpeed = Garde la vitesse constante après chaque rebond. Désactivé : rebond physique normal.
bhv_p_Bounce_speedGain = Gain de vitesse
bhv_pd_Bounce_speedGain = La balle accélère de cette valeur à chaque rebond (jusqu’à la vitesse max).
bhv_p_Bounce_maxSpeed = Vitesse max
bhv_pd_Bounce_maxSpeed = Limite de vitesse quand la balle accélère.
bhv_p_Bounce_bounciness = Rebond
bhv_pd_Bounce_bounciness = Physique : quelle part de l’énergie un rebond conserve (1 = tout).
bhv_p_Bounce_minAngle = Angle min
bhv_pd_Bounce_minAngle = Ne jamais aller presque droit selon un axe : la trajectoire reste au moins à cet écart de l’horizontale/verticale (évite les échanges infinis dans Pong/Breakout).
bhv_p_Bounce_startAngle = Angle de départ
bhv_pd_Bounce_startAngle = Direction au départ : 0 = droite, 90 = haut, 45 = haut-droite.
bhv_g_Launch = Lancement
bhv_p_Bounce_randomStart = Départ aléatoire
bhv_pd_Bounce_randomStart = Choisit une direction diagonale aléatoire au départ.
bhv_p_Bounce_launchOnStart = Lancer au démarrage
bhv_pd_Bounce_launchOnStart = Lance quand le jeu démarre. Désactivé : appelez launch depuis vos blocs.
bhv_p_Bounce_bounceOffView = Rebondir sur la vue
bhv_pd_Bounce_bounceOffView = Physique : rebondit aussi sur les bords de la vue de la caméra (les éléments UI rebondissent toujours sur l’écran).
bhv_g_Screen_edges = Bords de l’écran
bhv_set_gravityScale = Échelle de gravité
bhv_set_linearDamping = Amortissement linéaire
bhv_n_Follow = Follow
bhv_d_Follow = Garde l’élément près d’un autre, avec un décalage et un rattrapage fluide : animaux de compagnie, barres de vie au-dessus d’un personnage, un poursuivant façon caméra, une ombre. Fonctionne pour les éléments UI et physiques.
bhv_p_Follow_target = Cible
bhv_pd_Follow_target = L’élément à suivre.
bhv_p_Follow_offsetX = Décalage x
bhv_pd_Follow_offsetX = Où rester, par rapport au centre de la cible (x, la droite est positive).
bhv_p_Follow_offsetY = Décalage y
bhv_pd_Follow_offsetY = Où rester, par rapport au centre de la cible (y, le haut est positif).
bhv_p_Follow_followX = Suivre x
bhv_pd_Follow_followX = Suivre sur l’axe gauche/droite.
bhv_p_Follow_followY = Suivre y
bhv_pd_Follow_followY = Suivre sur l’axe haut/bas (un élément physique ignore alors la gravité).
bhv_p_Follow_mirrorOffset = Décalage en miroir
bhv_pd_Follow_mirrorOffset = Inverse le décalage x quand la cible regarde à gauche (son image est inversée).
bhv_p_Follow_stiffness = Raideur
bhv_pd_Follow_stiffness = Précision du suivi : plus élevé = rattrape plus vite. 0 = collé à la cible (saute dessus).
bhv_p_Follow_maxSpeed = Vitesse max
bhv_pd_Follow_maxSpeed = Limite de vitesse. 0 = pas de limite (les éléments physiques sont limités à 450 px/s).
bhv_p_Follow_stopDistance = Distance d’arrêt
bhv_pd_Follow_stopDistance = Arrête de bouger quand il est plus proche que cela de l’endroit voulu.
bhv_p_Follow_matchRotation = Copier la rotation
bhv_pd_Follow_matchRotation = Copie aussi la rotation de la cible.
bhv_n_JoystickMovement = Joystick movement
bhv_d_JoystickMovement = Déplace l’élément avec un joystick : vue de dessus (toutes les directions) ou défilement latéral (gauche/droite seulement).
bhv_p_JoystickMovement_joystick = Joystick
bhv_pd_JoystickMovement_joystick = L’élément joystick qui pilote celui-ci.
bhv_p_JoystickMovement_mode = Mode
bhv_p_JoystickMovement_speed = Vitesse
bhv_p_JoystickMovement_deadZone = Zone morte
bhv_pd_JoystickMovement_deadZone = Ignore les très petits mouvements du joystick.
bhv_p_JoystickMovement_rotateToDirection = Tourner vers la direction
bhv_pd_JoystickMovement_rotateToDirection = Tourne l’élément pour qu’il regarde là où il va.
bhv_p_JoystickMovement_faceOffset = Décalage de face
bhv_pd_JoystickMovement_faceOffset = Angle de l’image quand elle regarde à droite (0 = droite, 90 = haut...).
bhv_n_JumpPad = Jump pad
bhv_d_JumpPad = Lance tout ce qui le touche (trampolines, ressorts, canons, tremplins de boost) dans une direction choisie. Choisissez qui il affecte avec une liste ou un filtre de nom ; il peut fonctionner comme un capteur que l’on traverse.
bhv_note_JumpPad = Nécessite un élément physique (généralement STATIC).
bhv_p_JumpPad_angle = Angle
bhv_pd_JumpPad_angle = Direction du lancement : 90 = haut, 0 = droite, 180 = gauche, 270 = bas.
bhv_p_JumpPad_power = Puissance
bhv_pd_JumpPad_power = Vitesse de lancement.
bhv_p_JumpPad_additive = Additif
bhv_pd_JumpPad_additive = Activé : s’ajoute à la vitesse actuelle. Désactivé : la remplace (le même saut à chaque fois).
bhv_p_JumpPad_onlyFromFront = Seulement de face
bhv_pd_JumpPad_onlyFromFront = Ne lance que ce qui arrive de face (le côté vers lequel pointe la flèche), pas par derrière.
bhv_p_JumpPad_cooldown = Temps de récupération
bhv_pd_JumpPad_cooldown = Temps avant que le pad puisse relancer.
bhv_p_JumpPad_targets = Cibles
bhv_pd_JumpPad_targets = Seuls ces éléments sont lancés. Vide = tout corps en mouvement.
bhv_p_JumpPad_nameFilter = Filtre de nom
bhv_pd_JumpPad_nameFilter = Seuls les éléments dont le nom contient ce texte sont lancés (un tag de fortune, ex. "Player"). Vide = tous.
bhv_p_JumpPad_sensor = Capteur
bhv_pd_JumpPad_sensor = Les objets traversent le pad et sont lancés tant qu’ils le chevauchent (pas de surface solide).
bhv_n_LimitToScreen = Limit to screen
bhv_d_LimitToScreen = Garde l’élément dans l’écran (ou la vue de la caméra, la scène, ou un rectangle) avec une marge facultative, pour que le joueur ou une raquette ne puisse jamais sortir. Un élément physique perd (ou renvoie) la vitesse qui le pousse à l’extérieur.
bhv_p_LimitToScreen_area = Zone
bhv_pd_LimitToScreen_area = VIEW : ce que la caméra montre maintenant (ou l’écran pour l’UI). SCENE : le premier écran (0,0 à la taille de la scène). CUSTOM : le rectangle ci-dessous.
bhv_p_LimitToScreen_limitX = Limite x
bhv_pd_LimitToScreen_limitX = Limite gauche/droite.
bhv_p_LimitToScreen_limitY = Limite y
bhv_pd_LimitToScreen_limitY = Limite haut/bas.
bhv_p_LimitToScreen_margin = Marge
bhv_pd_LimitToScreen_margin = Espace laissé libre sur les bords.
bhv_p_LimitToScreen_keepFullyInside = Rester entièrement dedans
bhv_pd_LimitToScreen_keepFullyInside = Tout l’élément doit rester à l’intérieur (désactivé : seulement son centre).
bhv_p_LimitToScreen_bounciness = Rebond
bhv_pd_LimitToScreen_bounciness = Physique : 0 = s’arrête au bord, 1 = rebondit avec la même vitesse.
bhv_p_LimitToScreen_customLeft = Gauche personnalisée
bhv_pd_LimitToScreen_customLeft = Zone CUSTOM : bord gauche.
bhv_p_LimitToScreen_customBottom = Bas personnalisé
bhv_pd_LimitToScreen_customBottom = Zone CUSTOM : bord bas.
bhv_p_LimitToScreen_customRight = Droite personnalisée
bhv_pd_LimitToScreen_customRight = Zone CUSTOM : bord droit.
bhv_p_LimitToScreen_customTop = Haut personnalisé
bhv_pd_LimitToScreen_customTop = Zone CUSTOM : bord haut.
bhv_n_LookAtTarget = Look at target
bhv_d_LookAtTarget = Tourne l’élément vers un autre élément ou vers le doigt, avec une vitesse de rotation : tourelles, yeux, flèches, armes qui visent.
bhv_p_LookAtTarget_source = Source
bhv_pd_LookAtTarget_source = TARGET : regarde l’élément ci-dessous. FINGER : regarde le point que vous touchez.
bhv_p_LookAtTarget_target = Cible
bhv_pd_LookAtTarget_target = L’élément à regarder (TARGET).
bhv_p_LookAtTarget_faceOffset = Décalage de face
bhv_pd_LookAtTarget_faceOffset = Angle de l’image quand elle regarde à droite (0 = droite, 90 = haut...).
bhv_p_LookAtTarget_turnSpeed = Vitesse de rotation
bhv_pd_LookAtTarget_turnSpeed = Vitesse de rotation. 0 = instantané.
bhv_p_LookAtTarget_keepLastTouch = Garder le dernier toucher
bhv_pd_LookAtTarget_keepLastTouch = FINGER seulement : continue de regarder le dernier toucher après que le doigt s’est levé.
bhv_p_LookAtTarget_tolerance = Tolérance
bhv_pd_LookAtTarget_tolerance = Compte comme aligné quand l’écart d’angle est inférieur à cette valeur (onAligned).
bhv_set_fixedRotation = Rotation fixe
bhv_n_MovingPlatform = Moving platform
bhv_d_MovingPlatform = Une plateforme qui glisse entre deux points (ascenseurs, ponts mobiles, portes coulissantes) et transporte ce qui se tient dessus. Devient cinématique pendant son fonctionnement.
bhv_note_MovingPlatform = Nécessite un élément physique (il devient cinématique pendant l’exécution du jeu).
bhv_p_MovingPlatform_axis = Axe
bhv_pd_MovingPlatform_axis = Mode portée : se déplace à gauche/droite ou en haut/bas depuis le départ.
bhv_g_Route = Trajet
bhv_p_MovingPlatform_distance = Distance
bhv_pd_MovingPlatform_distance = Mode portée : distance parcourue du départ à l’autre extrémité (négatif = gauche / bas).
bhv_p_MovingPlatform_pointB = Point b
bhv_pd_MovingPlatform_pointB = Mode points : un élément marquant l’autre extrémité. S’il est défini, il remplace la portée.
bhv_p_MovingPlatform_pointA = Point a
bhv_pd_MovingPlatform_pointA = Mode points : un élément marquant la première extrémité. Vide = la position de départ de cette plateforme.
bhv_p_MovingPlatform_speed = Vitesse
bhv_pd_MovingPlatform_speed = Vitesse le long du trajet.
bhv_p_MovingPlatform_pause = Pause
bhv_pd_MovingPlatform_pause = Temps d’attente à chaque extrémité.
bhv_p_MovingPlatform_smooth = Fluide
bhv_pd_MovingPlatform_smooth = Ralentit en douceur près des extrémités.
bhv_p_MovingPlatform_carryRiders = Transporter les passagers
bhv_pd_MovingPlatform_carryRiders = Déplace latéralement ce qui se tient dessus (nécessaire pour un joueur qui définit sa propre vitesse).
bhv_n_Orbit = Orbit
bhv_d_Orbit = Tourne autour d’un autre élément (planètes, boucliers, satellites, scies rotatives) ou autour d’un point, avec une forme ovale et une spirale vers l’intérieur/extérieur facultatives. Les éléments physiques restent physiques (ils poussent les objets) et ignorent la gravité.
bhv_p_Orbit_center = Centre
bhv_pd_Orbit_center = L’élément autour duquel tourner. Vide = un point choisi pour que l’élément démarre sur son propre cercle.
bhv_p_Orbit_radius = Rayon
bhv_pd_Orbit_radius = Distance au centre. 0 = la distance actuelle à l’élément central (100 s’il n’y a pas d’élément central).
bhv_p_Orbit_speed = Vitesse
bhv_pd_Orbit_speed = Degrés par seconde.
bhv_p_Orbit_clockwise = Sens horaire
bhv_pd_Orbit_clockwise = Tourne dans le sens horaire (désactivé : sens antihoraire).
bhv_p_Orbit_ovalRatio = Rapport de l’ovale
bhv_pd_Orbit_ovalRatio = Hauteur de l’ovale par rapport à sa largeur (1 = cercle).
bhv_p_Orbit_spiral = Spirale
bhv_pd_Orbit_spiral = Le rayon augmente (positif) ou diminue (négatif) de cette valeur chaque seconde : spirales.
bhv_p_Orbit_minRadius = Rayon min
bhv_pd_Orbit_minRadius = Plus petit rayon en spirale vers l’intérieur.
bhv_p_Orbit_faceMovement = Orienter selon le mouvement
bhv_pd_Orbit_faceMovement = Tourne l’élément le long de sa trajectoire (flèches, avions).
bhv_p_Orbit_faceOffset = Décalage de face
bhv_pd_Orbit_faceOffset = Angle de l’image quand elle regarde à droite (0 = droite, 90 = haut...).
bhv_n_PlatformerPlayer = Platformer player
bhv_d_PlatformerPlayer = Courez et sautez avec des boutons à l’écran ou le clavier : double saut, coyote time et mise en mémoire du saut. Nécessite de la gravité dans la scène.
bhv_note_PlatformerPlayer = Nécessite un élément physique DYNAMIC et de la gravité dans la scène.
bhv_p_PlatformerPlayer_leftButton = Bouton gauche
bhv_pd_PlatformerPlayer_leftButton = Bouton (n’importe quel élément) qui déplace vers la gauche tant qu’il est maintenu.
bhv_p_PlatformerPlayer_rightButton = Bouton droit
bhv_p_PlatformerPlayer_jumpButton = Bouton de saut
bhv_p_PlatformerPlayer_useKeyboard = Utiliser le clavier
bhv_pd_PlatformerPlayer_useKeyboard = Les flèches / A D W / espace fonctionnent aussi (ordinateur, tests).
bhv_p_PlatformerPlayer_speed = Vitesse
bhv_p_PlatformerPlayer_acceleration = Accélération
bhv_pd_PlatformerPlayer_acceleration = 0 = instantané, sinon la vitesse à laquelle il atteint la vitesse voulue.
bhv_p_PlatformerPlayer_flipToDirection = Inverser selon la direction
bhv_pd_PlatformerPlayer_flipToDirection = Met l’image en miroir en marchant vers la gauche.
bhv_p_PlatformerPlayer_jumpSpeed = Vitesse de saut
bhv_g_Jump = Saut
bhv_p_PlatformerPlayer_maxJumps = Sauts max
bhv_pd_PlatformerPlayer_maxJumps = 2 = double saut, 1 = saut simple.
bhv_p_PlatformerPlayer_coyoteTime = Coyote time
bhv_pd_PlatformerPlayer_coyoteTime = Temps après avoir quitté une plateforme pendant lequel un saut fonctionne encore.
bhv_p_PlatformerPlayer_jumpBuffer = Mémoire de saut
bhv_pd_PlatformerPlayer_jumpBuffer = Un saut pressé un peu avant l’atterrissage est mémorisé pendant ce temps.
bhv_n_TapToMove = Tap to move
bhv_d_TapToMove = Se déplace là où vous touchez : TAP marche jusqu’au point touché (stratégie, point-and-click), HOLD suit le doigt tant qu’il est posé, DRAG_ITEM permet de saisir l’élément lui-même et de le faire glisser (pièces de puzzle, cartes). Les touchers sur les boutons/joystick de la liste d’exclusion ne sont pas utilisés.
bhv_p_TapToMove_mode = Mode
bhv_pd_TapToMove_mode = TAP : va au point touché. HOLD : suit le doigt tant qu’il est posé. DRAG_ITEM : touchez l’élément et faites-le glisser.
bhv_g_Touch = Toucher
bhv_p_TapToMove_ignoreTouchesOn = Ignorer les touchers sur
bhv_pd_TapToMove_ignoreTouchesOn = Les touchers qui commencent sur ces éléments (boutons, joystick, panneaux) sont ignorés.
bhv_p_TapToMove_marker = Repère
bhv_pd_TapToMove_marker = Élément facultatif affiché au point touché (mode TAP) ; il se cache quand l’élément arrive.
bhv_p_TapToMove_speed = Vitesse
bhv_pd_TapToMove_speed = Vitesse de marche.
bhv_p_TapToMove_stopDistance = Distance d’arrêt
bhv_pd_TapToMove_stopDistance = Compte comme arrivé quand il est aussi proche.
bhv_p_TapToMove_horizontalOnly = Horizontal seulement
bhv_pd_TapToMove_horizontalOnly = Seulement gauche/droite (les personnages de type plateforme gardent la gravité). Désactivé : se déplace dans toutes les directions et ignore la gravité.
bhv_p_TapToMove_dragStiffness = Raideur du glissement
bhv_pd_TapToMove_dragStiffness = DRAG_ITEM : raideur avec laquelle l’élément suit le doigt (éléments physiques ; plus élevé = plus serré).
bhv_p_TapToMove_rotateToDirection = Tourner vers la direction
bhv_pd_TapToMove_rotateToDirection = Tourne l’élément vers là où il va.
bhv_p_TapToMove_flipToDirection = Inverser selon la direction
bhv_pd_TapToMove_flipToDirection = Met l’image en miroir en allant vers la gauche.
bhv_p_TapToMove_faceOffset = Décalage de face
bhv_pd_TapToMove_faceOffset = Angle de l’image quand elle regarde à droite (0 = droite, 90 = haut...).
bhv_n_TiltMove = Tilt move
bhv_d_TiltMove = Déplace l’élément en inclinant le téléphone (accéléromètre) : une balle qui roule, un labyrinthe à bille, un attrape-objets qui tombent. Les flèches simulent l’inclinaison sur ordinateur.
bhv_p_TiltMove_mode = Mode
bhv_pd_TiltMove_mode = VELOCITY : l’inclinaison définit la vitesse. ROLL : l’inclinaison pousse comme la gravité sur une balle (elle continue de rouler).
bhv_g_Tilt = Inclinaison
bhv_p_TiltMove_fullTilt = Inclinaison complète
bhv_pd_TiltMove_fullTilt = Inclinaison qui donne la pleine vitesse. 9.8 = téléphone à la verticale, environ 4 = une inclinaison confortable.
bhv_p_TiltMove_deadZone = Zone morte
bhv_pd_TiltMove_deadZone = Les inclinaisons plus petites que cela sont ignorées.
bhv_p_TiltMove_smoothing = Lissage
bhv_pd_TiltMove_smoothing = Lisse le capteur tremblant. Plus élevé = plus lisse mais plus lent à réagir.
bhv_p_TiltMove_orientation = Orientation
bhv_pd_TiltMove_orientation = AUTO suit la rotation de l’écran. Réglez-la à la main si les directions sont fausses sur votre téléphone.
bhv_p_TiltMove_useKeyboard = Utiliser le clavier
bhv_pd_TiltMove_useKeyboard = Les flèches / WASD simulent l’inclinaison (ordinateur, tests).
bhv_p_TiltMove_horizontal = Horizontal
bhv_pd_TiltMove_horizontal = Déplacer à gauche/droite.
bhv_p_TiltMove_vertical = Vertical
bhv_pd_TiltMove_vertical = Déplacer en haut/bas (désactive la gravité pour cet élément pendant l’exécution).
bhv_p_TiltMove_invertX = Inverser x
bhv_pd_TiltMove_invertX = Échange gauche et droite.
bhv_p_TiltMove_invertY = Inverser y
bhv_pd_TiltMove_invertY = Échange haut et bas.
bhv_p_TiltMove_speed = Vitesse
bhv_pd_TiltMove_speed = Vitesse maximale.
bhv_p_TiltMove_acceleration = Accélération
bhv_pd_TiltMove_acceleration = ROLL seulement : accélération à pleine inclinaison.
bhv_p_TiltMove_damping = Amortissement
bhv_pd_TiltMove_damping = ROLL seulement : ralentit la balle (0 = jamais).
bhv_n_TopDownPlayer = Top-down player
bhv_d_TopDownPlayer = Déplace l’élément dans toutes les directions (RPG, tir, labyrinthe) : joystick, 4 boutons ou clavier, avec accélération, friction, alignement sur 4/8 directions et rotation facultative vers le mouvement. Utilisez une gravité de 0 dans la scène.
bhv_p_TopDownPlayer_joystick = Joystick
bhv_pd_TopDownPlayer_joystick = Élément joystick qui pilote celui-ci (facultatif).
bhv_p_TopDownPlayer_upButton = Bouton haut
bhv_pd_TopDownPlayer_upButton = Bouton (n’importe quel élément) qui déplace vers le haut tant qu’il est maintenu.
bhv_p_TopDownPlayer_downButton = Bouton bas
bhv_pd_TopDownPlayer_downButton = Bouton (n’importe quel élément) qui déplace vers le bas tant qu’il est maintenu.
bhv_p_TopDownPlayer_leftButton = Bouton gauche
bhv_pd_TopDownPlayer_leftButton = Bouton (n’importe quel élément) qui déplace vers la gauche tant qu’il est maintenu.
bhv_p_TopDownPlayer_rightButton = Bouton droit
bhv_pd_TopDownPlayer_rightButton = Bouton (n’importe quel élément) qui déplace vers la droite tant qu’il est maintenu.
bhv_p_TopDownPlayer_useKeyboard = Utiliser le clavier
bhv_pd_TopDownPlayer_useKeyboard = Les flèches / WASD déplacent aussi l’élément (ordinateur, tests).
bhv_p_TopDownPlayer_deadZone = Zone morte
bhv_pd_TopDownPlayer_deadZone = Les poussées du joystick plus petites que cela sont ignorées.
bhv_p_TopDownPlayer_directions = Directions
bhv_pd_TopDownPlayer_directions = ANY = directions fluides du joystick, EIGHT = aligne sur 8 directions, FOUR = haut/bas/gauche/droite seulement.
bhv_p_TopDownPlayer_speed = Vitesse
bhv_pd_TopDownPlayer_speed = Vitesse maximale.
bhv_p_TopDownPlayer_acceleration = Accélération
bhv_pd_TopDownPlayer_acceleration = Vitesse à laquelle il atteint la pleine vitesse. 0 = instantané.
bhv_p_TopDownPlayer_friction = Friction
bhv_pd_TopDownPlayer_friction = Vitesse à laquelle il s’arrête quand rien n’est pressé. 0 = instantané.
bhv_p_TopDownPlayer_rotateToDirection = Tourner vers la direction
bhv_pd_TopDownPlayer_rotateToDirection = Tourne l’élément vers là où il se déplace.
bhv_g_Facing = Orientation du regard
bhv_p_TopDownPlayer_faceOffset = Décalage de face
bhv_pd_TopDownPlayer_faceOffset = Angle de l’image quand elle regarde à droite (0 = droite, 90 = haut...).
bhv_p_TopDownPlayer_turnSpeed = Vitesse de rotation
bhv_pd_TopDownPlayer_turnSpeed = Vitesse de rotation. 0 = instantané.
bhv_p_TopDownPlayer_flipToDirection = Inverser selon la direction
bhv_pd_TopDownPlayer_flipToDirection = Met l’image en miroir en allant vers la gauche (pour les vues de côté).
bhv_n_WrapScreen = Wrap around screen
bhv_d_WrapScreen = Quand l’élément sort d’un côté de l’écran, il revient par le côté opposé (Asteroids, tunnels de Pac-Man, jeux de course sans fin). La vitesse est conservée.
bhv_p_WrapScreen_area = Zone
bhv_pd_WrapScreen_area = VIEW : ce que la caméra montre maintenant (ou l’écran pour l’UI). SCENE : le premier écran (0,0 à la taille de la scène). CUSTOM : le rectangle ci-dessous.
bhv_p_WrapScreen_wrapX = Rebouclage x
bhv_pd_WrapScreen_wrapX = Reboucle sur les bords gauche/droite.
bhv_p_WrapScreen_wrapY = Rebouclage y
bhv_pd_WrapScreen_wrapY = Reboucle sur les bords haut/bas.
bhv_p_WrapScreen_margin = Marge
bhv_pd_WrapScreen_margin = Espace supplémentaire hors de la zone avant le rebouclage.
bhv_p_WrapScreen_customLeft = Gauche personnalisée
bhv_pd_WrapScreen_customLeft = Zone CUSTOM : bord gauche.
bhv_p_WrapScreen_customBottom = Bas personnalisé
bhv_pd_WrapScreen_customBottom = Zone CUSTOM : bord bas.
bhv_p_WrapScreen_customRight = Droite personnalisée
bhv_pd_WrapScreen_customRight = Zone CUSTOM : bord droit.
bhv_p_WrapScreen_customTop = Haut personnalisé
bhv_pd_WrapScreen_customTop = Zone CUSTOM : bord haut.
bhv_n_CountUp = Count up
bhv_d_CountUp = Un élément Texte compte d’un nombre à un autre, comme un score. Préfixe, suffixe et séparateur de milliers facultatifs.
bhv_g_Text = Texte
bhv_p_CountUp_from = De
bhv_pd_CountUp_from = Nombre de départ.
bhv_p_CountUp_to = À
bhv_pd_CountUp_to = Nombre jusqu’auquel il compte.
bhv_p_CountUp_duration = Durée
bhv_pd_CountUp_duration = Durée du comptage.
bhv_p_CountUp_delay = Délai
bhv_pd_CountUp_delay = Attend ce temps avant de compter.
bhv_p_CountUp_decimals = Décimales
bhv_pd_CountUp_decimals = Chiffres après la virgule.
bhv_p_CountUp_prefix = Préfixe
bhv_pd_CountUp_prefix = Texte avant le nombre, ex. $ ou Score :
bhv_p_CountUp_suffix = Suffixe
bhv_pd_CountUp_suffix = Texte après le nombre, ex. % ou pts
bhv_p_CountUp_thousandsSeparator = Séparateur de milliers
bhv_pd_CountUp_thousandsSeparator = Écrit 1,234,567 au lieu de 1234567.
bhv_p_CountUp_ease = Accélération
bhv_pd_CountUp_ease = Comment la vitesse évolue pendant le comptage.
bhv_p_CountUp_autoPlay = Lecture auto
bhv_pd_CountUp_autoPlay = Commence à compter dès le début de la scène. Sinon utilisez le bloc compter.
bhv_n_Typewriter = Typewriter
bhv_d_Typewriter = Un élément Texte écrit son texte lettre par lettre, comme une boîte de dialogue. Touchez pour tout afficher d’un coup.
bhv_p_Typewriter_speed = Vitesse
bhv_pd_Typewriter_speed = Lettres par seconde.
bhv_p_Typewriter_startDelay = Délai de départ
bhv_pd_Typewriter_startDelay = Attend ce temps avant de commencer à écrire.
bhv_p_Typewriter_punctuationPause = Pause de ponctuation
bhv_pd_Typewriter_punctuationPause = Pause supplémentaire après . , ! ? pour que les phrases respirent (0 = aucune).
bhv_p_Typewriter_customText = Texte personnalisé
bhv_pd_Typewriter_customText = Écrit un autre texte à la place de celui de l’élément (vide = utilise le texte de l’élément).
bhv_p_Typewriter_tapToSkip = Toucher pour passer
bhv_pd_Typewriter_tapToSkip = Toucher le texte l’affiche en entier d’un coup.
bhv_p_Typewriter_autoPlay = Lecture auto
bhv_pd_Typewriter_autoPlay = Commence dès le début de la scène. Sinon utilisez le bloc écrire le texte.
bhv_p_Typewriter_tickSound = Son de frappe
bhv_pd_Typewriter_tickSound = Minuscule son pour les lettres (facultatif).
bhv_p_Typewriter_tickEvery = Son toutes les
bhv_pd_Typewriter_tickEvery = Joue le son de frappe toutes les N lettres.
bhv_n_Blink = Blink
bhv_d_Blink = L’élément clignote (ou apparaît et disparaît en fondu). Idéal pour les textes « Touchez pour commencer », les avertissements et l’invincibilité.
bhv_g_UI_effects = Effets UI
bhv_p_Blink_onTime = Temps visible
bhv_pd_Blink_onTime = Durée de visibilité à chaque fois.
bhv_p_Blink_offTime = Temps masqué
bhv_pd_Blink_offTime = Durée de masquage à chaque fois.
bhv_p_Blink_offOpacity = Opacité masquée
bhv_pd_Blink_offOpacity = Opacité pendant l’état « masqué » (0 = invisible).
bhv_p_Blink_smooth = Fluide
bhv_pd_Blink_smooth = Fondu progressif au lieu de basculer d’un coup.
bhv_p_Blink_count = Nombre
bhv_pd_Blink_count = Nombre de clignotements, puis il s’arrête visible. 0 = pour toujours.
bhv_p_Blink_autoPlay = Lecture auto
bhv_pd_Blink_autoPlay = Commence à clignoter dès le début de la scène.
bhv_n_FadeIn = Fade in
bhv_d_FadeIn = L’élément apparaît en douceur : d’invisible (et éventuellement plus petit) à son aspect normal. Idéal pour les menus et les titres.
bhv_p_FadeIn_duration = Durée
bhv_pd_FadeIn_duration = Durée du fondu.
bhv_p_FadeIn_delay = Délai
bhv_pd_FadeIn_delay = Attend ce temps avant de commencer.
bhv_p_FadeIn_fromOpacity = Opacité de départ
bhv_pd_FadeIn_fromOpacity = Opacité au début (0 = invisible).
bhv_p_FadeIn_fromScale = Échelle de départ
bhv_pd_FadeIn_fromScale = Taille au début, 1 = taille normale. Utilisez 0.5 pour le faire « surgir ».
bhv_p_FadeIn_ease = Accélération
bhv_pd_FadeIn_ease = Comment la vitesse évolue pendant le fondu.
bhv_p_FadeIn_autoPlay = Lecture auto
bhv_pd_FadeIn_autoPlay = Commence dès le début de la scène. Sinon l’élément est affiché normalement jusqu’à l’exécution du bloc lecture.
bhv_n_FadeOut = Fade out
bhv_d_FadeOut = L’élément disparaît en douceur et peut ensuite se cacher ou se retirer. Idéal pour les messages, les objets à ramasser et la fermeture des menus.
bhv_p_FadeOut_trigger = Déclencheur
bhv_pd_FadeOut_trigger = Quand le fondu commence. MANUAL = seulement quand le bloc lecture s’exécute.
bhv_p_FadeOut_duration = Durée
bhv_pd_FadeOut_duration = Durée du fondu.
bhv_p_FadeOut_delay = Délai
bhv_pd_FadeOut_delay = Attend ce temps avant de commencer (un message qui disparaît tout seul).
bhv_p_FadeOut_toOpacity = Opacité d’arrivée
bhv_pd_FadeOut_toOpacity = Opacité à la fin (0 = invisible).
bhv_p_FadeOut_toScale = Échelle d’arrivée
bhv_pd_FadeOut_toScale = Taille à la fin, 1 = taille normale. Utilisez 0 pour rétrécir jusqu’à disparaître.
bhv_p_FadeOut_ease = Accélération
bhv_pd_FadeOut_ease = Comment la vitesse évolue pendant le fondu.
bhv_p_FadeOut_then = Ensuite
bhv_pd_FadeOut_then = Ce qui se passe à la fin : STAY = reste là (estompé), HIDE = masqué (et sa physique désactivée), DESTROY = retiré.
bhv_n_Parallax = Parallax
bhv_d_Parallax = Un calque d’arrière-plan qui bouge plus lentement que le monde quand la caméra bouge, pour la profondeur. Fonctionne pour les arrière-plans d’écran (UI) et les éléments du monde.
bhv_p_Parallax_factorX = Facteur x
bhv_pd_Parallax_factorX = Vitesse latérale par rapport au monde : 0 = bouge avec le monde (aucun effet), 0.5 = demi-vitesse (loin), 1 = reste immobile à l’écran (très loin).
bhv_p_Parallax_factorY = Facteur y
bhv_pd_Parallax_factorY = Pareil, pour le haut et le bas. Utilisé seulement quand « Affecter la verticale » est activé.
bhv_p_Parallax_affectVertical = Affecter la verticale
bhv_pd_Parallax_affectVertical = Réagit aussi quand la caméra monte et descend.
bhv_p_Parallax_loopWidth = Largeur de boucle
bhv_pd_Parallax_loopWidth = Répète le mouvement tous les N pixels latéralement, pour qu’une rangée de tuiles identiques défile sans fin (0 = pas de répétition).
bhv_p_Parallax_loopHeight = Hauteur de boucle
bhv_pd_Parallax_loopHeight = Pareil, pour le haut et le bas (0 = pas de répétition).
bhv_n_Pulse = Pulse
bhv_d_Pulse = L’élément grossit et rétrécit sans cesse, comme un cœur qui bat. Idéal pour les boutons « Jouer » et les objets à ramasser.
bhv_p_Pulse_minScale = Échelle min
bhv_pd_Pulse_minScale = Plus petite taille, 1 = taille normale.
bhv_p_Pulse_maxScale = Échelle max
bhv_pd_Pulse_maxScale = Plus grande taille, 1 = taille normale.
bhv_p_Pulse_speed = Vitesse
bhv_pd_Pulse_speed = Battements par seconde.
bhv_p_Pulse_lowOpacity = Opacité basse
bhv_pd_Pulse_lowOpacity = Opacité à la plus petite taille (1 = pas de fondu).
bhv_p_Pulse_autoPlay = Lecture auto
bhv_pd_Pulse_autoPlay = Commence à pulser dès le début de la scène. Sinon utilisez les blocs démarrer / pulser une fois.
bhv_p_Pulse_pulseWhileTouched = Pulser au toucher
bhv_pd_Pulse_pulseWhileTouched = Continue de pulser tant que l’élément est touché.
bhv_n_ScaleTouchEffect = Scale touch effect
bhv_d_ScaleTouchEffect = L’élément rétrécit (ou grossit) quand il est touché et revient en place au relâchement.
bhv_p_ScaleTouchEffect_pressedScale = Échelle à l’appui
bhv_pd_ScaleTouchEffect_pressedScale = Échelle quand il est touché, 1 = taille normale.
bhv_p_ScaleTouchEffect_speed = Vitesse
bhv_pd_ScaleTouchEffect_speed = Vitesse à laquelle il passe à la nouvelle taille.
bhv_p_ScaleTouchEffect_pressedAlpha = Alpha à l’appui
bhv_pd_ScaleTouchEffect_pressedAlpha = S’estompe aussi un peu quand il est touché (1 = pas de fondu).
bhv_n_Shake = Secousse
bhv_d_Shake = L’élément tremble un instant : au début de la scène, quand il est touché ou depuis un bloc. Idéal pour les mauvaises réponses, les coups et les boutons.
bhv_p_Shake_trigger = Déclencheur
bhv_pd_Shake_trigger = Quand il tremble. MANUAL = seulement quand le bloc secouer s’exécute.
bhv_p_Shake_axis = Axe
bhv_pd_Shake_axis = Direction de son mouvement.
bhv_p_Shake_intensity = Intensité
bhv_pd_Shake_intensity = Distance à laquelle il s’éloigne de sa place.
bhv_p_Shake_duration = Durée
bhv_pd_Shake_duration = Durée d’une secousse.
bhv_p_Shake_frequency = Fréquence
bhv_pd_Shake_frequency = Changements de direction par seconde : plus grand = nerveux, plus petit = balancement.
bhv_p_Shake_rotation = Rotation
bhv_pd_Shake_rotation = Tourne aussi un peu d’avant en arrière (0 = pas de rotation).
bhv_p_Shake_decay = Atténuation
bhv_pd_Shake_decay = La secousse s’affaiblit jusqu’à s’arrêter.
