bhv_d_Trigger3D = Une zone invisible qui signale qui entre et sort : sursauts, points de contrôle, cinématiques, changements de musique, lignes d'arrivée. La zone est la boîte de l'élément ou un rayon ; surveille des éléments choisis, un préfixe de nom ou la caméra subjective.
