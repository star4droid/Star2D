bhv_pd_LookAtTarget3D_idleSweep = Balaye à gauche et à droite de cet angle quand il ne voit rien (0 = reste immobile).
bhv_n_Orbit3D = Orbite 3D
bhv_d_Orbit3D = Tourne autour d'un élément central ou du point de départ : lunes, gardes autour d'une tour, caméra tournant autour d'une voiture dans un menu, lumière autour d'une scène. Peut regarder dans le sens du mouvement ou vers le centre.
bhv_e_Orbit3D_onLap = À chaque tour
bhv_p_Orbit3D_center = Centre
bhv_pd_Orbit3D_center = Élément autour duquel tourner (vide = le point de départ moins le rayon).
bhv_p_Orbit3D_radius = Rayon
bhv_pd_Orbit3D_radius = Distance du centre (0 = la distance au départ).
bhv_p_Orbit3D_speed = Vitesse
bhv_pd_Orbit3D_speed = Vitesse de rotation (négatif = dans l'autre sens).
bhv_p_Orbit3D_height = Hauteur
bhv_pd_Orbit3D_height = Hauteur au-dessus du centre.
bhv_p_Orbit3D_wave = Ondulation
bhv_pd_Orbit3D_wave = Ondulation de haut en bas en tournant (0 = à plat).
bhv_p_Orbit3D_facing = Orientation
bhv_pd_Orbit3D_facing = Où il regarde en tournant.
bhv_n_Oscillator3D = Oscillateur 3D
bhv_d_Oscillator3D = Va et vient entre son départ et un décalage : murs coulissants, pistons, scies, pièges, ascenseurs sans passagers. Doux ou linéaire, avec une pause aux deux bouts.
bhv_e_Oscillator3D_onEnd = À une extrémité
bhv_p_Oscillator3D_offsetX = Décalage x
bhv_pd_Oscillator3D_offsetX = Décalage du bout éloigné sur X depuis le départ.
bhv_p_Oscillator3D_offsetY = Décalage y
bhv_pd_Oscillator3D_offsetY = Décalage du bout éloigné sur Y (vers le haut).
bhv_p_Oscillator3D_offsetZ = Décalage z
bhv_pd_Oscillator3D_offsetZ = Décalage du bout éloigné sur Z.
bhv_p_Oscillator3D_localOffset = Décalage local
