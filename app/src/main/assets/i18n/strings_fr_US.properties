bhv_n_PlatformMover3D = Plateforme mobile 3D
bhv_d_PlatformMover3D = Une plateforme mobile, un ascenseur ou un ferry : se déplace entre son départ et un décalage (ou par des points), attend à chaque arrêt et transporte ce qui est dessus (personnages, caisses, le joueur en vue subjective). Donnez-lui un corps KINEMATIC.
bhv_e_PlatformMover3D_onStop = À l'arrêt
bhv_p_PlatformMover3D_points = Points
bhv_pd_PlatformMover3D_points = Arrêts après le départ, dans l'ordre (vide = le décalage ci-dessous).
bhv_p_PlatformMover3D_offsetX = Décalage x
bhv_pd_PlatformMover3D_offsetX = Bout éloigné sur X quand il n'y a pas de points.
