bhv_p_LookAtTarget3D_yawOnly = Cap seulement
bhv_pd_LookAtTarget3D_yawOnly = Tourne seulement autour de Y (reste droit).
bhv_p_LookAtTarget3D_turnSpeed = Vitesse de rotation
