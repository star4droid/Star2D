bhv_p_Oscillator3D_phase = Phase
bhv_pd_Oscillator3D_phase = Point de départ du cycle (0..1) pour que les copies soient décalées.
bhv_n_PathFollower3D = Suiveur de chemin 3D
bhv_d_PathFollower3D = Parcourt une liste d'éléments points de passage (objets vides ou marqueurs) : en boucle, en aller-retour ou une fois. Marche au sol ou vole tout droit ; attend à chaque point. Les caméras font un survol cinématique.
bhv_e_PathFollower3D_onWaypoint = À un point de passage
bhv_e_PathFollower3D_onPathEnd = À la fin du chemin
