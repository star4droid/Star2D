# --- Animation editor, number pad, help, tips ---
anim_help=Touchez les images de la liste pour les ajouter comme images de l’animation. Glissez une image pour changer l’ordre, ✕ la retire, touchez une image pour la voir. « Durée d’image » définit combien de temps chaque image est affichée (millisecondes). Utilisez l’animation dans les blocs avec setAnimation et son nom.
anim_empty=Aucune image pour l’instant.\nTouchez les images ci-dessous pour les ajouter.
anim_prev=Image précédente
anim_next=Image suivante
anim_frame_time=Durée d’image (ms)
anim_add_frames=Images : touchez pour ajouter une image à l’animation
anim_add_all=Tout ajouter
anim_save_q=Enregistrer cette animation avant de fermer ?
ui_clear=Effacer
tut_params_intro=Le bloc jaune affiche l'événement (%1$s) et ses entrées. « %2$s » est cet élément : appuyez longuement dessus et glissez-le dans un champ pour l'utiliser.
tut_numpad_intro=Les champs numériques ouvrent un pavé numérique : touchez les chiffres, ⌫ efface le dernier, C efface tout, puis OK.
tut_drag_body2=Le bloc jaune montre les entrées de cet événement. Maintenez %1$s (le corps qui a heurté le rocher) et glissez-le dans le premier cercle.
tut_drag_body2_coin=Maintenez %1$s sur le bloc jaune (le corps qui a touché la pièce) et glissez-le dans le premier cercle.
blk_browse=Parcourir
blk_p_current=l’élément auquel appartient cet événement
blk_p_body2=l’autre corps de la collision
blk_p_body1=le premier corps de la collision
blk_p_event=l’événement de toucher (position, pointeur…)
blk_p_drag=Maintenez-le et glissez-en une copie dans n’importe quel champ.
ui_light_blur=Bords de lumière doux (flous)
ui_light_shadows=Les corps projettent des ombres
ui_light_culling=Ignorer les lumières hors de l’écran (plus rapide)
ui_light_diffuse=Lumière diffuse (plus douce, moins de contraste)
ui_light_gamma=Correction gamma
ui_add_desc_boxBody=Un rectangle avec physique. Joueurs, murs, plateformes.
ui_add_desc_circleBody=Un corps rond : balles, roues, pièces.
ui_add_desc_textItem=Afficher du texte : score, titres, messages.
ui_add_desc_joystickItem=Joystick à l’écran pour contrôler le joueur.
ui_add_desc_progressBar=Barres de vie, barres de chargement, minuteurs.
ui_add_desc_customBody=Corps avec une forme de collision personnalisée (polygone).
ui_add_desc_particleEffect=Effets de feu, fumée, étincelles, pluie.
ui_add_desc_camera=Contrôle quelle partie du monde est visible.
ui_add_desc_tiledMap=Charger un niveau créé avec Tiled (.tmx).
ui_add_desc_pointLight=Lumière qui éclaire dans toutes les directions.
ui_add_desc_directionalLight=Lumière comme le soleil, venant d’une seule direction.
ui_add_desc_coneLight=Cône de lampe torche / projecteur.
ui_ev_desc_OnCreate = S'exécute une fois au démarrage de la scène.
ui_ev_desc_OnStep = S'exécute à chaque image (environ 60 fois par seconde).
ui_ev_desc_OnPause = Quand le jeu est en pause ou l'app passe en arrière-plan.
ui_ev_desc_OnResume = Quand le jeu reprend.
ui_ev_desc_onCollisionStart = Quand deux corps commencent à se toucher (body1, body2).
ui_ev_desc_onCollisionEnd = Quand deux corps cessent de se toucher.
ui_ev_desc_onClick = Quand on touche cet élément.
ui_ev_desc_OnBodyCreated = Quand cet élément est créé.
ui_ev_desc_OnBodyUpdate = À chaque image, pour cet élément.
ui_ev_desc_onTouchStart = Quand un doigt commence à le toucher.
ui_ev_desc_onTouchEnd = Quand le doigt est levé.
ui_ev_desc_onBodyCollided = Quand il touche un autre corps (body2).
ui_ev_desc_onBodyCollideEnd = Quand il cesse de toucher un autre corps.
ui_tip_name=Nom unique de l’élément. Utilisé dans les blocs et le code pour le retrouver.
ui_tip_type=DYNAMIC : bouge et tombe avec la gravité (joueurs, balles).\nSTATIC : ne bouge jamais (sol, murs).\nKINAMATIC : bouge uniquement par le code, n’est pas affecté par la gravité (plateformes mobiles).\nUI : reste fixe à l’écran (boutons, score).
ui_tip_lock=Les éléments verrouillés ne peuvent pas être déplacés au toucher dans l’éditeur.
ui_tip_Script=Le script de corps (code) qui contrôle cet élément.
ui_tip_parent=Attache cet élément à un autre ; il suit son parent.
ui_tip_x=Position horizontale dans le monde.
ui_tip_y=Position verticale dans le monde.
ui_tip_z=Ordre d’affichage : les valeurs plus élevées sont dessinées au-dessus.
ui_tip_rotation=Angle en degrés.
ui_tip_width=Largeur de l’élément.
ui_tip_height=Hauteur de l’élément.
ui_tip_radius=Rayon du cercle.
ui_tip_density=Poids du corps. Plus élevé = plus lourd.
ui_tip_friction=À quel point il glisse. 0 = glace, 1 = caoutchouc.
ui_tip_restitution=Rebond. 0 = aucun rebond, 1 = rebond complet.
ui_tip_Gravity_Scale=Multiplicateur de gravité pour ce corps. 0 = flotte.
ui_tip_Fixed_Rotation=Empêche le corps de tourner (idéal pour les joueurs).
ui_tip_Bullet=Meilleure détection des collisions pour les objets très rapides.
ui_tip_isSensor=Détecte les collisions mais ne bloque pas (déclencheurs, pièces).
ui_tip_Active=Les corps inactifs ne participent pas à la physique.
ui_tip_Visible=Afficher ou masquer l’élément.
ui_tip_image=Image affichée pour cet élément (du dossier images).
ui_tip_Tint=Couleur multipliée sur l’image.
ui_tip_Collision=Éléments avec lesquels celui-ci ne doit PAS entrer en collision.
ui_tip_Points=Points du polygone de collision personnalisé.
ui_tip_Text=Texte à afficher.
ui_tip_Font_Scale=Taille du texte.
ui_tip_tileX=Répéter l’image horizontalement.
ui_tip_tileY=Répéter l’image verticalement.
ui_tip_Zoom=Zoom de la caméra. Plus petit = plus proche.
ui_tip_Duration=Durée de l’effet en secondes.
ui_tip_Distance=Portée de la lumière.
ui_tip_rays=Qualité de la lumière (plus de rayons = plus lisse, plus lent).
ui_tip_Static_Light=Les lumières statiques coûtent moins cher (elles ne bougent pas).
ui_tip_attach_To=Attache la lumière à un élément pour qu’elle le suive.
help_add_t=➕ Ajouter des éléments
help_add_d=Touchez le bouton bleu + et choisissez un type (boîte, cercle, texte, joystick...).
help_tools_t=✋ Outils
help_tools_d=Main = sélectionner et déplacer la caméra, puis déplacer, redimensionner et pivoter. Le bouton XY verrouille le glissement sur un seul axe.
help_props_t=⚙ Propriétés
help_props_d=Ouvrez Propriétés depuis la barre latérale pour changer le nom, l’image, le type (statique/dynamique), la physique et plus encore. Les champs numériques ouvrent un pavé numérique.
help_events_t=⚡ Événements
help_events_d=Sélectionnez un élément, ouvrez Événements (ex. Au clic) et glissez-y des blocs pour créer la logique sans code.
help_blocks_t=🧩 Blocs
help_blocks_d=Maintenez un bloc dans la palette, puis glissez-le sous un autre (ou touchez-le simplement). Touchez un champ pour saisir une valeur ou y placer un bloc de valeur ; les blocs de valeur peuvent s’imbriquer les uns dans les autres. Maintenez un bloc pour ses options, (!) l’explique.
help_params_t=🔹 Paramètres d’événement
help_params_d=Le premier bloc d’un événement montre ses paramètres : current (cet élément), body2 (ce qu’il a heurté), event (le toucher). Maintenez-en un et glissez-en une copie dans n’importe quel champ.
help_numbers_t=🔢 Nombres et fichiers
help_numbers_d=Les champs numériques ouvrent un pavé numérique (⌫ efface, C efface tout). Les champs d’images, de sons, d’animations et de scènes ont un bouton Parcourir qui ouvre le bon dossier.
help_anims_t=🎞 Animations
help_anims_d=Dans Fichiers, ouvrez (ou créez) une animation dans le dossier anims : touchez des images pour ajouter des images à l’animation, glissez-les pour les réordonner, réglez la durée d’image et appuyez sur lecture. Utilisez-la avec le bloc setAnimation.
help_joints_t=🔗 Joints
help_joints_d=Les joints relient physiquement deux corps : roues, portes, cordes...
help_vars_t=𝑥 Variables
help_vars_d=Créez des variables comme score ou lives et utilisez-les dans les blocs.
help_assets_t=🖼 Collections
help_assets_d=Des images gratuites (CC0) que vous pouvez ajouter à votre projet depuis Fichiers → Collections.
help_play_t=▶ Jouer
help_play_d=Le bouton vert Jouer compile et lance votre jeu. Appuyez sur Retour pour l’arrêter. En cas d’échec, touchez « Demander à l’IA de corriger ».
help_lessons_t=🎓 Leçons
help_lessons_d=Sur l’écran d’accueil, l’onglet Apprendre propose des leçons pas à pas qui créent de vrais jeux avec vous.
help_ai_t=✨ Assistant IA
help_ai_d=Décrivez ce que vous voulez, ex. « fais sauter le joueur quand je touche l’écran », et il écrit le code ou explique les étapes.

# --- joints, event inputs ---
tut_add_finish=Ajoutez « %1$s » dessous : il ferme l'ancienne scène, seule la nouvelle continue.
tut_finish_inside=Glissez aussi « %1$s » dans l'ouverture « sinon », sous « %2$s » : il ferme l'ancienne scène pour que seule la nouvelle tourne.
