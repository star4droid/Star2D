bhv_n_Traffic3D = Trafic 3D
bhv_d_Traffic3D = Une voiture de ville (ou bus, bateau) conduite par le jeu : suit sa voie par des points de passage en boucle, ralentit et s'arrête derrière les autres voitures et le joueur, klaxonne, fait tourner ses roues, et peut disparaître loin de la caméra puis recommencer.
