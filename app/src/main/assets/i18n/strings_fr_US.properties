bhv_pd_Health_maxHealth = Points de vie quand il est plein.
bhv_g_Hit_points = Points de vie
bhv_p_Health_health = Health
bhv_pd_Health_health = Points de vie au début de la scène.
bhv_p_Health_invulnerableTime = Durée d’invulnérabilité
bhv_pd_Health_invulnerableTime = Après un coup, rien ne peut le blesser pendant ce temps (empêche aussi les dégâts de plusieurs ennemis qui touchent en même temps).
bhv_p_Health_regenPerSecond = Régénération par seconde
bhv_pd_Health_regenPerSecond = Points de vie récupérés par seconde (0 = pas de régénération).
bhv_p_Health_regenDelay = Délai de régénération
