bhv_p_Seat3D_promptText = Texte d'invite
bhv_pd_Seat3D_promptText = Texte 2D affiché avec le bouton (facultatif).
bhv_p_Seat3D_sitText = Texte s'asseoir
bhv_pd_Seat3D_sitText = Invite pour s'asseoir.
bhv_p_Seat3D_standText = Texte se lever
bhv_pd_Seat3D_standText = Invite pour se lever.
bhv_p_Seat3D_tapObject = Toucher l'objet
bhv_pd_Seat3D_tapObject = Toucher le siège lui-même fait aussi s'asseoir.
bhv_p_Seat3D_useKeyboard = Utiliser le clavier
bhv_pd_Seat3D_useKeyboard = La touche E assoit / lève (ordinateur, tests).
bhv_n_Shooter3D = Tireur 3D
