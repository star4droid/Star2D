bhv_p_Patrol3D_points = Points
bhv_pd_Patrol3D_points = Points de patrouille dans l'ordre (vide = errer au hasard autour du départ).
bhv_p_Patrol3D_wanderRadius = Rayon d'errance
bhv_pd_Patrol3D_wanderRadius = Distance d'errance depuis le départ quand il n'y a pas de points.
bhv_p_Patrol3D_randomOrder = Ordre aléatoire
bhv_pd_Patrol3D_randomOrder = Visiter les points dans un ordre aléatoire.
bhv_p_Patrol3D_speed = Vitesse
bhv_pd_Patrol3D_speed = Vitesse de marche.
bhv_p_Patrol3D_turnSpeed = Vitesse de rotation
bhv_pd_Patrol3D_turnSpeed = Vitesse de rotation.
