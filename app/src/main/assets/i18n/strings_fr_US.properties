bhv_p_Car_useTilt = Utiliser l’inclinaison
bhv_pd_Car_useTilt = Inclinez le téléphone pour diriger (vue de dessus).
bhv_p_Car_deadZone = Zone morte
bhv_pd_Car_deadZone = Les poussées du joystick plus petites que cela sont ignorées.
bhv_p_Car_maxSpeed = Vitesse max
bhv_pd_Car_maxSpeed = Vitesse maximale en marche avant.
bhv_g_Engine_and_brakes = Moteur et freins
bhv_p_Car_reverseSpeed = Vitesse en marche arrière
bhv_pd_Car_reverseSpeed = Vitesse maximale en marche arrière.
bhv_p_Car_acceleration = Accélération
bhv_pd_Car_acceleration = Vitesse à laquelle le moteur accélère la voiture.
bhv_p_Car_brakeForce = Force de freinage
