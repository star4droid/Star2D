bhv_pd_Respawn3D_fallHeight = Réapparaît quand il tombe sous cette hauteur.
bhv_p_Respawn3D_onDeath = À la mort
bhv_pd_Respawn3D_onDeath = Réapparaît quand sa Santé 3D atteint 0 (et le ranime).
bhv_p_Respawn3D_deathDelay = Délai après la mort
bhv_pd_Respawn3D_deathDelay = Attend ce temps après la mort.
bhv_p_Respawn3D_lift = Portance
bhv_pd_Respawn3D_lift = Le soulève d'autant au-dessus du point enregistré.
bhv_p_Respawn3D_sound = Son
bhv_pd_Respawn3D_sound = Son à la réapparition.
bhv_p_Respawn3D_shake = Secousse
bhv_pd_Respawn3D_shake = Secoue la caméra à la réapparition (0 = non).
bhv_n_Rotator3D = Rotateur 3D
bhv_d_Rotator3D = Fait tourner l'élément sans fin autour de X, Y et Z : ventilateurs, roues, pièces, moulins, radars. Peut accélérer en douceur et compter les tours complets.
bhv_e_Rotator3D_onTurn = À chaque tour
bhv_p_Rotator3D_speedX = Vitesse x
bhv_pd_Rotator3D_speedX = Vitesse de rotation autour de X (tangage).
bhv_p_Rotator3D_speedY = Vitesse y
bhv_pd_Rotator3D_speedY = Vitesse de rotation autour de Y (cap).
bhv_p_Rotator3D_speedZ = Vitesse z
bhv_pd_Rotator3D_speedZ = Vitesse de rotation autour de Z (roulis).
bhv_p_Rotator3D_localAxes = Axes locaux
