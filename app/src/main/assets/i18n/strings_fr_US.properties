bhv_p_PathFollower3D_speed = Vitesse
bhv_pd_PathFollower3D_speed = Vitesse de déplacement.
bhv_p_PathFollower3D_acceleration = Accélération
bhv_pd_PathFollower3D_acceleration = À quelle vitesse il atteint sa vitesse (0 = immédiat).
bhv_p_PathFollower3D_turnSpeed = Vitesse de rotation
bhv_pd_PathFollower3D_turnSpeed = Vitesse de rotation vers le point suivant (0 = ne tourne jamais).
bhv_p_PathFollower3D_arriveDistance = Distance d'arrivée
