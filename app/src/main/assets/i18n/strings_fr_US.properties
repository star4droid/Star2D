bhv_n_Respawn3D = Réapparition 3D
bhv_d_Respawn3D = Ramène le joueur (ou une voiture, une balle) au départ ou au dernier point de contrôle quand il tombe du monde ou meurt (Santé 3D) : arrêté, debout et tourné dans le sens enregistré. Les points de contrôle s'enregistrent par des blocs ou des événements de Zone 3D.
