tpl_EndlessRoad3D_tag = 3D / Arcade
tpl_EndlessRoad3D_desc = Autoroute sans fin : évitez la circulation, ramassez des pièces, la vitesse augmente avec la distance. Score, distance et vitesse à l'écran.
