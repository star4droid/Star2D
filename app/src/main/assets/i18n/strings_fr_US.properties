bhv_n_JumpPad3D = Tremplin 3D
bhv_d_JumpPad3D = Projette en l'air quiconque marche dessus (et en avant si vous voulez) : trampolines, plaques d'accélération, rampes de lancement. Marche pour les corps physiques, les personnages pilotés et les voitures.
