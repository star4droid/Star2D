bhv_p_Car_rollingResistance = Résistance au roulement
bhv_pd_Car_rollingResistance = Ralentissement quand rien n’est pressé.
bhv_p_Car_maxSteerAngle = Angle de braquage max
bhv_pd_Car_maxSteerAngle = Plus grand angle des roues avant.
bhv_g_Steering__top_down_ = Direction (vue de dessus)
bhv_p_Car_steerSpeed = Vitesse de braquage
bhv_pd_Car_steerSpeed = Vitesse à laquelle les roues tournent vers l’angle voulu.
bhv_p_Car_steerReduction = Réduction du braquage
