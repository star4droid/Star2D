bhv_n_Chase = Poursuite
bhv_d_Chase = Court après une cible (le joueur) quand elle s’approche, abandonne si elle s’éloigne trop et peut rentrer chez lui. Idéal pour les ennemis ; ajoutez une Patrouille sur le même élément pour des gardes qui vous poursuivent quand ils vous voient.
bhv_p_Chase_target = Cible
bhv_pd_Chase_target = L’élément à poursuivre (en général le joueur).
bhv_p_Chase_sightRange = Portée de vue
bhv_pd_Chase_sightRange = Commence à poursuivre quand la cible est plus proche que cette distance.
bhv_p_Chase_giveUpRange = Portée d’abandon
bhv_pd_Chase_giveUpRange = Arrête la poursuite quand la cible est plus loin que cette distance (plus grande que la portée de vue).
bhv_p_Chase_needLineOfSight = Ligne de vue requise
bhv_pd_Chase_needLineOfSight = Activé : les murs entre lui et la cible la cachent. Désactivé : il sent la cible à travers les murs.
bhv_p_Chase_speed = Vitesse
bhv_pd_Chase_speed = Vitesse de course.
bhv_p_Chase_acceleration = Accélération
bhv_pd_Chase_acceleration = Vitesse pour atteindre la vitesse. 0 = instantané.
bhv_p_Chase_stopDistance = Distance d’arrêt
bhv_pd_Chase_stopDistance = S’arrête à cette distance de la cible (et déclenche onReachTarget).
bhv_p_Chase_horizontalOnly = Horizontal seulement
bhv_pd_Chase_horizontalOnly = Gauche/droite seulement (ennemis au sol soumis à la gravité). Désactivé : vole droit vers la cible sans gravité.
bhv_p_Chase_returnHome = Retour au départ
bhv_pd_Chase_returnHome = Après l’abandon, retourne à son point de départ.
bhv_p_Chase_flipToDirection = Retourner l’image
bhv_pd_Chase_flipToDirection = Retourne l’image vers la direction du mouvement.
bhv_p_Chase_artFacesLeft = L’image regarde à gauche
bhv_pd_Chase_artFacesLeft = L’image est dessinée tournée vers la gauche.
bhv_p_Chase_faceTarget = Faire face à la cible
bhv_pd_Chase_faceTarget = Tourne l’élément vers la cible (ennemis vus de dessus).
bhv_p_Chase_faceOffset = Angle du visage
bhv_pd_Chase_faceOffset = Angle de l’image quand elle regarde à droite (0 = droite, 90 = haut...).
bhv_n_Patrol = Patrouille
bhv_d_Patrol = Fait des allers-retours tout seul (ennemis, gardes, dangers mobiles) : une distance de chaque côté ou des éléments points de passage. Attend aux extrémités, retourne son image et peut faire demi-tour aux murs et aux bords. Se met en pause pendant qu’une Poursuite du même élément poursuit.
bhv_p_Patrol_mode = Mode
bhv_pd_Patrol_mode = DISTANCE : va-et-vient autour de la position de départ. WAYPOINTS : visite les éléments de la liste dans l’ordre.
bhv_p_Patrol_axis = Axe
bhv_pd_Patrol_axis = DISTANCE seulement : gauche/droite ou haut/bas.
bhv_p_Patrol_rangeBack = Portée arrière
bhv_pd_Patrol_rangeBack = DISTANCE seulement : distance à gauche (ou en bas) du départ.
bhv_p_Patrol_rangeForward = Portée avant
bhv_pd_Patrol_rangeForward = DISTANCE seulement : distance à droite (ou en haut) du départ.
bhv_p_Patrol_startBackwards = Commencer en arrière
bhv_pd_Patrol_startBackwards = DISTANCE seulement : va d’abord à gauche / en bas.
bhv_p_Patrol_waypoints = Points de passage
bhv_pd_Patrol_waypoints = WAYPOINTS seulement : éléments à rejoindre dans l’ordre (peuvent rester invisibles).
bhv_p_Patrol_loopWaypoints = Boucler les points
bhv_pd_Patrol_loopWaypoints = WAYPOINTS seulement : après le dernier, retourne au premier (boucle). Désactivé = retour par le même trajet.
bhv_p_Patrol_speed = Vitesse
bhv_pd_Patrol_speed = Vitesse de marche.
bhv_p_Patrol_waitTime = Temps d’attente
bhv_pd_Patrol_waitTime = Durée d’attente à chaque extrémité / point.
bhv_p_Patrol_flying = Vole
bhv_pd_Patrol_flying = Ignore la gravité (oiseaux, drones). Les trajets verticaux et points de passage l’ignorent toujours.
bhv_p_Patrol_flipOnTurn = Retourner au demi-tour
bhv_pd_Patrol_flipOnTurn = Retourne l’image quand il marche à gauche.
bhv_p_Patrol_artFacesLeft = L’image regarde à gauche
bhv_pd_Patrol_artFacesLeft = L’image est dessinée tournée vers la gauche (retournée en marchant à droite).
bhv_p_Patrol_turnAtWalls = Demi-tour aux murs
bhv_pd_Patrol_turnAtWalls = Fait demi-tour quand un mur (statique ou plateforme mobile) est juste devant. Éléments physiques seulement.
bhv_p_Patrol_turnAtLedges = Demi-tour aux bords
bhv_pd_Patrol_turnAtLedges = Fait demi-tour au lieu de tomber d’un bord. Éléments physiques seulement.
bhv_p_Patrol_ledgeDepth = Profondeur du bord
bhv_pd_Patrol_ledgeDepth = Profondeur de sol requise sous ses pieds pour continuer à marcher.
bhv_p_Patrol_yieldToChase = Laisser la poursuite
bhv_pd_Patrol_yieldToChase = Ne fait rien pendant qu’une Poursuite de cet élément poursuit.
