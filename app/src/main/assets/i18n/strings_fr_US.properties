ui_joint_desc_RevoluteJoint=Pivote autour d'un point : roues, portes, pendules.
ui_joint_desc_PrismaticJoint=Glisse le long d'un axe : pistons, ascenseurs.
ui_joint_desc_DistanceJoint=Garde deux corps à distance (bâton / ressort).
ui_joint_desc_PulleyJoint=Deux corps suspendus à une poulie.
