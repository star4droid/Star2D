bhv_p_Projectile3D_targetPrefix = Préfixe de cible
bhv_pd_Projectile3D_targetPrefix = Ne blesse que les éléments dont le nom commence ainsi (vide = tout ce qui a de la santé).
bhv_p_Projectile3D_destroyOnHit = Détruire à l'impact
bhv_pd_Projectile3D_destroyOnHit = Disparaît quand il touche quelque chose.
bhv_p_Projectile3D_impactEffect = Effet d'impact
bhv_pd_Projectile3D_impactEffect = Élément copié au point d'impact (étincelles, marque ; supprimé après 2 s). Facultatif.
