bhv_n_CameraFollow = Camera Follow
bhv_d_CameraFollow = La caméra suit un élément en douceur, avec une zone morte, une anticipation dans le sens du mouvement, des limites de scène et un zoom. Fonctionne avec Camera Shake. Placez-le sur le joueur ou sur n’importe quel élément et choisissez la cible.
bhv_g_Camera = Caméra
bhv_p_CameraFollow_target = Cible
bhv_pd_CameraFollow_target = L’élément à suivre. Vide = l’élément qui a ce comportement.
bhv_g_Target = Cible
bhv_p_CameraFollow_followX = Suivre x
bhv_pd_CameraFollow_followX = Suivre horizontalement.
bhv_p_CameraFollow_followY = Suivre y
bhv_pd_CameraFollow_followY = Suivre verticalement.
bhv_p_CameraFollow_offsetX = Décalage x
bhv_pd_CameraFollow_offsetX = Regarder jusqu’à cette distance à droite de la cible (négatif = à gauche).
bhv_p_CameraFollow_offsetY = Décalage y
bhv_pd_CameraFollow_offsetY = Regarder jusqu’à cette distance au-dessus de la cible (négatif = en dessous).
bhv_p_CameraFollow_snapOnStart = Placer au démarrage
bhv_pd_CameraFollow_snapOnStart = Place la caméra sur la cible au début (désactivé : glisse depuis la position actuelle de la caméra).
bhv_p_CameraFollow_followSpeed = Vitesse de suivi
bhv_pd_CameraFollow_followSpeed = Vitesse de rattrapage de la caméra. Plus élevé = plus serré. 0 = collée à la cible.
bhv_g_Feel = Ressenti
bhv_p_CameraFollow_deadZoneWidth = Largeur de la zone morte
bhv_pd_CameraFollow_deadZoneWidth = La cible peut se déplacer latéralement de cette distance avant que la caméra ne bouge.
bhv_p_CameraFollow_deadZoneHeight = Hauteur de la zone morte
bhv_pd_CameraFollow_deadZoneHeight = Pareil pour le mouvement vertical.
bhv_p_CameraFollow_lookAhead = Anticipation
bhv_pd_CameraFollow_lookAhead = La caméra regarde jusqu’à cette distance devant, dans le sens du déplacement de la cible (cibles physiques).
bhv_p_CameraFollow_lookAheadSpeed = Vitesse d’anticipation
bhv_pd_CameraFollow_lookAheadSpeed = Vitesse de la cible à laquelle l’anticipation est complète.
bhv_p_CameraFollow_zoom = Zoom
bhv_pd_CameraFollow_zoom = 1 = vue normale de la scène, 2 = deux fois plus près, 0.5 = deux fois plus loin.
bhv_g_Zoom = Zoom
bhv_p_CameraFollow_zoomSpeed = Vitesse du zoom
bhv_pd_CameraFollow_zoomSpeed = Vitesse de changement du zoom. 0 = immédiat.
bhv_p_CameraFollow_useBounds = Utiliser les limites
bhv_pd_CameraFollow_useBounds = Garde la vue à l’intérieur du rectangle ci-dessous (la taille de votre niveau), pour ne jamais montrer le vide extérieur.
bhv_g_Limits = Limites
bhv_p_CameraFollow_boundsLeft = Limite gauche
bhv_p_CameraFollow_boundsBottom = Limite bas
bhv_p_CameraFollow_boundsRight = Limite droite
bhv_p_CameraFollow_boundsTop = Limite haut
bhv_n_CameraShake = Camera Shake
bhv_d_CameraShake = Secousse d’écran pour les coups, explosions et atterrissages. Appelez shake avec une force de 0 à 1 ; les coups forts secouent bien plus que les faibles et s’estompent d’eux-mêmes. La santé peut aussi le déclencher (Shake on hit). Fonctionne avec ou sans Camera Follow.
bhv_p_CameraShake_maxOffset = Décalage max
bhv_pd_CameraShake_maxOffset = Plus grand déplacement de la caméra à pleine force.
bhv_g_Shake = Secousse
bhv_p_CameraShake_frequency = Fréquence
bhv_pd_CameraShake_frequency = Vitesse du tremblement.
bhv_p_CameraShake_decay = Atténuation
bhv_pd_CameraShake_decay = Vitesse à laquelle la force s’estompe, par seconde (1 = une secousse complète dure une seconde).
bhv_p_CameraShake_power = Puissance
bhv_pd_CameraShake_power = 2 rend les coups faibles très doux et les coups forts violents ; 1 est linéaire.
bhv_p_CameraShake_shakeX = Secousse x
bhv_pd_CameraShake_shakeX = Secoue sur les côtés.
bhv_p_CameraShake_shakeY = Secousse y
bhv_pd_CameraShake_shakeY = Secoue de haut en bas.
bhv_p_CameraShake_shakeOnStart = Secousse au démarrage
bhv_pd_CameraShake_shakeOnStart = Secoue une fois au démarrage de la scène (0 = non).
bhv_n_DamageOnTouch = Damage On Touch
bhv_d_DamageOnTouch = Pointes, lave, ennemis, scies : blesse les éléments qui le touchent (ils ont besoin d’un comportement Health ou Destructible), une fois par contact ou à répétition, avec recul.
bhv_g_Combat = Combat
bhv_note_DamageOnTouch = Nécessite un élément physique. Les cibles sont trouvées par les contacts, donc un corps Dynamic doit être impliqué ; les cibles de la liste sont aussi détectées par chevauchement.
bhv_p_DamageOnTouch_targets = Cibles
bhv_pd_DamageOnTouch_targets = Éléments qui sont blessés. Laissez les deux champs vides pour blesser tout ce qui a un comportement Health.
bhv_g_Who_gets_hurt = Qui est blessé
bhv_p_DamageOnTouch_targetPrefix = Préfixe des cibles
bhv_pd_DamageOnTouch_targetPrefix = Blesse aussi les éléments dont le nom commence par l’un de ces mots (séparés par des virgules), ex. player, hero.
bhv_p_DamageOnTouch_damage = Dégâts
bhv_pd_DamageOnTouch_damage = Points de vie retirés par un coup.
bhv_g_Damage = Dégâts
bhv_p_DamageOnTouch_repeatEvery = Répéter toutes les
bhv_pd_DamageOnTouch_repeatEvery = 0 = blesse une seule fois au début du contact. Sinon blesse à nouveau à cette fréquence tant que le contact dure (lave, feu).
bhv_p_DamageOnTouch_autoHealth = Vie automatique
bhv_pd_DamageOnTouch_autoHealth = Donne ce nombre de points de vie à une cible sans Health pour qu’elle puisse mourir (0 = ne pas y toucher).
bhv_p_DamageOnTouch_destroySelfOnHit = Se détruire au coup
bhv_pd_DamageOnTouch_destroySelfOnHit = Cet élément disparaît après avoir blessé quelque chose (mines, objets lancés).
bhv_p_DamageOnTouch_knockback = Recul
bhv_pd_DamageOnTouch_knockback = Repousse la cible horizontalement, en px/s (0 = aucun).
bhv_g_Reaction = Réaction
bhv_p_DamageOnTouch_knockbackUp = Recul vers le haut
bhv_pd_DamageOnTouch_knockbackUp = Repousse la cible vers le haut, en px/s.
bhv_p_DamageOnTouch_stunTime = Durée d’étourdissement
bhv_pd_DamageOnTouch_stunTime = Les comportements de mouvement de la cible restent désactivés pendant ce temps pour que la poussée soit visible (voir Health > Stun behaviors).
bhv_p_DamageOnTouch_hitSound = Son du coup
bhv_pd_DamageOnTouch_hitSound = Joué quand il blesse quelque chose.
bhv_n_Destructible = Destructible
bhv_d_Destructible = Caisses, briques, murs : se brise après un certain nombre de coups (balles, DamageOnTouch, ou une balle qui le touche), montre des images endommagées en chemin et peut lâcher un objet.
bhv_note_Destructible = Nécessite un élément physique. Les coups par contact viennent des contacts, donc un corps Dynamic (une balle, un joueur) doit être impliqué.
bhv_p_Destructible_hits = Coups
bhv_pd_Destructible_hits = Nombre de coups nécessaires.
bhv_g_Durability = Durabilité
bhv_p_Destructible_everyHitCountsOne = Chaque coup compte un
bhv_pd_Destructible_everyHitCountsOne = Chaque coup compte pour 1 quelle que soit sa puissance. Désactivé : les points de dégâts sont soustraits des coups.
bhv_p_Destructible_hitters = Frappeurs
bhv_pd_Destructible_hitters = Éléments qui le blessent en le touchant (une balle pour des briques).
bhv_g_Hit_by_touching = Touché par contact
bhv_p_Destructible_hitterPrefix = Préfixe des frappeurs
bhv_pd_Destructible_hitterPrefix = Aussi les éléments dont le nom commence par l’un de ces mots, ex. ball (séparés par des virgules).
bhv_p_Destructible_damagedImage1 = Image endommagée 1
bhv_pd_Destructible_damagedImage1 = Image après les premiers coups (facultatif). Jusqu’à trois images sont réparties selon les dégâts.
bhv_g_Look = Aspect
bhv_p_Destructible_damagedImage2 = Image endommagée 2
bhv_pd_Destructible_damagedImage2 = Image après davantage de coups (facultatif).
bhv_p_Destructible_damagedImage3 = Image endommagée 3
bhv_pd_Destructible_damagedImage3 = Image juste avant qu’il ne se brise (facultatif).
bhv_p_Destructible_hitSound = Son du coup
bhv_pd_Destructible_hitSound = Joué à chaque coup qui ne le brise pas.
bhv_p_Destructible_breakSound = Son de bris
bhv_pd_Destructible_breakSound = Joué quand il se brise.
bhv_p_Destructible_breakAction = Action de bris
bhv_pd_Destructible_breakAction = DESTROY le retire, HIDE le garde (invisible, sans collision) pour pouvoir le ramener avec reset.
bhv_g_When_it_breaks = Quand il se brise
bhv_p_Destructible_breakDelay = Délai de bris
bhv_pd_Destructible_breakDelay = Attend ce temps avant de disparaître (le temps de votre propre effet).
bhv_p_Destructible_dropItem = Objet lâché
bhv_pd_Destructible_dropItem = Élément copié quand il se brise (bonus, pièce...). Placez l’original n’importe où : il est caché au démarrage du jeu. Facultatif.
bhv_p_Destructible_dropChance = Chance de lâcher
bhv_pd_Destructible_dropChance = Probabilité du lâcher.
bhv_n_Health = Health
bhv_d_Health = Points de vie pour n’importe quel élément : dégâts, soins, images d’invulnérabilité, régénération, une barre de progression qui suit la vie et ce qui se passe à la mort (détruire, cacher, réapparaître, redémarrer la scène ou en ouvrir une autre).
