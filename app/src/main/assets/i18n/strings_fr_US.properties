bhv_p_JumpPad3D_forwardSpeed = Vitesse vers l'avant
bhv_pd_JumpPad3D_forwardSpeed = Poussée vers l'avant du tremplin (-Z).
bhv_p_JumpPad3D_cooldown = Temps de recharge
bhv_pd_JumpPad3D_cooldown = Attend ce temps avant de relancer le même élément.
bhv_p_JumpPad3D_sound = Son
bhv_pd_JumpPad3D_sound = Son d'un lancement.
bhv_n_Lifetime3D = Durée de vie 3D
bhv_d_Lifetime3D = Supprime l'élément après quelques secondes, en rétrécissant ou en s'estompant à la fin : ennemis créés, effets, débris, impacts de balles, plateformes temporaires.
bhv_e_Lifetime3D_onExpire = À l'expiration
bhv_p_Lifetime3D_lifetime = Durée de vie
bhv_pd_Lifetime3D_lifetime = Secondes avant sa suppression.
