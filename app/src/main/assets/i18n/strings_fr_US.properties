bhv_p_Projectile3D_lifetime = Durée de vie
bhv_pd_Projectile3D_lifetime = Disparaît après autant de secondes.
bhv_p_Projectile3D_faceVelocity = Suivre la trajectoire
bhv_pd_Projectile3D_faceVelocity = Se tourne dans le sens du vol (flèches).
bhv_p_Projectile3D_damage = Dégâts
