tpl_City3D_title = Conduite en ville 3D
tpl_City3D_tag = 3D / Conduite
tpl_City3D_desc = Conduisez une voiture aux vraies roues dans une petite ville 3D : joystick ou pédales, caméra qui suit, mini-carte et circulation.
tpl_HorrorHouse3D_title = Maison hantée 3D
tpl_HorrorHouse3D_tag = 3D / Horreur
tpl_HorrorHouse3D_desc = Faites le tour d'une maison la nuit, trouvez la clé, ouvrez les portes qui grincent, montez l'escalier et explorez à la lampe torche. Inventaire, sons et effets d'écran.
