bhv_p_Car_mode = Mode
bhv_pd_Car_mode = TOP_DOWN : une voiture vue de dessus. SIDE_SCROLLER : la liste de roues est pilotée par des moteurs (construisez la voiture avec des joints dans l’éditeur).
