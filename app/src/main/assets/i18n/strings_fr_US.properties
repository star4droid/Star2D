bhv_p_Lifetime3D_fadeTime = Durée de fondu
bhv_pd_Lifetime3D_fadeTime = S'estompe à la fin (matériaux transparents).
bhv_p_Lifetime3D_hideOnly = Masquer seulement
bhv_pd_Lifetime3D_hideOnly = Le masque seulement (peut être réaffiché) au lieu de le supprimer.
bhv_n_LookAtTarget3D = Regarder la cible 3D
bhv_d_LookAtTarget3D = Se tourne en douceur vers une cible à portée : tourelles, caméras de sécurité, statues dont les yeux vous suivent, projecteur qui suit le joueur. Peut balayer à gauche et à droite quand il ne voit personne.
