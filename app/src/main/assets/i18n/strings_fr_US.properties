bhv_p_Pickup3D_button = Bouton
bhv_pd_Pickup3D_button = Bouton 2D à toucher pour ramasser (vide = ramassé simplement en entrant à portée).
bhv_p_Pickup3D_promptText = Texte d'invite
bhv_pd_Pickup3D_promptText = Texte 2D affiché avec le bouton (facultatif).
