bhv_pd_Patrol3D_walkClip = Animation en marchant (vide = aucune).
bhv_p_Patrol3D_idleClip = Animation de repos
bhv_pd_Patrol3D_idleClip = Animation à l'arrêt (vide = aucune).
bhv_n_Pickup3D = Ramassable 3D
bhv_d_Pickup3D = Un objet que le joueur range dans l'inventaire : clés, piles, pièces, notes, munitions. Ramassé en marchant dessus ou en touchant un bouton 2D de près ; joue un son, vole vers le joueur et disparaît (ou revient plus tard).
