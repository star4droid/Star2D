bhv_p_Car_frontAxle = Essieu avant
bhv_pd_Car_frontAxle = Distance entre le centre de la voiture et l’essieu avant. 0 (avec l’essieu arrière à 0) = 35 % du côté le plus long.
bhv_p_Car_rearAxle = Essieu arrière
