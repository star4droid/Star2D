bhv_pd_Shooter3D_shootSound = Son d'un tir.
bhv_p_Shooter3D_emptySound = Son à vide
bhv_pd_Shooter3D_emptySound = Son quand il n'y a plus de munitions.
bhv_n_Spawner3D = Générateur 3D
bhv_d_Spawner3D = Crée des copies d'un élément modèle à cet endroit toutes les quelques secondes : ennemis, caisses qui tombent, pièces, voitures, pluie de rochers. Zone aléatoire, limite d'éléments vivants en même temps, total, lancer initial et durée de vie automatique.
bhv_e_Spawner3D_onSpawn = À la création
bhv_e_Spawner3D_onAllSpawned = Quand tout est créé
bhv_p_Spawner3D_templates = Modèles
bhv_pd_Spawner3D_templates = L'élément à copier (caché au départ). Plusieurs = un au hasard à chaque fois.
bhv_p_Spawner3D_interval = Intervalle
bhv_pd_Spawner3D_interval = Secondes entre deux copies.
bhv_p_Spawner3D_randomExtra = Supplément aléatoire
bhv_pd_Spawner3D_randomExtra = Attente aléatoire ajoutée à chaque intervalle.
bhv_p_Spawner3D_startDelay = Délai de départ
bhv_pd_Spawner3D_startDelay = Attend ce temps avant la première copie.
bhv_p_Spawner3D_autoStart = Démarrage auto
bhv_pd_Spawner3D_autoStart = Commence à créer au début du jeu (sinon un bloc le lance).
bhv_p_Spawner3D_maxAlive = Max en vie
bhv_pd_Spawner3D_maxAlive = Copies vivantes maximum en même temps (0 = sans limite).
bhv_p_Spawner3D_totalLimit = Limite totale
bhv_pd_Spawner3D_totalLimit = S'arrête après autant de copies au total (0 = jamais).
bhv_p_Spawner3D_areaRadius = Rayon de zone
bhv_pd_Spawner3D_areaRadius = Endroit aléatoire à cette distance du générateur (0 = exactement ici).
bhv_p_Spawner3D_useSpawnerRotation = Rotation du générateur
bhv_pd_Spawner3D_useSpawnerRotation = Les copies regardent dans le même sens que le générateur (sinon elles gardent le cap du modèle).
bhv_p_Spawner3D_launchSpeed = Vitesse de lancer
bhv_pd_Spawner3D_launchSpeed = Vitesse de lancer vers l'avant du générateur (copies DYNAMIC ; les projectiles volent).
bhv_p_Spawner3D_launchUp = Lancer vers le haut
bhv_pd_Spawner3D_launchUp = Vitesse de lancer vers le haut.
bhv_p_Spawner3D_copyLifetime = Durée de vie des copies
bhv_pd_Spawner3D_copyLifetime = Les copies sont supprimées après autant de secondes (0 = elles restent).
bhv_n_Swing3D = Balancier 3D
bhv_d_Swing3D = Se balance comme un pendule autour d'un pivot au-dessus (ou à côté) de l'élément : lampes suspendues, enseignes, balançoires, pièges à hache. Peut s'amortir lentement et être relancé par des blocs.
bhv_p_Swing3D_angle = Angle
bhv_pd_Swing3D_angle = Angle maximal de chaque côté.
bhv_p_Swing3D_period = Période
bhv_pd_Swing3D_period = Secondes pour un balancement complet (aller-retour).
bhv_p_Swing3D_axis = Axe
bhv_pd_Swing3D_axis = X / Z : se balance comme un pendule, Y : tourne à gauche et à droite comme une tête de ventilateur.
bhv_p_Swing3D_damping = Amortissement
bhv_pd_Swing3D_damping = À quelle vitesse le balancement s'amortit (0 = sans fin).
bhv_p_Swing3D_pivotHeight = Hauteur du pivot
bhv_pd_Swing3D_pivotHeight = Pivot au-dessus de la position de l'élément (longueur du fil d'une lampe).
bhv_p_Swing3D_phase = Phase
bhv_pd_Swing3D_phase = Début du cycle (0..1), pour que les copies se balancent en décalé.
bhv_n_ThirdPersonController3D = Contrôleur troisième personne 3D
bhv_d_ThirdPersonController3D = Un personnage vu de dos : le joystick le déplace par rapport à la caméra, il se tourne vers où il marche, saute, court et joue ses animations repos / marche / course / saut. Glissez pour tourner la caméra, pincez pour zoomer.
bhv_e_ThirdPersonController3D_onJump = Au saut
bhv_e_ThirdPersonController3D_onLand = À l'atterrissage
bhv_p_ThirdPersonController3D_joystick = Joystick
bhv_pd_ThirdPersonController3D_joystick = Joystick qui déplace le personnage (haut = en s'éloignant de la caméra).
bhv_p_ThirdPersonController3D_jumpButton = Bouton de saut
bhv_pd_ThirdPersonController3D_jumpButton = Bouton de saut (n'importe quel élément).
bhv_p_ThirdPersonController3D_runButton = Bouton de course
bhv_pd_ThirdPersonController3D_runButton = Bouton de course : maintenu = courir.
bhv_p_ThirdPersonController3D_useKeyboard = Utiliser le clavier
bhv_pd_ThirdPersonController3D_useKeyboard = WASD / flèches pour bouger, espace pour sauter, Maj pour courir (ordinateur, tests).
bhv_p_ThirdPersonController3D_runAtFullPush = Courir à fond
bhv_pd_ThirdPersonController3D_runAtFullPush = Court quand le joystick est poussé presque au bord.
bhv_p_ThirdPersonController3D_deadZone = Zone morte
bhv_pd_ThirdPersonController3D_deadZone = Les poussées du joystick plus petites que ça sont ignorées.
