bhv_p_SpaceShip_deadZone = Zone morte
bhv_pd_SpaceShip_deadZone = Les poussées du joystick plus petites que cela sont ignorées.
bhv_p_SpaceShip_thrust = Poussée
bhv_pd_SpaceShip_thrust = Accélération vers l’avant.
bhv_p_SpaceShip_maxSpeed = Vitesse max
bhv_pd_SpaceShip_maxSpeed = Limite de vitesse.
bhv_p_SpaceShip_rotateSpeed = Vitesse de rotation
bhv_pd_SpaceShip_rotateSpeed = Vitesse de virage.
