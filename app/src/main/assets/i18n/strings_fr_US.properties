# --- racing v2, sizes ---
tut_set_w=Les nouveaux éléments sont petits. Mettez la largeur à %1$s.
tut_set_h=Mettez la hauteur à %1$s.
tut_bounce_zero=Mettez restitution (rebond) à %1$s pour que le héros atterrisse sans rebondir.
tut_road_info=Maintenant la route. road1 et road2 partagent les mêmes événements (leur Script est road) : les blocs ajoutés marchent pour les deux.
tut_road_created=Touchez OnBodyCreated : il s'exécute une fois pour chaque morceau de route.
tut_road_speed=Mettez la vitesse à %1$s : la route descend, la voiture semble avancer.
tut_road_update=Touchez OnBodyUpdate : quand un morceau sort par le bas, il saute au-dessus de l'autre.
tut_road_limit=Tapez %1$s dans le second cercle : le milieu du morceau est une demi-hauteur sous l'écran, donc invisible.
tut_moveby_inside=Glissez « %1$s » dans « %2$s » : il déplace un élément d'une distance.
tut_moveby_dx=Mettez dx à %1$s (pas de déplacement latéral).
tut_moveby_dy=Mettez dy à %1$s : deux morceaux plus haut, juste au-dessus de l'autre.
tut_rival_info=Les trois voitures rivales partagent aussi leurs événements (Script : rival). Elles descendent plus lentement que la route : on dirait des voitures plus lentes que vous doublez.

