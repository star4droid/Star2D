bhv_d_SpaceShip = Vaisseau façon Asteroids : tourne à gauche/droite, pousse vers l’avant dans la direction du regard, traînée, limite de vitesse et boost facultatif. Dirigez avec un joystick, des boutons, le clavier ou en inclinant le téléphone. Nécessite une gravité de 0.
