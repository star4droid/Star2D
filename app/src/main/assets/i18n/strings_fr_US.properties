bhv_p_Car_rightButton = Bouton droit
bhv_pd_Car_rightButton = Vue de dessus : tourne à droite. Défilement latéral : avance vers la droite / se penche à droite en l’air.
bhv_p_Car_handbrakeButton = Bouton de frein à main
bhv_pd_Car_handbrakeButton = Bloque l’arrière : la voiture glisse et dérape (vue de dessus) ou les roues s’arrêtent (défilement latéral).
