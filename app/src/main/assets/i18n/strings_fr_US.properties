bhv_p_PathFollower3D_waitTime = Temps d'attente
bhv_pd_PathFollower3D_waitTime = Attente à chaque point.
bhv_p_PathFollower3D_modelYawOffset = Décalage de cap du modèle
bhv_pd_PathFollower3D_modelYawOffset = Cap supplémentaire quand le modèle regarde +Z au lieu de -Z.
bhv_n_Patrol3D = Patrouille 3D
bhv_d_Patrol3D = Gardes et monstres marchent entre des points de patrouille (ou errent autour de leur départ), s'arrêtent, regardent autour, puis repartent, avec les animations marche et repos. Se met en pause tout seul quand une Poursuite 3D du même élément poursuit.
