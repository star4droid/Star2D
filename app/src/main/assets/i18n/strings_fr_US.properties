ov_help = Variables de cet objet. Chaque événement de l'objet (tous ses blocs) les utilise par leur nom, ex. health = health - 1. Chaque copie de l'objet a ses propres valeurs, à partir de la valeur initiale.\n\nAutres objets : blocs « modifier la variable d'un objet » et « variable nombre ___ de ___ ». Java : ObjectVars.getFloat(item, "health"), item.setVar("health", 3), item.getVarNumber("health").\n\nUn bloc « Variable locale » peut devenir une variable d'objet : appui long dessus dans l'éditeur de blocs.
