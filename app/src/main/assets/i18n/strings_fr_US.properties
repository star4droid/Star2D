bhv_p_Rotator3D_spinUpTime = Durée de démarrage
bhv_pd_Rotator3D_spinUpTime = Secondes pour atteindre la pleine vitesse au départ (0 = immédiat).
bhv_p_Rotator3D_running = En marche
bhv_pd_Rotator3D_running = Tourne au début du jeu (des blocs peuvent l'arrêter et le relancer).
bhv_n_Seat3D = Siège 3D
bhv_d_Seat3D = Une chaise, un banc ou un canapé où le joueur peut s'asseoir : un bouton 2D apparaît de près, la caméra glisse en douceur vers le siège (on peut toujours regarder autour) et le contrôleur de déplacement se met en pause ; touchez à nouveau pour se lever devant.
bhv_e_Seat3D_onSit = En s'asseyant
bhv_e_Seat3D_onStand = En se levant
bhv_p_Seat3D_player = Joueur
bhv_pd_Seat3D_player = L'élément joueur dont le contrôleur se met en pause (vide = ce que suit la caméra principale, ou la caméra elle-même).
bhv_p_Seat3D_camera = Caméra
bhv_pd_Seat3D_camera = Caméra qui va vers le siège (vide = la caméra principale).
bhv_p_Seat3D_range = Portée
bhv_pd_Seat3D_range = Utilisable à cette distance.
