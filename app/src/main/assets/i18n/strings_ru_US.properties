bhv_e_FirstPersonController3D_onJump = При прыжке
bhv_e_FirstPersonController3D_onLand = При приземлении
bhv_e_FirstPersonController3D_onStep = При шаге
bhv_p_FirstPersonController3D_joystick = Джойстик
bhv_pd_FirstPersonController3D_joystick = Джойстик ходьбы (вверх = вперёд).
bhv_p_FirstPersonController3D_lookJoystick = Джойстик обзора
bhv_pd_FirstPersonController3D_lookJoystick = Необязательный второй джойстик для поворота обзора (вместо перетаскивания).
bhv_p_FirstPersonController3D_jumpButton = Кнопка прыжка
bhv_pd_FirstPersonController3D_jumpButton = Кнопка прыжка (любой элемент).
bhv_p_FirstPersonController3D_runButton = Кнопка бега
bhv_pd_FirstPersonController3D_runButton = Кнопка бега: удерживать = бег.
bhv_p_FirstPersonController3D_dragToLook = Тянуть для обзора
bhv_pd_FirstPersonController3D_dragToLook = Тяните по пустому экрану, чтобы осмотреться.
bhv_p_FirstPersonController3D_useKeyboard = Использовать клавиатуру
bhv_pd_FirstPersonController3D_useKeyboard = WASD / стрелки — ходьба, Q/E — поворот, пробел — прыжок, shift — бег (компьютер, тесты).
bhv_p_FirstPersonController3D_deadZone = Мёртвая зона
bhv_pd_FirstPersonController3D_deadZone = Отклонения джойстика меньше этого игнорируются.
bhv_p_FirstPersonController3D_camera = Камера
bhv_pd_FirstPersonController3D_camera = Камера глаз (пусто = главная камера). Игнорируется, если поведение стоит на камере.
bhv_p_FirstPersonController3D_eyeHeight = Высота глаз
bhv_pd_FirstPersonController3D_eyeHeight = Глаза над ногами.
bhv_p_FirstPersonController3D_lookSensitivity = Чувствительность обзора
bhv_pd_FirstPersonController3D_lookSensitivity = Как быстро перетаскивание поворачивает обзор.
bhv_p_FirstPersonController3D_turnSpeed = Скорость поворота
bhv_pd_FirstPersonController3D_turnSpeed = Скорость поворота джойстиком обзора или Q/E.
bhv_p_FirstPersonController3D_fieldOfView = Поле зрения
bhv_pd_FirstPersonController3D_fieldOfView = Угол обзора камеры (0 = оставить как у камеры).
bhv_p_FirstPersonController3D_walkSpeed = Скорость ходьбы
bhv_pd_FirstPersonController3D_walkSpeed = Скорость ходьбы.
bhv_p_FirstPersonController3D_runSpeed = Скорость бега
bhv_pd_FirstPersonController3D_runSpeed = Скорость бега.
bhv_p_FirstPersonController3D_runAtFullPush = Бег при полном отклонении
bhv_pd_FirstPersonController3D_runAtFullPush = Бежит, когда джойстик отклонён почти до края.
bhv_p_FirstPersonController3D_acceleration = Ускорение
bhv_pd_FirstPersonController3D_acceleration = Как быстро набирается нужная скорость (больше = резче).
bhv_p_FirstPersonController3D_jumpSpeed = Скорость прыжка
bhv_pd_FirstPersonController3D_jumpSpeed = Скорость отрыва при прыжке (0 = без прыжка).
bhv_p_FirstPersonController3D_radius = Радиус
bhv_pd_FirstPersonController3D_radius = Радиус тела для остановки у стен, когда нет тела DYNAMIC.
bhv_p_FirstPersonController3D_headBob = Покачивание головы
bhv_pd_FirstPersonController3D_headBob = Высота покачивания головы при ходьбе (0 = нет).
bhv_p_FirstPersonController3D_stepLength = Длина шага
bhv_pd_FirstPersonController3D_stepLength = Расстояние между шагами (цикл покачивания и звук шага).
bhv_p_FirstPersonController3D_footstepSound = Звук шага
bhv_pd_FirstPersonController3D_footstepSound = Звук шага (пусто = тишина).
bhv_p_FirstPersonController3D_footstepSound2 = Второй звук шага
bhv_pd_FirstPersonController3D_footstepSound2 = Второй звук шага, чередуется с первым.
bhv_p_FirstPersonController3D_landSound = Звук приземления
bhv_pd_FirstPersonController3D_landSound = Звук приземления после прыжка или падения.
bhv_p_FirstPersonController3D_stepVolume = Громкость шагов
bhv_pd_FirstPersonController3D_stepVolume = Громкость шагов.
bhv_n_Flashlight3D = Фонарик 3D
bhv_d_Flashlight3D = Превращает свет SPOT в фонарик игрока: он следует за камерой с небольшой задержкой, 2D-кнопка включает и выключает его, а необязательная батарея разряжается, мигает на исходе, показывается на 2D-полоске и заряжается батарейками из инвентаря.
bhv_e_Flashlight3D_onToggle = При переключении
bhv_e_Flashlight3D_onBatteryEmpty = При разряде батареи
bhv_e_Flashlight3D_onBatteryLow = При низком заряде
bhv_p_Flashlight3D_camera = Камера
bhv_pd_Flashlight3D_camera = Камера, за которой следует (пусто = главная камера).
bhv_p_Flashlight3D_offsetRight = Смещение вправо
bhv_pd_Flashlight3D_offsetRight = Смещение вправо от глаз.
bhv_p_Flashlight3D_offsetDown = Смещение вниз
bhv_pd_Flashlight3D_offsetDown = Смещение ниже глаз.
bhv_p_Flashlight3D_sway = Инерция
bhv_pd_Flashlight3D_sway = Отставание от поворотов камеры (0 = нет, больше = тяжелее).
bhv_p_Flashlight3D_toggleButton = Кнопка вкл/выкл
bhv_pd_Flashlight3D_toggleButton = 2D-кнопка включения / выключения.
bhv_p_Flashlight3D_startOn = Включён в начале
bhv_pd_Flashlight3D_startOn = Включён при старте игры.
bhv_p_Flashlight3D_useKeyboard = Использовать клавиатуру
bhv_pd_Flashlight3D_useKeyboard = Клавиша F переключает (компьютер, тесты).
bhv_p_Flashlight3D_clickSound = Звук щелчка
bhv_pd_Flashlight3D_clickSound = Звук щелчка выключателя.
bhv_p_Flashlight3D_drainPerSecond = Расход в секунду
bhv_pd_Flashlight3D_drainPerSecond = Расход батареи в секунду при включении (0 = бесконечно).
bhv_p_Flashlight3D_batteryItem = Предмет-батарейка
bhv_pd_Flashlight3D_batteryItem = Предмет инвентаря, заряжающий пустую батарею ("" = нет).
bhv_p_Flashlight3D_batteryBar = Полоска батареи
bhv_pd_Flashlight3D_batteryBar = 2D-полоска с зарядом батареи (необязательно).
bhv_p_Flashlight3D_lowLevel = Низкий уровень
bhv_pd_Flashlight3D_lowLevel = Начинает мигать ниже этого заряда.
bhv_n_Flicker3D = Мерцание 3D
bhv_d_Flicker3D = Оживляет 3D-свет: мягкое мерцание свечи, живой огонь, сломанная лампа, которая жужжит и гаснет, медленная пульсация или стробоскоп. Может управлять свечением лампочки или пламени вместе со светом.
bhv_e_Flicker3D_onOut = При отключении
bhv_p_Flicker3D_style = Стиль
bhv_pd_Flicker3D_style = CANDLE мягко, FIRE живо, BROKEN иногда гаснет, PULSE дышит, STROBE мигает.
bhv_p_Flicker3D_amount = Сила
bhv_pd_Flicker3D_amount = Насколько сильны изменения (0 = ровно, 1 = гаснет полностью).
bhv_p_Flicker3D_speed = Скорость
bhv_pd_Flicker3D_speed = Как быстро меняется.
bhv_p_Flicker3D_outEvery = Гаснет каждые
bhv_pd_Flicker3D_outEvery = BROKEN: среднее число секунд между отключениями.
bhv_p_Flicker3D_glowObject = Светящийся объект
bhv_pd_Flicker3D_glowObject = Лампочка, пламя или экран, свечение которых следует за светом (необязательно).
bhv_p_Flicker3D_glowColor = Цвет свечения
bhv_pd_Flicker3D_glowColor = Цвет свечения этого объекта.
bhv_p_Flicker3D_glowStrength = Сила свечения
bhv_pd_Flicker3D_glowStrength = Сила свечения при полном свете.
bhv_p_Flicker3D_cutSound = Звук отключения
bhv_pd_Flicker3D_cutSound = BROKEN: звук жужжания / искры при отключении.
bhv_n_Floater3D = Парение 3D
bhv_d_Floater3D = Покачивается вверх-вниз и медленно вращается, как подбираемый предмет, монета, призрак или лодка на стоянке. Каждая копия стартует в свой момент, поэтому ряд монет не движется в унисон.
bhv_p_Floater3D_height = Высота
bhv_pd_Floater3D_height = Высота покачивания выше и ниже начала.
bhv_p_Floater3D_frequency = Частота
bhv_pd_Floater3D_frequency = Полных движений вверх-вниз в секунду.
bhv_p_Floater3D_randomStart = Случайный старт
bhv_pd_Floater3D_randomStart = Случайное начало цикла, чтобы копии не двигались вместе.
bhv_p_Floater3D_spinSpeed = Скорость вращения
bhv_pd_Floater3D_spinSpeed = Скорость вращения вокруг Y (0 = нет).
bhv_p_Floater3D_sway = Инерция
bhv_pd_Floater3D_sway = Мягкий наклон туда-сюда (лодки, листья).
bhv_n_Footsteps3D = Шаги 3D
bhv_d_Footsteps3D = Проигрывает звуки шагов, пока элемент идёт, чаще при беге, тише вдали от камеры: монстры, которых слышно раньше, чем видно, NPC, игрок. Берёт случайный звук из списка и меняет высоту, чтобы не звучало однообразно.
bhv_e_Footsteps3D_onStep = При шаге
bhv_p_Footsteps3D_sounds = Звуки
bhv_pd_Footsteps3D_sounds = Звуки шагов; случайный на каждый шаг.
bhv_p_Footsteps3D_volume = Громкость
bhv_pd_Footsteps3D_volume = Громкость шагов (0..1).
bhv_p_Footsteps3D_pitchVariation = Разброс высоты
bhv_pd_Footsteps3D_pitchVariation = Случайное изменение высоты (0 = всегда одинаково).
bhv_p_Footsteps3D_hearDistance = Дальность слышимости
bhv_pd_Footsteps3D_hearDistance = Слышно на таком расстоянии от камеры (0 = всегда полная громкость).
bhv_p_Footsteps3D_stepLength = Длина шага
bhv_pd_Footsteps3D_stepLength = Пройденное расстояние между шагами.
bhv_p_Footsteps3D_minSpeed = Мин. скорость
bhv_pd_Footsteps3D_minSpeed = Медленнее — считается, что стоит.
bhv_p_Footsteps3D_airSpeed = Скорость в воздухе
bhv_pd_Footsteps3D_airSpeed = Нет шагов, пока движется вверх или вниз быстрее этого (прыжок, падение).
bhv_n_Health3D = Здоровье 3D
bhv_d_Health3D = Очки здоровья для 3D-игроков, врагов и разрушаемых предметов: получает урон от Погони 3D, Стрелка 3D и Снаряда 3D, кратко неуязвим после удара, может восстанавливаться, показывает 2D-полоску, а при смерти проигрывает клип, прячется или удаляется.
bhv_e_Health3D_onDamage = При уроне
bhv_e_Health3D_onHeal = При лечении
bhv_e_Health3D_onDeath = При смерти
bhv_p_Health3D_maxHealth = Макс. здоровье
bhv_pd_Health3D_maxHealth = Максимум очков здоровья.
bhv_p_Health3D_startHealth = Начальное здоровье
bhv_pd_Health3D_startHealth = Очки здоровья в начале (0 = полное).
bhv_p_Health3D_invincibleTime = Время неуязвимости
bhv_pd_Health3D_invincibleTime = Не может быть ранен снова столько времени после удара.
bhv_p_Health3D_regenPerSecond = Восстановление в секунду
bhv_pd_Health3D_regenPerSecond = Очков здоровья в секунду (0 = нет).
bhv_p_Health3D_regenDelay = Задержка восстановления
bhv_pd_Health3D_regenDelay = Лечение ждёт столько после последнего удара.
bhv_p_Health3D_healthBar = Полоска здоровья
bhv_pd_Health3D_healthBar = 2D-полоска со здоровьем (необязательно).
bhv_p_Health3D_healthText = Текст здоровья
bhv_pd_Health3D_healthText = 2D-текст с очками здоровья (необязательно).
bhv_p_Health3D_hurtShake = Тряска при ранении
bhv_pd_Health3D_hurtShake = Трясёт камеру, когда ранен игрок камеры.
bhv_p_Health3D_knockback = Отбрасывание
bhv_pd_Health3D_knockback = Отбрасывается от атакующего с такой скоростью (тела DYNAMIC).
bhv_p_Health3D_hurtClip = Клип ранения
bhv_pd_Health3D_hurtClip = Клип, проигрываемый при ранении (пусто = нет).
bhv_p_Health3D_hurtSound = Звук ранения
bhv_pd_Health3D_hurtSound = Звук при ранении.
bhv_p_Health3D_onDeath = При смерти
bhv_pd_Health3D_onDeath = Что происходит при 0 здоровья.
bhv_p_Health3D_deathClip = Клип смерти
bhv_pd_Health3D_deathClip = Клип для PLAY_CLIP («death», «die»).
bhv_p_Health3D_removeAfter = Удалить через
bhv_pd_Health3D_removeAfter = Удаляет / скрывает элемент через столько после смерти (0 = остаётся, для PLAY_CLIP).
bhv_p_Health3D_deathSound = Звук смерти
bhv_pd_Health3D_deathSound = Звук смерти.
bhv_n_Interactable3D = Интерактивный 3D
bhv_d_Interactable3D = Делает объект используемым: когда игрок рядом (и смотрит на него), появляются ваша 2D-кнопка и подсказка; нажатие кнопки (или объекта, или E) вызывает onInteract. Записки, выключатели, рычаги, сундуки, компьютеры. Многие объекты могут делить одну кнопку «ИСПОЛЬЗОВАТЬ».
bhv_e_Interactable3D_onInteract = При взаимодействии
bhv_e_Interactable3D_onEnterRange = При входе в зону
bhv_e_Interactable3D_onExitRange = При выходе из зоны
bhv_p_Interactable3D_player = Игрок
bhv_pd_Interactable3D_player = Игрок (пусто = главная камера, игрок от первого лица).
bhv_p_Interactable3D_range = Дальность
bhv_pd_Interactable3D_range = Можно использовать на таком расстоянии.
bhv_p_Interactable3D_needLook = Нужно смотреть
bhv_pd_Interactable3D_needLook = Камера должна смотреть на объект.
bhv_p_Interactable3D_lookAngle = Угол взгляда
bhv_pd_Interactable3D_lookAngle = Насколько точно камера должна смотреть на него (половина угла).
bhv_p_Interactable3D_once = Один раз
bhv_pd_Interactable3D_once = Можно использовать только один раз.
bhv_p_Interactable3D_button = Кнопка
bhv_pd_Interactable3D_button = 2D-кнопка, видимая при возможности использования; нажатие использует объект (её могут делить несколько объектов).
bhv_p_Interactable3D_promptText = Текст подсказки
bhv_pd_Interactable3D_promptText = 2D-текст, показываемый с кнопкой (необязательно).
bhv_p_Interactable3D_message = Сообщение
bhv_pd_Interactable3D_message = Что говорит текст.
bhv_p_Interactable3D_tapObject = Нажатие на объект
bhv_pd_Interactable3D_tapObject = Нажатие на сам 3D-объект тоже использует его (в пределах дальности).
bhv_p_Interactable3D_useKeyboard = Использовать клавиатуру
bhv_pd_Interactable3D_useKeyboard = Клавиша E использует (компьютер, тесты).
bhv_p_Interactable3D_sound = Звук
bhv_pd_Interactable3D_sound = Звук при использовании.
bhv_p_Interactable3D_highlight = Подсветка
bhv_pd_Interactable3D_highlight = Светящийся контур, пока можно использовать.
bhv_n_JumpPad3D = Прыжковая площадка 3D
bhv_d_JumpPad3D = Подбрасывает того, кто на неё наступил, в воздух (и вперёд, если нужно): батуты, ускорители, трамплины. Работает с физическими телами, управляемыми персонажами и машинами.
bhv_e_JumpPad3D_onLaunch = При запуске
bhv_p_JumpPad3D_targets = Цели
bhv_pd_JumpPad3D_targets = Элементы, которые она подбрасывает (пусто = любой движущийся элемент на ней).
bhv_p_JumpPad3D_reach = Охват
bhv_pd_JumpPad3D_reach = Считается на площадке до такой высоты над ней.
bhv_p_JumpPad3D_upSpeed = Скорость вверх
bhv_pd_JumpPad3D_upSpeed = Скорость подброса вверх.
bhv_p_JumpPad3D_forwardSpeed = Скорость вперёд
bhv_pd_JumpPad3D_forwardSpeed = Толчок вперёд по фронту площадки (-Z).
bhv_p_JumpPad3D_cooldown = Перезарядка
bhv_pd_JumpPad3D_cooldown = Ждёт столько, прежде чем снова подбросить тот же элемент.
bhv_p_JumpPad3D_sound = Звук
bhv_pd_JumpPad3D_sound = Звук подброса.
bhv_n_Lifetime3D = Время жизни 3D
bhv_d_Lifetime3D = Удаляет элемент через несколько секунд, уменьшая или растворяя его в конце: созданные враги, эффекты, обломки, следы от пуль, временные платформы.
bhv_e_Lifetime3D_onExpire = При истечении
bhv_p_Lifetime3D_lifetime = Время жизни
bhv_pd_Lifetime3D_lifetime = Секунд до удаления.
bhv_p_Lifetime3D_shrinkTime = Время уменьшения
bhv_pd_Lifetime3D_shrinkTime = Уменьшается до нуля в конце.
bhv_p_Lifetime3D_fadeTime = Время растворения
bhv_pd_Lifetime3D_fadeTime = Растворяется в конце (прозрачные материалы).
bhv_p_Lifetime3D_hideOnly = Только скрыть
bhv_pd_Lifetime3D_hideOnly = Только скрывает (можно показать снова), а не удаляет.
bhv_n_LookAtTarget3D = Смотреть на цель 3D
bhv_d_LookAtTarget3D = Плавно поворачивается к цели в пределах дальности: турели, камеры наблюдения, статуи, следящие глазами, прожектор, следящий за игроком. Может водить влево-вправо, когда никого не видит.
bhv_e_LookAtTarget3D_onTargetSeen = При виде цели
bhv_e_LookAtTarget3D_onTargetLost = При потере цели
bhv_p_LookAtTarget3D_target = Цель
bhv_pd_LookAtTarget3D_target = Элемент, на который смотреть (пусто = главная камера, т.е. игрок от первого лица).
bhv_p_LookAtTarget3D_range = Дальность
bhv_pd_LookAtTarget3D_range = Смотрит, только когда цель так близко (0 = всегда).
bhv_p_LookAtTarget3D_heightOffset = Смещение по высоте
bhv_pd_LookAtTarget3D_heightOffset = Смотреть на эту высоту над позицией цели.
bhv_p_LookAtTarget3D_yawOnly = Только курс
bhv_pd_LookAtTarget3D_yawOnly = Вращается только вокруг Y (остаётся вертикальным).
bhv_p_LookAtTarget3D_turnSpeed = Скорость поворота
bhv_pd_LookAtTarget3D_turnSpeed = Скорость поворота (0 = сразу).
bhv_p_LookAtTarget3D_yawOffset = Смещение курса
bhv_pd_LookAtTarget3D_yawOffset = Дополнительный курс, если модель смотрит в +Z, а не в -Z.
bhv_p_LookAtTarget3D_idleSweep = Обзор в покое
bhv_pd_LookAtTarget3D_idleSweep = Водит влево-вправо на этот угол, когда ничего не видит (0 = стоит).
bhv_n_Orbit3D = Орбита 3D
bhv_d_Orbit3D = Кружит вокруг центрального элемента или начальной точки: луны, стражи вокруг башни, камера вокруг машины в меню, свет над сценой. Может смотреть по ходу движения или в центр.
bhv_e_Orbit3D_onLap = При круге
bhv_p_Orbit3D_center = Центр
bhv_pd_Orbit3D_center = Элемент, вокруг которого кружить (пусто = начальная точка минус радиус).
bhv_p_Orbit3D_radius = Радиус
bhv_pd_Orbit3D_radius = Расстояние от центра (0 = расстояние в начале).
bhv_p_Orbit3D_speed = Скорость
bhv_pd_Orbit3D_speed = Скорость вращения (отрицательная = в другую сторону).
bhv_p_Orbit3D_height = Высота
bhv_pd_Orbit3D_height = Высота над центром.
bhv_p_Orbit3D_wave = Волна
bhv_pd_Orbit3D_wave = Волна вверх-вниз при кружении (0 = ровно).
bhv_p_Orbit3D_facing = Направление взгляда
bhv_pd_Orbit3D_facing = Куда смотрит при кружении.
bhv_n_Oscillator3D = Осциллятор 3D
bhv_d_Oscillator3D = Движется туда-обратно между стартом и смещением: сдвижные стены, поршни, пилы, ловушки, лифты без пассажиров. Плавно или линейно, с паузой на концах.
bhv_e_Oscillator3D_onEnd = На конце
bhv_p_Oscillator3D_offsetX = Смещение x
bhv_pd_Oscillator3D_offsetX = Смещение дальнего конца по X от старта.
bhv_p_Oscillator3D_offsetY = Смещение y
bhv_pd_Oscillator3D_offsetY = Смещение дальнего конца по Y (вверх).
bhv_p_Oscillator3D_offsetZ = Смещение z
bhv_pd_Oscillator3D_offsetZ = Смещение дальнего конца по Z.
bhv_p_Oscillator3D_localOffset = Локальное смещение
bhv_pd_Oscillator3D_localOffset = Смещение в собственных осях элемента (поворачивается с ним), а не в мировых.
bhv_p_Oscillator3D_duration = Длительность
bhv_pd_Oscillator3D_duration = Секунд от одного конца до другого.
bhv_p_Oscillator3D_pause = Пауза
bhv_pd_Oscillator3D_pause = Ожидание на каждом конце.
bhv_p_Oscillator3D_motion = Движение
bhv_pd_Oscillator3D_motion = Как ускоряется и замедляется.
bhv_p_Oscillator3D_phase = Фаза
bhv_pd_Oscillator3D_phase = Начальная точка цикла (0..1), чтобы копии двигались вразнобой.
bhv_n_PathFollower3D = Движение по пути 3D
bhv_d_PathFollower3D = Проходит по списку элементов-точек (пустые объекты или маркеры): по кругу, туда-обратно или один раз. Идёт по земле или летит напрямую; ждёт в каждой точке. Камеры делают кинематографичный пролёт.
bhv_e_PathFollower3D_onWaypoint = В точке пути
bhv_e_PathFollower3D_onPathEnd = В конце пути
bhv_p_PathFollower3D_waypoints = Точки пути
bhv_pd_PathFollower3D_waypoints = Точки для посещения по порядку (любые 3D-элементы; скройте их или используйте объекты EMPTY).
bhv_p_PathFollower3D_loop = Цикл
bhv_pd_PathFollower3D_loop = LOOP: обратно к первой точке. PING_PONG: туда-обратно. ONCE: остановка на последней.
bhv_p_PathFollower3D_onGround = По земле
bhv_pd_PathFollower3D_onGround = Идёт по земле (гравитация, ступени), а не летит к каждой точке напрямую.
bhv_p_PathFollower3D_speed = Скорость
bhv_pd_PathFollower3D_speed = Скорость движения.
bhv_p_PathFollower3D_acceleration = Ускорение
bhv_pd_PathFollower3D_acceleration = Как быстро набирает скорость (0 = сразу).
bhv_p_PathFollower3D_turnSpeed = Скорость поворота
bhv_pd_PathFollower3D_turnSpeed = Скорость поворота к следующей точке (0 = не поворачивается).
bhv_p_PathFollower3D_arriveDistance = Дистанция прибытия
bhv_pd_PathFollower3D_arriveDistance = Считается прибывшим на таком расстоянии от точки.
bhv_p_PathFollower3D_waitTime = Время ожидания
bhv_pd_PathFollower3D_waitTime = Ожидание в каждой точке.
bhv_p_PathFollower3D_modelYawOffset = Смещение курса модели
bhv_pd_PathFollower3D_modelYawOffset = Дополнительный курс, если модель смотрит в +Z, а не в -Z.
bhv_n_Patrol3D = Патруль 3D
bhv_d_Patrol3D = Стражи и монстры ходят между точками патруля (или бродят вокруг старта), останавливаются, осматриваются и идут дальше, с клипами ходьбы и покоя. Сам ставится на паузу, пока Погоня 3D на том же элементе преследует.
bhv_e_Patrol3D_onArrive = При прибытии
bhv_p_Patrol3D_points = Точки
bhv_pd_Patrol3D_points = Точки патруля по порядку (пусто = бродить случайно вокруг старта).
bhv_p_Patrol3D_wanderRadius = Радиус блуждания
bhv_pd_Patrol3D_wanderRadius = Расстояние блуждания от старта, если точек нет.
bhv_p_Patrol3D_randomOrder = Случайный порядок
bhv_pd_Patrol3D_randomOrder = Посещать точки в случайном порядке.
bhv_p_Patrol3D_speed = Скорость
bhv_pd_Patrol3D_speed = Скорость ходьбы.
bhv_p_Patrol3D_turnSpeed = Скорость поворота
bhv_pd_Patrol3D_turnSpeed = Скорость поворота.
bhv_p_Patrol3D_waitMin = Мин. ожидание
bhv_pd_Patrol3D_waitMin = Самая короткая остановка в точке.
bhv_p_Patrol3D_waitMax = Макс. ожидание
bhv_pd_Patrol3D_waitMax = Самая длинная остановка в точке.
bhv_p_Patrol3D_lookAround = Осматриваться
bhv_pd_Patrol3D_lookAround = Смотрит влево и вправо во время остановки.
bhv_p_Patrol3D_modelYawOffset = Смещение курса модели
bhv_pd_Patrol3D_modelYawOffset = Дополнительный курс, если модель смотрит в +Z, а не в -Z.
bhv_p_Patrol3D_walkClip = Клип ходьбы
bhv_pd_Patrol3D_walkClip = Клип при ходьбе (пусто = нет).
bhv_p_Patrol3D_idleClip = Клип покоя
bhv_pd_Patrol3D_idleClip = Клип при остановке (пусто = нет).
bhv_n_Pickup3D = Подбор 3D
bhv_d_Pickup3D = Предмет, который игрок собирает в инвентарь: ключи, батарейки, монеты, записки, патроны. Подбирается, если пройти по нему или нажать 2D-кнопку вблизи; звучит, летит к игроку и исчезает (или потом возвращается).
bhv_e_Pickup3D_onPickup = При подборе
bhv_p_Pickup3D_itemId = Id предмета
bhv_pd_Pickup3D_itemId = Id инвентаря, который добавляется («key_red», «battery», «coin»).
bhv_p_Pickup3D_count = Количество
bhv_pd_Pickup3D_count = Сколько добавляет.
bhv_p_Pickup3D_player = Игрок
bhv_pd_Pickup3D_player = Игрок (пусто = главная камера, игрок от первого лица).
bhv_p_Pickup3D_range = Дальность
bhv_pd_Pickup3D_range = Подбирается на таком расстоянии.
bhv_p_Pickup3D_button = Кнопка
bhv_pd_Pickup3D_button = 2D-кнопка для подбора (пусто = подбирается, просто войдя в зону).
bhv_p_Pickup3D_promptText = Текст подсказки
bhv_pd_Pickup3D_promptText = 2D-текст, показываемый с кнопкой (необязательно).
bhv_p_Pickup3D_message = Сообщение
bhv_pd_Pickup3D_message = Что говорит текст («Взять ключ»).
bhv_p_Pickup3D_tapObject = Нажатие на объект
bhv_pd_Pickup3D_tapObject = Нажатие на сам объект подбирает его (в пределах дальности).
bhv_p_Pickup3D_sound = Звук
bhv_pd_Pickup3D_sound = Звук при подборе.
bhv_p_Pickup3D_flyToPlayer = Лететь к игроку
bhv_pd_Pickup3D_flyToPlayer = Летит к игроку, а не исчезает сразу.
bhv_p_Pickup3D_respawnTime = Время возрождения
bhv_pd_Pickup3D_respawnTime = Возвращается через столько секунд (0 = никогда).
bhv_p_Pickup3D_destroyWhenTaken = Удалять при подборе
bhv_pd_Pickup3D_destroyWhenTaken = Удаляет элемент из сцены при подборе (без возрождения).
bhv_n_PlatformMover3D = Движущаяся платформа 3D
bhv_d_PlatformMover3D = Движущаяся платформа, лифт или паром: ездит между стартом и смещением (или по точкам), ждёт на каждой остановке и везёт всё, что на ней стоит (персонажи, ящики, игрок от первого лица). Дайте ей тело KINEMATIC.
bhv_e_PlatformMover3D_onStop = На остановке
bhv_p_PlatformMover3D_points = Точки
bhv_pd_PlatformMover3D_points = Остановки после старта по порядку (пусто = смещение ниже).
bhv_p_PlatformMover3D_offsetX = Смещение x
bhv_pd_PlatformMover3D_offsetX = Дальний конец по X, если точек нет.
bhv_p_PlatformMover3D_offsetY = Смещение y
bhv_pd_PlatformMover3D_offsetY = Дальний конец по Y (вверх), если точек нет.
bhv_p_PlatformMover3D_offsetZ = Смещение z
bhv_pd_PlatformMover3D_offsetZ = Дальний конец по Z, если точек нет.
bhv_p_PlatformMover3D_speed = Скорость
bhv_pd_PlatformMover3D_speed = Скорость движения.
bhv_p_PlatformMover3D_waitTime = Время ожидания
bhv_pd_PlatformMover3D_waitTime = Ожидание на каждой остановке.
bhv_p_PlatformMover3D_waitForCall = Ждать вызова
bhv_pd_PlatformMover3D_waitForCall = Едет только после вызова блока «к следующей остановке» (кнопки лифта).
bhv_p_PlatformMover3D_carryRiders = Везти пассажиров
bhv_pd_PlatformMover3D_carryRiders = Везёт стоящие на ней элементы.
bhv_n_Projectile3D = Снаряд 3D
bhv_d_Projectile3D = Пуля, стрела, огненный шар или брошенный мяч: летит вперёд (по своей -Z) с необязательной гравитацией, не проходит сквозь тонкие стены, ранит то, во что попадает (Здоровье 3D), показывает эффект попадания и исчезает. Поставьте на шаблон, который копирует Стрелок 3D или Спаунер 3D.
bhv_e_Projectile3D_onHit = При попадании
bhv_e_Projectile3D_onExpire = При истечении
bhv_p_Projectile3D_speed = Скорость
bhv_pd_Projectile3D_speed = Скорость вперёд в начале (Стрелок 3D задаёт свою).
bhv_p_Projectile3D_gravity = Гравитация
bhv_pd_Projectile3D_gravity = Насколько гравитация тянет вниз (0 = прямо, 1 = брошенный мяч).
bhv_p_Projectile3D_lifetime = Время жизни
bhv_pd_Projectile3D_lifetime = Исчезает через столько секунд.
bhv_p_Projectile3D_faceVelocity = Смотреть по полёту
bhv_pd_Projectile3D_faceVelocity = Поворачивается по направлению полёта (стрелы).
bhv_p_Projectile3D_damage = Урон
bhv_pd_Projectile3D_damage = Урон Здоровью 3D того, во что попадает.
bhv_p_Projectile3D_targetPrefix = Префикс цели
bhv_pd_Projectile3D_targetPrefix = Ранит только элементы, имя которых начинается так (пусто = всё со здоровьем).
bhv_p_Projectile3D_destroyOnHit = Удалять при попадании
bhv_pd_Projectile3D_destroyOnHit = Исчезает, когда во что-то попадает.
bhv_p_Projectile3D_impactEffect = Эффект попадания
bhv_pd_Projectile3D_impactEffect = Элемент, копируемый в точку попадания (искры, след; удаляется через 2 с). Необязательно.
bhv_p_Projectile3D_impactSound = Звук попадания
bhv_pd_Projectile3D_impactSound = Звук в точке попадания.
bhv_n_Respawn3D = Возрождение 3D
bhv_d_Respawn3D = Возвращает игрока (или машину, мяч) на старт или к последней контрольной точке, если он упал с мира или умер (Здоровье 3D): остановленным, стоящим и повёрнутым как сохранено. Контрольные точки сохраняются блоками или событиями Триггера 3D.
bhv_e_Respawn3D_onRespawn = При возрождении
bhv_e_Respawn3D_onCheckpoint = На контрольной точке
bhv_p_Respawn3D_fallHeight = Высота падения
bhv_pd_Respawn3D_fallHeight = Возрождается, если падает ниже этой высоты.
bhv_p_Respawn3D_onDeath = При смерти
bhv_pd_Respawn3D_onDeath = Возрождается, когда Здоровье 3D падает до 0 (и оживляет).
bhv_p_Respawn3D_deathDelay = Задержка после смерти
bhv_pd_Respawn3D_deathDelay = Ждёт столько после смерти.
bhv_p_Respawn3D_lift = Подъём
bhv_pd_Respawn3D_lift = Поднимает на столько над сохранённой точкой.
bhv_p_Respawn3D_sound = Звук
bhv_pd_Respawn3D_sound = Звук при возрождении.
bhv_p_Respawn3D_shake = Тряска
bhv_pd_Respawn3D_shake = Трясёт камеру при возрождении (0 = нет).
bhv_n_Rotator3D = Вращатель 3D
bhv_d_Rotator3D = Бесконечно вращает элемент вокруг X, Y и Z: вентиляторы, колёса, монеты, мельницы, радары. Может плавно разгоняться и считать полные обороты.
bhv_e_Rotator3D_onTurn = При обороте
bhv_p_Rotator3D_speedX = Скорость x
bhv_pd_Rotator3D_speedX = Скорость вращения вокруг X (тангаж).
bhv_p_Rotator3D_speedY = Скорость y
bhv_pd_Rotator3D_speedY = Скорость вращения вокруг Y (курс).
bhv_p_Rotator3D_speedZ = Скорость z
bhv_pd_Rotator3D_speedZ = Скорость вращения вокруг Z (крен).
bhv_p_Rotator3D_localAxes = Локальные оси
