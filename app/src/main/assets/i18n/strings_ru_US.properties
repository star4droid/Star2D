bhv_p_Car3D_bodyRoll = Крен кузова
bhv_pd_Car3D_bodyRoll = Насколько кузов кренится в поворотах (0 = ровно, 1 = реально, может перевернуться).
bhv_p_Car3D_wheelMode = Режим колёс
bhv_pd_Car3D_wheelMode = AUTO: узлы модели, если есть, иначе элементы-колёса, иначе невидимые колёса по углам.
bhv_p_Car3D_frontLeftNode = Узел переднего левого
bhv_pd_Car3D_frontLeftNode = Узел переднего левого колеса в модели.
bhv_p_Car3D_frontRightNode = Узел переднего правого
bhv_pd_Car3D_frontRightNode = Узел переднего правого колеса в модели.
bhv_p_Car3D_rearLeftNode = Узел заднего левого
bhv_pd_Car3D_rearLeftNode = Узел заднего левого колеса в модели.
bhv_p_Car3D_rearRightNode = Узел заднего правого
bhv_pd_Car3D_rearRightNode = Узел заднего правого колеса в модели.
bhv_p_Car3D_frontLeftWheel = Переднее левое колесо
bhv_pd_Car3D_frontLeftWheel = Элемент переднего левого колеса (режим ELEMENTS).
bhv_p_Car3D_frontRightWheel = Переднее правое колесо
bhv_pd_Car3D_frontRightWheel = Элемент переднего правого колеса (режим ELEMENTS).
bhv_p_Car3D_rearLeftWheel = Заднее левое колесо
bhv_pd_Car3D_rearLeftWheel = Элемент заднего левого колеса (режим ELEMENTS).
bhv_p_Car3D_rearRightWheel = Заднее правое колесо
bhv_pd_Car3D_rearRightWheel = Элемент заднего правого колеса (режим ELEMENTS).
bhv_p_Car3D_wheelRadius = Радиус колеса
bhv_pd_Car3D_wheelRadius = Радиус колеса (0 = измеряется по колёсам).
bhv_p_Car3D_fitCollider = Подогнать коллайдер
bhv_pd_Car3D_fitCollider = Уменьшает коллайдер кузова над колёсами, чтобы машину держали пружины (рекомендуется).
bhv_p_Car3D_followCamera = Камера следует
bhv_pd_Car3D_followCamera = Камера следует за машиной сзади (пустая камера = главная).
bhv_p_Car3D_camera = Камера
bhv_pd_Car3D_camera = Камера, которая следует (пусто = главная камера).
bhv_p_Car3D_cameraDistance = Расстояние камеры
bhv_pd_Car3D_cameraDistance = Расстояние камеры позади машины.
bhv_p_Car3D_cameraHeight = Высота камеры
bhv_pd_Car3D_cameraHeight = Высота камеры над машиной.
bhv_p_Car3D_flipResetTime = Время до переворота обратно
bhv_pd_Car3D_flipResetTime = Ставит машину на колёса, если она пролежала перевёрнутой столько времени (0 = никогда).
bhv_n_CharacterAnimator3D = Аниматор персонажа 3D
bhv_d_CharacterAnimator3D = Проигрывает клипы покоя, ходьбы, бега, прыжка и падения модели по её реальной скорости, с плавным смешиванием. Работает с любым движением (ваши блоки, ИИ, физика). Достаточно части имени клипа («walk»).
bhv_e_CharacterAnimator3D_onClipChanged = При смене клипа
bhv_p_CharacterAnimator3D_idleClip = Клип покоя
bhv_pd_CharacterAnimator3D_idleClip = Клип в покое (достаточно части имени).
bhv_p_CharacterAnimator3D_walkClip = Клип ходьбы
bhv_pd_CharacterAnimator3D_walkClip = Клип при ходьбе.
bhv_p_CharacterAnimator3D_runClip = Клип бега
bhv_pd_CharacterAnimator3D_runClip = Клип при беге (пусто = клип ходьбы).
bhv_p_CharacterAnimator3D_jumpClip = Клип прыжка
bhv_pd_CharacterAnimator3D_jumpClip = Клип при подъёме в воздухе (пусто = оставить наземный).
bhv_p_CharacterAnimator3D_fallClip = Клип падения
bhv_pd_CharacterAnimator3D_fallClip = Клип при падении (пусто = клип прыжка).
bhv_p_CharacterAnimator3D_walkSpeed = Скорость ходьбы
bhv_pd_CharacterAnimator3D_walkSpeed = Скорость, под которую сделан клип ходьбы (медленнее идёт — медленнее клип).
bhv_p_CharacterAnimator3D_runSpeed = Скорость бега
bhv_pd_CharacterAnimator3D_runSpeed = Скорость, с которой включается клип бега.
bhv_p_CharacterAnimator3D_matchSpeed = Подстроить скорость
bhv_pd_CharacterAnimator3D_matchSpeed = Скорость клипа следует за скоростью движения (ноги не скользят).
bhv_p_CharacterAnimator3D_blendTime = Время смешивания
bhv_pd_CharacterAnimator3D_blendTime = Время смешивания двух клипов.
bhv_p_CharacterAnimator3D_groundCheck = Проверка земли
bhv_pd_CharacterAnimator3D_groundCheck = Считается в воздухе, если под ногами нет ничего так близко.
bhv_n_Chase3D = Погоня 3D
bhv_d_Chase3D = Враг, который видит (дальность, поле зрения, стены закрывают обзор) или слышит игрока, бежит за ним, атакует вблизи, какое-то время ищет в последнем замеченном месте, затем возвращается. Работает вместе с Патрулём 3D на том же элементе.
bhv_e_Chase3D_onSpotted = При обнаружении
bhv_e_Chase3D_onLost = При потере
bhv_e_Chase3D_onAttack = При атаке
bhv_p_Chase3D_target = Цель
bhv_pd_Chase3D_target = Кого преследовать (пусто = главная камера: игрок от первого лица).
bhv_p_Chase3D_sightRange = Дальность зрения
bhv_pd_Chase3D_sightRange = Видит цель на таком расстоянии.
bhv_p_Chase3D_fieldOfView = Поле зрения
bhv_pd_Chase3D_fieldOfView = Ширина обзора перед ним (360 = вокруг).
bhv_p_Chase3D_needLineOfSight = Нужна прямая видимость
bhv_pd_Chase3D_needLineOfSight = Стены (физические тела) закрывают обзор.
bhv_p_Chase3D_hearRange = Дальность слуха
bhv_pd_Chase3D_hearRange = Замечает цель на таком расстоянии даже за спиной или за стенами.
bhv_p_Chase3D_eyeHeight = Высота глаз
bhv_pd_Chase3D_eyeHeight = Глаза над его позицией.
bhv_p_Chase3D_searchTime = Время поиска
bhv_pd_Chase3D_searchTime = Продолжает искать в последнем замеченном месте столько времени после потери цели.
bhv_p_Chase3D_chaseSpeed = Скорость погони
bhv_pd_Chase3D_chaseSpeed = Скорость бега при погоне.
bhv_p_Chase3D_turnSpeed = Скорость поворота
bhv_pd_Chase3D_turnSpeed = Скорость поворота.
bhv_p_Chase3D_stopDistance = Дистанция остановки
bhv_pd_Chase3D_stopDistance = Останавливается на таком расстоянии от цели.
bhv_p_Chase3D_returnHome = Возвращаться домой
bhv_pd_Chase3D_returnHome = Возвращается на исходное место, сдавшись.
bhv_p_Chase3D_modelYawOffset = Смещение курса модели
bhv_pd_Chase3D_modelYawOffset = Дополнительный курс, если модель смотрит в +Z, а не в -Z.
bhv_p_Chase3D_attackRange = Дальность атаки
bhv_pd_Chase3D_attackRange = Атакует, когда цель так близко.
bhv_p_Chase3D_attackInterval = Интервал атаки
bhv_pd_Chase3D_attackInterval = Секунд между двумя атаками.
bhv_p_Chase3D_damage = Урон
bhv_pd_Chase3D_damage = Урон Здоровью 3D цели за атаку (0 = только событие).
bhv_p_Chase3D_spotSound = Звук обнаружения
bhv_pd_Chase3D_spotSound = Звук, когда замечает цель.
bhv_p_Chase3D_attackSound = Звук атаки
bhv_pd_Chase3D_attackSound = Звук атаки.
bhv_p_Chase3D_runClip = Клип бега
bhv_pd_Chase3D_runClip = Клип при погоне (пусто = нет).
bhv_p_Chase3D_attackClip = Клип атаки
bhv_pd_Chase3D_attackClip = Клип, проигрываемый раз за атаку (пусто = нет).
bhv_p_Chase3D_idleClip = Клип покоя
bhv_pd_Chase3D_idleClip = Клип стоя (поиск, ожидание).
bhv_p_Chase3D_walkClip = Клип ходьбы
bhv_pd_Chase3D_walkClip = Клип при возвращении домой.
bhv_n_ClickToMove3D = Движение по нажатию 3D
bhv_d_ClickToMove3D = Нажмите на землю, и персонаж пойдёт туда (стратегии, приключения, point-and-click). Необязательный маркер ставится в место нажатия. Нажатия на кнопки и джойстики игнорируются.
