# --- Animation editor, number pad, help, tips ---
anim_help=Нажимайте на изображения в списке, чтобы добавить их как кадры. Перетащите кадр, чтобы изменить порядок, ✕ удаляет его, нажмите на кадр, чтобы посмотреть его. «Время кадра» задаёт, сколько показывается каждый кадр (в миллисекундах). Используйте анимацию в блоках через setAnimation и её имя.
anim_empty=Кадров пока нет.\nНажмите на изображения ниже, чтобы добавить их.
anim_prev=Предыдущий кадр
anim_next=Следующий кадр
anim_frame_time=Время кадра (мс)
anim_add_frames=Изображения: нажмите, чтобы добавить кадр
anim_add_all=Добавить все
anim_save_q=Сохранить эту анимацию перед закрытием?
ui_clear=Очистить
tut_params_intro=Жёлтый блок показывает событие (%1$s) и его входные данные. «%2$s» — это этот элемент: удерживайте его и перетащите в любое поле.
tut_numpad_intro=Числовые поля открывают цифровую клавиатуру: нажимайте цифры, ⌫ удаляет последнюю, C очищает, затем OK.
tut_drag_body2=Жёлтый блок показывает входные параметры этого события. Удерживайте %1$s (тело, которое врезалось в камень) и перетащите в первый кружок.
tut_drag_body2_coin=Удерживайте %1$s на жёлтом блоке (тело, которое коснулось монеты) и перетащите в первый кружок.
blk_browse=Обзор
blk_p_current=элемент, которому принадлежит это событие
blk_p_body2=другое тело в столкновении
blk_p_body1=первое тело в столкновении
blk_p_event=событие касания (позиция, указатель…)
blk_p_drag=Удерживайте и перетащите копию в любое поле.
ui_light_blur=Мягкие (размытые) края света
ui_light_shadows=Тела отбрасывают тени
ui_light_culling=Пропускать источники света за экраном (быстрее)
ui_light_diffuse=Рассеянный свет (мягче, меньше контраста)
ui_light_gamma=Гамма-коррекция
ui_add_desc_boxBody=Прямоугольник с физикой. Игроки, стены, платформы.
ui_add_desc_circleBody=Круглое тело: мячи, колёса, монеты.
ui_add_desc_textItem=Показывает текст: счёт, заголовки, сообщения.
ui_add_desc_joystickItem=Экранный джойстик для управления игроком.
ui_add_desc_progressBar=Полоски здоровья, загрузки, таймеры.
ui_add_desc_customBody=Тело с собственной формой коллайдера (многоугольник).
ui_add_desc_particleEffect=Эффекты огня, дыма, искр, дождя.
ui_add_desc_camera=Определяет, какая часть мира видна.
ui_add_desc_tiledMap=Загрузить уровень, созданный в Tiled (.tmx).
ui_add_desc_pointLight=Свет, который светит во все стороны.
ui_add_desc_directionalLight=Свет как от солнца, с одного направления.
ui_add_desc_coneLight=Конус фонарика / прожектора.
ui_ev_desc_OnCreate = Выполняется один раз при запуске сцены.
ui_ev_desc_OnStep = Выполняется каждый кадр (около 60 раз в секунду).
ui_ev_desc_OnPause = Когда игра на паузе или приложение свернуто.
ui_ev_desc_OnResume = Когда игра возобновляется.
ui_ev_desc_onCollisionStart = Когда два тела начинают касаться (body1, body2).
ui_ev_desc_onCollisionEnd = Когда два тела перестают касаться.
ui_ev_desc_onClick = Когда на этот элемент нажимают.
ui_ev_desc_OnBodyCreated = Когда этот элемент создан.
ui_ev_desc_OnBodyUpdate = Каждый кадр для этого элемента.
ui_ev_desc_onTouchStart = Когда палец начинает касаться.
ui_ev_desc_onTouchEnd = Когда палец убран.
ui_ev_desc_onBodyCollided = Когда сталкивается с другим телом (body2).
ui_ev_desc_onBodyCollideEnd = Когда перестает касаться другого тела.
ui_tip_name=Уникальное имя элемента. Используется в блоках и коде, чтобы найти его.
ui_tip_type=DYNAMIC: двигается и падает под действием гравитации (игроки, мячи).\nSTATIC: никогда не двигается (земля, стены).\nKINAMATIC: двигается только кодом, гравитация на него не действует (движущиеся платформы).\nUI: остаётся неподвижным на экране (кнопки, счёт).
ui_tip_lock=Заблокированные элементы нельзя двигать касанием в редакторе.
ui_tip_Script=Какой скрипт тела (код) управляет этим элементом.
ui_tip_parent=Прикрепляет этот элемент к другому; он следует за родителем.
ui_tip_x=Горизонтальная позиция в мире.
ui_tip_y=Вертикальная позиция в мире.
ui_tip_z=Порядок отрисовки: элементы с большим значением рисуются поверх.
ui_tip_rotation=Угол в градусах.
ui_tip_width=Ширина элемента.
ui_tip_height=Высота элемента.
ui_tip_radius=Радиус круга.
ui_tip_density=Насколько тяжёлое тело. Больше = тяжелее.
ui_tip_friction=Насколько оно скользит. 0 = лёд, 1 = резина.
ui_tip_restitution=Упругость (отскок). 0 = без отскока, 1 = полный отскок.
ui_tip_Gravity_Scale=Множитель гравитации для этого тела. 0 = парит.
ui_tip_Fixed_Rotation=Не даёт телу вращаться (удобно для игроков).
ui_tip_Bullet=Более точные столкновения для очень быстрых объектов.
ui_tip_isSensor=Обнаруживает столкновения, но не блокирует (триггеры, монеты).
ui_tip_Active=Неактивные тела не участвуют в физике.
ui_tip_Visible=Показать или скрыть элемент.
ui_tip_image=Картинка этого элемента (из папки images).
ui_tip_Tint=Цвет, умножаемый на изображение.
ui_tip_Collision=Элементы, с которыми этот НЕ должен сталкиваться.
ui_tip_Points=Точки собственного многоугольника коллайдера.
ui_tip_Text=Отображаемый текст.
ui_tip_Font_Scale=Размер текста.
ui_tip_tileX=Повторять изображение по горизонтали.
ui_tip_tileY=Повторять изображение по вертикали.
ui_tip_Zoom=Масштаб камеры. Меньше = ближе.
ui_tip_Duration=Длительность эффекта в секундах.
ui_tip_Distance=Насколько далеко достаёт свет.
ui_tip_rays=Качество света (больше лучей = плавнее, но медленнее).
ui_tip_Static_Light=Статичный свет дешевле (не двигается).
ui_tip_attach_To=Прикрепляет свет к элементу, чтобы он следовал за ним.
help_add_t=➕ Добавление элементов
help_add_d=Нажмите синюю кнопку + и выберите тип (коробка, круг, текст, джойстик...).
help_tools_t=✋ Инструменты
help_tools_d=Рука = выбор и перемещение камеры, затем перемещение, изменение размера и поворот. Кнопка XY ограничивает перетаскивание одной осью.
help_props_t=⚙ Свойства
help_props_d=Откройте «Свойства» на боковой панели, чтобы изменить имя, картинку, тип (статичный/динамический), физику и многое другое. Числовые поля открывают цифровую клавиатуру.
help_events_t=⚡ События
help_events_d=Выберите элемент, откройте «События» (например, «При клике») и перетащите туда блоки, чтобы создать логику без кода.
help_blocks_t=🧩 Блоки
help_blocks_d=Удерживайте блок в палитре и перетащите его под другой (или просто нажмите на него). Нажмите на поле, чтобы ввести значение или поставить в него блок значения; блоки значений можно вкладывать друг в друга. Удерживайте блок, чтобы открыть его параметры, (!) объясняет его.
help_params_t=🔹 Параметры события
help_params_d=Первый блок события показывает его параметры: current (этот элемент), body2 (то, во что он врезался), event (касание). Удерживайте один из них и перетащите копию в любое поле.
help_numbers_t=🔢 Числа и файлы
help_numbers_d=Числовые поля открывают клавиатуру (⌫ удаляет, C очищает). У полей для изображений, звуков, анимаций и сцен есть кнопка «Обзор», которая открывает нужную папку.
help_anims_t=🎞 Анимации
help_anims_d=В «Файлах» откройте (или создайте) анимацию в папке anims: нажимайте на изображения, чтобы добавить кадры, перетаскивайте кадры, чтобы изменить порядок, задайте время кадра и нажмите воспроизведение. Используйте её с блоком setAnimation.
help_joints_t=🔗 Joints (соединения)
help_joints_d=Joints (соединения) физически связывают два тела: колёса, двери, верёвки...
help_vars_t=𝑥 Переменные
help_vars_d=Создавайте переменные, например score или lives, и используйте их в блоках.
help_assets_t=🖼 Коллекции
help_assets_d=Бесплатные изображения (CC0), которые можно добавить в проект через Файлы → Коллекции.
help_play_t=▶ Играть
help_play_d=Зелёная кнопка «Играть» собирает и запускает вашу игру. Нажмите «Назад», чтобы остановить. Если не получилось, нажмите «Попросить ИИ исправить».
help_lessons_t=🎓 Уроки
help_lessons_d=На главном экране во вкладке «Обучение» есть пошаговые уроки, в которых вы вместе создаёте настоящие игры.
help_ai_t=✨ ИИ-помощник
help_ai_d=Опишите, что вы хотите, например «сделай так, чтобы игрок прыгал при нажатии», и он напишет код или объяснит шаги.

# --- joints, event inputs ---
tut_add_finish=Добавьте «%1$s» под ним: он закрывает старую сцену, и работает только новая.
tut_finish_inside=Перетащите «%1$s» тоже в проём «иначе», под «%2$s»: он закроет старую сцену, чтобы работала только новая.
blk_r_current=этот элемент
