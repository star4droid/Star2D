bhv_pd_ClickToMove3D_ground = Землёй считаются только нажатия на эти элементы (пусто = всё твёрдое или высота пола).
bhv_p_ClickToMove3D_tapSlop = Допуск нажатия
bhv_pd_ClickToMove3D_tapSlop = Наибольшее смещение пальца, которое ещё считается нажатием (перетаскивание двигает камеру).
bhv_p_ClickToMove3D_speed = Скорость
bhv_pd_ClickToMove3D_speed = Скорость ходьбы.
bhv_p_ClickToMove3D_turnSpeed = Скорость поворота
bhv_pd_ClickToMove3D_turnSpeed = Скорость поворота.
bhv_p_ClickToMove3D_stopDistance = Дистанция остановки
bhv_pd_ClickToMove3D_stopDistance = Останавливается на таком расстоянии от точки.
bhv_p_ClickToMove3D_modelYawOffset = Смещение курса модели
bhv_pd_ClickToMove3D_modelYawOffset = Дополнительный курс, если модель смотрит в +Z, а не в -Z.
bhv_p_ClickToMove3D_walkClip = Клип ходьбы
bhv_pd_ClickToMove3D_walkClip = Клип при ходьбе (пусто = нет).
bhv_p_ClickToMove3D_idleClip = Клип покоя
bhv_pd_ClickToMove3D_idleClip = Клип стоя (пусто = нет).
bhv_n_Door3D = Дверь 3D
bhv_d_Door3D = Дверь, которая поворачивается на петлях, сдвигается или проигрывает клипы открытия / закрытия модели. Игрок открывает её вашей 2D-кнопкой вблизи; может требовать ключ из инвентаря, закрываться сама и играть звуки открытия / закрытия / замка.
bhv_e_Door3D_onOpen = При открытии
bhv_e_Door3D_onClose = При закрытии
bhv_e_Door3D_onLocked = Если заперта
bhv_e_Door3D_onUnlock = При отпирании
