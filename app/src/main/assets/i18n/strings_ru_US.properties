# --- racing v2, sizes ---
tut_set_w=Новые элементы маленькие. Установите ширину %1$s.
tut_set_h=Установите высоту %1$s.
tut_bounce_zero=Установите restitution (отскок) на %1$s, чтобы герой приземлялся без отскока.
tut_road_info=Теперь дорога. road1 и road2 используют общие события (Script: road), поэтому блоки работают для обоих кусков.
tut_road_created=Нажмите OnBodyCreated: выполняется один раз для каждого куска дороги.
tut_road_speed=Установите скорость %1$s: дорога едет вниз, и машина будто едет вперёд.
tut_road_update=Нажмите OnBodyUpdate: когда кусок уходит вниз за экран, он прыгает наверх над другим.
tut_road_limit=Введите %1$s во второй кружок: середина куска на полэкрана ниже — его уже не видно.
tut_moveby_inside=Перетащите «%1$s» внутрь «%2$s»: он сдвигает элемент на расстояние.
tut_moveby_dx=Установите dx = %1$s (без сдвига вбок).
tut_moveby_dy=Установите dy = %1$s: на два куска вверх, ровно над другим.
tut_rival_info=Три машины-соперника тоже делят события (Script: rival). Они едут вниз медленнее дороги — как медленные машины, которые вы обгоняете.

