ov_help = Переменные этого объекта. Каждое событие объекта (все его блоки) использует их по имени, напр. health = health - 1. У каждой копии объекта свои значения, начиная с начального.\n\nДругие объекты: блоки «задать переменную объекта» и «числовая переменная ___ у ___». Java: ObjectVars.getFloat(item, "health"), item.setVar("health", 3), item.getVarNumber("health").\n\nБлок «Локальная переменная» можно сделать переменной объекта: долгое нажатие на него в редакторе блоков.
