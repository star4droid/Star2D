bhv_p_Rotator3D_spinUpTime = Время разгона
bhv_pd_Rotator3D_spinUpTime = Секунд до полной скорости при старте (0 = сразу).
bhv_p_Rotator3D_running = Работает
bhv_pd_Rotator3D_running = Вращается со старта игры (блоки могут останавливать и запускать).
bhv_n_Seat3D = Сиденье 3D
bhv_d_Seat3D = Стул, скамья или диван, на которые игрок может сесть: вблизи появляется 2D-кнопка, камера плавно переезжает к сиденью (можно осматриваться), а контроллер движения игрока встаёт на паузу; нажмите снова, чтобы встать перед ним.
bhv_e_Seat3D_onSit = При посадке
bhv_e_Seat3D_onStand = При вставании
bhv_p_Seat3D_player = Игрок
bhv_pd_Seat3D_player = Элемент игрока, чей контроллер встаёт на паузу (пусто = то, за чем следует главная камера, или сама камера).
bhv_p_Seat3D_camera = Камера
bhv_pd_Seat3D_camera = Камера, которая едет к сиденью (пусто = главная камера).
bhv_p_Seat3D_range = Дальность
bhv_pd_Seat3D_range = Можно использовать на таком расстоянии.
bhv_p_Seat3D_eyeHeight = Высота глаз
bhv_pd_Seat3D_eyeHeight = Глаза над позицией сиденья сидя.
bhv_p_Seat3D_eyeForward = Глаза вперёд
bhv_pd_Seat3D_eyeForward = Глаза впереди центра сиденья (по его фронту).
bhv_p_Seat3D_seatYawOffset = Смещение курса сиденья
bhv_pd_Seat3D_seatYawOffset = Дополнительный курс сиденья: 180, если фронт модели +Z, а не -Z.
bhv_p_Seat3D_seatedPitch = Наклон сидя
bhv_pd_Seat3D_seatedPitch = Взгляд вниз сидя (отрицательный = вниз).
bhv_p_Seat3D_moveTime = Время перемещения
bhv_pd_Seat3D_moveTime = Секунд, за которые камера переезжает к сиденью и обратно.
bhv_p_Seat3D_lookWhileSeated = Осматриваться сидя
bhv_pd_Seat3D_lookWhileSeated = Тяните, чтобы осматриваться сидя.
bhv_p_Seat3D_standDistance = Расстояние при вставании
bhv_pd_Seat3D_standDistance = Встаёт на таком расстоянии перед сиденьем.
bhv_p_Seat3D_sitClip = Клип сидения
bhv_pd_Seat3D_sitClip = От третьего лица: сажает модель игрока на сиденье и проигрывает этот клип (пусто = модель остаётся на месте).
bhv_p_Seat3D_button = Кнопка
bhv_pd_Seat3D_button = 2D-кнопка сесть / встать (её могут делить несколько сидений).
bhv_p_Seat3D_promptText = Текст подсказки
bhv_pd_Seat3D_promptText = 2D-текст, показываемый с кнопкой (необязательно).
bhv_p_Seat3D_sitText = Текст «сесть»
bhv_pd_Seat3D_sitText = Подсказка «сесть».
bhv_p_Seat3D_standText = Текст «встать»
bhv_pd_Seat3D_standText = Подсказка «встать».
bhv_p_Seat3D_tapObject = Нажатие на объект
bhv_pd_Seat3D_tapObject = Нажатие на само сиденье тоже усаживает.
bhv_p_Seat3D_useKeyboard = Использовать клавиатуру
bhv_pd_Seat3D_useKeyboard = Клавиша E — сесть / встать (компьютер, тесты).
bhv_n_Shooter3D = Стрелок 3D
bhv_d_Shooter3D = Стреляет при нажатии или удержании кнопки огня: мгновенные попадания по прицелу (HITSCAN) или копии шаблона пули (со Снарядом 3D). Целится туда, куда смотрит камера, или вдоль фронта элемента; скорострельность, разброс, патроны из инвентаря, звуки и отдача камеры.
bhv_e_Shooter3D_onShoot = При выстреле
bhv_e_Shooter3D_onHit = При попадании
bhv_e_Shooter3D_onEmpty = Без патронов
bhv_p_Shooter3D_fireButton = Кнопка огня
bhv_pd_Shooter3D_fireButton = 2D-кнопка огня (любой элемент).
bhv_p_Shooter3D_autoFire = Автоогонь
bhv_pd_Shooter3D_autoFire = Стреляет, пока кнопка удерживается.
bhv_p_Shooter3D_fireRate = Скорострельность
bhv_pd_Shooter3D_fireRate = Выстрелов в секунду.
bhv_p_Shooter3D_useKeyboard = Использовать клавиатуру
bhv_pd_Shooter3D_useKeyboard = Пробел или F — огонь (компьютер, тесты).
