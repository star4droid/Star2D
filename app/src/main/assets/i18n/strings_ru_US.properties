bhv_p_Door3D_player = Игрок
bhv_pd_Door3D_player = Игрок (пусто = главная камера, игрок от первого лица).
bhv_p_Door3D_range = Дальность
bhv_pd_Door3D_range = Можно использовать на таком расстоянии.
bhv_p_Door3D_needLook = Нужно смотреть
bhv_pd_Door3D_needLook = Камера должна смотреть на дверь.
bhv_p_Door3D_button = Кнопка
bhv_pd_Door3D_button = 2D-кнопка, видимая, когда игрок может открыть дверь (её могут делить несколько дверей).
bhv_p_Door3D_promptText = Текст подсказки
bhv_pd_Door3D_promptText = 2D-текст, показываемый с кнопкой (необязательно).
bhv_p_Door3D_openText = Текст «открыть»
bhv_pd_Door3D_openText = Подсказка, пока закрыта.
bhv_p_Door3D_closeText = Текст «закрыть»
bhv_pd_Door3D_closeText = Подсказка, пока открыта.
bhv_p_Door3D_lockedText = Текст «заперто»
bhv_pd_Door3D_lockedText = Подсказка, пока заперта.
bhv_p_Door3D_tapObject = Нажатие на объект
bhv_pd_Door3D_tapObject = Нажатие на саму дверь тоже её открывает (в пределах дальности).
bhv_p_Door3D_useKeyboard = Использовать клавиатуру
bhv_pd_Door3D_useKeyboard = Клавиша E использует (компьютер, тесты).
bhv_p_Door3D_openSound = Звук открытия
bhv_pd_Door3D_openSound = Звук при открытии.
bhv_p_Door3D_closeSound = Звук закрытия
bhv_pd_Door3D_closeSound = Звук при закрытии.
bhv_p_Door3D_lockedSound = Звук запертой двери
bhv_pd_Door3D_lockedSound = Звук, когда игрок дёргает запертую дверь.
bhv_p_Door3D_unlockSound = Звук отпирания
bhv_pd_Door3D_unlockSound = Звук при отпирании.
bhv_n_EndlessRoad3D = Бесконечная дорога 3D
bhv_d_EndlessRoad3D = Строит бесконечную дорогу перед игроком (в сторону -Z) из шаблонов участков, переиспользуя оставшиеся позади; добавляет объекты по сторонам, трафик в полосах и подбираемые предметы, усложняется с расстоянием и считает дистанцию и очки. Поместите на пустой объект в начале дороги.
bhv_e_EndlessRoad3D_onLevelUp = При повышении уровня
bhv_e_EndlessRoad3D_onCrash = При аварии
bhv_e_EndlessRoad3D_onCollect = При сборе
bhv_p_EndlessRoad3D_target = Цель
bhv_pd_EndlessRoad3D_target = Машина игрока (или бегун), для которой строится дорога.
bhv_p_EndlessRoad3D_roadTiles = Участки дороги
bhv_pd_EndlessRoad3D_roadTiles = Шаблоны участков (каждый раз случайный; скрыты в начале).
bhv_p_EndlessRoad3D_tileLength = Длина участка
bhv_pd_EndlessRoad3D_tileLength = Длина участка вдоль Z (0 = измеряется по первому шаблону).
bhv_p_EndlessRoad3D_tilesAhead = Участков впереди
bhv_pd_EndlessRoad3D_tilesAhead = Участков, держащихся перед игроком.
bhv_p_EndlessRoad3D_tilesBehind = Участков позади
bhv_pd_EndlessRoad3D_tilesBehind = Участков, держащихся позади игрока.
bhv_p_EndlessRoad3D_props = Декорации
bhv_pd_EndlessRoad3D_props = Деревья, фонари, здания, знаки вдоль дороги (случайно).
bhv_p_EndlessRoad3D_propChance = Шанс декорации
bhv_pd_EndlessRoad3D_propChance = Шанс декорации с каждой стороны участка.
bhv_p_EndlessRoad3D_propDistance = Расстояние декораций
