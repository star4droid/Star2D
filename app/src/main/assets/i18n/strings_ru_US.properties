bhv_g_Reaction = Реакция
bhv_p_DamageOnTouch_knockbackUp = Отбрасывание вверх
bhv_pd_DamageOnTouch_knockbackUp = Оттолкнуть цель вверх, в px/с.
bhv_p_DamageOnTouch_stunTime = Время оглушения
bhv_pd_DamageOnTouch_stunTime = Поведения движения цели остаются выключенными столько времени, чтобы толчок был виден (см. Health > Поведения оглушения).
bhv_p_DamageOnTouch_hitSound = Звук удара
bhv_pd_DamageOnTouch_hitSound = Проигрывается, когда кому-то наносится урон.
bhv_n_Destructible = Разрушаемый
bhv_d_Destructible = Ящики, кирпичи, стены: ломается после нескольких ударов (пули, DamageOnTouch или касание мяча), по пути показывает повреждённые картинки и может выбросить предмет.
bhv_note_Destructible = Нужен физический элемент. Удары касанием определяются по контактам, поэтому должно участвовать Dynamic-тело (мяч, игрок).
bhv_p_Destructible_hits = Удары
bhv_pd_Destructible_hits = Сколько ударов нужно.
bhv_g_Durability = Прочность
bhv_p_Destructible_everyHitCountsOne = Каждый удар считается за один
bhv_pd_Destructible_everyHitCountsOne = Каждый удар считается за 1, каков бы ни был его урон. Выкл.: очки урона вычитаются из ударов.
bhv_p_Destructible_hitters = Бьющие
bhv_pd_Destructible_hitters = Элементы, наносящие ему урон касанием (мяч для кирпичей).
bhv_g_Hit_by_touching = Удар касанием
bhv_p_Destructible_hitterPrefix = Префикс бьющего
bhv_pd_Destructible_hitterPrefix = Также элементы, имя которых начинается с одного из этих слов, напр. ball (через запятую).
bhv_p_Destructible_damagedImage1 = Повреждённое изображение 1
bhv_pd_Destructible_damagedImage1 = Картинка после первых ударов (необязательно). До трёх картинок распределяются по ходу урона.
bhv_g_Look = Вид
bhv_p_Destructible_damagedImage2 = Повреждённое изображение 2
bhv_pd_Destructible_damagedImage2 = Картинка после нескольких ударов (необязательно).
bhv_p_Destructible_damagedImage3 = Повреждённое изображение 3
bhv_pd_Destructible_damagedImage3 = Картинка прямо перед разрушением (необязательно).
bhv_p_Destructible_hitSound = Звук удара
bhv_pd_Destructible_hitSound = Проигрывается при каждом ударе, который не разрушает его.
bhv_p_Destructible_breakSound = Звук разрушения
bhv_pd_Destructible_breakSound = Проигрывается, когда он ломается.
bhv_p_Destructible_breakAction = Действие при разрушении
bhv_pd_Destructible_breakAction = DESTROY удаляет его, HIDE оставляет (невидимым, без столкновений), чтобы можно было вернуть через reset.
bhv_g_When_it_breaks = Когда ломается
bhv_p_Destructible_breakDelay = Задержка разрушения
bhv_pd_Destructible_breakDelay = Подождать столько, прежде чем он исчезнет (время для вашего эффекта).
bhv_p_Destructible_dropItem = Выпадающий предмет
bhv_pd_Destructible_dropItem = Элемент, копируемый при разрушении (усиление, монета...). Оригинал можно положить куда угодно: он скрывается при старте игры. Необязательно.
bhv_p_Destructible_dropChance = Шанс выпадения
bhv_pd_Destructible_dropChance = Шанс выпадения предмета.
bhv_n_Health = Здоровье
bhv_d_Health = Очки здоровья для любого элемента: урон, лечение, кадры неуязвимости, регенерация, индикатор прогресса, следующий за здоровьем, и то, что происходит при смерти (уничтожить, скрыть, возродить, перезапустить сцену или открыть другую).
bhv_p_Health_maxHealth = Макс. здоровье
bhv_pd_Health_maxHealth = Очки здоровья, когда оно полное.
bhv_g_Hit_points = Очки здоровья
bhv_p_Health_health = Здоровье
bhv_pd_Health_health = Очки здоровья в начале сцены.
bhv_p_Health_invulnerableTime = Время неуязвимости
bhv_pd_Health_invulnerableTime = После удара столько времени ничто не может его ранить (также останавливает урон от нескольких касающихся врагов одновременно).
bhv_p_Health_regenPerSecond = Регенерация в секунду
bhv_pd_Health_regenPerSecond = Очков здоровья восстанавливается в секунду (0 = без регенерации).
bhv_p_Health_regenDelay = Задержка регенерации
bhv_pd_Health_regenDelay = Регенерация начинается через столько после последнего удара.
bhv_p_Health_bar = Полоса
bhv_pd_Health_bar = Элемент-индикатор прогресса, показывающий здоровье (его Max и Progress задаются автоматически). Необязательно.
bhv_g_Display = Экран
bhv_p_Health_blinkWhileInvulnerable = Мигать при неуязвимости
bhv_pd_Health_blinkWhileInvulnerable = Мигать при неуязвимости, чтобы игрок видел удар.
bhv_p_Health_shakeOnHit = Тряска при ударе
bhv_pd_Health_shakeOnHit = Трясти камеру при ранении (нужен CameraShake в сцене). 0 = выкл.
bhv_p_Health_hurtSound = Звук ранения
bhv_pd_Health_hurtSound = Проигрывается при получении урона.
bhv_p_Health_deathSound = Звук смерти
bhv_pd_Health_deathSound = Проигрывается при смерти.
bhv_p_Health_dieAction = Действие при смерти
bhv_pd_Health_dieAction = Что происходит, когда очки здоровья достигают 0. RESPAWN требует поведения Respawn на том же элементе (иначе сцена перезапускается).
bhv_g_Death = Смерть
bhv_p_Health_dieDelay = Задержка смерти
bhv_pd_Health_dieDelay = Подождать столько после смерти перед действием (время для вашей анимации смерти).
bhv_p_Health_scene = Сцена
bhv_pd_Health_scene = Сцена для открытия при OPEN_SCENE; для RESTART_SCENE оставьте пустым, чтобы открыть заново текущую сцену (введите её точное имя, если в нём есть заглавные буквы).
bhv_p_Health_stunBehaviors = Поведения оглушения
bhv_pd_Health_stunBehaviors = Поведения, выключаемые во время оглушения от удара со временем оглушения (имена через запятую).
bhv_g_Hit_reaction = Реакция на удар
bhv_n_Projectile = Снаряд
bhv_d_Projectile = Превращает элемент в пулю, стрелу или огненный шар: летит в заданном направлении, ранит то, во что попадёт, останавливается у стен и исчезает по истечении времени жизни. Используйте с Spawner, чтобы выпускать копии.
bhv_p_Projectile_angle = Угол
bhv_pd_Projectile_angle = Направление: 0 = вправо, 90 = вверх, 180 = влево, -90 = вниз.
bhv_g_Flight = Полёт
bhv_p_Projectile_useElementRotation = Использовать поворот элемента
bhv_pd_Projectile_useElementRotation = Лететь туда, куда смотрит элемент (поворачивайте элемент или его спавнер, чтобы целиться).
bhv_p_Projectile_speed = Скорость
bhv_p_Projectile_acceleration = Ускорение
bhv_pd_Projectile_acceleration = Ускоряется (или замедляется при отрицательном значении) каждую секунду.
bhv_p_Projectile_gravity = Гравитация
bhv_pd_Projectile_gravity = Гравитация искривляет полёт (гранаты, стрелы). Тогда скорость — только начальная.
bhv_p_Projectile_lifetime = Время жизни
bhv_pd_Projectile_lifetime = Исчезает через столько. 0 = никогда.
bhv_p_Projectile_autoLaunch = Автозапуск
bhv_pd_Projectile_autoLaunch = Начать лететь при появлении элемента. Выкл.: вызывайте launch сами.
bhv_p_Projectile_targets = Цели
bhv_pd_Projectile_targets = Элементы, которым он наносит урон. Оставьте оба поля пустыми, чтобы ранить всё, у чего есть Health.
bhv_p_Projectile_targetPrefix = Префикс цели
bhv_pd_Projectile_targetPrefix = Также элементы, имя которых начинается с одного из этих слов (через запятую), напр. enemy.
bhv_p_Projectile_damage = Урон
bhv_pd_Projectile_damage = Очки здоровья, отнимаемые одним ударом.
bhv_p_Projectile_autoHealth = Авто-здоровье
bhv_pd_Projectile_autoHealth = Дать цели без Health столько очков здоровья (0 = не трогать).
bhv_p_Projectile_pierce = Прошивание
bhv_pd_Projectile_pierce = Сколько дополнительных целей он может пройти насквозь, прежде чем остановится.
bhv_p_Projectile_knockback = Отбрасывание
bhv_pd_Projectile_knockback = Оттолкнуть поражённую цель по ходу полёта, в px/с.
bhv_p_Projectile_hitSound = Звук удара
bhv_pd_Projectile_hitSound = Проигрывается при попадании в цель.
bhv_p_Projectile_obstacles = Препятствия
bhv_pd_Projectile_obstacles = Стены / земля, которые его останавливают.
bhv_g_Obstacles = Препятствия
bhv_p_Projectile_obstaclePrefix = Префикс препятствия
bhv_pd_Projectile_obstaclePrefix = Также элементы, имя которых начинается с одного из этих слов, напр. wall, ground.
bhv_p_Projectile_destroyOnObstacle = Уничтожать о препятствие
bhv_pd_Projectile_destroyOnObstacle = Исчезать при касании препятствия.
bhv_n_Shooter = Стрелок
bhv_d_Shooter = Стреляет пулями с помощью джойстика, кнопки огня или автоматически по ближайшему врагу. Враги получают урон, усиления повышают скорострельность и урон.
bhv_note_Shooter = Нужен физический элемент (пули вылетают из его центра).
bhv_p_Shooter_aimJoystick = Джойстик прицеливания
bhv_pd_Shooter_aimJoystick = Целиться и стрелять, двигая этот джойстик (необязательно).
bhv_g_Controls = Управление
bhv_p_Shooter_fireButton = Кнопка огня
bhv_pd_Shooter_fireButton = Стреляет, пока этот элемент удерживается (необязательно).
bhv_p_Shooter_autoFire = Автоогонь
bhv_pd_Shooter_autoFire = Стрелять само, пока враг в зоне досягаемости.
bhv_p_Shooter_autoAim = Автоприцел
bhv_pd_Shooter_autoAim = Целиться в ближайшего врага, когда джойстик не используется.
bhv_p_Shooter_defaultAngle = Угол по умолчанию
bhv_pd_Shooter_defaultAngle = Направление, когда цели нет: 0 = вправо, 90 = вверх. Изображение, отражённое влево, стреляет влево.
bhv_p_Shooter_bulletImage = Изображение пули
bhv_g_Bullets = Пули
bhv_p_Shooter_bulletColor = Цвет пули
bhv_p_Shooter_bulletSize = Размер пули
bhv_p_Shooter_bulletSpeed = Скорость пули
bhv_p_Shooter_fireRate = Скорострельность
bhv_pd_Shooter_fireRate = Выстрелов в секунду.
bhv_p_Shooter_bulletLifetime = Время жизни пули
bhv_pd_Shooter_bulletLifetime = Пуля исчезает через столько.
bhv_p_Shooter_range = Дальность
bhv_pd_Shooter_range = Враги дальше этого расстояния игнорируются автоприцелом / автоогнём.
bhv_p_Shooter_enemies = Враги
bhv_pd_Shooter_enemies = Элементы, которым пули наносят урон.
bhv_g_Enemies = Враги
bhv_p_Shooter_damage = Урон
bhv_pd_Shooter_damage = Урон одной пули.
bhv_p_Shooter_enemyHealth = Здоровье врага
bhv_pd_Shooter_enemyHealth = Очки здоровья, с которыми начинает каждый враг.
bhv_p_Shooter_destroyKilled = Уничтожать убитых
bhv_pd_Shooter_destroyKilled = Удалять врагов, когда их здоровье достигает 0.
bhv_p_Shooter_powerups = Усиления
bhv_pd_Shooter_powerups = Элементы, дающие бонус, когда стрелок касается их (они исчезают).
bhv_g_Power_ups = Усиления
bhv_p_Shooter_powerFireRate = Скорострельность усиления
bhv_pd_Shooter_powerFireRate = Скорострельность умножается на это значение во время усиления.
bhv_p_Shooter_powerDamage = Урон усиления
bhv_pd_Shooter_powerDamage = Урон умножается на это значение во время усиления.
bhv_p_Shooter_powerDuration = Длительность усиления
bhv_n_Spawner = Спавнер
bhv_d_Spawner = Создаёт копии элемента-шаблона во время игры: врагов, монеты, камни. Каждые несколько секунд или волнами, в месте спавнера, внутри его области, по кольцу вокруг него или в точках появления, с ограничением числа одновременно живых.
bhv_p_Spawner_template = Шаблон
bhv_pd_Spawner_template = Элемент для копирования. Он скрывается при старте игры; каждая копия сохраняет его поведения, события и свойства.
bhv_g_What = Что
bhv_p_Spawner_moreTemplates = Другие шаблоны
bhv_pd_Spawner_moreTemplates = Другие элементы для копирования: при каждом появлении случайно выбирается один из всех шаблонов.
bhv_p_Spawner_spawnedLifetime = Время жизни копий
bhv_pd_Spawner_spawnedLifetime = Каждая копия удаляется через столько (0 = никогда).
bhv_p_Spawner_autoStart = Автостарт
bhv_pd_Spawner_autoStart = Начать создавать копии при старте сцены. Выкл.: вызовите start spawning.
bhv_g_When = Когда
bhv_p_Spawner_firstDelay = Первая задержка
bhv_pd_Spawner_firstDelay = Подождать столько перед первым появлением.
bhv_p_Spawner_interval = Интервал
bhv_pd_Spawner_interval = Секунд между двумя появлениями (в волнах: между двумя участниками одной волны).
bhv_p_Spawner_maxAlive = Макс. живых
bhv_pd_Spawner_maxAlive = Новая копия не создаётся, пока столько живо. 0 = без ограничения (движок останавливается на 300).
bhv_p_Spawner_totalLimit = Общий лимит
bhv_pd_Spawner_totalLimit = Остановиться насовсем после стольких появлений. 0 = никогда.
bhv_p_Spawner_speedUp = Ускорение
bhv_pd_Spawner_speedUp = Каждое появление (каждая волна в режиме волн) сокращает интервал на столько.
bhv_p_Spawner_minInterval = Мин. интервал
bhv_pd_Spawner_minInterval = Интервал никогда не станет короче этого.
bhv_p_Spawner_area = Область
bhv_pd_Spawner_area = AT_SPAWNER: на спавнере. INSIDE_SELF: где угодно в его прямоугольнике. RING: вокруг него. POINTS: в элементах-маркерах ниже.
bhv_g_Where = Где
bhv_p_Spawner_radiusMin = Мин. радиус
bhv_pd_Spawner_radiusMin = RING: ближайшее расстояние от спавнера.
bhv_p_Spawner_radiusMax = Макс. радиус
bhv_pd_Spawner_radiusMax = RING: дальнейшее расстояние от спавнера.
bhv_p_Spawner_points = Точки
bhv_pd_Spawner_points = POINTS: элементы, отмечающие, где появляются копии.
bhv_p_Spawner_randomPoint = Случайная точка
bhv_pd_Spawner_randomPoint = POINTS: выбирать случайную точку. Выкл.: проходить по ним по порядку.
bhv_p_Spawner_useWaves = Использовать волны
bhv_pd_Spawner_useWaves = Появление волнами: группа, пауза, группа побольше...
bhv_g_Waves = Волны
bhv_p_Spawner_waveSize = Размер волны
bhv_pd_Spawner_waveSize = Участников первой волны.
bhv_p_Spawner_waveGrowth = Рост волны
bhv_pd_Spawner_waveGrowth = В каждой волне на столько участников больше, чем в предыдущей.
bhv_p_Spawner_waveCount = Число волн
bhv_pd_Spawner_waveCount = Количество волн. 0 = бесконечно.
bhv_p_Spawner_waveDelay = Задержка волны
bhv_pd_Spawner_waveDelay = Пауза между двумя волнами.
bhv_p_Spawner_waitUntilCleared = Ждать полной зачистки
bhv_pd_Spawner_waitUntilCleared = Волна заканчивается (и может начаться следующая), только когда все её участники исчезли.
bhv_p_Spawner_loopWaves = Зациклить волны
bhv_pd_Spawner_loopWaves = Начать заново с первой волны после последней.
bhv_p_Spawner_spawnSound = Звук появления
bhv_pd_Spawner_spawnSound = Проигрывается при каждом появлении.
bhv_n_Turret = Турель
bhv_d_Turret = Автоматическая пушка: находит ближайшую цель в зоне досягаемости, поворачивается к ней и стреляет пулями, которые её ранят (целям нужно поведение Health, либо дайте им очки здоровья через «Авто-здоровье»). Пули используются повторно, поэтому это дёшево.
bhv_note_Turret = Нужен физический элемент; он поворачивается и стреляет из своего центра.
bhv_p_Turret_targets = Цели
bhv_pd_Turret_targets = Элементы, по которым он стреляет.
bhv_g_Targets = Цели
bhv_p_Turret_targetPrefix = Префикс цели
bhv_pd_Turret_targetPrefix = Также элементы, имя которых начинается с одного из этих слов (через запятую), напр. player, enemy.
bhv_p_Turret_range = Дальность
bhv_pd_Turret_range = Видит только цели на таком расстоянии.
bhv_p_Turret_turnSpeed = Скорость поворота
bhv_pd_Turret_turnSpeed = Поворачивается к цели с такой скоростью. 0 = мгновенно.
bhv_g_Aim = Прицел
bhv_p_Turret_imageAngle = Угол изображения
bhv_pd_Turret_imageAngle = Направление, куда смотрит картинка при повороте 0: 0 = вправо, 90 = вверх, 180 = влево, -90 = вниз.
bhv_p_Turret_rotateToTarget = Поворачиваться к цели
bhv_pd_Turret_rotateToTarget = Поворачивать элемент к цели. Выкл.: только стреляет в том направлении, куда уже смотрит.
bhv_p_Turret_aimTolerance = Допуск прицела
bhv_pd_Turret_aimTolerance = Стреляет, только когда направлен на цель с такой точностью.
bhv_p_Turret_leadTarget = Упреждение цели
bhv_pd_Turret_leadTarget = Целится туда, где будет движущаяся цель, а не туда, где она сейчас.
bhv_p_Turret_active = Активна
bhv_pd_Turret_active = Стреляет автоматически. Выкл.: вызывайте fire now сами.
bhv_g_Fire = Огонь
bhv_p_Turret_fireRate = Скорострельность
bhv_pd_Turret_fireRate = Залпов в секунду.
bhv_p_Turret_burst = Очередь
bhv_pd_Turret_burst = Пуль в одном залпе.
bhv_p_Turret_burstGap = Интервал очереди
bhv_pd_Turret_burstGap = Пауза между пулями одного залпа.
bhv_p_Turret_spread = Разброс
bhv_pd_Turret_spread = Случайное боковое отклонение каждой пули.
bhv_p_Turret_muzzle = Дуло
bhv_pd_Turret_muzzle = Пули вылетают на таком расстоянии от центра в направлении стрельбы (конец ствола).
bhv_p_Turret_bulletImage = Изображение пули
bhv_pd_Turret_bulletImage = Картинка пули. Пусто = цветной квадрат.
bhv_g_Bullet = Пуля
bhv_p_Turret_bulletColor = Цвет пули
bhv_pd_Turret_bulletColor = Цвет квадрата (или оттенок картинки).
bhv_p_Turret_bulletSize = Размер пули
bhv_p_Turret_bulletSpeed = Скорость пули
bhv_p_Turret_bulletLifetime = Время жизни пули
bhv_pd_Turret_bulletLifetime = Пуля, ни во что не попавшая, исчезает через столько.
bhv_p_Turret_damage = Урон
bhv_pd_Turret_damage = Очки здоровья, отнимаемые одной пулей.
bhv_p_Turret_autoHealth = Авто-здоровье
bhv_pd_Turret_autoHealth = Дать цели без Health столько очков здоровья (0 = не трогать).
bhv_p_Turret_knockback = Отбрасывание
bhv_pd_Turret_knockback = Оттолкнуть цель по направлению пули.
bhv_p_Turret_shootSound = Звук выстрела
bhv_pd_Turret_shootSound = Проигрывается при каждом выстреле.
bhv_p_Turret_hitSound = Звук удара
bhv_pd_Turret_hitSound = Проигрывается при попадании пули.
bhv_p_Turret_obstacles = Препятствия
bhv_pd_Turret_obstacles = Стены, останавливающие пули.
bhv_p_Turret_obstaclePrefix = Префикс препятствия
bhv_pd_Turret_obstaclePrefix = Также элементы, имя которых начинается с одного из этих слов, напр. wall, ground.
bhv_n_Checkpoint = Контрольная точка
bhv_d_Checkpoint = Флаг, запоминающий, куда возвращаться: когда игрок касается его, поведение Respawn возвращает сюда после смерти или падения. Работает при перезапусках сцены (и, если хотите, при запусках приложения).
bhv_g_Gameplay = Геймплей
bhv_note_Checkpoint = Нужен физический элемент; сделайте его Sensor, чтобы игрок пробегал сквозь него.
bhv_p_Checkpoint_targets = Цели
bhv_pd_Checkpoint_targets = Элементы, которые его активируют.
bhv_g_Who_activates_it = Кто активирует
bhv_p_Checkpoint_targetPrefix = Префикс цели
bhv_pd_Checkpoint_targetPrefix = Также элементы, имя которых начинается с одного из этих слов (через запятую).
bhv_p_Checkpoint_channel = Канал
bhv_pd_Checkpoint_channel = Контрольные точки и поведения Respawn с одним каналом работают вместе. Для разных игроков используйте разные каналы.
bhv_g_Respawn_point = Точка возрождения
bhv_p_Checkpoint_offsetX = Смещение x
bhv_pd_Checkpoint_offsetX = Игрок возвращается на столько правее центра флага (отрицательное = левее).
bhv_p_Checkpoint_offsetY = Смещение y
bhv_pd_Checkpoint_offsetY = Игрок возвращается на столько выше центра флага.
bhv_p_Checkpoint_saveToDisk = Сохранять на диск
bhv_pd_Checkpoint_saveToDisk = Сохранять контрольную точку после закрытия приложения (Preferences). Выкл.: действует до закрытия игры или вызова forgetCheckpoints.
bhv_p_Checkpoint_activeImage = Изображение активной
bhv_pd_Checkpoint_activeImage = Картинка после активации (необязательно), напр. поднятый флаг.
bhv_p_Checkpoint_activateSound = Звук активации
bhv_pd_Checkpoint_activateSound = Проигрывается при активации.
bhv_n_Collectible = Собираемый предмет
bhv_d_Collectible = Монеты, самоцветы, ключи, сердца: когда игрок касается, добавляет значение в переменную сцены (счёт, монеты, ключи), может лечить, проигрывает звук и исчезает или возвращается позже.
bhv_note_Collectible = Нужен физический элемент; лучше как Sensor, чтобы игрок проходил сквозь него.
bhv_p_Collectible_collectors = Собирающие
bhv_pd_Collectible_collectors = Элементы, которые могут его собрать.
bhv_g_Who_can_pick_it_up = Кто может подобрать
bhv_p_Collectible_collectorPrefix = Префикс собирающего
bhv_pd_Collectible_collectorPrefix = Также элементы, имя которых начинается с одного из этих слов (через запятую). Оставьте список и этот текст пустыми, чтобы любой элемент с поведением Health мог его собрать.
bhv_p_Collectible_variable = Переменная
bhv_pd_Collectible_variable = Имя переменной сцены (создайте её в «Переменных»: int или float), напр. score или coins. Пусто = без переменной.
bhv_g_Reward = Награда
bhv_p_Collectible_value = Значение
bhv_pd_Collectible_value = Добавляется к переменной при сборе.
bhv_p_Collectible_heal = Лечение
bhv_pd_Collectible_heal = Лечит собирающего (нужно поведение Health).
bhv_p_Collectible_group = Группа
bhv_pd_Collectible_group = Учитывается для Goal, требующей все собираемые предметы этой группы (монеты, звёзды...). Пусто = без группы.
bhv_p_Collectible_collectSound = Звук сбора
bhv_pd_Collectible_collectSound = Проигрывается при сборе.
bhv_p_Collectible_afterCollect = После сбора
bhv_pd_Collectible_afterCollect = DESTROY удаляет его, HIDE оставляет невидимым (потом возвращается через respawn), NOTHING оставляет как есть.
bhv_g_After = После
bhv_p_Collectible_popTime = Время хлопка
bhv_pd_Collectible_popTime = Короткий хлопок (рост и затухание) перед исчезновением.
bhv_p_Collectible_respawnAfter = Возродить через
bhv_pd_Collectible_respawnAfter = Только HIDE: возвращается через столько. 0 = никогда.
bhv_n_Door = Дверь
bhv_d_Door = Дверь, портал или выход: когда игрок касается её (или нажимает кнопку рядом), открывает другую сцену или телепортирует игрока к другому элементу. Может сначала требовать ключ (переменную сцены).
bhv_note_Door = Нужен физический элемент; сделайте его Sensor, чтобы игрок мог стоять в нём.
bhv_p_Door_targets = Цели
bhv_pd_Door_targets = Элементы, которые могут ею пользоваться.
bhv_g_Who = Кто
bhv_p_Door_targetPrefix = Префикс цели
bhv_pd_Door_targetPrefix = Также элементы, имя которых начинается с одного из этих слов (через запятую).
bhv_p_Door_mode = Режим
bhv_pd_Door_mode = OPEN_SCENE открывает другую сцену, TELEPORT перемещает игрока к элементу назначения.
bhv_g_What_it_does = Что делает
bhv_p_Door_scene = Сцена
bhv_pd_Door_scene = OPEN_SCENE: сцена для открытия (точное имя).
bhv_p_Door_destination = Назначение
bhv_pd_Door_destination = TELEPORT: игрок появляется в центре этого элемента (другая Door даёт двусторонний портал).
bhv_p_Door_delay = Задержка
bhv_pd_Door_delay = Подождать столько после открытия двери (время для звука или анимации).
bhv_p_Door_trigger = Триггер
bhv_pd_Door_trigger = ON_TOUCH: сразу. WHEN_PRESSED: игрок должен также удерживать кнопку ниже (или нажать Up / W на клавиатуре).
bhv_g_How_it_opens = Как открывается
bhv_p_Door_useButton = Кнопка использования
bhv_pd_Door_useButton = Элемент-кнопка, которую нужно удерживать при WHEN_PRESSED (необязательно).
bhv_p_Door_needVariable = Нужная переменная
bhv_pd_Door_needVariable = Переменная сцены, которая должна достичь числа ниже, напр. keys. Пусто = всегда открыто.
bhv_p_Door_needAtLeast = Нужно не менее
bhv_pd_Door_needAtLeast = Необходимое значение переменной.
bhv_p_Door_consume = Расходовать
bhv_pd_Door_consume = Использование двери отнимает это количество у переменной (ключ тратится).
bhv_p_Door_openSound = Звук открытия
bhv_pd_Door_openSound = Проигрывается при открытии двери.
bhv_p_Door_lockedSound = Звук запертой двери
bhv_pd_Door_lockedSound = Проигрывается, когда игрок касается двери, а ключа нет.
bhv_n_Goal = Цель уровня
bhv_d_Goal = Финишная черта / условие победы: уровень выигран, когда игрок достигает её И выполнены условия (собраны все монеты группы, набран счёт, все враги уничтожены). Показывает панель победы и может открыть следующую сцену.
bhv_p_Goal_targets = Цели
bhv_pd_Goal_targets = Элементы, побеждающие касанием.
bhv_g_Who_wins = Кто побеждает
bhv_p_Goal_targetPrefix = Префикс цели
bhv_pd_Goal_targetPrefix = Также элементы, имя которых начинается с одного из этих слов (через запятую).
bhv_p_Goal_needTouch = Нужно касание
bhv_pd_Goal_needTouch = Выкл.: касание не нужно, уровень выигран, как только выполнены условия ниже (напр. собрать все звёзды).
bhv_p_Goal_collectGroup = Группа для сбора
bhv_pd_Goal_collectGroup = Имя группы собираемых предметов, которые нужно собрать ВСЕ. Пусто = без условия.
bhv_g_Conditions = Условия
bhv_p_Goal_needVariable = Нужная переменная
bhv_pd_Goal_needVariable = Переменная сцены, которая должна достичь числа ниже, напр. score или keys. Пусто = без условия.
bhv_p_Goal_needAtLeast = Нужно не менее
bhv_pd_Goal_needAtLeast = Необходимое значение переменной.
bhv_p_Goal_mustBeGone = Должны исчезнуть
bhv_pd_Goal_mustBeGone = Элементы, которые должны быть уничтожены все (боссы, враги).
bhv_p_Goal_winPanel = Панель победы
bhv_pd_Goal_winPanel = Элемент для показа (панель «Вы победили»). Скрывается при старте игры.
bhv_g_When_won = При победе
bhv_p_Goal_nextScene = Следующая сцена
bhv_pd_Goal_nextScene = Сцена для открытия после задержки (следующий уровень). Пусто = остаться.
bhv_p_Goal_delay = Задержка
bhv_pd_Goal_delay = Подождать столько перед открытием сцены.
bhv_p_Goal_clearCheckpoints = Сбросить контрольные точки
bhv_pd_Goal_clearCheckpoints = Забыть контрольные точки при победе в уровне (чтобы следующая игра началась с начала).
bhv_p_Goal_winSound = Звук победы
bhv_pd_Goal_winSound = Проигрывается при победе в уровне.
bhv_n_PowerUp = Усиление
bhv_d_PowerUp = Подбираемый предмет, который на время меняет настройки поведения у того, кто его взял (быстрее, выше прыжки, быстрее стрельба...), а затем возвращает их. Также может лечить и делать неуязвимым.
bhv_note_PowerUp = Нужен физический элемент; лучше как Sensor, чтобы игрок проходил сквозь него.
bhv_p_PowerUp_collectors = Собирающие
bhv_pd_PowerUp_collectors = Элементы, которые могут его взять.
bhv_p_PowerUp_collectorPrefix = Префикс собирающего
bhv_pd_PowerUp_collectorPrefix = Также элементы, имя которых начинается с одного из этих слов (через запятую). Оставьте список и этот текст пустыми, чтобы любой элемент с поведением Health мог его взять.
bhv_p_PowerUp_behavior1 = Поведение
bhv_pd_PowerUp_behavior1 = Имя класса поведения у собирающего, напр. PlatformerPlayer, Shooter, TopDownPlayer. Пусто = без эффекта.
bhv_g_Effect_1 = Эффект 1
bhv_p_PowerUp_parameter1 = Настройка
bhv_pd_PowerUp_parameter1 = Настройка (публичное поле) для изменения, в точности как в поведении, напр. jumpSpeed, speed, fireRate.
bhv_p_PowerUp_mode1 = Как
bhv_pd_PowerUp_mode1 = SET задаёт значение, ADD прибавляет, MULTIPLY умножает текущее значение.
bhv_p_PowerUp_amount1 = Величина
bhv_p_PowerUp_behavior2 = Поведение
bhv_pd_PowerUp_behavior2 = Вторая настройка для одновременного изменения (необязательно).
bhv_g_Effect_2 = Эффект 2
bhv_p_PowerUp_parameter2 = Настройка
bhv_pd_PowerUp_parameter2 = Вторая настройка для изменения, в точности как в поведении.
bhv_p_PowerUp_mode2 = Как
bhv_pd_PowerUp_mode2 = SET задаёт значение, ADD прибавляет, MULTIPLY умножает текущее значение.
bhv_p_PowerUp_amount2 = Величина
bhv_p_PowerUp_duration = Длительность
bhv_pd_PowerUp_duration = Сколько длятся эффекты. 0 = навсегда.
bhv_g_Duration_and_extras = Длительность и дополнительно
bhv_p_PowerUp_heal = Лечение
bhv_pd_PowerUp_heal = Очков здоровья, восстанавливаемых собирающему (нужно Health).
bhv_p_PowerUp_shield = Щит
bhv_pd_PowerUp_shield = Собирающего нельзя ранить в течение этого времени (нужно Health).
bhv_p_PowerUp_collectSound = Звук сбора
bhv_pd_PowerUp_collectSound = Проигрывается при подборе.
bhv_p_PowerUp_afterCollect = После сбора
bhv_pd_PowerUp_afterCollect = DESTROY удаляет его после окончания эффектов, HIDE только скрывает.
bhv_p_PowerUp_respawnAfter = Возродить через
bhv_pd_PowerUp_respawnAfter = Возвращается через столько (чтобы то же усиление можно было взять снова). 0 = никогда.
bhv_n_Respawn = Возрождение
bhv_d_Respawn = Возвращает игрока к последней контрольной точке (или к месту старта) после смерти или падения за пределы мира, с короткой неуязвимостью, необязательным счётчиком жизней и сценой окончания игры.
bhv_note_Respawn = Нужен физический элемент. Чтобы использовать при смерти, задайте действие смерти в Health как RESPAWN.
bhv_p_Respawn_channel = Канал
bhv_pd_Respawn_channel = Должен совпадать с каналом контрольных точек, которые нужно использовать.
bhv_p_Respawn_startAtCheckpoint = Старт у контрольной точки
bhv_pd_Respawn_startAtCheckpoint = В начале сцены перейти к сохранённой контрольной точке, если она есть (после перезапуска).
bhv_p_Respawn_saveToDisk = Сохранять на диск
bhv_pd_Respawn_saveToDisk = Также искать контрольную точку, сохранённую на диске.
bhv_p_Respawn_respawnWhenFalling = Возрождение при падении
bhv_pd_Respawn_respawnWhenFalling = Возрождаться, когда элемент падает ниже линии (ямы в платформерах).
bhv_p_Respawn_fallBelowY = Падение ниже y
bhv_pd_Respawn_fallBelowY = Высота линии (пиксели редактора, y вверх). Ниже неё элемент возрождается.
bhv_p_Respawn_delay = Задержка
bhv_pd_Respawn_delay = Подождать столько (невидимым) перед возвращением.
bhv_g_How = Как
bhv_p_Respawn_invulnerableTime = Время неуязвимости
bhv_pd_Respawn_invulnerableTime = Ничто не может ранить его столько времени после возвращения (нужно Health).
bhv_p_Respawn_restoreHealth = Восстановить здоровье
bhv_pd_Respawn_restoreHealth = Очки здоровья снова полные (нужно Health).
bhv_p_Respawn_respawnSound = Звук возрождения
bhv_pd_Respawn_respawnSound = Проигрывается при возвращении.
bhv_p_Respawn_lives = Жизни
bhv_pd_Respawn_lives = Количество жизней. 0 = без ограничения. Когда потеряна последняя, открывается сцена ниже.
bhv_g_Lives = Жизни
bhv_p_Respawn_livesVariable = Переменная жизней
bhv_pd_Respawn_livesVariable = Переменная сцены (int), всегда показывающая оставшиеся жизни, напр. lives. Пусто = нет.
bhv_p_Respawn_gameOverScene = Сцена окончания игры
bhv_pd_Respawn_gameOverScene = Сцена для открытия, когда жизней не осталось (игра окончена). Пусто = ничего не делать, срабатывает только событие.
bhv_n_ButtonSound = Звук кнопки
bhv_d_ButtonSound = Проигрывает звук, когда элемент нажимают, отпускают или кликают. Добавьте его на каждую кнопку вашего меню.
bhv_g_Input = Ввод
bhv_p_ButtonSound_sound = Звук
bhv_pd_ButtonSound_sound = Звук, проигрываемый при начале касания / клике (файл из sounds проекта).
bhv_p_ButtonSound_releaseSound = Звук отпускания
bhv_pd_ButtonSound_releaseSound = Звук, проигрываемый, когда палец отпущен (необязательно).
bhv_p_ButtonSound_when = Когда
bhv_pd_ButtonSound_when = TOUCH_START = сразу при нажатии, CLICK = только когда нажали и отпустили на нём.
bhv_p_ButtonSound_cooldown = Пауза между срабатываниями
bhv_pd_ButtonSound_cooldown = Игнорировать касания, пришедшие раньше этого времени после последнего звука.
bhv_n_Draggable = Перетаскиваемый
bhv_d_Draggable = Игрок может перетаскивать элемент пальцем. Держите его внутри области, привязывайте к сетке, возвращайте домой или бросайте на цели (головоломки, инвентари, ползунки).
bhv_p_Draggable_lockX = Блокировка x
bhv_pd_Draggable_lockX = Не двигать вбок.
bhv_p_Draggable_lockY = Блокировка y
bhv_pd_Draggable_lockY = Не двигать вверх и вниз.
bhv_p_Draggable_area = Область
bhv_pd_Draggable_area = Держать элемент внутри прямоугольника другого элемента (необязательно).
bhv_p_Draggable_gridSize = Размер сетки
bhv_pd_Draggable_gridSize = При отпускании привязывать к сетке такого размера (0 = без сетки).
bhv_p_Draggable_snapBack = Возврат
bhv_pd_Draggable_snapBack = Вернуться на начальное место при отпускании.
bhv_p_Draggable_snapBackTime = Время возврата
bhv_pd_Draggable_snapBackTime = Сколько длится возврат (0 = сразу).
bhv_p_Draggable_dropTargets = Цели сброса
bhv_pd_Draggable_dropTargets = Элементы, на которые его можно бросить (необязательно). onDropOn срабатывает, когда его отпускают над одним из них.
bhv_p_Draggable_snapToTarget = Привязка к цели
bhv_pd_Draggable_snapToTarget = Переместиться в центр цели, на которую его бросили.
bhv_p_Draggable_dragScale = Масштаб при перетаскивании
bhv_pd_Draggable_dragScale = Размер при перетаскивании (1 = обычный), чтобы он выглядел приподнятым.
bhv_p_Draggable_bringToFront = На передний план
bhv_pd_Draggable_bringToFront = Выводить элемент поверх остальных при перетаскивании.
bhv_p_Draggable_freezePhysics = Заморозить физику
bhv_pd_Draggable_freezePhysics = Физический элемент перестаёт двигаться сам, пока его держат.
bhv_n_LongPress = Долгое нажатие
bhv_d_LongPress = Отличает быстрое касание от удержания элемента. Кнопки с подтверждением удержанием, скрытые меню, накопление заряда.
bhv_p_LongPress_holdTime = Время удержания
bhv_pd_LongPress_holdTime = Сколько палец должен оставаться нажатым.
bhv_p_LongPress_moveTolerance = Допуск движения
bhv_pd_LongPress_moveTolerance = Если палец сдвинется дальше этого (в пикселях экрана), это уже не нажатие.
bhv_p_LongPress_repeat = Повтор
bhv_pd_LongPress_repeat = Продолжать вызывать onLongPress каждое время удержания, пока палец нажат.
bhv_p_LongPress_holdBar = Полоса удержания
bhv_pd_LongPress_holdBar = Элемент Progress, заполняющийся при удержании (необязательно): удерживайте для подтверждения.
bhv_n_OpenSceneOnClick = Открыть сцену по клику
bhv_d_OpenSceneOnClick = Касание элемента открывает другую сцену, после необязательного ожидания и затухания. Для кнопок «Играть» и меню.
bhv_p_OpenSceneOnClick_scene = Сцена
bhv_pd_OpenSceneOnClick_scene = Имя сцены для открытия (как написано в списке сцен).
bhv_p_OpenSceneOnClick_trigger = Триггер
bhv_pd_OpenSceneOnClick_trigger = CLICK = когда нажали и отпустили на элементе, TOUCH_START = сразу при нажатии.
bhv_p_OpenSceneOnClick_delay = Задержка
bhv_pd_OpenSceneOnClick_delay = Подождать столько перед сменой сцены (время для звука или эффекта).
bhv_p_OpenSceneOnClick_fadeOverlay = Накладка затухания
bhv_pd_OpenSceneOnClick_fadeOverlay = Большой чёрный блок поверх всего экрана (необязательно): проявляется перед сменой сцены. Сделайте его невидимым или 0% непрозрачным в редакторе.
bhv_p_OpenSceneOnClick_fadeTime = Время затухания
bhv_pd_OpenSceneOnClick_fadeTime = Сколько накладка проявляется.
bhv_p_OpenSceneOnClick_clickSound = Звук нажатия
bhv_pd_OpenSceneOnClick_clickSound = Звук, проигрываемый при принятии касания (необязательно).
bhv_n_SwipeDetector = Детектор свайпа
bhv_d_SwipeDetector = Определяет свайп пальцем влево, вправо, вверх или вниз — по элементу или в любом месте экрана. Для перелистывания страниц, меню и игр со свайп-управлением.
bhv_p_SwipeDetector_onlyOnElement = Только на элементе
bhv_pd_SwipeDetector_onlyOnElement = Учитываются только свайпы, начавшиеся на этом элементе. Выкл. = свайп в любом месте экрана.
bhv_p_SwipeDetector_minDistance = Мин. дистанция
bhv_pd_SwipeDetector_minDistance = Какое расстояние должен пройти палец (в пикселях экрана).
bhv_p_SwipeDetector_maxTime = Макс. время
bhv_pd_SwipeDetector_maxTime = Свайп должен быть сделан за это время; более медленные перетаскивания игнорируются (0 = без ограничения).
bhv_p_SwipeDetector_fireWhileMoving = Срабатывать при движении
bhv_pd_SwipeDetector_fireWhileMoving = Реагировать, как только дистанция достигнута, не дожидаясь, пока палец отпустят.
bhv_n_ToggleOnClick = Переключение по клику
bhv_d_ToggleOnClick = Касание элемента показывает или скрывает другие элементы: панель настроек, меню, подсказку.
bhv_p_ToggleOnClick_targets = Цели
bhv_pd_ToggleOnClick_targets = Элементы, которые показываются / скрываются.
bhv_p_ToggleOnClick_action = Действие
bhv_pd_ToggleOnClick_action = TOGGLE = переключать каждый раз, SHOW = всегда показывать, HIDE = всегда скрывать.
bhv_p_ToggleOnClick_trigger = Триггер
bhv_pd_ToggleOnClick_trigger = CLICK = когда нажали и отпустили на элементе, TOUCH_START = сразу при нажатии.
bhv_p_ToggleOnClick_startHidden = Скрыть при старте
bhv_pd_ToggleOnClick_startHidden = Скрыть цели при старте сцены.
bhv_p_ToggleOnClick_affectPhysics = Влияет на физику
bhv_pd_ToggleOnClick_affectPhysics = Скрытые физические элементы также перестают сталкиваться и двигаться.
bhv_n_Lifetime = Время жизни
bhv_d_Lifetime = Элемент удаляет себя через некоторое время, сначала затухая (и по желанию уменьшаясь). Пули, частицы, временные платформы, подсказки.
bhv_g_Logic = Логика
bhv_p_Lifetime_seconds = Секунды
bhv_pd_Lifetime_seconds = Сколько он живёт, считая от старта сцены (или от reset).
bhv_p_Lifetime_randomExtra = Случайная добавка
bhv_pd_Lifetime_randomExtra = Случайное добавочное время жизни от -x до +x секунд, чтобы толпа не исчезала вся сразу.
bhv_p_Lifetime_fadeTime = Время затухания
bhv_pd_Lifetime_fadeTime = Затухает в последние секунды.
bhv_p_Lifetime_shrink = Сжатие
bhv_pd_Lifetime_shrink = Также уменьшается до нуля при затухании.
bhv_p_Lifetime_endAction = Действие по окончании
bhv_pd_Lifetime_endAction = DESTROY удаляет элемент, HIDE оставляет его невидимым и неактивным.
bhv_n_ProgressBind = Привязка прогресса
bhv_d_ProgressBind = Держит индикатор Progress в соответствии с числом: значением, сохранённым через setValue, другим индикатором или числом, написанным в Text. Здоровье, загрузка, опыт, таймеры.
bhv_p_ProgressBind_source = Источник
bhv_pd_ProgressBind_source = Откуда берётся число. SAVED_VALUE = значение, сохранённое по имени (setValue / getValue), OTHER_PROGRESS = значение другого элемента Progress, OTHER_TEXT = первое число, написанное в элементе Text, MANUAL = только блок задания значения.
bhv_p_ProgressBind_valueName = Имя значения
bhv_pd_ProgressBind_valueName = Имя сохранённого значения (SAVED_VALUE).
bhv_p_ProgressBind_other = Другой
bhv_pd_ProgressBind_other = Другой элемент (OTHER_PROGRESS / OTHER_TEXT).
bhv_p_ProgressBind_minValue = Мин. значение
bhv_pd_ProgressBind_minValue = Число, при котором полоса пуста.
bhv_p_ProgressBind_maxValue = Макс. значение
bhv_pd_ProgressBind_maxValue = Число, при котором полоса полна.
bhv_p_ProgressBind_smoothing = Сглаживание
bhv_pd_ProgressBind_smoothing = Как быстро полоса следует за значением (0 = сразу).
bhv_p_ProgressBind_pollInterval = Интервал опроса
bhv_pd_ProgressBind_pollInterval = Как часто читается источник; значение, сохранённое по имени, читается из хранилища.
bhv_n_ScoreCounter = Счётчик очков
bhv_d_ScoreCounter = Показывает переменную сцены (счёт, монеты, жизни...) в элементе Text с префиксом, дополнением нулями и анимацией подсчёта, и хранит рекорд на устройстве.
bhv_p_ScoreCounter_variable = Переменная
bhv_pd_ScoreCounter_variable = Переменная сцены для показа (int или float, созданная в «Переменных»). Collectible и Timer пишут в переменные по имени. Пусто = счётчик хранит своё число.
bhv_g_Value = Значение
bhv_p_ScoreCounter_display = Экран
bhv_pd_ScoreCounter_display = Элемент Text, который её показывает. Пусто = этот элемент (если это Text).
bhv_p_ScoreCounter_prefix = Префикс
bhv_pd_ScoreCounter_prefix = Пишется перед числом, напр. SCORE
bhv_p_ScoreCounter_suffix = Суффикс
bhv_pd_ScoreCounter_suffix = Пишется после числа, напр.  pts
bhv_p_ScoreCounter_decimals = Десятичные знаки
bhv_pd_ScoreCounter_decimals = Цифр после десятичной точки.
bhv_p_ScoreCounter_padDigits = Дополнение нулями
bhv_pd_ScoreCounter_padDigits = Заполнять нулями до такого количества цифр (0005). 0 = выкл.
bhv_p_ScoreCounter_thousandsSeparator = Разделитель тысяч
bhv_pd_ScoreCounter_thousandsSeparator = Группировать цифры: 12,345.
bhv_p_ScoreCounter_animate = Анимировать
bhv_pd_ScoreCounter_animate = Число бежит вверх/вниз до нового значения, а не прыгает.
bhv_p_ScoreCounter_animateTime = Время анимации
bhv_pd_ScoreCounter_animateTime = Сколько максимум длится подсчёт.
bhv_p_ScoreCounter_highScoreKey = Ключ рекорда
bhv_pd_ScoreCounter_highScoreKey = Имя, под которым лучшее значение хранится на устройстве (напр. highscore_level1). Пусто = без рекорда.
bhv_g_High_score = Рекорд
bhv_p_ScoreCounter_highScoreDisplay = Показ рекорда
bhv_pd_ScoreCounter_highScoreDisplay = Элемент Text, показывающий рекорд (необязательно).
bhv_p_ScoreCounter_highScorePrefix = Префикс рекорда
bhv_pd_ScoreCounter_highScorePrefix = Пишется перед рекордом.
bhv_n_Timer = Таймер
bhv_d_Timer = Обратный отсчёт или секундомер в элементе Text: лимиты времени уровней, время гонок, показ перезарядки. Запускайте, ставьте на паузу и сбрасывайте блоками; также может записывать секунды в переменную сцены.
bhv_p_Timer_mode = Режим
bhv_pd_Timer_mode = COUNTDOWN отсчитывает вниз от секунд ниже до 0, STOPWATCH считает вверх.
bhv_g_Timer = Таймер
bhv_p_Timer_seconds = Секунды
bhv_pd_Timer_seconds = Обратный отсчёт: с чего начинается. Секундомер: останавливается (onTimeout) на этом времени, 0 = никогда.
bhv_p_Timer_autoStart = Автостарт
bhv_pd_Timer_autoStart = Запускается при старте сцены. Выкл.: вызовите start timer.
bhv_p_Timer_loop = Цикл
bhv_pd_Timer_loop = Сам начинается заново после onTimeout.
bhv_p_Timer_display = Экран
bhv_pd_Timer_display = Элемент Text, показывающий время. Пусто = этот элемент (если это Text).
bhv_p_Timer_format = Формат
bhv_pd_Timer_format = M_SS = 1:05, SECONDS = 65, TENTHS = 65.3, M_SS_CC = 01:05.30.
bhv_p_Timer_prefix = Префикс
bhv_pd_Timer_prefix = Пишется перед временем, напр. TIME
bhv_p_Timer_suffix = Суффикс
bhv_pd_Timer_suffix = Пишется после времени, напр. s
bhv_p_Timer_warnAt = Предупреждать за
bhv_pd_Timer_warnAt = Обратный отсчёт: когда остаётся столько секунд, текст принимает цвет предупреждения и срабатывает onWarning. 0 = выкл.
bhv_p_Timer_warnColor = Цвет предупреждения
bhv_pd_Timer_warnColor = Цвет текста во время предупреждения.
bhv_p_Timer_variable = Переменная
bhv_pd_Timer_variable = Переменная сцены (int или float), получающая время в секундах. Пусто = нет.
bhv_g_Variable = Переменная
bhv_n_Floating = Парение
bhv_d_Floating = Элемент вечно покачивается вверх и вниз (и/или вбок). Физические элементы становятся kinematic, пока оно работает.
bhv_g_Motion = Движение
bhv_p_Floating_amplitudeY = Амплитуда y
bhv_pd_Floating_amplitudeY = Расстояние по вертикали в каждую сторону.
bhv_p_Floating_amplitudeX = Амплитуда x
bhv_pd_Floating_amplitudeX = Расстояние по горизонтали в каждую сторону.
bhv_p_Floating_frequency = Частота
bhv_pd_Floating_frequency = Полных циклов в секунду.
bhv_p_Floating_phase = Фаза
bhv_pd_Floating_phase = Смещение старта в цикле (0..1), чтобы несколько элементов не двигались вместе.
bhv_set_type = Тип
bhv_n_Spin = Вращение
bhv_d_Spin = Непрерывно вращает элемент (монеты, пилы, значки загрузки). Физические элементы становятся kinematic, пока оно работает.
bhv_p_Spin_speed = Скорость
bhv_pd_Spin_speed = Градусов в секунду.
bhv_p_Spin_clockwise = По часовой стрелке
bhv_n_Bounce = Отскок
bhv_d_Bounce = Мяч, который никогда не останавливается: держит постоянную скорость и отскакивает от всего (Pong, Breakout, скринсейверы). Физические элементы отскакивают от стен и других тел; UI-элементы отскакивают от краёв экрана.
bhv_g_Movement = Движение
bhv_p_Bounce_speed = Скорость
bhv_pd_Bounce_speed = Скорость мяча.
bhv_g_Ball = Мяч
bhv_p_Bounce_keepSpeed = Сохранять скорость
bhv_pd_Bounce_keepSpeed = Сохраняет постоянную скорость после каждого отскока. Выкл.: обычная упругость физики.
bhv_p_Bounce_speedGain = Прирост скорости
bhv_pd_Bounce_speedGain = Мяч ускоряется на столько при каждом отскоке (до макс. скорости).
bhv_p_Bounce_maxSpeed = Макс. скорость
bhv_pd_Bounce_maxSpeed = Ограничение скорости, когда мяч ускоряется.
bhv_p_Bounce_bounciness = Упругость
bhv_pd_Bounce_bounciness = Физика: сколько энергии сохраняет отскок (1 = всю).
bhv_p_Bounce_minAngle = Мин. угол
bhv_pd_Bounce_minAngle = Никогда не двигаться почти строго вдоль оси: траектория держится не ближе этого угла к горизонтали/вертикали (останавливает бесконечный пинг-понг в Pong/Breakout).
bhv_p_Bounce_startAngle = Начальный угол
bhv_pd_Bounce_startAngle = Направление в начале: 0 = вправо, 90 = вверх, 45 = вверх-вправо.
bhv_g_Launch = Запуск
bhv_p_Bounce_randomStart = Случайный старт
bhv_pd_Bounce_randomStart = Выбрать случайное диагональное направление в начале.
bhv_p_Bounce_launchOnStart = Запуск при старте
bhv_pd_Bounce_launchOnStart = Запустить при старте игры. Выкл.: вызовите launch из своих блоков.
bhv_p_Bounce_bounceOffView = Отскок от вида
bhv_pd_Bounce_bounceOffView = Физика: также отскакивать от краёв вида камеры (UI-элементы всегда отскакивают от экрана).
bhv_g_Screen_edges = Края экрана
bhv_set_gravityScale = Масштаб гравитации
bhv_set_linearDamping = Линейное затухание
bhv_n_Follow = Слежение
bhv_d_Follow = Держит элемент рядом с другим, со смещением и плавным догоняньем: питомцы, полосы здоровья над персонажем, преследователь вроде камеры, тень. Работает для UI и физических элементов.
bhv_p_Follow_target = Цель
bhv_pd_Follow_target = Элемент, за которым нужно следовать.
bhv_p_Follow_offsetX = Смещение x
bhv_pd_Follow_offsetX = Где оставаться относительно центра цели (x, вправо — положительное).
bhv_p_Follow_offsetY = Смещение y
bhv_pd_Follow_offsetY = Где оставаться относительно центра цели (y, вверх — положительное).
bhv_p_Follow_followX = Следовать по x
bhv_pd_Follow_followX = Следовать по оси влево/вправо.
bhv_p_Follow_followY = Следовать по y
bhv_pd_Follow_followY = Следовать по оси вверх/вниз (физический элемент тогда игнорирует гравитацию).
bhv_p_Follow_mirrorOffset = Зеркальное смещение
bhv_pd_Follow_mirrorOffset = Отражать смещение по x, когда цель смотрит влево (её изображение отражено).
bhv_p_Follow_stiffness = Жёсткость
bhv_pd_Follow_stiffness = Насколько плотно следует: больше = догоняет быстрее. 0 = приклеен к цели (прыгает к ней).
bhv_p_Follow_maxSpeed = Макс. скорость
bhv_pd_Follow_maxSpeed = Ограничение скорости. 0 = без ограничения (физические элементы ограничены 450 px/с).
bhv_p_Follow_stopDistance = Дистанция остановки
bhv_pd_Follow_stopDistance = Перестаёт двигаться, когда ближе этого к нужной точке.
bhv_p_Follow_matchRotation = Копировать поворот
bhv_pd_Follow_matchRotation = Копировать также поворот цели.
bhv_n_JoystickMovement = Движение джойстиком
bhv_d_JoystickMovement = Двигает элемент джойстиком: вид сверху (все направления) или сайд-скроллер (только влево/вправо).
bhv_p_JoystickMovement_joystick = Джойстик
bhv_pd_JoystickMovement_joystick = Элемент-джойстик, управляющий этим.
bhv_p_JoystickMovement_mode = Режим
bhv_p_JoystickMovement_speed = Скорость
bhv_p_JoystickMovement_deadZone = Мёртвая зона
bhv_pd_JoystickMovement_deadZone = Игнорировать крошечные движения джойстика.
bhv_p_JoystickMovement_rotateToDirection = Поворот по направлению
bhv_pd_JoystickMovement_rotateToDirection = Поворачивать элемент лицом туда, куда он движется.
bhv_p_JoystickMovement_faceOffset = Смещение лица
bhv_pd_JoystickMovement_faceOffset = Угол изображения, когда оно смотрит вправо (0 = вправо, 90 = вверх...).
bhv_n_JumpPad = Трамплин
bhv_d_JumpPad = Запускает всё, что его касается (батуты, пружины, пушки, ускорители), в выбранном направлении. Кого он затрагивает, выбирается списком или фильтром по имени; может работать как сенсор, сквозь который проходят.
bhv_note_JumpPad = Нужен физический элемент (обычно STATIC).
bhv_p_JumpPad_angle = Угол
bhv_pd_JumpPad_angle = Направление запуска: 90 = вверх, 0 = вправо, 180 = влево, 270 = вниз.
bhv_p_JumpPad_power = Степень
bhv_pd_JumpPad_power = Скорость запуска.
bhv_p_JumpPad_additive = Добавочный
bhv_pd_JumpPad_additive = Вкл.: прибавляется к текущей скорости. Выкл.: заменяет её (каждый раз один и тот же прыжок).
bhv_p_JumpPad_onlyFromFront = Только спереди
bhv_pd_JumpPad_onlyFromFront = Запускает только то, что приходит спереди (со стороны, куда указывает стрелка), а не сзади.
bhv_p_JumpPad_cooldown = Пауза между срабатываниями
bhv_pd_JumpPad_cooldown = Время до повторного запуска трамплина.
bhv_p_JumpPad_targets = Цели
bhv_pd_JumpPad_targets = Запускаются только эти элементы. Пусто = каждое движущееся тело.
bhv_p_JumpPad_nameFilter = Фильтр по имени
bhv_pd_JumpPad_nameFilter = Запускаются только элементы, имя которых содержит этот текст (простой тег, напр. "Player"). Пусто = любые.
bhv_p_JumpPad_sensor = Сенсор
bhv_pd_JumpPad_sensor = Предметы проходят сквозь трамплин и запускаются, пока перекрывают его (без твёрдой поверхности).
bhv_n_LimitToScreen = Ограничить экраном
bhv_d_LimitToScreen = Держит элемент внутри экрана (или вида камеры, сцены или прямоугольника) с необязательным полем, чтобы игрок или ракетка никогда не вышли за пределы. Физический элемент теряет (или отражает) скорость, которая выталкивает его наружу.
bhv_p_LimitToScreen_area = Область
bhv_pd_LimitToScreen_area = VIEW: то, что сейчас показывает камера (или экран для UI). SCENE: первый экран (от 0,0 до размера сцены). CUSTOM: прямоугольник ниже.
bhv_p_LimitToScreen_limitX = Ограничение x
bhv_pd_LimitToScreen_limitX = Ограничить влево/вправо.
bhv_p_LimitToScreen_limitY = Ограничение y
bhv_pd_LimitToScreen_limitY = Ограничить вверх/вниз.
bhv_p_LimitToScreen_margin = Поле
bhv_pd_LimitToScreen_margin = Свободное место, оставляемое у краёв.
bhv_p_LimitToScreen_keepFullyInside = Держать полностью внутри
bhv_pd_LimitToScreen_keepFullyInside = Весь элемент должен оставаться внутри (выкл.: только его центр).
bhv_p_LimitToScreen_bounciness = Упругость
bhv_pd_LimitToScreen_bounciness = Физика: 0 = останавливается у края, 1 = отскакивает с той же скоростью.
bhv_p_LimitToScreen_customLeft = Своя граница слева
bhv_pd_LimitToScreen_customLeft = Область CUSTOM: левый край.
bhv_p_LimitToScreen_customBottom = Своя граница снизу
bhv_pd_LimitToScreen_customBottom = Область CUSTOM: нижний край.
bhv_p_LimitToScreen_customRight = Своя граница справа
bhv_pd_LimitToScreen_customRight = Область CUSTOM: правый край.
bhv_p_LimitToScreen_customTop = Своя граница сверху
bhv_pd_LimitToScreen_customTop = Область CUSTOM: верхний край.
bhv_n_LookAtTarget = Смотреть на цель
bhv_d_LookAtTarget = Поворачивает элемент лицом к другому элементу или пальцу с заданной скоростью поворота: турели, глаза, стрелки, прицеливающиеся пушки.
bhv_p_LookAtTarget_source = Источник
bhv_pd_LookAtTarget_source = TARGET: смотреть на элемент ниже. FINGER: смотреть на точку касания.
bhv_p_LookAtTarget_target = Цель
bhv_pd_LookAtTarget_target = Элемент, на который нужно смотреть (TARGET).
bhv_p_LookAtTarget_faceOffset = Смещение лица
bhv_pd_LookAtTarget_faceOffset = Угол изображения, когда оно смотрит вправо (0 = вправо, 90 = вверх...).
bhv_p_LookAtTarget_turnSpeed = Скорость поворота
bhv_pd_LookAtTarget_turnSpeed = Как быстро поворачивается. 0 = мгновенно.
bhv_p_LookAtTarget_keepLastTouch = Помнить последнее касание
bhv_pd_LookAtTarget_keepLastTouch = Только FINGER: продолжать смотреть на последнее касание после того, как палец поднят.
bhv_p_LookAtTarget_tolerance = Допуск
bhv_pd_LookAtTarget_tolerance = Считается выровненным, когда разница углов меньше этого (onAligned).
bhv_set_fixedRotation = Фиксированное вращение
bhv_n_MovingPlatform = Движущаяся платформа
bhv_d_MovingPlatform = Платформа, скользящая между двумя точками (лифты, подвижные мосты, раздвижные двери) и несущая всё, что на ней стоит. Становится kinematic, пока работает.
bhv_note_MovingPlatform = Нужен физический элемент (он становится kinematic, пока игра запущена).
bhv_p_MovingPlatform_axis = Ось
bhv_pd_MovingPlatform_axis = Режим диапазона: двигаться влево/вправо или вверх/вниз от начала.
bhv_g_Route = Маршрут
bhv_p_MovingPlatform_distance = Расстояние
bhv_pd_MovingPlatform_distance = Режим диапазона: как далеко она движется от начала до другого конца (отрицательное = влево / вниз).
bhv_p_MovingPlatform_pointB = Точка b
bhv_pd_MovingPlatform_pointB = Режим точек: элемент, отмечающий другой конец. Если задан, заменяет диапазон.
bhv_p_MovingPlatform_pointA = Точка a
bhv_pd_MovingPlatform_pointA = Режим точек: элемент, отмечающий первый конец. Пусто = начальная позиция этой платформы.
bhv_p_MovingPlatform_speed = Скорость
bhv_pd_MovingPlatform_speed = Скорость вдоль маршрута.
bhv_p_MovingPlatform_pause = Пауза
bhv_pd_MovingPlatform_pause = Сколько ждёт на каждом конце.
bhv_p_MovingPlatform_smooth = Плавно
bhv_pd_MovingPlatform_smooth = Плавно замедляется у концов.
bhv_p_MovingPlatform_carryRiders = Перевозить пассажиров
bhv_pd_MovingPlatform_carryRiders = Двигает вбок то, что на ней стоит (нужно для игрока, задающего свою скорость).
bhv_n_Orbit = Орбита
bhv_d_Orbit = Кружит вокруг другого элемента (планеты, щиты, спутники, вращающиеся пилы) или вокруг точки, с необязательной овальной формой и спиралью внутрь/наружу. Физические элементы остаются физическими (толкают предметы) и игнорируют гравитацию.
bhv_p_Orbit_center = Центр
bhv_pd_Orbit_center = Элемент, вокруг которого нужно кружить. Пусто = точка, выбранная так, чтобы элемент начинал на своей окружности.
bhv_p_Orbit_radius = Радиус
bhv_pd_Orbit_radius = Расстояние от центра. 0 = текущее расстояние до центрального элемента (100, если центрального элемента нет).
bhv_p_Orbit_speed = Скорость
bhv_pd_Orbit_speed = Градусов в секунду.
bhv_p_Orbit_clockwise = По часовой стрелке
bhv_pd_Orbit_clockwise = Кружить по часовой стрелке (выкл.: против часовой).
bhv_p_Orbit_ovalRatio = Соотношение овала
bhv_pd_Orbit_ovalRatio = Высота овала относительно его ширины (1 = круг).
bhv_p_Orbit_spiral = Спираль
bhv_pd_Orbit_spiral = Радиус растёт (положительное) или уменьшается (отрицательное) на столько каждую секунду: спирали.
bhv_p_Orbit_minRadius = Мин. радиус
bhv_pd_Orbit_minRadius = Наименьший радиус при закручивании внутрь.
bhv_p_Orbit_faceMovement = Лицом по движению
bhv_pd_Orbit_faceMovement = Поворачивать элемент вдоль его пути (стрелы, самолёты).
bhv_p_Orbit_faceOffset = Смещение лица
bhv_pd_Orbit_faceOffset = Угол изображения, когда оно смотрит вправо (0 = вправо, 90 = вверх...).
bhv_n_PlatformerPlayer = Игрок-платформер
bhv_d_PlatformerPlayer = Бегайте и прыгайте экранными кнопками или клавиатурой: двойной прыжок, койот-тайм и буфер прыжка. Нужна гравитация в сцене.
bhv_note_PlatformerPlayer = Нужен DYNAMIC физический элемент и гравитация в сцене.
bhv_p_PlatformerPlayer_leftButton = Кнопка влево
bhv_pd_PlatformerPlayer_leftButton = Кнопка (любой элемент), двигающая влево, пока её удерживают.
bhv_p_PlatformerPlayer_rightButton = Кнопка вправо
bhv_p_PlatformerPlayer_jumpButton = Кнопка прыжка
bhv_p_PlatformerPlayer_useKeyboard = Использовать клавиатуру
bhv_pd_PlatformerPlayer_useKeyboard = Стрелки / A D W / пробел тоже работают (десктоп, тесты).
bhv_p_PlatformerPlayer_speed = Скорость
bhv_p_PlatformerPlayer_acceleration = Ускорение
bhv_pd_PlatformerPlayer_acceleration = 0 = мгновенно, иначе как быстро достигается скорость.
bhv_p_PlatformerPlayer_flipToDirection = Разворот по направлению
bhv_pd_PlatformerPlayer_flipToDirection = Отражать изображение при ходьбе влево.
bhv_p_PlatformerPlayer_jumpSpeed = Скорость прыжка
bhv_g_Jump = Прыжок
bhv_p_PlatformerPlayer_maxJumps = Макс. прыжков
bhv_pd_PlatformerPlayer_maxJumps = 2 = двойной прыжок, 1 = одинарный.
bhv_p_PlatformerPlayer_coyoteTime = Койот-тайм
bhv_pd_PlatformerPlayer_coyoteTime = Время после ухода с платформы, в течение которого прыжок ещё работает.
bhv_p_PlatformerPlayer_jumpBuffer = Буфер прыжка
bhv_pd_PlatformerPlayer_jumpBuffer = Прыжок, нажатый чуть раньше приземления, запоминается на столько.
bhv_n_TapToMove = Касание для движения
bhv_d_TapToMove = Движется туда, куда касаетесь: TAP идёт к точке касания (стратегии, point-and-click), HOLD следует за пальцем, пока он нажат, DRAG_ITEM позволяет схватить сам элемент и перетащить его (детали пазлов, карты). Касания по кнопкам/джойстику из списка игнорирования не используются.
bhv_p_TapToMove_mode = Режим
bhv_pd_TapToMove_mode = TAP: идти к точке касания. HOLD: следовать за пальцем, пока он нажат. DRAG_ITEM: коснуться элемента и перетащить его.
bhv_g_Touch = Касание
bhv_p_TapToMove_ignoreTouchesOn = Игнорировать касания по
bhv_pd_TapToMove_ignoreTouchesOn = Касания, начавшиеся на этих элементах (кнопки, джойстик, панели), игнорируются.
bhv_p_TapToMove_marker = Маркер
bhv_pd_TapToMove_marker = Необязательный элемент, показываемый в точке касания (режим TAP); скрывается, когда элемент прибывает.
bhv_p_TapToMove_speed = Скорость
bhv_pd_TapToMove_speed = Скорость ходьбы.
bhv_p_TapToMove_stopDistance = Дистанция остановки
bhv_pd_TapToMove_stopDistance = Считается прибывшим, когда ближе этого.
bhv_p_TapToMove_horizontalOnly = Только горизонтально
bhv_pd_TapToMove_horizontalOnly = Только влево/вправо (персонажи платформера сохраняют гравитацию). Выкл.: движется во всех направлениях и игнорирует гравитацию.
bhv_p_TapToMove_dragStiffness = Жёсткость перетаскивания
bhv_pd_TapToMove_dragStiffness = DRAG_ITEM: насколько жёстко элемент следует за пальцем (физические элементы; больше = плотнее).
bhv_p_TapToMove_rotateToDirection = Поворот по направлению
bhv_pd_TapToMove_rotateToDirection = Поворачивать элемент в сторону движения.
bhv_p_TapToMove_flipToDirection = Разворот по направлению
bhv_pd_TapToMove_flipToDirection = Отражать изображение при движении влево.
bhv_p_TapToMove_faceOffset = Смещение лица
bhv_pd_TapToMove_faceOffset = Угол изображения, когда оно смотрит вправо (0 = вправо, 90 = вверх...).
bhv_n_TiltMove = Движение наклоном
bhv_d_TiltMove = Двигает элемент наклоном телефона (акселерометр): катящийся шар, лабиринт с шариком, ловец падающих предметов. На компьютере наклон имитируют стрелки.
bhv_p_TiltMove_mode = Режим
bhv_pd_TiltMove_mode = VELOCITY: наклон задаёт скорость. ROLL: наклон толкает как гравитация на шар (он продолжает катиться).
bhv_g_Tilt = Наклон
bhv_p_TiltMove_fullTilt = Полный наклон
bhv_pd_TiltMove_fullTilt = Наклон, дающий полную скорость. 9.8 = телефон вертикально, около 4 = удобный наклон.
bhv_p_TiltMove_deadZone = Мёртвая зона
bhv_pd_TiltMove_deadZone = Наклоны меньше этого игнорируются.
bhv_p_TiltMove_smoothing = Сглаживание
bhv_pd_TiltMove_smoothing = Сглаживает дрожащий датчик. Больше = плавнее, но медленнее реакция.
bhv_p_TiltMove_orientation = Ориентация
bhv_pd_TiltMove_orientation = AUTO следует повороту экрана. Задайте вручную, если направления на вашем телефоне неверные.
bhv_p_TiltMove_useKeyboard = Использовать клавиатуру
bhv_pd_TiltMove_useKeyboard = Стрелки / WASD имитируют наклон (десктоп, тесты).
bhv_p_TiltMove_horizontal = По горизонтали
bhv_pd_TiltMove_horizontal = Двигать влево/вправо.
bhv_p_TiltMove_vertical = Вертикальный
bhv_pd_TiltMove_vertical = Двигать вверх/вниз (выключает гравитацию для этого элемента, пока работает).
bhv_p_TiltMove_invertX = Инвертировать x
bhv_pd_TiltMove_invertX = Поменять местами лево и право.
bhv_p_TiltMove_invertY = Инвертировать y
bhv_pd_TiltMove_invertY = Поменять местами верх и низ.
bhv_p_TiltMove_speed = Скорость
bhv_pd_TiltMove_speed = Максимальная скорость.
bhv_p_TiltMove_acceleration = Ускорение
bhv_pd_TiltMove_acceleration = Только ROLL: ускорение при полном наклоне.
bhv_p_TiltMove_damping = Затухание
bhv_pd_TiltMove_damping = Только ROLL: замедляет шар (0 = никогда).
bhv_n_TopDownPlayer = Игрок сверху
bhv_d_TopDownPlayer = Двигает элемент во всех направлениях (RPG, шутер, лабиринт): джойстиком, 4 кнопками или клавиатурой, с ускорением, трением, привязкой к 4/8 направлениям и необязательным поворотом по движению. Используйте гравитацию 0 в сцене.
bhv_p_TopDownPlayer_joystick = Джойстик
bhv_pd_TopDownPlayer_joystick = Элемент-джойстик, управляющий этим (необязательно).
bhv_p_TopDownPlayer_upButton = Кнопка вверх
bhv_pd_TopDownPlayer_upButton = Кнопка (любой элемент), двигающая вверх, пока её удерживают.
bhv_p_TopDownPlayer_downButton = Кнопка вниз
bhv_pd_TopDownPlayer_downButton = Кнопка (любой элемент), двигающая вниз, пока её удерживают.
bhv_p_TopDownPlayer_leftButton = Кнопка влево
bhv_pd_TopDownPlayer_leftButton = Кнопка (любой элемент), двигающая влево, пока её удерживают.
bhv_p_TopDownPlayer_rightButton = Кнопка вправо
bhv_pd_TopDownPlayer_rightButton = Кнопка (любой элемент), двигающая вправо, пока её удерживают.
bhv_p_TopDownPlayer_useKeyboard = Использовать клавиатуру
bhv_pd_TopDownPlayer_useKeyboard = Стрелки / WASD тоже двигают элемент (десктоп, тесты).
bhv_p_TopDownPlayer_deadZone = Мёртвая зона
bhv_pd_TopDownPlayer_deadZone = Отклонения джойстика меньше этого игнорируются.
bhv_p_TopDownPlayer_directions = Направления
bhv_pd_TopDownPlayer_directions = ANY = плавные направления джойстика, EIGHT = привязка к 8 направлениям, FOUR = только вверх/вниз/влево/вправо.
bhv_p_TopDownPlayer_speed = Скорость
bhv_pd_TopDownPlayer_speed = Максимальная скорость.
bhv_p_TopDownPlayer_acceleration = Ускорение
bhv_pd_TopDownPlayer_acceleration = Как быстро достигается полная скорость. 0 = мгновенно.
bhv_p_TopDownPlayer_friction = Трение
bhv_pd_TopDownPlayer_friction = Как быстро останавливается, когда ничего не нажато. 0 = мгновенно.
bhv_p_TopDownPlayer_rotateToDirection = Поворот по направлению
bhv_pd_TopDownPlayer_rotateToDirection = Поворачивать элемент в сторону движения.
bhv_g_Facing = Лицом
bhv_p_TopDownPlayer_faceOffset = Смещение лица
bhv_pd_TopDownPlayer_faceOffset = Угол изображения, когда оно смотрит вправо (0 = вправо, 90 = вверх...).
bhv_p_TopDownPlayer_turnSpeed = Скорость поворота
bhv_pd_TopDownPlayer_turnSpeed = Как быстро поворачивается. 0 = мгновенно.
bhv_p_TopDownPlayer_flipToDirection = Разворот по направлению
bhv_pd_TopDownPlayer_flipToDirection = Отражать изображение при движении влево (для вида сбоку).
bhv_n_WrapScreen = Переход через край экрана
bhv_d_WrapScreen = Когда элемент уходит с одной стороны экрана, он возвращается с противоположной (Asteroids, туннели Pac-Man, бесконечный бег). Скорость сохраняется.
bhv_p_WrapScreen_area = Область
bhv_pd_WrapScreen_area = VIEW: то, что сейчас показывает камера (или экран для UI). SCENE: первый экран (от 0,0 до размера сцены). CUSTOM: прямоугольник ниже.
bhv_p_WrapScreen_wrapX = Переход по x
bhv_pd_WrapScreen_wrapX = Переход по левому/правому краям.
bhv_p_WrapScreen_wrapY = Переход по y
bhv_pd_WrapScreen_wrapY = Переход по верхнему/нижнему краям.
bhv_p_WrapScreen_margin = Поле
bhv_pd_WrapScreen_margin = Дополнительное место за пределами области перед переходом.
bhv_p_WrapScreen_customLeft = Своя граница слева
bhv_pd_WrapScreen_customLeft = Область CUSTOM: левый край.
bhv_p_WrapScreen_customBottom = Своя граница снизу
bhv_pd_WrapScreen_customBottom = Область CUSTOM: нижний край.
bhv_p_WrapScreen_customRight = Своя граница справа
bhv_pd_WrapScreen_customRight = Область CUSTOM: правый край.
bhv_p_WrapScreen_customTop = Своя граница сверху
bhv_pd_WrapScreen_customTop = Область CUSTOM: верхний край.
bhv_n_CountUp = Счёт вверх
bhv_d_CountUp = Элемент Text считает от одного числа до другого, как счёт очков. Необязательные префикс, суффикс и разделитель тысяч.
bhv_g_Text = Текст
bhv_p_CountUp_from = От
bhv_pd_CountUp_from = Число, с которого начинается.
bhv_p_CountUp_to = До
bhv_pd_CountUp_to = Число, до которого считает.
bhv_p_CountUp_duration = Длительность
bhv_pd_CountUp_duration = Сколько длится подсчёт.
bhv_p_CountUp_delay = Задержка
bhv_pd_CountUp_delay = Подождать столько перед началом подсчёта.
bhv_p_CountUp_decimals = Десятичные знаки
bhv_pd_CountUp_decimals = Цифр после точки.
bhv_p_CountUp_prefix = Префикс
bhv_pd_CountUp_prefix = Текст перед числом, напр. $ или Score:
bhv_p_CountUp_suffix = Суффикс
bhv_pd_CountUp_suffix = Текст после числа, напр. % или pts
bhv_p_CountUp_thousandsSeparator = Разделитель тысяч
bhv_pd_CountUp_thousandsSeparator = Писать 1,234,567 вместо 1234567.
bhv_p_CountUp_ease = Плавность
bhv_pd_CountUp_ease = Как меняется скорость во время подсчёта.
bhv_p_CountUp_autoPlay = Автозапуск
bhv_pd_CountUp_autoPlay = Начать подсчёт сразу при старте сцены. Иначе используйте блок count to.
bhv_n_Typewriter = Печатная машинка
bhv_d_Typewriter = Элемент Text печатает свой текст буква за буквой, как диалоговое окно. Коснитесь, чтобы показать всё сразу.
bhv_p_Typewriter_speed = Скорость
bhv_pd_Typewriter_speed = Букв в секунду.
bhv_p_Typewriter_startDelay = Задержка старта
bhv_pd_Typewriter_startDelay = Подождать столько перед началом печати.
bhv_p_Typewriter_punctuationPause = Пауза на знаках препинания
bhv_pd_Typewriter_punctuationPause = Дополнительная пауза после . , ! ? чтобы предложения «дышали» (0 = нет).
bhv_p_Typewriter_customText = Свой текст
bhv_pd_Typewriter_customText = Печатать другой текст вместо написанного в элементе (пусто = текст элемента).
bhv_p_Typewriter_tapToSkip = Касание пропускает
bhv_pd_Typewriter_tapToSkip = Касание текста показывает его весь сразу.
bhv_p_Typewriter_autoPlay = Автозапуск
bhv_pd_Typewriter_autoPlay = Начать сразу при старте сцены. Иначе используйте блок type text.
bhv_p_Typewriter_tickSound = Звук набора
bhv_pd_Typewriter_tickSound = Крошечный звук для букв (необязательно).
bhv_p_Typewriter_tickEvery = Звук каждые
bhv_pd_Typewriter_tickEvery = Проигрывать звук набора каждые столько букв.
bhv_n_Blink = Мигание
bhv_d_Blink = Элемент мигает (или плавно появляется и исчезает). Хорошо для текстов «Нажмите для старта», предупреждений и неуязвимости.
bhv_g_UI_effects = UI-эффекты
bhv_p_Blink_onTime = Время «вкл.»
bhv_pd_Blink_onTime = Сколько времени он остаётся видимым каждый раз.
bhv_p_Blink_offTime = Время «выкл.»
bhv_pd_Blink_offTime = Сколько времени он остаётся скрытым каждый раз.
bhv_p_Blink_offOpacity = Непрозрачность «выкл.»
bhv_pd_Blink_offOpacity = Непрозрачность в состоянии «выкл.» (0 = невидимый).
bhv_p_Blink_smooth = Плавно
bhv_pd_Blink_smooth = Плавно затухать вместо мгновенного переключения.
bhv_p_Blink_count = Количество
bhv_pd_Blink_count = Число миганий, затем остаётся видимым. 0 = бесконечно.
bhv_p_Blink_autoPlay = Автозапуск
bhv_pd_Blink_autoPlay = Начать мигать сразу при старте сцены.
bhv_n_FadeIn = Появление
bhv_d_FadeIn = Элемент плавно появляется: из невидимого (и по желанию меньшего) к обычному виду. Хорошо для меню и заголовков.
bhv_p_FadeIn_duration = Длительность
bhv_pd_FadeIn_duration = Сколько длится появление.
bhv_p_FadeIn_delay = Задержка
bhv_pd_FadeIn_delay = Подождать столько перед началом.
bhv_p_FadeIn_fromOpacity = Начальная непрозрачность
bhv_pd_FadeIn_fromOpacity = Непрозрачность в начале (0 = невидимый).
bhv_p_FadeIn_fromScale = Начальный масштаб
bhv_pd_FadeIn_fromScale = Размер в начале, 1 = обычный размер. Используйте 0.5, чтобы он «выскакивал».
bhv_p_FadeIn_ease = Плавность
bhv_pd_FadeIn_ease = Как меняется скорость во время появления.
bhv_p_FadeIn_autoPlay = Автозапуск
bhv_pd_FadeIn_autoPlay = Начать сразу при старте сцены. Иначе элемент показывается обычным, пока не выполнится блок play.
bhv_n_FadeOut = Исчезновение
bhv_d_FadeOut = Элемент плавно исчезает и затем может скрыться или удалить себя. Хорошо для сообщений, предметов и закрывающихся меню.
bhv_p_FadeOut_trigger = Триггер
bhv_pd_FadeOut_trigger = Когда начинается исчезновение. MANUAL = только когда выполняется блок play.
bhv_p_FadeOut_duration = Длительность
bhv_pd_FadeOut_duration = Сколько длится появление.
bhv_p_FadeOut_delay = Задержка
bhv_pd_FadeOut_delay = Подождать столько перед началом (сообщение, исчезающее само).
bhv_p_FadeOut_toOpacity = Конечная непрозрачность
bhv_pd_FadeOut_toOpacity = Непрозрачность в конце (0 = невидимый).
bhv_p_FadeOut_toScale = Конечный масштаб
bhv_pd_FadeOut_toScale = Размер в конце, 1 = обычный размер. Используйте 0, чтобы сжаться до нуля.
bhv_p_FadeOut_ease = Плавность
bhv_pd_FadeOut_ease = Как меняется скорость во время появления.
bhv_p_FadeOut_then = Затем
bhv_pd_FadeOut_then = Что происходит в конце: STAY = остаётся (выцветшим), HIDE = скрывается (и физика выключается), DESTROY = удаляется.
bhv_n_Parallax = Параллакс
bhv_d_Parallax = Фоновый слой, двигающийся медленнее мира при движении камеры, для глубины. Работает для экранных фонов (UI) и элементов мира.
bhv_p_Parallax_factorX = Коэффициент x
bhv_pd_Parallax_factorX = Скорость вбок относительно мира: 0 = движется с миром (без эффекта), 0.5 = половинная скорость (далеко), 1 = стоит на месте на экране (очень далеко).
bhv_p_Parallax_factorY = Коэффициент y
bhv_pd_Parallax_factorY = То же для вверх и вниз. Используется, только когда включено «Влиять по вертикали».
bhv_p_Parallax_affectVertical = Влиять по вертикали
bhv_pd_Parallax_affectVertical = Также реагировать, когда камера движется вверх и вниз.
bhv_p_Parallax_loopWidth = Ширина цикла
bhv_pd_Parallax_loopWidth = Повторять движение каждые столько пикселей вбок, чтобы ряд одинаковых плиток прокручивался вечно (0 = без повтора).
bhv_p_Parallax_loopHeight = Высота цикла
bhv_pd_Parallax_loopHeight = То же для вверх и вниз (0 = без повтора).
bhv_n_Pulse = Пульсация
bhv_d_Pulse = Элемент снова и снова растёт и уменьшается, как бьющееся сердце. Хорошо для кнопок «Играть» и предметов.
bhv_p_Pulse_minScale = Мин. масштаб
bhv_pd_Pulse_minScale = Наименьший размер, 1 = обычный размер.
bhv_p_Pulse_maxScale = Макс. масштаб
bhv_pd_Pulse_maxScale = Наибольший размер, 1 = обычный размер.
bhv_p_Pulse_speed = Скорость
bhv_pd_Pulse_speed = Ударов в секунду.
bhv_p_Pulse_lowOpacity = Низкая непрозрачность
bhv_pd_Pulse_lowOpacity = Непрозрачность при наименьшем размере (1 = без затухания).
bhv_p_Pulse_autoPlay = Автозапуск
bhv_pd_Pulse_autoPlay = Начать пульсировать сразу при старте сцены. Иначе используйте блоки start / pulse once.
bhv_p_Pulse_pulseWhileTouched = Пульсировать при касании
bhv_pd_Pulse_pulseWhileTouched = Продолжать пульсировать, пока элемента касаются.
bhv_n_ScaleTouchEffect = Эффект масштаба при касании
bhv_d_ScaleTouchEffect = Элемент уменьшается (или растёт), пока его касаются, и пружинит обратно при отпускании.
bhv_p_ScaleTouchEffect_pressedScale = Масштаб при нажатии
bhv_pd_ScaleTouchEffect_pressedScale = Масштаб при касании, 1 = обычный размер.
bhv_p_ScaleTouchEffect_speed = Скорость
bhv_pd_ScaleTouchEffect_speed = Как быстро переходит к новому размеру.
bhv_p_ScaleTouchEffect_pressedAlpha = Прозрачность при нажатии
bhv_pd_ScaleTouchEffect_pressedAlpha = Также немного тускнеет при касании (1 = без затухания).
bhv_n_Shake = Тряска
bhv_d_Shake = Элемент на мгновение дрожит: при старте сцены, при касании или из блока. Хорошо для неверных ответов, ударов и кнопок.
bhv_p_Shake_trigger = Триггер
bhv_pd_Shake_trigger = Когда трясётся. MANUAL = только когда выполняется блок shake.
bhv_p_Shake_axis = Ось
bhv_pd_Shake_axis = В каком направлении двигается.
bhv_p_Shake_intensity = Интенсивность
bhv_pd_Shake_intensity = Как далеко он отходит от своего места.
bhv_p_Shake_duration = Длительность
bhv_pd_Shake_duration = Сколько длится одна тряска.
bhv_p_Shake_frequency = Частота
bhv_pd_Shake_frequency = Смен направления в секунду: больше = нервно, меньше = покачивание.
bhv_p_Shake_rotation = Поворот
bhv_pd_Shake_rotation = Также немного поворачивается туда-сюда (0 = без поворота).
bhv_p_Shake_decay = Затухание
bhv_pd_Shake_decay = Тряска слабеет, пока не остановится.
bhv_p_Shake_loop = Цикл
bhv_pd_Shake_loop = Трястись, пока не выполнится блок stop (длительность игнорируется).
bhv_n_SlideIn = Выезд
bhv_d_SlideIn = Элемент выезжает на своё место с одной стороны, при желании с отскоком или сглаживанием. Блок уводит его обратно. Хорошо для меню и панелей.
bhv_p_SlideIn_from = От
bhv_pd_SlideIn_from = Сторона, с которой он приходит.
bhv_p_SlideIn_distance = Расстояние
bhv_pd_SlideIn_distance = Как далеко он начинает.
bhv_p_SlideIn_duration = Длительность
bhv_pd_SlideIn_duration = Сколько длится выезд.
bhv_p_SlideIn_delay = Задержка
bhv_pd_SlideIn_delay = Подождать столько перед началом (задавайте разные значения, чтобы выезжал список по одному).
bhv_p_SlideIn_ease = Плавность
bhv_pd_SlideIn_ease = Как меняется скорость во время выезда.
bhv_p_SlideIn_fade = Затухание
bhv_pd_SlideIn_fade = Также плавно появляться при выезде.
bhv_p_SlideIn_autoPlay = Автозапуск
bhv_pd_SlideIn_autoPlay = Начать сразу при старте сцены. Иначе элемент остаётся на месте, пока не выполнится блок play.
bhv_n_TintCycle = Смена оттенка
bhv_d_TintCycle = Цвет элемента медленно меняется: туда-обратно между двумя цветами или через всю радугу. Хорошо для заголовков, усилений и знаков опасности.
bhv_p_TintCycle_mode = Режим
bhv_pd_TintCycle_mode = BETWEEN = плавно переходит между двумя цветами, RAINBOW = проходит все цвета.
bhv_p_TintCycle_colorA = Цвет a
bhv_pd_TintCycle_colorA = Первый цвет (BETWEEN).
bhv_p_TintCycle_colorB = Цвет b
bhv_pd_TintCycle_colorB = Второй цвет (BETWEEN).
bhv_p_TintCycle_speed = Скорость
bhv_pd_TintCycle_speed = Полных циклов в секунду.
bhv_p_TintCycle_saturation = Насыщенность
bhv_pd_TintCycle_saturation = Насколько сильные цвета (RAINBOW).
bhv_p_TintCycle_brightness = Яркость
bhv_pd_TintCycle_brightness = Насколько светлые цвета (RAINBOW).
bhv_p_TintCycle_autoPlay = Автозапуск
bhv_pd_TintCycle_autoPlay = Начать сразу при старте сцены.
bhv_n_Wobble = Покачивание
bhv_d_Wobble = Элемент качается влево и вправо, как игрушка (и может немного сплющиваться). Постоянно, при касании или из блока. Хорошо для неактивных иконок и привлечения внимания.
bhv_p_Wobble_trigger = Триггер
bhv_pd_Wobble_trigger = Когда покачивается. MANUAL = только когда выполняется блок wobble.
bhv_p_Wobble_angle = Угол
bhv_pd_Wobble_angle = Насколько поворачивается в каждую сторону.
bhv_p_Wobble_speed = Скорость
bhv_pd_Wobble_speed = Полных качаний в секунду.
bhv_p_Wobble_duration = Длительность
bhv_pd_Wobble_duration = Качается столько времени, затем останавливается. 0 = пока не остановят.
bhv_p_Wobble_decay = Затухание
bhv_pd_Wobble_decay = Каждое качание меньше предыдущего (нужна длительность).
bhv_p_Wobble_squash = Сплющивание
bhv_pd_Wobble_squash = Немного растягивается и сплющивается при качании (0 = нет).
bhv_n_Car = Машина
bhv_d_Car = Управляемая машина с газом, тормозом, рулём и ручником. TOP_DOWN: машина по модели велосипеда, вид сверху (угол руля, колёсная база, сцепление, занос на ручнике). SIDE_SCROLLER: приводит в движение колёса машины, собранной на соединениях.
bhv_g_Vehicles = Транспорт
bhv_note_Car = Нужен DYNAMIC физический элемент (кузов машины). Вид сверху: гравитация 0 в сцене. Сайд-скроллер: колёса соединены с кузовом соединениями.
bhv_p_Car_mode = Режим
bhv_pd_Car_mode = TOP_DOWN: машина, вид сверху. SIDE_SCROLLER: список колёс приводится моторами (соберите машину на соединениях в редакторе).
bhv_g_Mode = Режим
bhv_p_Car_joystick = Джойстик
bhv_pd_Car_joystick = Джойстик: влево/вправо рулит (сверху) или едет (сбоку), вверх/вниз — газ и тормоз.
bhv_p_Car_gasButton = Кнопка газа
bhv_pd_Car_gasButton = Кнопка газа (любой элемент). Удержание = разгон.
bhv_p_Car_brakeButton = Кнопка тормоза
bhv_pd_Car_brakeButton = Кнопка тормоза. Вид сверху: тормозит, затем едет назад. Сайд-скроллер: блокирует колёса.
bhv_p_Car_leftButton = Кнопка влево
bhv_pd_Car_leftButton = Вид сверху: руль влево. Сайд-скроллер: ехать влево / наклон влево в воздухе.
bhv_p_Car_rightButton = Кнопка вправо
bhv_pd_Car_rightButton = Вид сверху: руль вправо. Сайд-скроллер: ехать вправо / наклон вправо в воздухе.
bhv_p_Car_handbrakeButton = Кнопка ручника
bhv_pd_Car_handbrakeButton = Блокирует заднюю ось: машина скользит и идёт в занос (вид сверху) или колёса останавливаются (сайд-скроллер).
bhv_p_Car_useKeyboard = Использовать клавиатуру
bhv_pd_Car_useKeyboard = Стрелки / WASD и пробел (ручник) тоже управляют (десктоп, тесты).
bhv_p_Car_useTilt = Использовать наклон
bhv_pd_Car_useTilt = Наклоняйте телефон, чтобы рулить (вид сверху).
bhv_p_Car_deadZone = Мёртвая зона
bhv_pd_Car_deadZone = Отклонения джойстика меньше этого игнорируются.
bhv_p_Car_maxSpeed = Макс. скорость
bhv_pd_Car_maxSpeed = Максимальная скорость вперёд.
bhv_g_Engine_and_brakes = Двигатель и тормоза
bhv_p_Car_reverseSpeed = Скорость назад
bhv_pd_Car_reverseSpeed = Максимальная скорость задним ходом.
bhv_p_Car_acceleration = Ускорение
bhv_pd_Car_acceleration = Как быстро двигатель разгоняет машину.
bhv_p_Car_brakeForce = Сила тормоза
bhv_pd_Car_brakeForce = Насколько сильно тормоз замедляет машину.
bhv_p_Car_rollingResistance = Сопротивление качению
bhv_pd_Car_rollingResistance = Замедление, когда ничего не нажато.
bhv_p_Car_maxSteerAngle = Макс. угол руля
bhv_pd_Car_maxSteerAngle = Наибольший угол передних колёс.
bhv_g_Steering__top_down_ = Руль (вид сверху)
bhv_p_Car_steerSpeed = Скорость руля
bhv_pd_Car_steerSpeed = Как быстро колёса поворачиваются на нужный угол.
bhv_p_Car_steerReduction = Уменьшение руля
bhv_pd_Car_steerReduction = Меньше рулит на большой скорости (0 = без изменений, 1 = почти прямо на максимальной скорости).
bhv_p_Car_frontAxle = Передняя ось
bhv_pd_Car_frontAxle = Расстояние от центра машины до передней оси. 0 (при задней оси 0) = 35% длинной стороны.
bhv_p_Car_rearAxle = Задняя ось
bhv_pd_Car_rearAxle = Расстояние от центра машины до задней оси. Колёсная база — это передняя + задняя ось.
bhv_p_Car_noseAngle = Угол носа
bhv_pd_Car_noseAngle = Угол, в который смотрит перед изображения, когда элемент не повёрнут (90 = вверх, 0 = вправо).
bhv_p_Car_grip = Сцепление
bhv_pd_Car_grip = Как быстро останавливается боковое скольжение. Высокое = как по рельсам, низкое = скользко.
bhv_g_Grip__top_down_ = Сцепление (вид сверху)
bhv_p_Car_handbrakeGrip = Сцепление при ручнике
bhv_pd_Car_handbrakeGrip = Сцепление при включённом ручнике (малое = занос).
bhv_p_Car_driftSpeed = Скорость заноса
bhv_pd_Car_driftSpeed = Боковая скорость, считающаяся заносом (onDriftStart).
bhv_p_Car_wheels = Колёса
bhv_pd_Car_wheels = Элементы-колёса (физические круги, соединённые с кузовом соединениями). Поведение вращает их.
bhv_g_Wheels__side_scroller_ = Колёса (сайд-скроллер)
bhv_p_Car_wheelAcceleration = Ускорение колёс
bhv_pd_Car_wheelAcceleration = Как быстро моторы колёс набирают скорость.
bhv_p_Car_airSpin = Вращение в воздухе
bhv_pd_Car_airSpin = Скорость вращения кузова в воздухе, пока удерживается влево/вправо.
bhv_n_SpaceShip = Космический корабль
bhv_d_SpaceShip = Корабль в стиле Asteroids: поворот влево/вправо, тяга вперёд по направлению взгляда, сопротивление, ограничение скорости и необязательное ускорение. Управление джойстиком, кнопками, клавиатурой или наклоном телефона. Нужна гравитация 0.
bhv_p_SpaceShip_joystick = Джойстик
bhv_pd_SpaceShip_joystick = Элемент-джойстик, управляющий кораблём (необязательно).
bhv_p_SpaceShip_steering = Рулевое управление
bhv_pd_SpaceShip_steering = ROTATE: влево/вправо поворачивает, вверх даёт тягу. POINT: корабль поворачивается в сторону направления джойстика.
bhv_p_SpaceShip_leftButton = Кнопка влево
bhv_pd_SpaceShip_leftButton = Кнопка (любой элемент), поворачивающая корабль влево, пока её удерживают.
bhv_p_SpaceShip_rightButton = Кнопка вправо
bhv_pd_SpaceShip_rightButton = Кнопка (любой элемент), поворачивающая корабль вправо, пока её удерживают.
bhv_p_SpaceShip_thrustButton = Кнопка тяги
bhv_pd_SpaceShip_thrustButton = Кнопка, дающая тягу вперёд, пока её удерживают.
bhv_p_SpaceShip_brakeButton = Кнопка тормоза
bhv_pd_SpaceShip_brakeButton = Кнопка, замедляющая корабль, пока её удерживают.
bhv_p_SpaceShip_boostButton = Кнопка ускорения
bhv_pd_SpaceShip_boostButton = Кнопка, запускающая ускорение.
bhv_p_SpaceShip_useKeyboard = Использовать клавиатуру
bhv_pd_SpaceShip_useKeyboard = Стрелки / A D W S / shift тоже управляют кораблём (десктоп, тесты).
bhv_p_SpaceShip_useTilt = Использовать наклон
bhv_pd_SpaceShip_useTilt = Наклоняйте телефон влево/вправо для поворота.
bhv_p_SpaceShip_deadZone = Мёртвая зона
bhv_pd_SpaceShip_deadZone = Отклонения джойстика меньше этого игнорируются.
bhv_p_SpaceShip_thrust = Тяга
bhv_pd_SpaceShip_thrust = Ускорение вперёд.
bhv_p_SpaceShip_maxSpeed = Макс. скорость
bhv_pd_SpaceShip_maxSpeed = Ограничение скорости.
bhv_p_SpaceShip_rotateSpeed = Скорость поворота
bhv_pd_SpaceShip_rotateSpeed = Скорость поворота корабля.
bhv_p_SpaceShip_drag = Сопротивление
bhv_pd_SpaceShip_drag = Сам замедляет корабль. 0 = дрейфует вечно (космос), 1 = останавливается примерно за секунду.
bhv_p_SpaceShip_brakePower = Сила торможения
bhv_pd_SpaceShip_brakePower = Насколько сильно тормоз замедляет корабль.
bhv_p_SpaceShip_noseAngle = Угол носа
bhv_pd_SpaceShip_noseAngle = Угол, в который смотрит нос изображения, когда элемент не повёрнут (90 = вверх, 0 = вправо).
bhv_p_SpaceShip_boostMultiplier = Множитель ускорения
bhv_pd_SpaceShip_boostMultiplier = Тяга и ограничение скорости умножаются на это во время ускорения. 1 = без ускорения.
bhv_g_Boost = Ускорение
bhv_p_SpaceShip_boostTime = Время ускорения
bhv_pd_SpaceShip_boostTime = Сколько длится ускорение.
bhv_p_SpaceShip_boostCooldown = Перезарядка ускорения
bhv_pd_SpaceShip_boostCooldown = Время до следующего запуска ускорения.
font_err_empty = Имя файла и файл шрифта не могут быть пустыми
font_err_name = Имя файла не может содержать / или \\
font_err_exists = Файл с таким именем уже существует
uim_events = События
uim_ev_no_holder = Сначала добавьте на открытую сцену UI holder, который показывает этот UI: код события принадлежит holder.
uim_ev_no_holder_hint = События пишутся для каждого UI holder: добавьте на сцену UI holder, который показывает этот UI.
uim_ev_holder = Код выполняется для UI holder: %s
uim_ev_which = Какой UI holder?
uim_ev_onChange = Значение изменено
uim_ev_onSubmit = Отправлено
uim_ev_onScroll = Прокрутка
uim_expand = Развернуть / свернуть
text_clear = Очистить
text_count = %1$d символов · %2$d строк
text_edit = Изменить текст
text_empty = пусто
ui_var_expr = Это значение — выражение Java: измените его в поле.

# v25: paged file viewer, font editor labels / descriptions / options / presets
pg_prev = Назад
pg_next = Далее
pg_big_text = Большой файл: показан по страницам
pg_binary = Двоичный файл (только чтение): байты по страницам
pg_more_chars = символов ещё, нажмите «Копировать», чтобы получить всё
font_p_size = Размер (px)
font_p_spaceX = Межбуквенный интервал
font_p_spaceY = Межстрочный интервал
font_p_kerning = Кернинг
font_p_color = Цвет
font_p_gamma = Плавность
font_p_borderWidth = Толщина
font_p_borderColor = Цвет
font_p_borderStraight = Острые углы
font_p_borderGamma = Плавность
font_p_shadowOffsetX = Смещение X
font_p_shadowOffsetY = Смещение Y
font_p_shadowColor = Цвет
font_p_hinting = Хинтинг
font_p_mono = Пиксельный вид (без сглаживания)
font_p_renderCount = Проходы отрисовки
font_p_minFilter = Фильтр уменьшения
font_p_magFilter = Фильтр увеличения
font_p_padTop = Отступ сверху
