bhv_n_Chase = Преследование
bhv_d_Chase = Бежит за целью (игроком), когда та подходит близко, сдаётся, если цель слишком далеко, и может вернуться домой. Для врагов; добавьте Патруль на тот же элемент для стражей, которые гонятся, когда видят вас.
bhv_p_Chase_target = Цель
bhv_pd_Chase_target = Элемент для преследования (обычно игрок).
bhv_p_Chase_sightRange = Дальность видимости
bhv_pd_Chase_sightRange = Начинает преследовать, когда цель ближе этого значения.
bhv_p_Chase_giveUpRange = Дальность отказа
bhv_pd_Chase_giveUpRange = Прекращает преследование, когда цель дальше этого значения (больше дальности видимости).
bhv_p_Chase_needLineOfSight = Нужна линия видимости
bhv_pd_Chase_needLineOfSight = Вкл: стены между ним и целью скрывают цель. Выкл: чувствует цель сквозь стены.
bhv_p_Chase_speed = Скорость
bhv_pd_Chase_speed = Скорость бега.
bhv_p_Chase_acceleration = Ускорение
bhv_pd_Chase_acceleration = Как быстро достигает скорости. 0 = мгновенно.
bhv_p_Chase_stopDistance = Дистанция остановки
bhv_pd_Chase_stopDistance = Останавливается на таком расстоянии от цели (и вызывает onReachTarget).
bhv_p_Chase_horizontalOnly = Только по горизонтали
bhv_pd_Chase_horizontalOnly = Только влево/вправо (наземные враги с гравитацией). Выкл: летит прямо к цели без гравитации.
bhv_p_Chase_returnHome = Вернуться домой
bhv_pd_Chase_returnHome = После отказа идёт обратно к месту старта.
bhv_p_Chase_flipToDirection = Отражать по направлению
bhv_pd_Chase_flipToDirection = Отражает картинку в сторону движения.
bhv_p_Chase_artFacesLeft = Картинка смотрит влево
bhv_pd_Chase_artFacesLeft = Картинка нарисована лицом влево.
bhv_p_Chase_faceTarget = Смотреть на цель
bhv_pd_Chase_faceTarget = Поворачивает элемент к цели (враги при виде сверху).
bhv_p_Chase_faceOffset = Угол лицом
bhv_pd_Chase_faceOffset = Угол картинки, когда она смотрит вправо (0 = вправо, 90 = вверх...).
bhv_n_Patrol = Патруль
bhv_d_Patrol = Ходит туда-сюда сам (враги, стражи, движущиеся опасности): расстояние в каждую сторону или элементы-точки маршрута. Ждёт на концах, отражает картинку и может разворачиваться у стен и краёв. Приостанавливается, пока Преследование на этом же элементе гонится.
bhv_p_Patrol_mode = Режим
bhv_pd_Patrol_mode = DISTANCE: туда-обратно вокруг стартовой позиции. WAYPOINTS: обходит элементы списка по порядку.
bhv_p_Patrol_axis = Ось
bhv_pd_Patrol_axis = Только DISTANCE: влево/вправо или вверх/вниз.
bhv_p_Patrol_rangeBack = Дальность назад
bhv_pd_Patrol_rangeBack = Только DISTANCE: как далеко идёт влево (или вниз) от старта.
bhv_p_Patrol_rangeForward = Дальность вперёд
bhv_pd_Patrol_rangeForward = Только DISTANCE: как далеко идёт вправо (или вверх) от старта.
bhv_p_Patrol_startBackwards = Начать назад
bhv_pd_Patrol_startBackwards = Только DISTANCE: сначала идёт влево / вниз.
bhv_p_Patrol_waypoints = Точки маршрута
bhv_pd_Patrol_waypoints = Только WAYPOINTS: элементы, к которым идёт по порядку (могут быть невидимыми).
bhv_p_Patrol_loopWaypoints = Зациклить точки
bhv_pd_Patrol_loopWaypoints = Только WAYPOINTS: после последней возвращается к первой (цикл). Выкл = идёт обратно тем же путём.
bhv_p_Patrol_speed = Скорость
bhv_pd_Patrol_speed = Скорость ходьбы.
bhv_p_Patrol_waitTime = Время ожидания
bhv_pd_Patrol_waitTime = Сколько ждёт на каждом конце / в каждой точке.
bhv_p_Patrol_flying = Летает
bhv_pd_Patrol_flying = Игнорирует гравитацию (птицы, дроны). Вертикальные маршруты и точки маршрута всегда её игнорируют.
bhv_p_Patrol_flipOnTurn = Отражать при развороте
bhv_pd_Patrol_flipOnTurn = Отражает картинку, когда идёт влево.
bhv_p_Patrol_artFacesLeft = Картинка смотрит влево
bhv_pd_Patrol_artFacesLeft = Картинка нарисована лицом влево (отражается при ходьбе вправо).
bhv_p_Patrol_turnAtWalls = Разворот у стен
bhv_pd_Patrol_turnAtWalls = Разворачивается, если прямо перед ним стена (статичная или движущаяся платформа). Только физические элементы.
bhv_p_Patrol_turnAtLedges = Разворот у краёв
bhv_pd_Patrol_turnAtLedges = Разворачивается, а не падает с края. Только физические элементы.
bhv_p_Patrol_ledgeDepth = Глубина края
bhv_pd_Patrol_ledgeDepth = Сколько земли должно быть под ногами, чтобы идти дальше.
bhv_p_Patrol_yieldToChase = Уступать преследованию
bhv_pd_Patrol_yieldToChase = Ничего не делает, пока Преследование этого элемента гонится.
