bhv_pd_Door3D_openTime = Секунд на открытие или закрытие.
bhv_p_Door3D_openClip = Клип открытия
bhv_pd_Door3D_openClip = ANIMATION: клип открытия.
bhv_p_Door3D_closeClip = Клип закрытия
bhv_pd_Door3D_closeClip = ANIMATION: клип закрытия.
bhv_p_Door3D_autoClose = Автозакрытие
bhv_pd_Door3D_autoClose = Закрывается сама через столько секунд (0 = остаётся открытой).
bhv_p_Door3D_startOpen = Открыта в начале
bhv_pd_Door3D_startOpen = Открыта при старте игры.
