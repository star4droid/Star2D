bc_help=1. Выберите тип: действие, C-блок (содержит блоки внутри) или значение.\n2. Напишите текст, который будет виден на блоке.\n3. Добавьте поля: каждое станет белой ячейкой на блоке (число, текст, элемент, условие, изображение…).\n4. Напишите код на Java. Используйте {fieldName} там, где нужно значение поля. C-блок вставляет внутренние блоки в {inside} (и {else}).\nСовет: \"current\" — это элемент, которому принадлежит событие; toast(\"…\") показывает сообщение.
