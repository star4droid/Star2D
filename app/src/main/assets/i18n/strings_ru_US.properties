supportRtlDetails = Поддерживает ли шрифт RTL (справа налево)?
sizeDetails = размер шрифта по умолчанию
fontScaleDetails = Масштабирование шрифта для увеличения
durationDetails = продолжительность в миллисекундах
softnessLengthDetails = Чем выше это значение, тем больше свет проникает в элементы, но мягко.
distanceDetails = Расстояние, покрываемое светом
raysDetails = Чем больше лучей, тем больше света. Учтите, что операция дорогая и может замедлить работу при большом количестве.
xDetails = положение элемента по оси x
yDetails = положение элемента по оси y
zDetails = Порядок элемента, определяет, находится ли элемент выше или ниже других элементов
densityDetails = Чем выше плотность, тем тверже становится тело и меньше подвержено силам.
restitutionDetails = Степень упругости (отскока) тела, чем выше значение, тем больше отскок. Учтите, что тело может отскакивать, если сталкивается с другим телом с высокой упругостью, оно будет действовать как батут.
frictionDetails = трение тела
tileXDetails = повторять изображение элемента по x
tileYDetails = повторять изображение элемента по y
colliderXDetails = положение x формы столкновения
colliderYDetails = положение y формы столкновения
gravityScaleDetails = Чем выше значение масштаба гравитации, тем больше тело подвержено гравитации.
imageDetails = изображение элемента
padImageDetails = внутреннее изображение отступа
buttonImageDetails = изображение кнопки
buttonBackgroundDetails = фон
LoopDetails = Зациклить или повторить
lockDetails = Заблокировать элемент, чтобы избежать непреднамеренного масштабирования и перемещения
ActiveDetails = Если элемент деактивирован, он перестает реагировать на физику
softDetails = Определяет, является ли свет мягким или нет, мягкость заставляет свет проходить через другие элементы.
visibleDetails = определяет, видим ли элемент
bulletDetails = Если элемент является пулей, он будет быстрее и периодически реагировать на физику (эта функция не должна быть всегда активна)
fixedRotationDetails = сделать вращение элемента фиксированным в игре.
isSensorDetails = Элемент-сенсор - это просто элемент, который реагирует на другие объекты, но сам не влияет на себя.
shapeDetails = определить тип формы (прямоугольник/круг/пользовательский)
lightTypeDetails = определить тип света
fontDetails = выбрать шрифт текста
textColorDetails = выбрать цвет текста
tintDetails = работает как цветовой фильтр для элементов.
collisionDetails = Элементы, указанные здесь, не будут сталкиваться с этим элементом и будут проходить через него.
attachToDetails = добавить свет к элементу, чтобы он всегда следовал за ним.
parentDetails = выбрать родителя элемента.
PointsDetails = указать точки пользовательского коллайдера.
scriptDetails = выбрать скрипт элемента из другого элемента.
