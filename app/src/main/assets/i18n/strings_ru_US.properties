bhv_p_EndlessRoad3D_traffic = Трафик
bhv_pd_EndlessRoad3D_traffic = Шаблоны машин, едущих по полосам.
bhv_p_EndlessRoad3D_trafficChance = Шанс трафика
bhv_pd_EndlessRoad3D_trafficChance = Шанс машины на каждом новом участке.
bhv_p_EndlessRoad3D_lanes = Полосы
bhv_pd_EndlessRoad3D_lanes = Число полос.
bhv_p_EndlessRoad3D_laneWidth = Ширина полосы
bhv_pd_EndlessRoad3D_laneWidth = Ширина полосы (0 = ширина дороги / число полос).
bhv_p_EndlessRoad3D_trafficSpeed = Скорость трафика
bhv_pd_EndlessRoad3D_trafficSpeed = Скорость трафика.
bhv_p_EndlessRoad3D_oncoming = Встречное
bhv_pd_EndlessRoad3D_oncoming = Левая половина полос едет навстречу игроку.
bhv_p_EndlessRoad3D_wheelNodes = Узлы колёс
bhv_pd_EndlessRoad3D_wheelNodes = Узлы колёс моделей трафика для вращения, через запятую.
bhv_p_EndlessRoad3D_pickups = Подбираемое
bhv_pd_EndlessRoad3D_pickups = Монеты, топливо, ускорители на полосах; подбираются, когда игрок проезжает.
bhv_p_EndlessRoad3D_pickupChance = Шанс предмета
bhv_pd_EndlessRoad3D_pickupChance = Шанс предмета на каждом новом участке.
bhv_p_EndlessRoad3D_pickupHeight = Высота предметов
bhv_pd_EndlessRoad3D_pickupHeight = Высота предметов над дорогой.
bhv_p_EndlessRoad3D_levelDistance = Дистанция уровня
bhv_pd_EndlessRoad3D_levelDistance = Следующий уровень каждые столько метров (0 = никогда).
bhv_p_EndlessRoad3D_trafficPerLevel = Трафик за уровень
bhv_pd_EndlessRoad3D_trafficPerLevel = Шанс трафика, добавляемый за уровень.
bhv_p_EndlessRoad3D_speedPerLevel = Скорость за уровень
bhv_pd_EndlessRoad3D_speedPerLevel = Макс. скорость, добавляемая Машине 3D игрока за уровень.
bhv_p_EndlessRoad3D_scorePerMeter = Очки за метр
bhv_pd_EndlessRoad3D_scorePerMeter = Очки за пройденный метр.
bhv_p_EndlessRoad3D_pickupScore = Очки за предмет
bhv_pd_EndlessRoad3D_pickupScore = Очки за предмет.
