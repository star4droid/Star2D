bhv_pd_Shooter3D_aimWithCamera = Стреляет туда, куда смотрит камера (от первого лица), а не вдоль фронта элемента.
bhv_p_Shooter3D_spread = Разброс
bhv_pd_Shooter3D_spread = Случайный разброс выстрелов.
bhv_p_Shooter3D_muzzleDistance = Расстояние дула
bhv_pd_Shooter3D_muzzleDistance = Выстрелы начинаются на таком расстоянии перед элементом.
bhv_p_Shooter3D_muzzleHeight = Высота дула
bhv_pd_Shooter3D_muzzleHeight = Выстрелы начинаются на такой высоте над позицией элемента.
bhv_p_Shooter3D_mode = Режим
bhv_pd_Shooter3D_mode = HITSCAN: мгновенное попадание по прицелу. PROJECTILE: стреляет копиями шаблона пули.
bhv_p_Shooter3D_damage = Урон
bhv_pd_Shooter3D_damage = Урон за попадание (HITSCAN; снаряды используют свой).
bhv_p_Shooter3D_range = Дальность
bhv_pd_Shooter3D_range = Наибольшая дальность попадания (HITSCAN).
bhv_p_Shooter3D_bulletTemplate = Шаблон пули
bhv_pd_Shooter3D_bulletTemplate = Шаблон пули, копируемый на каждый выстрел (PROJECTILE). Скрыт в начале.
