<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 256 256" version="1.1" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" style="fill-rule:evenodd;clip-rule:evenodd;">
  <rect x="0" y="0" width="256" height="256" style="fill:none;"/>
  <!-- Wireframe cube-like shape: front face, back face, connecting edges -->
  <!-- Front face (bottom-left rectangle) -->
  <rect x="30" y="110" width="130" height="116" style="fill:none;stroke:rgb(216,216,216);stroke-width:14px;"/>
  <!-- Back face (top-right rectangle, offset) -->
  <rect x="96" y="30" width="130" height="116" style="fill:none;stroke:rgb(216,216,216);stroke-width:14px;"/>
  <!-- Connecting edges (4 corners) -->
  <line x1="30" y1="110" x2="96" y2="30" style="stroke:rgb(216,216,216);stroke-width:14px;"/>
  <line x1="160" y1="110" x2="226" y2="30" style="stroke:rgb(216,216,216);stroke-width:14px;"/>
  <line x1="160" y1="226" x2="226" y2="146" style="stroke:rgb(216,216,216);stroke-width:14px;"/>
  <line x1="30" y1="226" x2="96" y2="146" style="stroke:rgb(216,216,216);stroke-width:14px;"/>
</svg>
