pluginManagement {
  repositories {
    gradlePluginPortal()
    google()
    mavenCentral()
  }
}
enableFeaturePreview("TYPESAFE_PROJECT_ACCESSORS")

dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories {
    mavenCentral()
    maven { url "https://plugins.gradle.org/m2/" }
    google()
    maven { url "https://jitpack.io" }
  }
}

rootProject.name = "Star2D"

include(
   ":app",
   ":template",
   ":desktop",
   ":najma",
   // World Builder: its own app (com.star4droid.worldbuilder) and also opened from the Star2D home screen
   ":worldbuilder:core",
   ":worldbuilder:android",
   ":worldbuilder:desktop"
)
